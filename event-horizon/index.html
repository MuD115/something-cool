<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Event Horizon</title>
<meta name="description" content="A real-time, ray-traced Schwarzschild black hole with gravitational lensing, a relativistic accretion disc and jets, built with three.js." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  :root {
    color-scheme: dark;
    --void: #020203;
    --ink: #ece6da;
    --ink-dim: #9d968a;
    --ink-faint: #5d5850;
    --ember: #ffb45a;
    --ember-deep: #c86a1e;
    --jet: #8fb0ff;
    --line: rgba(236, 230, 218, 0.14);
    --scrim: rgba(2, 2, 3, 0.55);
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
    --gutter: max(16px, env(safe-area-inset-left, 0px));
  }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--void);
    color: var(--ink);
    font: 400 12px/1.5 var(--mono);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #scene:active { cursor: grabbing; }

  /* ---------- loader ---------- */
  #loader {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--void);
    z-index: 20;
    transition: opacity 1.6s ease 0.2s, visibility 0s linear 1.8s;
  }
  #loader p {
    margin: 0;
    color: var(--ink-dim);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    font-size: 11px;
  }
  #loader p::before {
    content: '';
    display: block;
    width: 44px;
    height: 44px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--void);
    box-shadow: 0 0 0 1px var(--ember-deep), 0 0 26px 2px rgba(255, 180, 90, 0.35);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 0 1px var(--ember), 0 0 40px 6px rgba(255, 180, 90, 0.5); } }
  body.ready #loader { opacity: 0; visibility: hidden; }

  /* ---------- overlay ---------- */
  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    padding: calc(20px + env(safe-area-inset-top, 0px)) var(--gutter) calc(18px + env(safe-area-inset-bottom, 0px));
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 16px;
    transition: opacity 0.5s ease;
    z-index: 5;
  }
  #ui.hidden { opacity: 0; }
  #ui.hidden * { pointer-events: none !important; }
  #ui > * { pointer-events: none; }
  #ui button, #ui .lil-gui, #ui a { pointer-events: auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .eyebrow {
    margin: 0 0 6px;
    font-size: 10.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  h1 {
    margin: 0;
    font: italic 500 clamp(34px, 6vw, 68px)/0.95 var(--display);
    letter-spacing: -0.01em;
    text-wrap: balance;
    text-shadow: 0 2px 30px rgba(0, 0, 0, 0.6);
  }
  h1 em {
    font-style: italic;
    color: var(--ember);
  }
  #blurb {
    max-width: 38ch;
    margin: 12px 0 0;
    color: var(--ink-dim);
    min-height: 3em;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.9);
  }

  #gui-slot { flex: none; }

  footer {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 16px 24px;
  }

  /* telemetry: an instrument readout, not a card */
  dl.telemetry {
    margin: 0;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 3px 16px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.95);
    max-width: 100%;
  }
  dl.telemetry dt {
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 10px;
    line-height: 18px;
  }
  dl.telemetry dd {
    margin: 0;
    color: var(--ink);
    line-height: 18px;
    overflow-wrap: anywhere;
  }
  dl.telemetry dd.zone { color: var(--ember); }
  dl.telemetry dd.perf { color: var(--ink-faint); }

  .dock {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }

  button {
    font: 500 11px/1 var(--mono);
    letter-spacing: 0.06em;
    color: var(--ink);
    background: var(--scrim);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 8px 10px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: border-color 0.2s, color 0.2s, background 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  button:hover { border-color: rgba(236, 230, 218, 0.4); }
  button:focus-visible { outline: 1px solid var(--ember); outline-offset: 2px; }
  button[aria-pressed='true'] {
    border-color: var(--ember);
    color: var(--ember);
    background: rgba(40, 20, 4, 0.6);
  }
  kbd {
    font: inherit;
    font-size: 10px;
    color: var(--ink-faint);
  }
  button[aria-pressed='true'] kbd { color: var(--ember-deep); }

  #presets { max-width: min(620px, 100%); }

  .hint {
    color: var(--ink-faint);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-align: right;
    text-shadow: 0 1px 8px #000;
  }

  /* ---------- lil-gui, restyled to match ---------- */
  .lil-gui {
    --background-color: rgba(8, 7, 6, 0.82);
    --widget-color: rgba(236, 230, 218, 0.09);
    --hover-color: rgba(236, 230, 218, 0.16);
    --focus-color: rgba(236, 230, 218, 0.22);
    --number-color: var(--ember);
    --string-color: var(--jet);
    --text-color: var(--ink);
    --title-background-color: rgba(8, 7, 6, 0.9);
    --title-text-color: var(--ink);
    --font-family: var(--mono);
    --font-size: 11px;
    --input-font-size: 11px;
    --widget-border-radius: 1px;
    --name-width: 48%;
    --width: 290px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line);
  }
  .lil-gui.root { max-height: calc(100vh - 220px); overflow-y: auto; }
  .lil-gui .title { letter-spacing: 0.1em; text-transform: uppercase; font-size: 10.5px; }

  #btn-show {
    position: fixed;
    right: var(--gutter);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    z-index: 6;
    opacity: 0.45;
  }
  #btn-show:hover, #btn-show:focus-visible { opacity: 1; }

  /* ---------- screenshot dialog ---------- */
  #shot {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(2, 2, 3, 0.86);
    display: grid;
    place-items: center;
    padding: 24px var(--gutter);
  }
  #shot figure { margin: 0; display: grid; gap: 12px; max-width: 100%; }
  #shot img {
    max-width: min(1100px, 100%);
    max-height: 72vh;
    border: 1px solid var(--line);
  }
  #shot figcaption {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    color: var(--ink-dim);
  }
  [hidden] { display: none !important; }

  @media (pointer: coarse) {
    kbd, .hint { display: none; }
  }

  @media (max-width: 720px) {
    header { flex-direction: column; align-items: stretch; gap: 10px; }
    footer { grid-template-columns: 1fr; }
    .dock { align-items: stretch; }
    .row { justify-content: flex-start; }
    #presets { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #presets::-webkit-scrollbar { display: none; }
    .hint, .t-extra { display: none; }
    #blurb { max-width: 30ch; }
    .lil-gui { --width: 250px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #loader, #loader p::before { animation: none; transition: none; }
  }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
</script>
</head>
<body>
<canvas id="scene" aria-label="Real-time rendering of a black hole. Drag to orbit, scroll or pinch to change distance."></canvas>

<div id="loader" role="status"><p>Integrating geodesics…</p></div>

<div id="ui">
  <header>
    <div>
      <p class="eyebrow">Schwarzschild metric · real-time geodesic ray tracing</p>
      <h1>Event <em>Horizon</em></h1>
      <p id="blurb"></p>
    </div>
    <div id="gui-slot"></div>
  </header>

  <div></div>

  <footer>
    <dl class="telemetry" aria-live="off">
      <dt>Distance</dt><dd id="t-r">–</dd>
      <dt class="t-extra">At M87* scale</dt><dd class="t-extra" id="t-au">–</dd>
      <dt>Your clock</dt><dd id="t-clock">–</dd>
      <dt class="t-extra">Escape velocity</dt><dd class="t-extra" id="t-esc">–</dd>
      <dt class="t-extra">Circular orbit</dt><dd class="t-extra" id="t-orbit">–</dd>
      <dt>Region</dt><dd class="zone" id="t-zone">–</dd>
      <dt class="t-extra">Render</dt><dd class="perf t-extra" id="t-perf">–</dd>
    </dl>

    <div class="dock">
      <div class="row" id="presets" aria-label="Scenes"></div>
      <div class="row">
        <button type="button" id="btn-cine" title="Cinematic drift (C)">Drift <kbd>C</kbd></button>
        <button type="button" id="sound" aria-pressed="false" title="Sound (M)"><span>Sound off</span><kbd>M</kbd></button>
        <button type="button" id="btn-shot" title="Capture a still (P)">Capture <kbd>P</kbd></button>
        <button type="button" id="btn-hide" title="Hide interface (H)">Hide UI <kbd>H</kbd></button>
      </div>
      <p class="hint">Drag to orbit · scroll to fall closer · F for fullscreen</p>
    </div>
  </footer>
</div>

<button type="button" id="btn-show" hidden title="Show interface (H)">Show UI <kbd>H</kbd></button>

<div id="shot" hidden>
  <figure>
    <img alt="Still frame of the black hole" />
    <figcaption>
      <span>Right-click or long-press the image to save it.</span>
      <button type="button" data-close>Close <kbd>Esc</kbd></button>
    </figcaption>
  </figure>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
