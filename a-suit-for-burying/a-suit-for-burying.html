<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A Suit for Burying</title>
<meta name="description" content="An interactive 2D Western with real-time lighting and shadows. A widower in a black suit, his late wife's grey mare, and choices that decide who he becomes." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" />
<style>
  :root {
    color-scheme: dark;
    --black: #050404;
    --ink: #eee4d0;
    --dust: #a8977c;
    --faint: #6b5f4f;
    --ember: #d9a15a;
    --blood: #9a3322;
    --display: 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
    --serif: 'IM Fell English', 'Iowan Old Style', Georgia, serif;
    --type: 'Special Elite', 'Courier New', ui-monospace, monospace;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--black);
    color: var(--ink);
    font: 16px/1.4 var(--serif);
    overflow: hidden;
    display: grid;
    place-items: center;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: calc(100vw / 2.39);
    max-width: 100%;
    overflow: hidden;
    background: #000;
    /* --u is 1% of the stage width, set by script, so type scales with the frame */
    --u: 1vw;
  }
  #view { display: block; width: 100%; height: 100%; }
  [hidden] { display: none !important; }

  /* ---------- subtitles and cards ---------- */
  #sub {
    position: absolute;
    left: 50%;
    bottom: 5.5%;
    transform: translateX(-50%);
    width: min(78%, 60ch);
    text-align: center;
    text-shadow: 0 1px 3px #000, 0 0 18px rgba(0, 0, 0, 0.9);
    pointer-events: none;
  }
  #sub-who {
    display: block;
    font: max(10px, calc(var(--u) * 0.95)) / 1.2 var(--display);
    letter-spacing: 0.18em;
    color: var(--ember);
    margin-bottom: 0.3em;
  }
  #sub-text {
    font-size: calc(max(15px, calc(var(--u) * 1.75)) * var(--ts, 1));
    line-height: 1.3;
    text-wrap: balance;
  }
  #sub[data-style='memory'] #sub-text { font-style: italic; color: #d8cdb8; opacity: 0.9; }
  #sub[data-style='memory'] #sub-who { color: var(--dust); }
  #sub[data-style='shout'] #sub-text { letter-spacing: 0.02em; }

  #card {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 0 18%;
    text-align: center;
    font: max(15px, calc(var(--u) * 1.9)) / 1.45 var(--type);
    color: var(--ink);
    text-shadow: 0 0 20px #000, 0 1px 2px #000;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0) 70%);
    opacity: 0;
    transition: opacity 1.1s ease;
    pointer-events: none;
    text-wrap: balance;
  }
  #card.show { opacity: 1; }

  /* ---------- choices ---------- */
  #choice {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 2.4% 6% 3%;
    background: linear-gradient(0deg, rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.55) 70%, rgba(0, 0, 0, 0));
    display: grid;
    justify-items: center;
    gap: calc(var(--u) * 1.1);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s, transform 0.5s;
  }
  #choice.show { opacity: 1; transform: none; }
  #choice-prompt {
    margin: 0;
    font: italic max(14px, calc(var(--u) * 1.6)) / 1.3 var(--serif);
    color: var(--dust);
    text-align: center;
    text-wrap: balance;
  }
  #choice-opts { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 1.2); }
  .opt {
    font: max(13px, calc(var(--u) * 1.45)) / 1 var(--display);
    letter-spacing: 0.08em;
    color: var(--ink);
    background: rgba(20, 14, 10, 0.75);
    border: 1px solid rgba(217, 161, 90, 0.45);
    padding: 0.7em 1.3em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.8em;
    transition: background 0.2s, border-color 0.2s, opacity 0.4s;
  }
  .opt:hover, .opt:focus-visible { background: rgba(60, 36, 18, 0.85); border-color: var(--ember); outline: none; }
  .opt kbd { font: max(10px, calc(var(--u) * 0.9)) / 1 var(--type); color: var(--ember); }
  .opt.picked { border-color: var(--ember); background: rgba(90, 50, 20, 0.9); }
  .opt.faded { opacity: 0.25; }
  #choice-timer {
    width: min(40%, 320px);
    height: 2px;
    background: rgba(238, 228, 208, 0.15);
    position: relative;
  }
  #choice-timer::after {
    content: '';
    position: absolute;
    inset: 0;
    transform-origin: left;
    transform: scaleX(var(--left, 1));
    background: var(--blood);
  }

  /* ---------- title ---------- */
  .kicker {
    margin: 0;
    font: max(10px, calc(var(--u) * 0.95)) / 1.2 var(--type);
    letter-spacing: 0.3em;
    color: var(--dust);
  }
  h1 {
    margin: 0;
    font: max(34px, calc(var(--u) * 6.4)) / 0.95 var(--display);
    letter-spacing: 0.02em;
    color: var(--ink);
    text-shadow: 0 2px 30px rgba(0, 0, 0, 0.9);
    text-wrap: balance;
  }
  .tagline {
    margin: 0;
    max-width: 44ch;
    font: italic max(14px, calc(var(--u) * 1.55)) / 1.4 var(--serif);
    color: #d8cdb8;
    text-shadow: 0 1px 8px #000;
  }
  .note {
    margin: 0;
    font: max(10px, calc(var(--u) * 0.9)) / 1.4 var(--type);
    color: var(--dust);
    letter-spacing: 0.05em;
  }
  #saved { color: var(--ember); }

  /* ---------- end ---------- */
  #end {
    position: absolute;
    inset: 0;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: calc(var(--u) * 1.2);
    padding: 0 10%;
    background: rgba(4, 3, 3, 0.9);
    opacity: 0;
    transition: opacity 1.4s;
    text-align: center;
  }
  #end.show { opacity: 1; }
  #end h2 { margin: 0; font: max(24px, calc(var(--u) * 3.6)) / 1 var(--display); }
  #end-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.45em;
    font: italic max(14px, calc(var(--u) * 1.45)) / 1.35 var(--serif);
    color: #d8cdb8;
    max-width: 52ch;
  }
  #end-list li::before { content: '\2014\2002'; color: var(--ember); font-style: normal; }
  #again {
    font: max(13px, calc(var(--u) * 1.3)) / 1 var(--display);
    letter-spacing: 0.16em;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(217, 161, 90, 0.6);
    padding: 0.8em 1.8em;
    cursor: pointer;
  }
  #again:hover, #again:focus-visible { background: rgba(90, 50, 20, 0.6); outline: none; }

  /* ---------- menus (main menu and the Esc menu) ---------- */
  .menu {
    position: absolute;
    inset: 0;
    display: grid;
    align-content: center;
    justify-items: center;
    text-align: center;
    padding: 12px 8%;
    overflow-y: auto;
    background: radial-gradient(ellipse at 50% 55%, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.72));
  }
  .menu[data-mode='pause'] { background: rgba(5, 4, 4, 0.78); }
  .menu[data-page='settings'], .menu[data-page='controls'], .menu[data-page='about'] { background: rgba(5, 4, 4, 0.86); }
  .menu-panel { display: grid; justify-items: center; gap: calc(var(--u) * 0.7); max-width: min(620px, 100%); padding: 4px; }
  .menu-header { display: grid; justify-items: center; gap: calc(var(--u) * 0.8); margin-bottom: calc(var(--u) * 0.6); }
  .menu-list { display: grid; gap: 6px; justify-items: stretch; min-width: min(260px, 100%); }
  .menu-btn {
    font: max(13px, calc(var(--u) * 1.3)) / 1 var(--display);
    letter-spacing: 0.16em;
    color: var(--ink);
    background: rgba(20, 14, 10, 0.6);
    border: 1px solid rgba(217, 161, 90, 0.4);
    padding: 0.75em 1.8em;
    cursor: pointer;
    display: grid;
    gap: 0.35em;
    transition: background 0.2s, border-color 0.2s;
  }
  .menu-btn:first-child { color: var(--black); background: var(--ember); border-color: var(--ember); }
  .menu-btn:first-child .menu-btn-sub { color: rgba(5, 4, 4, 0.7); }
  .menu-btn:hover, .menu-btn:focus-visible { background: rgba(90, 50, 20, 0.75); border-color: var(--ember); outline: none; color: var(--ink); }
  .menu-btn:first-child:hover, .menu-btn:first-child:focus-visible { background: #efc07a; color: var(--black); }
  .menu-btn-sub { font: max(9px, calc(var(--u) * 0.75)) / 1.2 var(--type); letter-spacing: 0.06em; color: var(--dust); }
  .menu-back, .menu-link {
    font: max(11px, calc(var(--u) * 0.9)) / 1 var(--type);
    color: var(--dust);
    background: none;
    border: 0;
    padding: 0.8em 1em;
    cursor: pointer;
  }
  .menu-back:hover, .menu-back:focus-visible, .menu-link:hover, .menu-link:focus-visible { color: var(--ember); outline: none; }
  .menu-title { margin: 0 0 0.2em; font: max(22px, calc(var(--u) * 2.6)) / 1 var(--display); letter-spacing: 0.06em; }
  .menu-sub { margin: 0; color: var(--dust); font: max(11px, calc(var(--u) * 0.85)) / 1.4 var(--type); max-width: 52ch; }
  .menu-form, .menu-keys { display: grid; gap: 4px; min-width: min(460px, 100%); text-align: start; }
  .menu-row, .menu-key-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 12px;
    padding: 0.45em 0.8em;
    background: rgba(20, 14, 10, 0.55);
    border-left: 2px solid rgba(217, 161, 90, 0.25);
    font-size: max(13px, calc(var(--u) * 1.05));
  }
  .menu-key-row { grid-template-columns: minmax(0, 1fr) auto; }
  .menu-row-value { font: max(11px, calc(var(--u) * 0.8)) / 1 var(--type); color: var(--dust); min-width: 3.5em; text-align: end; }
  .menu input[type='range'] { accent-color: var(--ember); width: min(200px, 40vw); }
  .menu input[type='checkbox'] { accent-color: var(--ember); width: 18px; height: 18px; }
  .menu select { font: inherit; color: var(--ink); background: #1b1410; border: 1px solid rgba(217, 161, 90, 0.35); padding: 0.25em 0.4em; }
  .menu-key { font: max(11px, calc(var(--u) * 0.85)) / 1 var(--type); color: var(--ember); border: 1px solid rgba(217, 161, 90, 0.35); padding: 0.45em 0.7em; }
  .menu-about { max-width: 56ch; text-align: start; color: #d8cdb8; font-size: max(13px, calc(var(--u) * 1.05)); }
  .menu-about h3 { margin: 1em 0 0.2em; font: max(11px, calc(var(--u) * 0.85)) / 1 var(--type); letter-spacing: 0.14em; color: var(--ember); }
  .menu-about p { margin: 0.4em 0; }
  #stage.nosubs #sub { display: none !important; }
  .menu h1 { font-size: max(30px, calc(var(--u) * 4.6)); }
  /* small screens: menus use the whole viewport, not just the letterboxed frame */
  @media (max-aspect-ratio: 1/1), (max-height: 520px) {
    .menu { position: fixed; z-index: 5; align-content: safe center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px; }
  }
  #nogl {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 0 12%;
    text-align: center;
    font: 16px/1.5 var(--type);
    color: var(--dust);
  }
  @media (prefers-reduced-motion: reduce) {
    #card, #choice, #end { transition: none; }
  }
  @media (max-aspect-ratio: 1/1) {
    /* portrait phones: invite a rotation, keep the frame playable */
    body::before {
      content: 'Turn your phone sideways for the full frame.';
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 16px;
      right: 16px;
      text-align: center;
      font: 12px/1.4 var(--type);
      color: var(--dust);
    }
    .menu { padding: 12px 16px; }
    h1 { font-size: 30px; }
    .tagline { font-size: 14px; }
    #card { padding: 0 16px; font-size: 14px; }
    #sub { width: calc(100% - 32px); }
    #choice { padding: 12px 16px 14px; }
    #end { padding: 0 16px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" aria-label="A Suit for Burying: animated story"></canvas>

  <div id="card" role="status" aria-live="polite"></div>
  <div id="sub" hidden aria-live="polite"><span id="sub-who"></span><span id="sub-text"></span></div>

  <div id="choice" hidden role="group" aria-labelledby="choice-prompt">
    <p id="choice-prompt"></p>
    <div id="choice-opts"></div>
    <div id="choice-timer" hidden aria-hidden="true"></div>
  </div>

  <div id="menu" aria-label="Menu"></div>

  <section id="end" hidden aria-labelledby="end-h">
    <p class="kicker">End of Chapter One</p>
    <h2 id="end-h">The man you&rsquo;re making</h2>
    <ul id="end-list"></ul>
    <p class="note">Chapter Two &middot; <em>Calvary Bend</em> is in the making. Your choices are saved for it.</p>
    <button type="button" id="again">Play again, choose differently</button>
    <button type="button" id="end-menu" class="menu-link">Main menu</button>
  </section>

  <div id="nogl" hidden>This story needs WebGL2, which this browser or device doesn&rsquo;t provide. Try a recent Chrome, Edge, Firefox or Safari.</div>
</div>
<script type="module">
// ---- src/engine/util.js
const __src_engine_util = (() => {
// Small maths and animation helpers shared by the whole engine.

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a));
const smooth = (a, b, v) => {
  const t = invLerp(a, b, v);
  return t * t * (3 - 2 * t);
};

const ease = {
  linear: (t) => t,
  in: (t) => t * t * t,
  out: (t) => 1 - Math.pow(1 - t, 3),
  inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  sine: (t) => 0.5 - 0.5 * Math.cos(Math.PI * t),
  back: (t) => {
    const c = 1.70158;
    return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
  },
};

// Keyframes: [[time, value], ...] with optional easing per segment
// ([time, value, 'out']). Values may be numbers or flat objects of numbers.
function key(t, frames, defaultEase = 'inOut') {
  if (t <= frames[0][0]) return frames[0][1];
  for (let i = 1; i < frames.length; i++) {
    const [t1, v1, e] = frames[i];
    if (t <= t1) {
      const [t0, v0] = frames[i - 1];
      const k = ease[e || defaultEase]((t - t0) / (t1 - t0));
      return mix(v0, v1, k);
    }
  }
  return frames[frames.length - 1][1];
}

function mix(a, b, k) {
  if (typeof a === 'number') return a + (b - a) * k;
  const out = {};
  for (const n in a) out[n] = typeof a[n] === 'number' && typeof b[n] === 'number' ? a[n] + (b[n] - a[n]) * k : k < 0.5 ? a[n] : b[n];
  for (const n in b) if (!(n in out)) out[n] = b[n];
  return out;
}

// Deterministic PRNG so procedural sets look the same on every visit.
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const hash1 = (n) => {
  const x = Math.sin(n * 127.1) * 43758.5453;
  return x - Math.floor(x);
};
// Smooth 1D value noise in [-1, 1].
function noise1(x) {
  const i = Math.floor(x);
  const f = x - i;
  const u = f * f * (3 - 2 * f);
  return (hash1(i) * (1 - u) + hash1(i + 1) * u) * 2 - 1;
}

// Colour helpers: 'rgb(…)' strings from arrays, and mixing.
const rgb = (c, a = 1) =>
  a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

// Two-bone inverse kinematics. Returns the middle joint for a limb rooted at
// (rx, ry) reaching toward (tx, ty); bend = +1 or −1 picks the elbow side.
function ik2(rx, ry, tx, ty, a, b, bend) {
  let dx = tx - rx;
  let dy = ty - ry;
  let d = Math.hypot(dx, dy);
  const max = (a + b) * 0.999;
  if (d > max) {
    dx *= max / d;
    dy *= max / d;
    d = max;
  }
  d = Math.max(d, Math.abs(a - b) + 0.01);
  const cosA = (a * a + d * d - b * b) / (2 * a * d);
  const ang = Math.atan2(dy, dx) + bend * Math.acos(clamp(cosA, -1, 1));
  return { jx: rx + Math.cos(ang) * a, jy: ry + Math.sin(ang) * a, ex: rx + dx, ey: ry + dy };
}

return { TAU, DEG, clamp, lerp, invLerp, smooth, ease, key, mix, rng, noise1, rgb, mixc, hex, ik2 };
})();

// ---- src/engine/camera.js
const __src_engine_camera = (() => {
// A 2D film camera: centre, framing width (in world units) and shake.
// Layers take a parallax depth: 1 is the action plane, <1 is further away,
// >1 is foreground that sweeps past faster than the actors.

const { noise1 } = __src_engine_util;
const BASE_VIEW = 1400;

class Camera {
  constructor() {
    this.x = 0;
    this.y = -220;
    this.view = BASE_VIEW;
    this.shake = 0;
    this.shakeScale = 1; // the player's camera-shake setting
    this.time = 0;
  }

  set({ x = this.x, y = this.y, view = this.view, shake = 0 } = {}) {
    this.x = x;
    this.y = y;
    this.view = view;
    this.shake = shake * this.shakeScale;
  }

  // Scale and offset for a layer at the given depth.
  frame(W, H, depth = 1) {
    // The view width is framed for 2.39:1; taller frames keep the same
    // vertical coverage plus a little, rather than zooming out sideways.
    const base = Math.max(W / BASE_VIEW, (H * 2.39 * 0.62) / BASE_VIEW);
    const s = base * Math.pow(BASE_VIEW / this.view, depth);
    const sx = this.shake * 14 * noise1(this.time * 23.1);
    const sy = this.shake * 10 * noise1(this.time * 19.7 + 40);
    return {
      s,
      ox: W / 2 - this.x * depth * s + sx * depth,
      oy: H / 2 - this.y * depth * s + sy * depth,
    };
  }

  apply(ctx, W, H, depth = 1) {
    const f = this.frame(W, H, depth);
    ctx.setTransform(f.s, 0, 0, f.s, f.ox, f.oy);
  }

  // World point → texture coordinates (0…1, y down).
  toUv(x, y, W, H, depth = 1) {
    const f = this.frame(W, H, depth);
    return [(x * f.s + f.ox) / W, (y * f.s + f.oy) / H];
  }
}

return { BASE_VIEW, Camera };
})();

// ---- src/engine/renderer.js
const __src_engine_renderer = (() => {
// Deferred 2D lighting.
//
// Scenes paint into four Canvas 2D layers each frame:
//   albedo    – the painted colours of everything that receives light
//   occluders – alpha of anything that casts a shadow
//   emissive  – light sources and sky (not lit, but glowing)
//   ground    – contact/cast shadows projected onto the ground plane
// A WebGL2 pass then lights the albedo with up to four point or directional
// lights: projected shadows on backdrops (so a lantern throws giant shadows
// on a barn wall), rim light on silhouettes from the occluder gradient,
// god rays, bloom, lightning flashes, film grain and a vignette.

const { Camera } = __src_engine_camera;
const MAX_LIGHTS = 4;

const VERT = `#version 300 es
in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;

uniform sampler2D uAlb;
uniform sampler2D uOcc;
uniform sampler2D uEmit;
uniform sampler2D uShd;
uniform vec2 uRes;
uniform vec3 uAmbient;
uniform int uCount;
uniform vec2 uLP[${MAX_LIGHTS}];
uniform vec3 uLC[${MAX_LIGHTS}];
uniform vec4 uLK[${MAX_LIGHTS}];   // falloff radius, projection k, softness, rim
uniform vec2 uGodPos;
uniform float uGod;
uniform float uBloom;
uniform vec3 uFlash;
uniform float uGroundShadow;
uniform float uTime;
uniform float uFade;
uniform float uGrain;
uniform float uExposure;

vec3 toLin(vec3 c) { return pow(c, vec3(2.2)); }

vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);

const __src_engine_state = (() => {
// The player's story so far. Chapter 1 writes it; later chapters read it.

const KEY = 'a-suit-for-burying:v1';

function freshState() {
  return {
    chapter: 1,
    resolve: null, // 'willing' | 'reluctant'
    armed: null, // true | false
    junePacked: false,
    trust: null, // 'high' | 'low'
    river: null, // 'carried' | 'struggled' | 'thrown'
    choices: [],
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? { ...freshState(), ...JSON.parse(raw) } : null;
  } catch {
    return null;
  }
}

function saveState(s) {
  try {
    localStorage.setItem(KEY, JSON.stringify(s));
  } catch {
    /* private mode or blocked storage: the story still plays */
  }
}

return { freshState, loadState, saveState };
})();

    this.scene = { id, def, inst: def.create(env), env };

    this.fired = new Set();
    this.choiceShown = false;
    this.choiceMade = false;
    this.leaving = null;

    this.ui.hideChoice();

    if (def.ambience) this.sound.ambience(def.ambience);

  go(next, { cut = false } = {}) {
    if (this.leaving) return;
    if (next === '@end') {
      this.leaving = { next, cut: false, t: 0 };
      return;
    }
    this.leaving = { next, cut, t: 0 };
  }

    const c = def.choice;
    if (!c || !this.choiceShown || this.choiceMade) return;
    const opt = c.options[i];

    opt.apply?.(this.state);
    this.state.choices.push(`${this.scene.id}:${i}`);
    saveState(this.state);

    this.ui.pickChoice(i);
    this.emit('choice', { scene: this.scene.id, i });
    setTimeout(() => this.ui.hideChoice(), 450);
    const next = typeof opt.next === 'function' ? opt.next(this.state) : opt.next;
    this.go(next, { cut: !!opt.cut });
  }

    const { def, inst } = this.scene;
    this.t += dt;
    const t = this.t;

    for (const [i, line] of (def.lines?.(this.state) || []).entries()) {
      if (t >= line.t && !this.fired.has(`l${i}`)) {
        this.fired.add(`l${i}`);

    }
    for (const [i, card] of (def.cards || []).entries()) {
      if (card.when && !card.when(this.state)) continue;
      if (t >= card.t && !this.fired.has(`c${i}`)) {

        this.ui.card(card.text, card.dur ?? 5);
      }
    }
    for (const [i, cue] of (def.cues || []).entries()) {
      if (t >= cue.t && !this.fired.has(`q${i}`)) {

      fire: bed('bandpass', 2400, 3),
    };
    // Wind gusts: slow modulation of the band.
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.09;
    const lg = ctx.createGain();
    lg.gain.value = 220;
    lfo.connect(lg).connect(this.beds.wind.f.frequency);
    lfo.start();

    // Drone for the score.
    this.droneGain = ctx.createGain();
    this.droneGain.gain.value = 0;
    const df = ctx.createBiquadFilter();
    df.type = 'lowpass';
    df.frequency.value = 260;
    this.droneGain.connect(df).connect(this.music);
    for (const [fr, type] of [[41.2, 'sawtooth'], [41.5, 'sawtooth'], [82.4, 'triangle']]) {
      const o = ctx.createOscillator();
      o.type = type;
      o.frequency.value = fr;
      o.connect(this.droneGain);
      o.start();
    }

    this.step = 0;
    this.nextNote = ctx.currentTime + 0.2;
    this.timer = setInterval(() => this.schedule(), 90);
    return Promise.resolve();
  }

  get t() {
    return this.ctx ? this.ctx.currentTime : 0;
  }

  setMute(m) {
    this.muted = m;
    if (this.ctx) this.master.gain.setTargetAtTime(m ? 0 : this.levels.master, this.t, 0.1);
  }

  // Volume settings, 0…1 each; applied now and on start.
  setLevels({ master, music, effects }) {
    this.levels = { master: master * 0.9, music: music * 0.55, effects: effects * 0.9 };
    if (!this.ctx) return;
    this.master.gain.setTargetAtTime(this.muted ? 0 : this.levels.master, this.t, 0.05);
    this.music.gain.setTargetAtTime(this.levels.music, this.t, 0.05);
    this.sfx.gain.setTargetAtTime(this.levels.effects, this.t, 0.05);
  }

  suspend() {
    this.ctx?.suspend();
  }

  resume() {
    this.ctx?.resume();
  }

  // Ambience levels, 0…1, eased.
  ambience(levels, time = 1.5) {
    if (!this.ctx) return;
    const scale = { wind: 0.35, rain: 0.22, river: 0.5, fire: 0.05 };
    for (const k in levels) {
      if (this.beds[k]) this.beds[k].g.gain.setTargetAtTime(levels[k] * scale[k], this.t, time / 3);
    }
  }

  setMood(m) {
    if (!this.ctx || this.mood === m) return;
    this.mood = m;
    this.step = 0;
    this.nextNote = Math.max(this.nextNote, this.t + 0.4);
    const mood = MOODS[m];
    this.droneGain.gain.setTargetAtTime(mood ? mood.drone : 0, this.t, 1.2);
  }

  schedule() {
    const mood = MOODS[this.mood];
    if (!mood) return;
    while (this.nextNote < this.t + 0.3) {
      const [n, beats] = mood.notes[this.step % mood.notes.length];
      if (n) this.pluck(NOTE[n], this.nextNote, this.mood === 'ride' ? 0.32 : 0.42);
      this.nextNote += (beats * 60) / mood.bpm;
      this.step++;
    }
  }

  // Karplus–Strong plucked string, rendered once per pitch and cached.
  pluck(freq, when = this.t, vol = 0.4) {
    if (!this.ctx) return;
    const ctx = this.ctx;
    let buf = this.plucks.get(freq);
    if (!buf) {
      const sr = ctx.sampleRate;
      const len = Math.floor(sr * 3);
      buf = ctx.createBuffer(1, len, sr);
      const d = buf.getChannelData(0);
      const N = Math.round(sr / freq);
      for (let i = 0; i < N; i++) d[i] = (Math.random() * 2 - 1) * (0.6 + 0.4 * Math.sin((i / N) * Math.PI));
      for (let i = N; i < len; i++) d[i] = (d[i - N] + d[i - N + 1 < i ? i - N + 1 : i - N]) * 0.4985;
      this.plucks.set(freq, buf);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = vol;
    const tone = ctx.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.value = 2600;
    src.connect(tone).connect(g).connect(this.music);
    src.start(when);
  }

  noiseHit({ when = this.t, dur = 0.2, freq = 800, q = 1, type = 'bandpass', vol = 0.5, attack = 0.005, dest = this.sfx }) {
    if (!this.ctx) return;
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    f.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    src.connect(f).connect(g).connect(dest);
    src.start(when, Math.random() * 3);
    src.stop(when + dur + 0.05);
  }

  thump(freq0, freq1, dur, vol, when = this.t) {
    if (!this.ctx) return;
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.frequency.setValueAtTime(freq0, when);
    o.frequency.exponentialRampToValueAtTime(freq1, when + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g).connect(this.sfx);
    o.start(when);
    o.stop(when + dur + 0.02);
  }

  // ---- foley ----

  hoof(surface = 'dirt', vol = 0.5) {
    const v = vol * (0.8 + Math.random() * 0.4);
    if (surface === 'water') {
      this.noiseHit({ dur: 0.25, freq: 900, q: 0.7, vol: v * 0.5 });
      return;
    }
    this.thump(170 + Math.random() * 40, 55, 0.09, v * 0.9);
    this.noiseHit({ dur: surface === 'mud' ? 0.12 : 0.05, freq: surface === 'mud' ? 400 : 1800, q: 1.2, vol: v * (surface === 'wood' ? 0.9 : 0.5) });
  }

  fall() {
    this.thump(120, 38, 0.35, 0.9);
    this.noiseHit({ dur: 0.4, freq: 300, q: 0.6, vol: 0.6, type: 'lowpass' });
  }

  splash(vol = 0.7) {
    this.noiseHit({ dur: 0.9, freq: 1200, q: 0.5, vol, attack: 0.02 });
    this.noiseHit({ dur: 0.6, freq: 300, q: 0.6, vol: vol * 0.6, type: 'lowpass' });
  }

  thunder(strength = 1, delay = 0) {
    const w = this.t + delay;
    this.noiseHit({ when: w, dur: 0.25, freq: 2500, type: 'highpass', vol: 0.5 * strength, q: 0.3 });
    this.noiseHit({ when: w + 0.05, dur: 4.5, freq: 120, type: 'lowpass', vol: 1.0 * strength, q: 0.4, attack: 0.2 });
    this.noiseHit({ when: w + 0.6, dur: 3, freq: 70, type: 'lowpass', vol: 0.8 * strength, q: 0.4, attack: 0.4 });
  }

  snort(vol = 0.5) {
    this.noiseHit({ dur: 0.35, freq: 700, q: 2.5, vol, attack: 0.03 });
    this.noiseHit({ when: this.t + 0.12, dur: 0.3, freq: 500, q: 2, vol: vol * 0.6, attack: 0.02 });
  }

  // A distressed horse: a harsh, falling squeal.
  neigh(vol = 0.35) {
    if (!this.ctx) return;
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = 'sawtooth';
    const w = this.t;
    o.frequency.setValueAtTime(680, w);
    o.frequency.linearRampToValueAtTime(920, w + 0.18);
    o.frequency.exponentialRampToValueAtTime(380, w + 1.1);
    const vib = ctx.createOscillator();
    vib.frequency.value = 22;
    const vg = ctx.createGain();
    vg.gain.value = 40;
    vib.connect(vg).connect(o.frequency);
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 1400;
    f.Q.value = 1.4;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, w);
    g.gain.linearRampToValueAtTime(vol, w + 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, w + 1.2);
    o.connect(f).connect(g).connect(this.sfx);
    o.start(w);
    vib.start(w);
    o.stop(w + 1.3);
    vib.stop(w + 1.3);
  }

  hammer() {
    this.thump(420, 180, 0.06, 0.4);
    this.noiseHit({ dur: 0.05, freq: 2600, q: 2, vol: 0.3 });
  }

  creak() {
    if (!this.ctx) return;
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = 'square';
    o.frequency.setValueAtTime(90, this.t);
    o.frequency.linearRampToValueAtTime(140, this.t + 0.6);
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 700;
    f.Q.value = 8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, this.t);
    g.gain.linearRampToValueAtTime(0.12, this.t + 0.1);
    g.gain.exponentialRampToValueAtTime(0.0001, this.t + 0.7);
    o.connect(f).connect(g).connect(this.sfx);
    o.start();
    o.stop(this.t + 0.75);
  }

  cough() {
    this.noiseHit({ dur: 0.18, freq: 900, q: 1.5, vol: 0.18, attack: 0.01 });
    this.noiseHit({ when: this.t + 0.28, dur: 0.16, freq: 850, q: 1.5, vol: 0.14, attack: 0.01 });
  }

  match() {
    this.noiseHit({ dur: 0.25, freq: 3000, q: 1, vol: 0.25, type: 'highpass' });
  }

  click() {
    this.noiseHit({ dur: 0.03, freq: 3200, q: 4, vol: 0.35 });
    this.thump(900, 400, 0.03, 0.2);
  }

  // Short chord cue when a choice appears.
  sting() {
    [NOTE.E3, NOTE.B3, NOTE.G4].forEach((f, i) => this.pluck(f, this.t + i * 0.06, 0.3));
  }
}

return { Sound };
})();

// ---- src/engine/ui.js
const __src_engine_ui = (() => {
// DOM overlays: subtitles, title cards, choices and the end card.

const $ = (id) => document.getElementById(id);

class UI {
  constructor() {
    this.sub = $('sub');
    this.subWho = $('sub-who');
    this.subText = $('sub-text');
    this.cardEl = $('card');
    this.choiceEl = $('choice');
    this.promptEl = $('choice-prompt');
    this.optsEl = $('choice-opts');
    this.timerEl = $('choice-timer');
    this.timers = [];
    this.typing = null;
  }

  clearText() {
    this.sub.hidden = true;
    this.cardEl.classList.remove('show');
    this.timers.forEach(clearTimeout);
    this.timers = [];
  }

  // Dialogue with a typewriter reveal.
  line(who, text, dur, style) {
    clearInterval(this.typing);
    this.sub.hidden = false;
    this.sub.dataset.style = style || '';
    this.subWho.textContent = who || '';
    this.subWho.hidden = !who;
    this.subText.textContent = '';
    let i = 0;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) this.subText.textContent = text;
    else {
      this.typing = setInterval(() => {
        i += 2;
        this.subText.textContent = text.slice(0, i);
        if (i >= text.length) clearInterval(this.typing);
      }, 22);
    }
    const lineId = (this.lineId = (this.lineId || 0) + 1);
    const id = setTimeout(() => {
      if (this.lineId === lineId) this.sub.hidden = true;
    }, dur * 1000);
    this.timers.push(id);
  }

  card(text, dur) {
    this.cardEl.textContent = text;
    this.cardEl.classList.add('show');
    const id = setTimeout(() => this.cardEl.classList.remove('show'), dur * 1000);
    this.timers.push(id);
  }

  showChoice(prompt, labels, timed, onPick) {
    this.promptEl.textContent = prompt;
    this.optsEl.innerHTML = '';
    labels.forEach((label, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.innerHTML = `<kbd>${i + 1}</kbd><span></span>`;
      b.querySelector('span').textContent = label;
      b.addEventListener('click', () => onPick(i));
      this.optsEl.appendChild(b);
    });
    this.timerEl.hidden = !timed;
    this.timerEl.style.setProperty('--left', '1');
    this.choiceEl.hidden = false;
    requestAnimationFrame(() => this.choiceEl.classList.add('show'));
    this.optsEl.querySelector('button')?.focus({ preventScroll: true });
  }

  choiceTimer(frac) {
    this.timerEl.style.setProperty('--left', String(Math.max(frac, 0)));
  }

  pickChoice(i) {
    this.optsEl.querySelectorAll('.opt').forEach((b, k) => b.classList.add(k === i ? 'picked' : 'faded'));
  }

  hideChoice() {
    this.choiceEl.classList.remove('show');
    this.choiceEl.hidden = true;
  }
}

return { UI };
})();

// ---- src/engine/menu.js
const __src_engine_menu = (() => {
// Game menus: a main menu, an Esc pause menu, and the pages they share
// (settings, controls, about). Pure DOM, keyboard- and pad-navigable, styled
// by the host page through the .menu* classes.
//
// new Menu(root, {
//   main: [{ id, label, sub, action, hidden() }],   main-menu buttons
//   pause: [{ id, label, action }],                  pause-menu buttons
//   settings: [{ key, label, type, ... }],           settings schema
//   controls: { input, actions } | { list },         rebindable or static
//   about: html string,
//   header: html string shown above the main menu,
//   onOpen, onClose                                   pause hooks
// })

const el = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
};

class Menu {
  constructor(root, opts) {
    this.root = root;
    this.o = opts;
    this.stack = [];
    this.mode = null; // 'main' | 'pause' | null
    root.classList.add('menu');
    root.hidden = true;
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-modal', 'true');
    root.addEventListener('keydown', (e) => this.nav(e));
  }

  get open() {
    return this.mode !== null;
  }

  showMain() {
    this.mode = 'main';
    this.stack = ['main'];
    this.render();
  }

  showPause() {
    if (this.mode) return;
    this.mode = 'pause';
    this.stack = ['pause'];
    this.o.onOpen?.();
    this.render();
  }

  close() {
    const was = this.mode;
    this.mode = null;
    this.stack = [];
    this.root.hidden = true;
    this.root.innerHTML = '';
    if (was === 'pause') this.o.onClose?.();
  }

  push(page) {
    this.stack.push(page);
    this.render();
  }

  back() {
    if (this.stack.length > 1) {
      this.stack.pop();
      this.render();
    } else if (this.mode === 'pause') this.close();
  }

  // Esc from the game or inside the menu.
  toggle() {
    if (this.mode === 'pause') this.back();
    else if (this.mode === 'main') {
      if (this.stack.length > 1) this.back();
    } else this.showPause();
  }

  render() {
    const page = this.stack[this.stack.length - 1];
    this.root.hidden = false;
    this.root.dataset.page = page;
    this.root.dataset.mode = this.mode;
    this.root.innerHTML = '';
    const panel = el('div', 'menu-panel');
    this.root.appendChild(panel);
    const build = { main: this.pageMain, pause: this.pagePause, settings: this.pageSettings, controls: this.pageControls, about: this.pageAbout }[page];
    build.call(this, panel);
    requestAnimationFrame(() => panel.querySelector('button, input, select')?.focus({ preventScroll: true }));
  }

  list(panel, items) {
    const ul = el('div', 'menu-list');
    for (const it of items) {
      if (it.hidden?.()) continue;
      const b = el('button', 'menu-btn');
      b.type = 'button';
      b.innerHTML = `<span class="menu-btn-label">${it.label}</span>${it.sub ? `<span class="menu-btn-sub">${it.sub}</span>` : ''}`;
      b.addEventListener('click', () => it.action(this));
      ul.appendChild(b);
    }
    panel.appendChild(ul);
  }

  heading(panel, title, sub) {
    panel.appendChild(el('h2', 'menu-title', title));
    if (sub) panel.appendChild(el('p', 'menu-sub', sub));
  }

  backButton(panel, label = 'Back') {
    const b = el('button', 'menu-back', `← ${label}`);
    b.type = 'button';
    b.addEventListener('click', () => this.back());
    panel.appendChild(b);
  }

  pageMain(panel) {
    if (this.o.header) panel.appendChild(el('div', 'menu-header', this.o.header));
    this.list(panel, this.o.main);
  }

  pagePause(panel) {
    this.heading(panel, this.o.pauseTitle || 'Paused');
    this.list(panel, this.o.pause);
  }

  pageAbout(panel) {
    panel.appendChild(el('div', 'menu-about', this.o.about));
    this.backButton(panel);
  }

  pageSettings(panel) {
    this.heading(panel, 'Settings');
    const s = this.o.settingsStore;
    const form = el('div', 'menu-form');
    for (const f of this.o.settings) {
      const row = el('label', 'menu-row');
      const id = `set-${f.key}`;
      row.htmlFor = id;
      row.appendChild(el('span', 'menu-row-label', f.label));
      let input;
      if (f.type === 'range') {
        input = el('input');
        input.type = 'range';
        input.min = f.min ?? 0;
        input.max = f.max ?? 1;
        input.step = f.step ?? 0.05;
        input.value = s.get(f.key);
        const out = el('output', 'menu-row-value', fmt(f, s.get(f.key)));
        input.addEventListener('input', () => {
          s.set(f.key, +input.value);
          out.textContent = fmt(f, +input.value);
        });
        row.appendChild(input);
        row.appendChild(out);
      } else if (f.type === 'select') {
        input = el('select');
        for (const [v, label] of f.options) {
          const o = el('option', '', label);
          o.value = v;
          input.appendChild(o);
        }
        input.value = String(s.get(f.key));
        input.addEventListener('change', () => s.set(f.key, isNaN(+input.value) ? input.value : +input.value));
        row.appendChild(input);
      } else {
        input = el('input');
        input.type = 'checkbox';
        input.checked = !!s.get(f.key);
        input.addEventListener('change', () => s.set(f.key, input.checked));
        row.appendChild(input);
      }
      input.id = id;
      form.appendChild(row);
    }
    panel.appendChild(form);
    const reset = el('button', 'menu-link', 'Restore defaults');
    reset.type = 'button';
    reset.addEventListener('click', () => {
      const keys = s.get('keys');
      s.reset();
      if (keys && !this.o.resetKeys) s.set('keys', keys);
      this.render();
    });
    panel.appendChild(reset);
    this.backButton(panel);
  }

  pageControls(panel) {
    this.heading(panel, 'Controls', this.o.controls.input ? 'Select a key to change it, then press the new key.' : '');
    const c = this.o.controls;
    const table = el('div', 'menu-keys');
    if (c.input) {
      const input = c.input;
      const b = input.bindings();
      for (const [a, label, ar] of c.actions) {
        const row = el('div', 'menu-key-row');
        row.appendChild(el('span', 'menu-row-label', `${label}${ar ? ` <span class="ar" lang="ar" dir="rtl">${ar}</span>` : ''}`));
        const keys = el('span', 'menu-key-slots');
        for (let slot = 0; slot < 2; slot++) {
          const k = el('button', 'menu-key', c.label(b[a]?.[slot]));
          k.type = 'button';
          k.addEventListener('click', () => {
            k.textContent = 'Press a key…';
            k.classList.add('listening');
            input.capture = (code) => {
              if (code !== 'Escape') input.rebind(a, slot, code);
              this.render();
            };
          });
          keys.appendChild(k);
        }
        row.appendChild(keys);
        table.appendChild(row);
      }
    } else {
      for (const [keysLabel, what] of c.list) {
        const row = el('div', 'menu-key-row');
        row.appendChild(el('span', 'menu-row-label', what));
        row.appendChild(el('span', 'menu-key static', keysLabel));
        table.appendChild(row);
      }
    }
    panel.appendChild(table);
    if (c.extra) panel.appendChild(el('p', 'menu-sub', c.extra));
    this.backButton(panel);
  }

  // Arrow keys move between controls; Esc goes back.
  nav(e) {
    if (e.code === 'Escape' || e.code === 'Backspace') {
      if (e.target.closest?.('.listening')) return;
      e.preventDefault();
      e.stopPropagation();
      if (this.mode === 'main' && this.stack.length === 1) return;
      this.back();
      return;
    }
    if (e.code !== 'ArrowDown' && e.code !== 'ArrowUp') return;
    if (e.target.tagName === 'SELECT') return;
    const items = [...this.root.querySelectorAll('button, input, select')];
    const i = items.indexOf(document.activeElement);
    const n = items[(i + (e.code === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
    n?.focus();
    e.preventDefault();
  }
}

function fmt(f, v) {
  if (f.format) return f.format(v);
  return `${Math.round(v * 100)}%`;
}

return { Menu };
})();

// ---- src/engine/settings.js
const __src_engine_settings = (() => {
// Player settings, persisted per browser. Every read and write is guarded:
// private windows and sandboxed frames may refuse storage, and the story must
// still run on defaults.

const KEY = 'a-suit-for-burying:settings:v1';

const DEFAULTS = {
  master: 1,
  music: 1,
  effects: 1,
  subtitles: true,
  textSize: 1,
  shake: true,
};

class Settings {
  constructor(key = KEY, defaults = DEFAULTS) {
    this.key = key;
    this.defaults = defaults;
    this.values = structuredClone(defaults);
    this.listeners = [];
    try {
      const raw = localStorage.getItem(key);
      if (raw) Object.assign(this.values, JSON.parse(raw));
    } catch {
      /* storage unavailable: defaults it is */
    }
  }

  get(k) {
    return this.values[k];
  }

  set(k, v) {
    this.values[k] = v;
    try {
      localStorage.setItem(this.key, JSON.stringify(this.values));
    } catch {
      /* not persisted, still applied */
    }
    for (const fn of this.listeners) fn(k, v);
  }

  reset() {
    for (const k of Object.keys(this.defaults)) this.set(k, structuredClone(this.defaults[k]));
  }

  onChange(fn) {
    this.listeners.push(fn);
  }
}

return { DEFAULTS, Settings };
})();

// ---- src/rigs/shapes.js
const __src_rigs_shapes = (() => {
// Path helpers for hand-built silhouettes.

// Smooth closed (or open) curve through points, Catmull-Rom → Bézier.
function smoothPath(ctx, pts, closed = true, tension = 1) {
  const n = pts.length;
  const p = (i) => (closed ? pts[(i + n) % n] : pts[Math.min(Math.max(i, 0), n - 1)]);

      return [piv[0] + lx * cs - ly * sn, piv[1] + lx * sn + ly * cs - bob];
    };

    // Rearing tucks the forelegs up under the chest.
    const tuck = clamp(this.rear * 1.4);
    for (let i = 0; i < 2; i++) {
      const t = body(FORE_ROOT[0] + 22 + i * 6, FORE_ROOT[1] + 70);
      hv[i] = [lerp(hv[i][0], t[0], tuck), lerp(hv[i][1], t[1], tuck)];
    }
    this.frame = { body, hv, pitch };
    return this.frame;
  }

  toWorld(lx, ly) {
    return [this.x + lx * this.f * this.scale, this.y + ly * this.scale];
  }

  // Seat of the saddle in world space, plus body pitch, for a rider.
  seat() {
    const { body, pitch } = this.frame || this.solve();
    const p = body(-2, -46);
    return { x: this.toWorld(p[0], p[1])[0], y: this.toWorld(p[0], p[1])[1], pitch: pitch * this.f, f: this.f };
  }

  // Bit (for reins) in world space.
  bit() {
    return this.bitWorld || [this.x, this.y - 120];
  }

  draw(ctx) {
    const { body, hv } = this.solve();
    const c = this.c;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.f * this.scale, this.scale);

    const farCoat = shade(c.coat, 0.66);
    const legs = [
      { root: FORE_ROOT, fore: true },
      { root: FORE_ROOT, fore: true },
      { root: HIND_ROOT, fore: false },
      { root: HIND_ROOT, fore: false },
    ];
    const drawLeg = (i, near) => {
      const L = legs[i];
      const r = body(L.root[0] + (near ? 0 : -6), L.root[1]);
      const hoof = hv[i];
      const fet = [hoof[0] + (L.fore ? -3 : -4), hoof[1] - 13];
      const a = L.fore ? 54 : 58;
      const bl = L.fore ? 52 : 52;
      const bend = L.fore ? -1 : 1; // knees forward, hocks back
      const j = ik2(r[0], r[1], fet[0], fet[1], a, bl, bend);
      const col = near ? c.coat : farCoat;
      const low = near ? c.dark : shade(c.dark, 0.7);
      limb(ctx, j.jx, j.jy, j.ex, j.ey, 13, 9.5, col);
      limb(ctx, r[0], r[1] - 8, j.jx, j.jy, L.fore ? 26 : 36, 14, col);
      limb(ctx, j.ex, j.ey, hoof[0] + 3, hoof[1] - 4, 10, 9, low);
      ctx.beginPath();
      ctx.moveTo(hoof[0] - 5, hoof[1] - 7);
      ctx.lineTo(hoof[0] + 8, hoof[1] - 7);
      ctx.lineTo(hoof[0] + 10, hoof[1]);
      ctx.lineTo(hoof[0] - 5, hoof[1]);
      ctx.closePath();
      ctx.fillStyle = near ? c.hoof : shade(c.hoof, 0.7);
      ctx.fill();
    };

    // tail (behind everything)
    const tr = body(-88, -28);
    ctx.save();
    ctx.translate(tr[0], tr[1]);
    ctx.rotate(-this.frame.pitch * 0.3);
    ctx.strokeStyle = c.mane;
    ctx.lineCap = 'round';
    for (let k = 0; k < 6; k++) {
      const sw = this.tailAng + k * 0.05 + 0.04 * noise1(this.time * 1.6 + k * 3);
      ctx.lineWidth = 7 - k * 0.6;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      const len = 88 + k * 4;
      ctx.bezierCurveTo(-18, 8, -Math.sin(sw) * len * 0.8 - 10, Math.cos(sw) * len * 0.45, -Math.sin(sw) * len * 0.7 - 6, Math.cos(sw) * len);
      ctx.stroke();
    }
    ctx.restore();

    drawLeg(1, false);
    drawLeg(3, false);

    // body
    const pts = [
      [88, 0], [85, -26], [58, -44], [18, -35], [-24, -39], [-66, -42], [-90, -28],
      [-96, -4], [-88, 20], [-70, 32], [-38, 34], [-6, 42], [38, 40], [64, 30], [82, 18],
    ].map(([x, y]) => body(x, y));
    ctx.beginPath();
    smoothPath(ctx, pts, true);
    ctx.fillStyle = c.coat;
    ctx.fill();

    // neck and head
    const nb1 = body(44, -40);
    const nb2 = body(88, -8);
    const na = this.neck + this.frame.pitch;
    const poll = [lerp(nb1[0], nb2[0], 0.35) + Math.cos(na) * 78, lerp(nb1[1], nb2[1], 0.35) + Math.sin(na) * 78];
    const perp = [-Math.sin(na), Math.cos(na)];
    ctx.beginPath();
    smoothPath(ctx, [
      nb1,
      [lerp(nb1[0], poll[0], 0.55) - perp[0] * 10, lerp(nb1[1], poll[1], 0.55) - perp[1] * 10],
      [poll[0] - perp[0] * 7, poll[1] - perp[1] * 7],
      [poll[0] + perp[0] * 16, poll[1] + perp[1] * 16],
      [lerp(nb2[0], poll[0], 0.5) + perp[0] * 12, lerp(nb2[1], poll[1], 0.5) + perp[1] * 12],
      nb2,
      body(40, -8),
    ], true);
    ctx.fill();

    // mane along the crest
    ctx.strokeStyle = c.mane;
    ctx.lineWidth = 3;
    for (let k = 0; k <= 9; k++) {
      const t = k / 9;
      const px = lerp(nb1[0] + 4, poll[0], t) - perp[0] * (8 - t * 2);
      const py = lerp(nb1[1] - 2, poll[1], t) - perp[1] * (8 - t * 2);
      const sway = 0.3 * noise1(this.time * 2 + k) + Math.min(Math.abs(this.speed) * 0.002, 0.5);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.quadraticCurveTo(px - 6 - sway * 10, py + 6, px - 10 - sway * 16, py + 16);
      ctx.stroke();
    }

    const ha = na + this.head + 0.95;
    ctx.save();
    ctx.translate(poll[0], poll[1]);
    ctx.rotate(ha);
    ctx.beginPath();
    smoothPath(ctx, [[-2, -9], [22, -10], [48, -6], [62, -2], [65, 6], [60, 13], [46, 13], [22, 17], [2, 14]], true);
    ctx.fillStyle = c.coat;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(56, 6, 9, 7.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = c.muzzle;
    ctx.fill();
    // ears
    const ep = this.ears;
    ctx.fillStyle = c.coat;
    ctx.beginPath();
    ctx.moveTo(1, -8);
    ctx.lineTo(-4 - ep * 16, -26 + ep * 14);
    ctx.lineTo(9, -10);
    ctx.fill();
    // forelock and eye
    ctx.strokeStyle = c.mane;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(2, -8);
    ctx.quadraticCurveTo(10, -4, 14, 4);
    ctx.stroke();
    ctx.fillStyle = '#0c0b0a';
    ctx.beginPath();
    ctx.ellipse(21, -3, 3, 2.2, 0.3, 0, Math.PI * 2);
    ctx.fill();
    if (this.saddled) {
      // bridle
      ctx.strokeStyle = '#2a1a10';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(6, -9);
      ctx.lineTo(18, 16);
      ctx.moveTo(46, -6);
      ctx.lineTo(56, 12);
      ctx.moveTo(8, 4);
      ctx.lineTo(50, 2);
      ctx.stroke();
    }
    const bitL = [56, 11];
    ctx.restore();
    const bx = poll[0] + Math.cos(ha) * bitL[0] - Math.sin(ha) * bitL[1];
    const by = poll[1] + Math.sin(ha) * bitL[0] + Math.cos(ha) * bitL[1];
    this.bitWorld = this.toWorld(bx, by);

    if (this.saddled) {
      // blanket, saddle, cinch, horn
      const s = (x, y) => body(x, y);
      ctx.fillStyle = '#6a2a22';
      ctx.beginPath();
      smoothPath(ctx, [s(30, -38), s(-36, -40), s(-40, -8), s(28, -6)], true);
      ctx.fill();
      ctx.fillStyle = '#4a2c18';
      ctx.beginPath();
      smoothPath(ctx, [s(26, -40), s(16, -54), s(-6, -46), s(-26, -52), s(-32, -40), s(-30, -22), s(22, -20)], true);
      ctx.fill();
      ctx.strokeStyle = '#2e1b0e';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(...s(4, -24));
      ctx.lineTo(...s(8, 40));
      ctx.stroke();
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(...s(-4, -30));
      ctx.lineTo(...s(-2, 12));
      ctx.stroke();
      ctx.fillStyle = '#1c120a';
      ctx.fillRect(...s(-3, 10), 6, 7); // stirrup
      if (this.bags) {
        ctx.fillStyle = '#3c2616';
        ctx.beginPath();
        smoothPath(ctx, [s(-30, -38), s(-54, -36), s(-58, -8), s(-34, -6)], true);
        ctx.fill();
      }
      ctx.fillStyle = '#3a2412';
      ctx.beginPath();
      const hn = s(22, -52);
      ctx.arc(hn[0], hn[1], 4, 0, Math.PI * 2);
      ctx.fill();
    }

    drawLeg(0, true);
    drawLeg(2, true);
    ctx.restore();

    // reins, in world space
    if (this.saddled) {
      const [bxw, byw] = this.bitWorld;
      ctx.strokeStyle = '#1e140c';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(bxw, byw);
      if (this.reins) {
        const [rx, ry] = this.reins;
        ctx.quadraticCurveTo((bxw + rx) / 2, Math.max(byw, ry) + 14, rx, ry);
      } else {
        const w = this.toWorld(...body(30, -30));
        ctx.quadraticCurveTo((bxw + w[0]) / 2, Math.max(byw, w[1]) + 30, w[0], w[1]);
      }
      ctx.stroke();
    }
  }
}

return { COATS, Horse };

const __src_sets_scenery = (() => {

// Vertical gradient in screen space. stops: [[0…1, '#hex'], …]
function skyGradient(R, stops) {
  R.sky((c) => {
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, R.H);
    for (const [p, col] of stops) g.addColorStop(p, col);
    c.fillStyle = g;
    c.fillRect(0, 0, R.W, R.H);
    c.restore();
  });
}

function stars(R, amount, seed = 3) {
  if (amount <= 0) return;
  R.sky((c) => {
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    const r = rng(seed);
    for (let i = 0; i < 260; i++) {
      const x = r() * R.W;
      const y = r() * R.H * 0.6;
      const b = r();
      c.fillStyle = `rgba(230,235,255,${amount * (0.2 + b * 0.8) * (1 - y / (R.H * 0.6))})`;
      c.fillRect(x, y, b > 0.9 ? 2 : 1.2, b > 0.9 ? 2 : 1.2);
    }
    c.restore();
  });
}

function sun(R, x, y, radius, color, depth = 0.05) {
  R.layer(depth);
  R.sky((c) => {
    const g = c.createRadialGradient(x, y, 0, x, y, radius * 5);
    g.addColorStop(0, color);
    g.addColorStop(0.18, color);
    g.addColorStop(0.22, 'rgba(255,190,120,0.35)');
    g.addColorStop(1, 'rgba(255,140,80,0)');
    c.fillStyle = g;
    c.fillRect(x - radius * 5, y - radius * 5, radius * 10, radius * 10);
  });
  R.layer(1);
}

// Soft cloud banks drawn over the sky.
function clouds(R, { seed = 1, y = -500, color = 'rgba(60,40,60,0.6)', count = 8, depth = 0.1, spread = 3000, t = 0, drift = 4 }) {
  R.layer(depth);
  R.sky((c) => {

    c.fillStyle = color;
    for (let i = 0; i < count; i++) {
      const cx = (r() - 0.5) * spread + ((t * drift) % spread);
      const cy = y + (r() - 0.5) * 120;
      const w = 200 + r() * 420;
      c.beginPath();
      for (let k = 0; k < 6; k++) {
        const ox = (k / 5 - 0.5) * w;
        c.ellipse(cx + ox, cy - Math.sin((k / 5) * Math.PI) * 26, w * 0.22, 24 + r() * 26, 0, 0, Math.PI * 2);

// ------------------------------------------------------------- terrain -----

// A ridge line of hills or mountains filling down from its crest.
function ridge(R, { depth = 0.3, base = 0, height = 200, freq = 0.004, rough = 0.5, seed = 0, color = '#2a2230', haze = null, mesa = false, cast = false }) {
  R.layer(depth);
  const cam = R.cam;
  const span = 700 * Math.pow(cam.view / 1400, depth) + 300;
  const x0 = cam.x * depth - span;
  const x1 = cam.x * depth + span;
  const f = (x) => {
    let n = noise1(x * freq + seed) * 0.6 + noise1(x * freq * 2.3 + seed * 3) * 0.3 * rough + noise1(x * freq * 6 + seed * 7) * 0.12 * rough;
    if (mesa) n = n > 0.05 ? 0.35 + n * 0.1 : n * 0.9 - 0.2;
    return base - height * (0.55 + 0.5 * n);
  };
  const path = (c) => {
    c.beginPath();
    c.moveTo(x0, base + 3000);
    for (let x = x0; x <= x1; x += 14) c.lineTo(x, f(x));
    c.lineTo(x1, base + 3000);
    c.closePath();
  };
  const draw = (c) => {
    path(c);
    c.fillStyle = color;
    c.fill();
  };
  if (cast) R.cast(draw);
  else R.paint(draw);
  // Atmospheric haze: distant ranges scatter a little sky light back at us.
  if (haze) {
    R.glow((c) => {
      path(c);
      c.globalAlpha = haze[1];
      c.fillStyle = haze[0];
      c.fill();
    });
  }
  R.layer(1);
  return f;
}

function ground(R, y, color, depth = 1, top = null) {
  R.layer(depth);
  R.paint((c) => {
    c.fillStyle = color;
    c.fillRect(R.cam.x * depth - 6000, y, 12000, 4000);
    if (top) {
      c.fillStyle = top;
      c.fillRect(R.cam.x * depth - 6000, y, 12000, 5);
    }
  });
  R.layer(1);
}

// Dry grass tufts along the ground line.
function grass(R, { y = 0, x0 = -2000, x1 = 2000, seed = 5, color = '#3a2a1a', density = 0.06, height = 26, t = 0, wind = 1, cast = false }) {

    c.strokeStyle = color;
    c.lineWidth = 2;
    c.beginPath();
    for (let x = x0; x < x1; x += 1 / density) {

      const h = height * (0.4 + r());

      for (let k = -1; k <= 1; k++) {

        c.quadraticCurveTo(gx + k * 4 + sway * 0.5, y - h * 0.5, gx + k * 7 + sway, y - h * (0.8 + r() * 0.3));
      }
    }
    c.stroke();
  };
  if (cast) R.cast(draw);
  else R.paint(draw);
}

const treeCache = new Map();

function buildTree(seed) {
  const r = rng(seed);
  const segs = [];
  const leaves = [];
  const grow = (x, y, ang, len, w, depth) => {
    const x2 = x + Math.cos(ang) * len;
    const y2 = y + Math.sin(ang) * len;
    segs.push([x, y, x2, y2, w, w * 0.72, depth]);
    if (depth >= 6 || len < 18) {
      for (let i = 0; i < 3; i++) leaves.push([x2 + (r() - 0.5) * 40, y2 + (r() - 0.5) * 30, 26 + r() * 30, r() * 6]);
      return;
    }
    const n = depth < 2 ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const spread = depth === 0 ? 0.9 : 0.75;
      const a = ang + (i / (n - 1 || 1) - 0.5) * spread * 2 + (r() - 0.5) * 0.5;
      grow(x2, y2, a, len * (0.68 + r() * 0.18), w * 0.66, depth + 1);
    }
  };
  grow(0, 0, -Math.PI / 2 + 0.08, 150, 34, 0);
  return { segs, leaves };
}

// A lone oak. It casts shadows and breaks sunlight into shafts.
function oak(R, x, y, { seed = 7, scale = 1, t = 0, leafColor = '#1e1a16', barkColor = '#221b15', bare = false } = {}) {

    c.save();
    c.translate(x, y);
    c.scale(scale, scale);
    c.lineCap = 'round';
    for (const [x0, y0, x1, y1, w0, w1, d] of tree.segs) {
      const sway = d > 2 ? Math.sin(t * 0.9 + d) * (d - 2) * 0.8 : 0;
      c.strokeStyle = barkColor;
      c.lineWidth = (w0 + w1) / 2;
      c.beginPath();
      c.moveTo(x0, y0);
      c.lineTo(x1 + sway, y1);
      c.stroke();
    }
    if (!bare) {
      c.fillStyle = leafColor;
      for (const [lx, ly, lr, ph] of tree.leaves) {
        const sway = Math.sin(t * 0.8 + ph) * 3;
        c.beginPath();
        c.ellipse(lx + sway, ly, lr, lr * 0.72, 0, 0, Math.PI * 2);
        c.fill();

    c.beginPath();
    c.moveTo(-40, 2);
    c.quadraticCurveTo(-14, -8, -16, -40);
    c.lineTo(16, -40);
    c.quadraticCurveTo(14, -8, 44, 2);
    c.closePath();
    c.fill();
    c.restore();
  });

function farmhouse(R, x, y, { lit = 1, t = 0 } = {}) {

      c.fillStyle = `rgba(255,${150 + 40 * fl},${70},${lit * fl})`;

// Scrub and rocks sweeping past in the foreground (depth > 1).
function foreground(R, { depth = 1.6, y = 60, seed = 21, color = '#0e0a08', count = 14, spread = 5000 }) {

  R.paint((c) => {
    const r = rng(seed);
    c.fillStyle = color;
    for (let i = 0; i < count; i++) {
      const x = (r() - 0.5) * spread;
      const w = 60 + r() * 160;
      const h = 30 + r() * 90;
      c.beginPath();
      if (r() > 0.5) {
        smoothPath(c, [[x - w / 2, y + 100], [x - w * 0.4, y - h * 0.6], [x, y - h], [x + w * 0.4, y - h * 0.5], [x + w / 2, y + 100]], true, 0.8);

        for (let k = 0; k < 9; k++) {
          const a = -Math.PI + (k / 8) * Math.PI;
          c.moveTo(x, y + 20);
          c.lineTo(x + Math.cos(a) * h * 1.2, y + Math.sin(a) * h * 1.1);
        }
        c.strokeStyle = color;
        c.lineWidth = 3;
        c.stroke();
        continue;
      }
      c.fill();
    }
  });

}

// ----------------------------------------------------------- weather -------

function rain(R, t, amount = 1, wind = 0.25) {
  if (amount <= 0) return;
  R.glow((c) => {
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    const r = rng(77);
    c.strokeStyle = `rgba(170,190,215,${0.16 * amount})`;
    c.lineWidth = 1.2;
    c.beginPath();
    const n = (500 * amount) | 0;
    for (let i = 0; i < n; i++) {
      const sp = 900 + r() * 500;
      const x0 = r() * (R.W + 200) - 100;
      const y = ((r() * R.H + t * sp) % (R.H + 60)) - 30;
      const x = (x0 + t * sp * wind) % (R.W + 200) - 100;
      c.moveTo(x, y);
      c.lineTo(x - 18 * wind * 2, y - 26);
    }
    c.stroke();
    c.restore();
  });
}

// A jagged bolt from the clouds to (x, y). Returns nothing; add a flash too.
function lightningBolt(R, x, y, seed, strength) {
  if (strength <= 0.02) return;
  R.layer(0.4);
  R.glow((c) => {
    const r = rng(seed);
    const pts = [[x + (r() - 0.5) * 200, y - 900]];
    for (let i = 1; i <= 14; i++) pts.push([lerp(pts[0][0], x, i / 14) + (r() - 0.5) * 70, lerp(pts[0][1], y, i / 14)]);
    c.lineCap = 'round';
    for (const [w, a] of [[16, 0.15], [6, 0.5], [2.5, 1]]) {
      c.strokeStyle = `rgba(210,225,255,${a * strength})`;
      c.lineWidth = w;
      c.beginPath();
      pts.forEach(([px, py], i) => (i ? c.lineTo(px, py) : c.moveTo(px, py)));
      c.stroke();
    }
  });
  R.layer(1);
}

// A flooded river: dark water with moving highlights, drawn over whatever
// stands in it so legs and bodies disappear below the surface.
function river(R, y, t, { flash = 0, x0 = -3000, x1 = 3000, rush = 1 } = {}) {
  R.cover((c) => {
    c.fillStyle = '#0d1418';
    c.fillRect(x0, y, x1 - x0, 1200);
  });
  R.glow((c) => {
    const r = rng(90);
    c.lineCap = 'round';
    for (let i = 0; i < 90; i++) {
      const row = r();
      const yy = y + 4 + row * row * 260;
      const speed = 90 * rush * (1 + r());
      const len = 30 + r() * 90;
      const xx = x0 + ((r() * (x1 - x0) + t * speed) % (x1 - x0));
      const a = (0.1 + 0.25 * r()) * (1 - row * 0.7) + flash * 0.4;
      c.strokeStyle = `rgba(${140 + flash * 100},${170 + flash * 70},${200 + flash * 55},${a})`;
      c.lineWidth = 1.5 + (1 - row) * 1.5;
      c.beginPath();
      c.moveTo(xx, yy + Math.sin(t * 3 + i) * 2);
      c.lineTo(xx + len, yy + Math.sin(t * 3 + i + 1) * 2);
      c.stroke();
    }
  });
}

// Foam boiling around something standing in the current.
function foam(R, x, y, w, t, amount = 1) {
  R.glow((c) => {
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI;
      const px = x + Math.cos(a) * w * 0.5 + Math.sin(t * 5 + i) * 6;
      c.fillStyle = `rgba(190,205,215,${0.18 * amount})`;
      c.beginPath();
      c.ellipse(px, y + Math.sin(t * 7 + i * 2) * 3, 16, 5, 0, 0, Math.PI * 2);
      c.fill();
    }
  });
}

function townLights(R, x, y, t, depth = 0.35) {
  R.layer(depth);
  R.paint((c) => {
    const r = rng(55);
    c.fillStyle = '#0c0b10';

      const h = 30 + r() * 50;

  R.glow((c) => {
    const r2 = rng(56);
    for (let i = 0; i < 30; i++) {
      const fl = 0.7 + 0.3 * noise1(t * 2 + i * 5);
      c.fillStyle = `rgba(255,${150 + r2() * 60},70,${0.8 * fl})`;
      c.fillRect(x + r2() * 860, y - 10 - r2() * 60, 4, 5);
    }
  });
  R.layer(1);
}

const __src_story_staging = (() => {
// Staging helpers shared by the chapter's scenes: moving actors, seating
// riders, hoof sounds, and the recurring farm set.

const { clamp, lerp, smooth } = __src_engine_util;
const { POSES, walkPose, blendPose } = __src_rigs_person;
const S = __src_sets_scenery;
// Drive a horse to a scripted x position, deriving its gait from the speed.
function drive(horse, x, dt) {
  const v = dt > 0 ? (x - horse.x) / dt : 0;
  const sp = Math.abs(v);
  const g = sp < 6 ? 'stand' : sp < 120 ? 'walk' : sp < 280 ? 'trot' : 'gallop';
  if (horse.gait !== 'swim') horse.setGait(g);
  horse.speed = sp;
  horse.x = x;
  horse.update(dt, false);
}

// Seat a person on a horse, leaning with the gait.
function seatRider(p, horse, { lean = 0, arms = null } = {}) {
  const s = horse.seat();
  p.grounded = false;
  p.f = horse.f;
  p.x = s.x;
  p.y = s.y + 2;
  const gallop = horse.gait === 'gallop';
  p.setPose({
    ...POSES.ride,
    torso: POSES.ride.torso + (gallop ? 0.32 : 0) - s.pitch * p.f * 0.8 + lean + (gallop ? 0.05 * Math.sin(horse.phase * Math.PI * 2) : 0),
    ...(arms || {}),
  });
}

// Walk a person from x0 to x1 between t0 and t1 (holding pose outside it).
function walk(p, t, x0, x1, t0, t1, base = POSES.stand) {
  const k = clamp((t - t0) / (t1 - t0));
  p.grounded = true;
  p.x = lerp(x0, x1, k);
  if (x1 !== x0 && k > 0 && k < 1) {
    p.f = x1 > x0 ? 1 : -1;
    const stepIn = smooth(0, 0.08, k) * (1 - smooth(0.92, 1, k));
    p.setPose(blendPose(base, walkPose((Math.abs(p.x - x0) / 88) * Math.PI * 2 * 0.5), stepIn));
    return true;
  }
  return false;
}

// Blend between two poses over a time window.
function poseAt(p, t, t0, t1, from, to) {
  p.setPose(blendPose(from, to, smooth(t0, t1, t)));
}

function hooves(sound, horse, surface = 'dirt', vol = 0.35) {
  horse.onStep = () => sound.hoof(surface, vol);
}

// Draw an actor with its ground shadow.
function actor(R, a, { shear = 0, squash = 0.14, groundY = 0, shadow = true } = {}) {
  R.cast((c) => a.draw(c));
  if (shadow) R.shadow((c) => a.draw(c), a.x, groundY, shear, squash);
}

// ---------------------------------------------------------------- farm -----

const FARM = { houseX: 240, fenceX0: -760, fenceX1: 120, postX: -210 };

const SKIES = {
  dusk: [[0, '#1c1a31'], [0.35, '#4d2f4c'], [0.6, '#b8623f'], [0.72, '#e39352']],
  night: [[0, '#05060c'], [0.4, '#0b1020'], [0.72, '#1a2236']],
  dawn: [[0, '#2c3150'], [0.35, '#6a5a78'], [0.6, '#d48a72'], [0.72, '#f2c089']],
  sunset: [[0, '#2a1d3a'], [0.3, '#6e3346'], [0.55, '#d0603c'], [0.7, '#f4a650']],
  golden: [[0, '#3c4a72'], [0.35, '#8c6a6a'], [0.6, '#e09a58'], [0.72, '#f8cc86']],
  storm: [[0, '#04050a'], [0.5, '#0a0d16'], [0.75, '#121826']],
};

// Blend two sky gradients (same stop positions).
function mixSky(a, b, k) {
  const hx = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  return a.map(([p, ca], i) => {
    const A = hx(ca);
    const B = hx(b[Math.min(i, b.length - 1)][1]);
    const c = A.map((v, j) => Math.round(lerp(v, B[j], k)).toString(16).padStart(2, '0'));
    return [p, `#${c.join('')}`];
  });
}

// The Marrow farm: failing corn, a split-rail fence, the house.
function farmSet(R, t, { sky = SKIES.dusk, lit = 1, stars = 0, handbill = false } = {}) {
  S.skyGradient(R, sky);
  S.stars(R, stars);
  S.clouds(R, { seed: 4, y: -430, color: 'rgba(40,24,40,0.45)', count: 7, t, drift: 3 });
  S.ridge(R, { depth: 0.18, base: -6, height: 150, freq: 0.003, seed: 2, color: '#3a2c40', haze: ['#7a4a5a', 0.18] });
  S.ridge(R, { depth: 0.45, base: 12, height: 70, freq: 0.006, seed: 9, rough: 0.3, color: '#2a1f26' });
  S.ground(R, 0, '#241a14', 1, '#2e2219');
  S.cornField(R, -1100, -260, -18, { t, color: '#5d4a2c' });
  const house = S.farmhouse(R, FARM.houseX, 0, { lit, t });
  S.fence(R, FARM.fenceX0, FARM.fenceX1, 6, { broken: [2] });
  if (handbill) {
    R.paint((c) => {
      c.save();
      c.translate(FARM.postX - 11, -64);
      c.rotate(0.06);
      c.fillStyle = '#c9bb96';
      c.fillRect(0, 0, 22, 28);
      c.fillStyle = '#3a2e22';
      for (let i = 0; i < 5; i++) c.fillRect(3, 4 + i * 5, 16 - (i % 2) * 5, 1.5);
      c.restore();
    });
  }
  S.grass(R, { y: 2, x0: -1600, x1: 1400, seed: 8, color: '#3a2b1a', t, density: 0.05 });
  return house;
}


return { drive, seatRider, walk, poseAt, hooves, actor, FARM, SKIES, mixSky, farmSet };

function farmActors() {
  const eli = new Person('suit');
  eli.x = -150;
  eli.f = -1;
  const june = new Person('dress', 0.62);
  june.x = 205;
  june.y = -8;
  june.f = -1;
  june.setPose(P_PORCH);
  const tob = new Person('vest');
  const ches = new Horse('chestnut');
  ches.saddled = true;
  ches.bags = true;
  ches.x = -1500;
  return { eli, june, tob, ches };
}

function farmLook(R, house, night = 0) {
  return {
    ambient: [lerp(0.17, 0.05, night), lerp(0.15, 0.06, night), lerp(0.26, 0.12, night)],
    lights: [
      { uv: [-0.08, 0.64], color: night ? [0.4, 0.5, 0.85] : [0.95, 0.55, 0.38], intensity: lerp(0.95, 0.35, night), radius: 0, rim: 1.0 },
      { x: house.window[0], y: house.window[1], color: [1.0, 0.64, 0.3], intensity: lerp(1.3, 1.8, night), radius: 0.2, rim: 0.7 },
    ],
    groundShadow: lerp(0.6, 0.3, night),
    bloom: 0.8,
  };
}

function drawFarm(R, t, a, opts = {}) {
  const house = farmSet(R, t, opts);
  const shear = -1.5;
  actor(R, a.ches, { shear });
  if (a.tob.visible !== false) R.cast((c) => a.tob.draw(c));
  if (a.june.visible !== false) actor(R, a.june, { shear, groundY: -8 });
  actor(R, a.eli, { shear });
  return house;
}

function barnLook(R, lamp, moon = 0.45, extra = []) {

    exposure: 1.1,

function drawBarn(R, t, a, lamp, { bundle = null, doorway = true } = {}) {
  S.barnInterior(R, { t });
  if (doorway) {
    // the open door: moonlit yard beyond, framed by dark jambs
    R.glow((c) => {
      const g = c.createLinearGradient(0, -330, 0, 0);
      g.addColorStop(0, 'rgba(30,40,70,0.7)');
      g.addColorStop(0.7, 'rgba(60,78,120,0.8)');
      g.addColorStop(1, 'rgba(40,50,70,0.8)');
      c.fillStyle = g;
      c.fillRect(-940, -330, 150, 330);
    });
    R.paint((c) => {
      c.fillStyle = '#1c130c';
      c.fillRect(-952, -342, 12, 342);
      c.fillRect(-790, -342, 12, 342);
      c.fillRect(-952, -350, 174, 16);
    });
  }
  S.trunk(R, -120, 0, { open: a.lid || 0 });
  R.cast((c) => a.dove.draw(c));
  S.barnStall(R);
  if (a.june.visible) R.cast((c) => a.june.draw(c));
  R.cast((c) => a.eli.draw(c));
  if (bundle) R.cast((c) => P.bundle(c, bundle.x, bundle.y, bundle.open));
  lamp.fl = S.lantern(R, lamp.x, lamp.y, { lit: lamp.lit, t });
}

function dawnLook(R, house) {

function drawDawn(R, t, a, extra) {
  const house = farmSet(R, t, { sky: SKIES.dawn, lit: 0.35 });
  // hitching post
  R.cast((c) => {
    c.fillStyle = '#3b2d20';
    c.fillRect(-262, -100, 9, 102);
    c.fillRect(-275, -104, 36, 7);
  });
  const shear = -1.6;
  actor(R, a.june, { shear, groundY: -8 });
  actor(R, a.dove, { shear });
  actor(R, a.eli, { shear });
  if (a.hatX !== undefined) R.cast((c) => P.hatOnGround(c, a.hatX, 4));
  extra?.(R);
  // morning mist hanging over the ground
  R.layer(0.8);
  R.glow((c) => {
    const g = c.createLinearGradient(0, -120, 0, 40);
    g.addColorStop(0, 'rgba(210,200,220,0)');
    g.addColorStop(0.7, 'rgba(210,200,220,0.13)');
    g.addColorStop(1, 'rgba(210,200,220,0.05)');
    c.fillStyle = g;
    c.fillRect(-3000, -120, 6000, 160);
  });
  R.layer(1);
  return house;
}

// Standing hip → saddle, as one continuous mount.
function mountOnto(e, d, t, t0, t1) {
  const k = smooth(t0, t1, t);
  const s = d.seat();
  e.grounded = true;
  const [sx, sy] = e.hip();
  e.grounded = false;
  e.f = d.f;
  e.x = lerp(sx, s.x, k);
  e.y = lerp(sy, s.y + 2, k) - Math.sin(k * Math.PI) * 30;
  e.setPose(blendPose(P_MOUNT, POSES.ride, smooth(t0 + (t1 - t0) * 0.4, t1, t)));
}

function drawRiver(R, t, a, flash, strikeX, extra) {
  S.skyGradient(R, SKIES.storm);
  S.clouds(R, { seed: 13, y: -380, color: `rgba(${20 + flash * 90},${24 + flash * 100},${38 + flash * 130},0.9)`, count: 14, t, drift: 18 });

  R.paint((c) => {
    c.fillStyle = '#15120f';
    c.beginPath();
    c.moveTo(-3000, 400);
    c.lineTo(-3000, -40);
    c.lineTo(BANK_L - 130, -40);
    c.quadraticCurveTo(BANK_L - 40, -38, BANK_L, 20);
    c.lineTo(BANK_R, 20);
    c.quadraticCurveTo(BANK_R + 40, -38, BANK_R + 130, -40);

    c.fill();

  S.lightningBolt(R, strikeX * 0.4, -40 * 0.4, 7, flash);
  R.cast((c) => a.ches.draw(c));
  R.cast((c) => a.tob.draw(c));
  R.cast((c) => a.dove.draw(c));
  if (a.eli.visible !== false) R.cast((c) => a.eli.draw(c));
  extra?.(R);
  S.river(R, WATER, t, { flash, x0: BANK_L - 40, x1: BANK_R + 40, rush: 1.4 });
  if (a.dove.y > 20) S.foam(R, a.dove.x, WATER, 170, t, 1);
  if (a.eli.inWater) S.foam(R, a.eli.x, WATER, 60, t, 1.2);
  S.rain(R, t, 1, 0.3);
}
