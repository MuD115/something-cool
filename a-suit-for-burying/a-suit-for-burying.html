        },
        camera: (t) => ({ x: key(t, [[0, 40], [duration, lerp(40, a.dove.x, 0.6)]]), y: -150, view: key(t, [[0, 1250], [duration, 1350]]) }),
        look: () => riverLook(a.flash, R, -300),
        draw(R, t) {
          drawRiver(R, t, a, a.flash, -300);
        },
      };
    },
  };
}

const riverCarried = riverAfter({
  duration: 16,
  river: 'carried',
  strikes: [[6, 0.35]],
  lines: () => [
    { t: 3.2, who: ELI, text: 'That’s it. You’ve got us. You’ve got us.', dur: 3.6 },
    { t: 12.4, who: ELI, text: 'Good girl.', dur: 2.6 },
  ],
  script(a, t, dt) {
    const d = a.dove;
    d.rear = 0.5 * (1 - smooth(0, 2.2, t));
    d.ears = 1 - smooth(0.5, 2.5, t);
    d.neck = lerp(-1.2, -0.7, smooth(0, 2, t));
    if (t > 2 && t < 10.5) d.setGait('swim');
    else if (d.gait === 'swim') d.setGait('walk');
    drive(d, key(t, [[2, 130], [10.5, -760, 'linear'], [12, -840, 'out']]), dt);
    d.y = bedAt(d.x);
    d.buck = t > 12.3 && t < 13.4 ? 0.2 * Math.sin((t - 12.3) * 18) : 0;
    seatRider(a.eli, d, { lean: 0.3 * (1 - smooth(10, 11, t)), arms: t < 10.5 ? { armN: 1.1, foreN: 1.3 } : null });
  },
});

const riverStruggle = riverAfter({
  duration: 16,
  river: 'struggled',
  strikes: [[4.5, 0.5], [9, 0.3]],
  lines: () => [
    { t: 1.6, who: ELI, text: 'Easy! Easy, damn you!', dur: 3 },
    { t: 12.6, who: TOBIAS, text: 'Thought the river had you both!', dur: 3.2 },
  ],
  script(a, t, dt, sound) {
    const d = a.dove;
    const fight = 1 - smooth(6, 10, t);
    d.rear = (0.35 + 0.3 * Math.sin(t * 5.5)) * fight;
    d.ears = fight;
    if (t > 1 && t < 11) d.setGait('swim');
    else if (d.gait === 'swim') d.setGait('walk');
    drive(d, 130 - 900 * smooth(1, 11.5, t) + 20 * Math.sin(t * 4) * fight, dt);
    d.y = bedAt(d.x);
    seatRider(a.eli, d, { lean: -0.2 * fight + 0.25, arms: { armN: 0.4, foreN: 1.1 } });
  },
});

const riverThrown = riverAfter({
  duration: 23,
  river: 'thrown',
  strikes: [[3, 0.4], [13.5, 0.5]],
  lines: () => [
    { t: 7.2, who: TOBIAS, text: 'She’s going back for him!', dur: 3.2, style: 'shout' },
    { t: 19.6, who: ELI, text: 'Why’d you come back for me?', dur: 3.4 },
  ],
  script(a, t, dt, sound, state) {
    const d = a.dove;
    const e = a.eli;
    if (!a.splashed && t > 1.3) {
      a.splashed = true;
      sound.splash(0.9);
    }
    if (!a.called && t > 6) {
      a.called = true;
      sound.neigh(0.35);
    }
    // Dove: to the bank, turn back, swim to him, turn, tow him out.
    let x;
    if (t < 5) x = lerp(130, -700, smooth(0.2, 5, t));
    else if (t < 7) x = -700;
    else if (t < 11.2) x = lerp(-700, 180, smooth(7, 11.2, t));
    else if (t < 12.4) x = 180;
    else x = lerp(180, -720, smooth(12.4, 18, t));
    d.f = t < 6 || t > 12 ? -1 : 1;
    d.setGait((t > 0.5 && t < 4.4) || (t > 7.2 && t < 11) || (t > 12.6 && t < 17.2) ? 'swim' : 'walk');
    drive(d, x, dt);
    d.y = bedAt(d.x);
    d.rear = t < 0.8 ? 0.6 : 0;
    d.neck = t > 6 && t < 7.2 ? -1.25 : t > 19 ? 0.1 : -0.85;
    d.head = t > 19 ? 0.6 : 1.05;

    // Eli: thrown, then fighting the current, then hanging on, then ashore.
    e.visible = true;
    e.inWater = t > 1.3 && t < 18.2;
    const drift = 220 + 11 * (t - 1.3);
    if (t < 1.3) {
      const k = t / 1.3;
      const s = { x: 130, y: -140 };
      e.grounded = false;
      e.x = lerp(s.x, 240, k);
      e.y = lerp(s.y, 50, k) - Math.sin(k * Math.PI) * 120;
      e.setPose(POSES.lie);
      e.hat = 'off';
    } else if (t < 11.6) {
      e.grounded = false;
      e.x = drift;
      e.y = 46 + Math.sin(t * 3) * 6;
      e.f = -1;
      e.setPose({ ...POSES.stand, torso: 0.1, head: -0.3, armN: 2.3 + 0.5 * Math.sin(t * 4), foreN: 2.6 + 0.4 * Math.sin(t * 4 + 1), armF: 2.0 + 0.5 * Math.sin(t * 4 + 2), foreF: 2.4 });
    } else if (t < 18.2) {
      e.grounded = false;
      e.f = -1;
      e.x = d.x + (t < 12.4 ? 40 : 70);
      e.y = 40 + Math.sin(t * 3) * 3;
      e.setPose({ ...POSES.stand, torso: -0.2, armN: 2.6, foreN: 2.9, armF: 2.4, foreF: 2.8 });
    } else {
      e.grounded = true;
      e.y = -40;
      e.x = lerp(-640, -660, smooth(18.2, 19, t));
      e.f = -1;
      e.setPose(t < 19.5 ? blendPose(POSES.lie, POSES.sit, smooth(18.2, 19.5, t)) : { ...POSES.sit, head: -0.25 });
    }
    state.mercy = true;
  },
});

// ============================================================ 7. ridge =======

const ridgeScene = {
  duration: 35,
  mood: 'tension',
  ambience: { wind: 0.5, rain: 0.45, river: 0 },
  cards: [{ t: 9.6, dur: 5, text: 'CALVARY BEND — No firearms within town limits. By order of Marshal H. Grady.' }],
  lines: (s) => {
    const out = [];
    if (s.armed) {
      out.push({ t: 15.6, who: ELI, text: 'Marshal can ask me for it himself.', dur: 4 });
      out.push({ t: 20.4, who: TOBIAS, text: 'So what do we do now?', dur: 3 });
      out.push({ t: 24, who: ELI, text: 'We wait for the town to go to sleep.', dur: 4 });
    } else {
      out.push({ t: 26, who: ELI, text: 'Oh, June.', dur: 3 });
    }
    if (s.river === 'thrown') out.push({ t: 29.6, who: ELI, text: 'Reckon I owe you twice now, girl.', dur: 3.4 });
    else if (s.river === 'carried') out.push({ t: 29.6, who: ELI, text: 'Ada’s girl. Always were.', dur: 3.4 });
    return out;
  },
  create({ R, sound, state }) {
    const eli = new Person('suit');
    const tob = new Person('vest');
    const dove = new Horse('dove');
    const ches = new Horse('chestnut');
    dove.saddled = ches.saddled = true;
    dove.bags = ches.bags = true;
    ches.x = -380;
    ches.f = 1;
    hooves(sound, dove, 'mud', 0.3);
    const armed = !!state.armed;
    let last = 0;
    const note = !armed;
    const a = { flash: 0, matchT: -1 };
    const strikes = [[12, 0.3], [21, 0.2]];
    return {
      update(t, dt) {
        a.flash = flashAt(t, strikes);
        if (Math.abs(t - 12) < dt) sound.thunder(0.35, 1.6);
        drive(dove, key(t, [[0, -1000], [5, -90, 'out']]), t - last || dt);
        last = t;
        ches.setGait('stand');
        ches.update(dt, false);
        seatRider(tob, ches);
        if (t < 5.4) seatRider(eli, dove);
        else if (t < 7) {
          // dismount: saddle to ground
          const k = smooth(5.4, 7, t);
          const s = dove.seat();
          eli.grounded = true;
          eli.x = dove.x + 60;
          eli.setPose(P_STAND);
          const [gx, gy] = eli.hip();
          eli.grounded = false;
          eli.x = lerp(s.x, gx, k);
          eli.y = lerp(s.y, gy, k) - Math.sin(k * Math.PI) * 24;
          eli.setPose(blendPose(POSES.ride, P_STAND, k));
        } else if (walk(eli, t, dove.x + 60, 70, 7.2, 9.2)) {
          /* to the sign */
        } else if (armed) {
          eli.f = 1;
          eli.setPose(t > 15 ? blendPose(P_STAND, P_BELT, smooth(15, 16, t)) : { ...P_STAND, head: -0.1 });
        } else if (t < 14) {
          eli.f = 1;
          eli.setPose({ ...P_STAND, head: -0.1 });
        } else if (walk(eli, t, 70, dove.x - 60, 14, 15.8)) {
          /* back to the saddlebag */
        } else {
          eli.f = -1;
          const reach = smooth(16, 16.6, t) * (1 - smooth(17, 17.6, t));
          eli.setPose(blendPose(t > 17.4 ? { ...POSES.hands, head: 0.35 } : P_STAND, { ...POSES.reach, armN: 1.4, foreN: 1.7 }, reach));
          if (t > 18.8 && a.matchT < 0) {
            a.matchT = t;
            sound.match();
          }
        }
      },
      camera: (t) => ({
        x: key(t, [[0, -520], [6, -150], [10, 0], [28, 0], [35, 260]]),
        y: key(t, [[0, -210], [28, -200], [35, -60]]),
        view: key(t, [[0, 1300], [10, 1100], [28, 1150], [35, 1750]]),
      }),
      look(t) {
        const matchLit = a.matchT > 0 ? clamp((t - a.matchT) * 6) * (1 - smooth(a.matchT + 7.5, a.matchT + 8.5, t)) : 0;
        const [hx, hy] = hand(eli);
        const townUv = uvOf(R, 800, 20, 0.35);
        const lights = [
          { uv: [0.15, -0.4], color: [0.4, 0.5, 0.78], intensity: 0.45, radius: 0, rim: 0.9 },
          { uv: townUv, color: [1.0, 0.58, 0.3], intensity: 0.55, radius: 0.35, rim: 0.9 },
        ];
        if (matchLit > 0) lights.unshift({ x: hx, y: hy - 12, color: [1.0, 0.65, 0.3], intensity: 2.2 * matchLit * (0.85 + 0.15 * noise1(t * 20)), radius: 0.12, rim: 1.2 });
        a.matchLit = matchLit;
        return { ambient: [0.05, 0.06, 0.1], flash: [0.3 * a.flash, 0.35 * a.flash, 0.55 * a.flash], lights, groundShadow: 0, bloom: 1.1 };
      },
      draw(R, t) {
        S.skyGradient(R, SKIES.night);
        S.clouds(R, { seed: 21, y: -380, color: `rgba(${24 + a.flash * 80},${28 + a.flash * 90},${44 + a.flash * 120},0.85)`, count: 12, t, drift: 8 });
        S.ridge(R, { depth: 0.2, base: 60, height: 120, freq: 0.004, seed: 61, color: '#0c0d14' });
        S.townLights(R, 420, 40, t, 0.35);
        // the ridge top, falling away to the town below
        R.paint((c) => {
          c.fillStyle = '#16120f';
          c.beginPath();
          c.moveTo(-3000, 600);
          c.lineTo(-3000, 0);
          c.lineTo(300, 0);
          c.quadraticCurveTo(360, 8, 390, 60);
          c.lineTo(430, 600);
          c.fill();
        });
        S.signpost(R, 150, 0, ['CALVARY BEND', 'NO FIREARMS WITHIN TOWN LIMITS.', 'BY ORDER OF', 'MARSHAL H. GRADY']);
        R.cast((c) => ches.draw(c));
        R.cast((c) => tob.draw(c));
        R.cast((c) => dove.draw(c));
        R.cast((c) => eli.draw(c));
        if (!armed && t > 17.2) {
          const [hx, hy] = hand(eli);
          R.cast((c) => P.bundle(c, hx - 6, hy + 2, smooth(19.4, 20.4, t)));
          if (note && t > 19.8) R.paint((c) => P.paper(c, hx + 16, hy - 10, -0.3));
        }
        if (a.matchLit > 0) {
          const [hx, hy] = hand(eli);
          R.glow((c) => {
            const g = c.createRadialGradient(hx, hy - 12, 0, hx, hy - 12, 10);
            g.addColorStop(0, `rgba(255,230,170,${a.matchLit})`);
            g.addColorStop(1, 'rgba(255,140,40,0)');
            c.fillStyle = g;
            c.fillRect(hx - 12, hy - 24, 24, 24);
          });
        }
        S.rain(R, t, 0.45, 0.2);
      },
    };
  },
  next: '@end',
};

// A card for the unarmed path, where June's note is read by match-light.
ridgeScene.cards.push({ t: 20.4, dur: 5.4, text: '“Pa — You promised Ma. But I want you home more. — June”', when: (s) => !s.armed });

const CHAPTER_1 = {
  first: 'prologue',
  scenes: {
    prologue,
    farm,
    'farm-hear': farmHear,
    'farm-refuse': farmRefuse,
    barn,
    'barn-take': barnTake,
    'barn-leave': barnLeave,
    dawn,
    'mount-soft': mountSoft,
    'mount-force': mountForce,
    ride,

    'river-carried': riverCarried,

    'river-thrown': riverThrown,
    ridge: ridgeScene,

// What the player's choices say about their Eli, for the end card.
function summary(s) {
  return [
    s.resolve === 'willing' ? 'You heard Tobias out, and took the money on offer.' : 'You sent Tobias away. A long night changed your mind.',
    s.armed ? 'Eli carries Ada’s pistol.' : 'You left the pistol in the trunk. June packed it for him anyway.',
    s.trust === 'high' ? 'You spoke softly, and Dove chose to carry him.' : 'You forced her. Dove carries him because she has to.',
    s.river === 'carried'
      ? 'In the flood you let go, and she brought you both across.'
      : s.river === 'struggled'
        ? 'In the flood you held on, and you both came out bruised.'
        : 'In the flood she threw him, then turned back for him.',
  ];
}

return { CHAPTER_1, summary };
})();

// ---- src/main.js
const __src_main = (() => {
const { Renderer } = __src_engine_renderer;
const { Director } = __src_engine_director;
const { Sound } = __src_engine_audio;
const { UI } = __src_engine_ui;
const { Menu } = __src_engine_menu;
const { Settings } = __src_engine_settings;
const { freshState, loadState } = __src_engine_state;
const { CHAPTER_1, summary } = __src_story_chapter1;
const $ = (id) => document.getElementById(id);
const stage = $('stage');
const canvas = $('view');

let R;
try {
  R = new Renderer(canvas);
} catch (err) {
  $('nogl').hidden = false;
  throw err;
}

const settings = new Settings();
const sound = new Sound();
const ui = new UI();
let state = freshState();
const director = new Director({ R, sound, ui, scenes: CHAPTER_1.scenes, state });

// ------------------------------------------------------------ sizing -------

// Cinemascope where there's room; a taller frame on portrait phones so the
// action and the text still fit.
let quality = 1;
function resize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const aspect = vw / vh < 1 ? 1.6 : 2.39;
  const w = Math.min(vw, vh * aspect);
  const h = w / aspect;
  stage.style.width = `${w}px`;
  stage.style.height = `${h}px`;
  // Type scales with the frame, but never below what a phone needs.
  stage.style.setProperty('--u', `${Math.max(w, h * 2.39) / 100}px`);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const px = Math.round(Math.min(1400, Math.max(640, w * dpr)) * quality);
  const py = Math.round(px / aspect);
  if (px !== R.W || py !== R.H) R.resize(px, py);
}
window.addEventListener('resize', resize);
resize();

// ------------------------------------------------------------ settings ---

function applySettings() {
  sound.setLevels({ master: settings.get('master'), music: settings.get('music'), effects: settings.get('effects') });
  stage.classList.toggle('nosubs', !settings.get('subtitles'));
  stage.style.setProperty('--ts', String(settings.get('textSize')));
  R.cam.shakeScale = settings.get('shake') ? 1 : 0;
}
settings.onChange(applySettings);
applySettings();

// ------------------------------------------------------ the main menu -----

// The main menu sits over a living frame of the prologue.
const titleEnv = { state, sound: { snort() {}, hoof() {} }, R, director };
let titleScene = CHAPTER_1.scenes.prologue.create(titleEnv);
let started = false;

function begin() {
  started = true;
  menu.close();
  state = freshState();
  director.state = state;
  director.paused = false;
  $('end').hidden = true;
  $('end').classList.remove('show');
  ui.clearText();
  ui.hideChoice();
  sound.start().then(() => {
    sound.resume();
    sound.setLevels({ master: settings.get('master'), music: settings.get('music'), effects: settings.get('effects') });
    sound.setMood('elegy');
  });
  director.start(CHAPTER_1.first);
}

function toMainMenu() {
  started = false;
  director.paused = false;
  $('end').hidden = true;
  $('end').classList.remove('show');
  ui.clearText();
  ui.hideChoice();
  sound.suspend();
  titleScene = CHAPTER_1.scenes.prologue.create(titleEnv);
  menu.showMain();
}

director.on('end', (s) => {
  const list = $('end-list');
  list.innerHTML = '';
  for (const line of summary(s)) {
    const li = document.createElement('li');
    li.textContent = line;
    list.appendChild(li);
  }
  $('end').hidden = false;
  requestAnimationFrame(() => $('end').classList.add('show'));
  $('again').focus({ preventScroll: true });
});
$('again').addEventListener('click', begin);
$('end-menu').addEventListener('click', toMainMenu);

// Returning players: the menu mentions their last ending.
function lastTime() {
  const saved = loadState();
  return saved && saved.river ? `<p class="note" id="saved">Last time: ${summary(saved)[1]}</p>` : '';
}

const menu = new Menu($('menu'), {
  get header() {
    return `<p class="kicker">Chapter One &middot; The Trunk</p>
    <h1 id="title-h">A Suit for Burying</h1>
    <p class="tagline">He buried his wife in the only suit he owned. He never took it off. Now a stranger wants the man he used to be.</p>
    ${lastTime()}`;
  },
  main: [
    { label: 'Begin', sub: 'Sound on · about five minutes', action: () => begin() },
    { label: 'Settings', action: (m) => m.push('settings') },
    { label: 'Controls', action: (m) => m.push('controls') },
    { label: 'About', action: (m) => m.push('about') },
  ],
  pause: [
    { label: 'Resume', action: (m) => m.close() },
    { label: 'Settings', action: (m) => m.push('settings') },
    { label: 'Controls', action: (m) => m.push('controls') },
    { label: 'Restart chapter', action: () => begin() },
    { label: 'Main menu', action: () => toMainMenu() },
  ],
  onOpen: () => {
    director.paused = true;
    sound.suspend();
  },
  onClose: () => {
    director.paused = false;
    sound.resume();
  },
  settingsStore: settings,
  settings: [
    { key: 'master', label: 'Master volume', type: 'range' },
    { key: 'music', label: 'Music', type: 'range' },
    { key: 'effects', label: 'Sound effects', type: 'range' },
    { key: 'subtitles', label: 'Subtitles', type: 'toggle' },
    { key: 'textSize', label: 'Text size', type: 'select', options: [[0.85, 'Small'], [1, 'Medium'], [1.2, 'Large'], [1.4, 'Extra large']] },
    { key: 'shake', label: 'Camera shake', type: 'toggle' },
  ],
  controls: {
    list: [
      ['1 / 2', 'Make a choice (or click it)'],
      ['Esc / Space', 'Open or close this menu'],
      ['M', 'Sound on or off'],
      ['F', 'Full screen'],
      ['Enter', 'Begin, from the main menu'],
    ],
    extra: 'Some choices are timed. If you hesitate, the story chooses for him.',
  },
  about: `<h2 class="menu-title">About</h2>
    <p><strong>A Suit for Burying</strong> is a short interactive Western. A widower in a black suit, his late wife&rsquo;s grey mare, and a stranger who knew the man he used to be.</p>
    <p>This is Chapter One. Your choices change how it plays out, and they&rsquo;re saved for the next chapter.</p>
    <p class="menu-sub">Everything is drawn, lit and synthesised in code, in real time. There are no images or recordings.</p>`,
});
menu.showMain();

// ------------------------------------------------------------- controls ---

window.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select')) return;
  const k = e.key.toLowerCase();
  if (k === 'escape' || (k === ' ' && started && !menu.open)) {
    if (e.target.closest('button') && k === ' ') return;
    e.preventDefault();
    if (started) menu.toggle();
  } else if (menu.open) {
    return;
  } else if (k === '1' || k === '2') director.choose(+k - 1);
  else if (k === 'm') sound.setMute(!sound.muted);
  else if (k === 'f') {
    const el = document.documentElement;
    (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.())?.catch?.(() => {});
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && started && !menu.open) menu.showPause();
});

// ----------------------------------------------------------------- loop ---

let lastNow = performance.now();
let time = 0;
let frames = 0;
let fpsT = 0;
function frame(now) {
  const dt = Math.min((now - lastNow) / 1000, 0.1);
  lastNow = now;
  time += dt;

  if (!started) {
    titleScene.update(12 + time * 0.2, dt);
    R.cam.time = time;
    R.cam.set({ x: -80, y: -230, view: 1350 });
    R.frame((r) => titleScene.draw(r, 12 + time), { ...titleScene.look(12), time, fade: 0.35 });
  } else {
    director.update(dt * (window.story?.speed || 1));
    director.render(time);
  }

  // Drop resolution once if the machine is struggling.
  frames++;
  fpsT += dt;
  if (fpsT > 2) {
    const fps = frames / fpsT;
    frames = 0;
    fpsT = 0;
    if (fps < 34 && quality > 0.6) {
      quality -= 0.2;
      resize();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Debug and testing hook.
window.story = {
  speed: 1,
  director,
  get state() {
    return director.state;
  },
  menu,
  settings,
  begin,
  jump: (id) => {
    if (!started) begin();
    director.start(id, { cut: true });
  },
  choose: (i) => director.choose(i),
};

return {  };
})();
