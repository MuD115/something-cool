    for (const id of ['torch', 'mirror', 'walkie']) if (!s.tools.includes(id)) s.tools.push(id);
    s.tools = s.tools.filter((id) => id !== 'whitecloth');
    g.active = 'mirror';

    const startAt = { south: X.start, lanes: X.lanesCp + 20, front: X.frontCp + 40 }[cp] ?? X.start;
    g.player.place(startAt);
    g.player.f = 1;

    // --- the people on the way ---
    const tyreMan = g.npc('man', X.tyreMan, { f: 1 });
    tyreMan.override = { ...POSES.squat, head: 0.1 };
    // the medic, out for a cigarette against the wall of his hospital
    const medic = g.npc('medic', X.medic, { f: -1 });
    medic.override = P_SMOKE;
    medic.rig.prop = (c, hand) => cigarette(c, hand, g.time);
    // a local man, unarmed, watching from behind the sandbags
    const guard = g.npc('spotter', X.guard, { f: 1 });
    guard.override = { ...POSES.kneel, head: -0.15 };
    const abu = g.npc('abuyazan', X.stop - 700, { f: 1 });
    abu.visible = false;
    Object.assign(g, { tyreMan, medic, guard, abu });

    // --- the collapsed wall: only a crawl gets under it ---
    L.ceiling(X.crawl[0], X.crawl[1], -58);

    // --- examine points ---
    // (box: the outline round the thing, fitted to its art, offset by bx, by)
    const look = (id, x, y, key, range = 90, box = {}) => L.add({ id, x, y, range, look: true, label: ['تفحّص', 'Examine'], use: () => line(g, key), ...box });
    look('wall1', X.wall1[0] - 40, -120, 'lane1_wall', 90, { box: [425, 110], bx: 248, by: 68 });
    look('car', X.car[0] - 30, -110, 'lane2_car', 90, { box: [240, 120], bx: 151, by: 55, outline: [[-117,57],[-119,-19],[-96,-50],[-11,-62],[49,-60],[85,-33],[119,-19],[121,57]] });
    look('crawl', X.crawl[0] - 50, -80, 'crawl', 70, { box: [185, 74], bx: 136, by: 48 });
    look('smoke', X.lane3[0] - 60, -160, 'lane3_smoke', 90, { box: [64, 44], bx: 260, by: 103 });
    look('hospital', X.hosp[0] + 300, -130, 'hospital', 110, { box: [318, 204], by: 35 });

    // --- the way south ---
    // (only what's still ahead of a restarted checkpoint)
    const ahead = (x, fn) => x > startAt && L.at(x, fn);
    LANES.forEach((lane) => ahead(lane.x0 - 260, () => g.runner.run(this.laneIntro(g, lane))));
    ahead(X.crawl[0] - 180, () => g.runner.run(this.crawl(g)));
    ahead(X.lanesCp, () => g.checkpoint('lanes'));
    ahead(X.medic - 260, () => g.runner.run(this.hospital(g)));
    ahead(X.frontCp, () => g.checkpoint('front'));
    ahead(X.stop - 170, () => g.runner.run(this.frontline(g)));

    // our sandbags: no one goes past them
    g.gate = (move) => (move > 0 && g.player.x >= X.stop && !g.a.stepOut ? 0 : move);

    g.sound.ambience({ wind: 0.35, air: 0.45, generator: 0, crowd: 0, traffic: 0 }, 2);
    g.sound.score?.mood('dusk', 4);
    g.sound.life(0.5);
    g.runner.run(this.opening(g));
    g.runner.run(ambient(g));
  },

  *opening(g) {
    const cp = g.state.checkpoint;
    if (cp === 'south') {
      g.text.titleCard(CARDS.open, 6);
      yield 6.5;
      g.text.objective(OBJ.south);
      g.prompt('right', 'امشِ', 'Walk');
      yield () => g.player.x > X.start + 120;
      g.prompt(null);
      yield 4;
      g.sound.radio(3);
      line(g, 'radio_west');
    } else {
      g.text.objective(cp === 'front' ? OBJ.on : OBJ.south);
    }
  },

  // ============================================================ the lanes ==

  *laneIntro(g, lane) {
    const p = g.player;
    g.sound.score?.mood('tense', 3);
    if (lane.id === 1) {
      g.text.objective(OBJ.lane1);
      g.prompt('crouch', 'انحنِ', 'Crouch down');
      yield* say(g, 'lane_intro');
      yield GAP;
      line(g, 'lane_light');
    } else if (lane.id === 2) {
      g.a.t2 = g.time; // his watch starts now: at the window first
      yield* say(g, 'lane2_car');
      yield GAP;
      line(g, 'lane2_hint');
      g.text.objective(OBJ.lane2);
      g.a.radio2 = true;
    } else {
      g.a.t3 = g.time;
      g.tyreMan.f = 1;
      yield* say(g, 'lane3_tyre');
      g.text.objective(OBJ.lane3);
    }
    yield () => p.x > lane.x1 + 20;
    if (lane.id === 2) g.a.radio2 = false;
    if (g.promptInfo?.en === 'Crouch down') g.prompt(null);
    g.text.objective(lane.id === 3 ? OBJ.on : OBJ.south);
    // stand again, unless the next thing along wants him low
    if (p.stance === 'crouch' && !g.promptInfo) {
      g.prompt('crouch', 'قِف', 'Stand up');
      yield () => p.stance === 'stand' || g.promptInfo?.en !== 'Stand up';
      if (g.promptInfo?.en === 'Stand up') g.prompt(null);
    }
    if (lane.id === 3) g.sound.score?.mood('dusk', 6);
  },

  // A near miss: he fires to kill, and the round cracks into the wall a hand's
  // width from Sami's head, and he throws himself back to where the lane began.
  *nearMiss(g, lane) {
    const p = g.player;
    const a = g.a;
    a.shotBusy = true;
    g.lock();
    const hx = p.f > 0 ? Math.min(p.x + 120, lane.x1 + 10) : Math.max(p.x - 120, lane.x0 - 10);
    const hy = -150 - Math.random() * 40;
    g.sound.sniperCrack();
    g.effects.puff(hx, hy);
    Object.assign(a, { shotAt: g.time, shotX: hx, shotY: hy });
    g.bump(0.25);
    const dive = g.settings.get('physics');
    if (dive) {
      // he throws himself down, away from where the round struck
      const away = -(Math.sign(hx - p.x) || p.f);
      p.knockDown([away * 320, -220], { then: a.forgiving ? 'prone' : null });
      yield 0.9;
    } else {
      p.override = P_FLINCH;
      yield 0.4;
    }
    g.fade = 0.55;
    yield 0.2;
    p.override = null;
    if (a.forgiving) {
      // forgiving lanes: he stays flat where he is, out of the sniper's line
      if (!p.down) p.stance = 'prone';
    } else {
      p.place(lane.x0 - 70);
      p.f = 1;
      p.stance = 'crouch';
    }
    g.fade = 0;
    g.state.lane_retries += 1;
    a.expose = 0;
    g.lock(false);
    a.shotBusy = false;
    const n = g.state.lane_retries;
    line(g, n === 1 ? 'warn_1' : n === 2 ? 'warn_2' : 'warn_3');
  },

  *lanePeek(g) {
    const p = g.player;
    g.lock();
    p.f = 1;
    p.override = POSES.mirror;
    yield 0.4;
    const stage = document.getElementById('stage');
    stage.classList.add('mirror');
    g.camOverride = { x: (X.lane2[0] + X.lane2[1]) / 2, y: -250, view: 820 };
    g.snapCamera();
    line(g, g.a.watch2 > 0.5 ? 'mirror_lane' : 'mirror_away');
    yield 3.2;
    stage.classList.remove('mirror');
    g.camOverride = null;
    g.snapCamera();
    p.override = null;
    g.lock(false);
  },

  // ============================================================ the crawl ==

  *crawl(g) {
    const p = g.player;
    g.text.objective(OBJ.crawl);
    g.prompt('prone', 'انبطح', 'Go prone');
    yield () => p.x > X.crawl[0] - 20 || p.stance === 'prone';
    yield () => p.x > X.crawl[1] + 20;
    if (g.promptInfo?.en === 'Go prone') g.prompt(null);
    g.text.objective(OBJ.south);
    if (p.stance !== 'stand') {
      g.prompt('prone', 'قِف', 'Stand up');
      yield () => p.stance === 'stand';
      g.prompt(null);
    }
  },

  // =================================================== the field hospital ==

  *hospital(g) {
    const p = g.player;
    const m = g.medic;
    g.lock();
    yield* g.walkPlayer(X.medic - 110);
    p.f = 1;
    yield 0.6;
    m.f = -1;
    yield* talk(g, ['medic_1', 'medic_2', 'medic_3']);
    // he drops the cigarette and steps on it
    m.rig.prop = null;
    m.override = { ...POSES.stand, head: 0.2 };
    yield 0.6;
    yield* talk(g, ['medic_4', 'medic_5', 'medic_6']);
    g.lock(false);
    g.text.objective(OBJ.on);
    // He watches Sami walk past, and lights another.
    yield () => p.x > X.medic + 60;
    yield 1.5;
    m.override = P_SMOKE;
    m.rig.prop = (c, hand) => cigarette(c, hand, g.time);
  },

  // ===================================================== the frontline ==

  *frontline(g) {
    const p = g.player;
    const gd = g.guard;
    g.sound.score?.mood('silence', 3);
    g.sound.life(0); // near the line, nothing moves
    g.sound.ambience({ wind: 0.12, air: 0.15, generator: 0 }, 3);
    g.lock();
    g.text.objective(null);
    yield* g.walkPlayer(X.stop - 30);
    p.f = 1;
    p.override = { ...POSES.crouch, head: 0.05 };
    // School Street, open to the checkpoint. The shape in the middle of it.
    g.camOverride = { x: (X.mouth[0] + X.mouth[1]) / 2 - 60, y: -190, view: 980 };
    yield 1.5;
    g.sound.birds();
    yield* say(g, 'shape');
    yield 1.2;
    gd.f = -1;
    gd.override = { ...POSES.crouch, head: 0.1 };
    g.camOverride = { x: X.stop + 60, y: -220, view: 1050 };
    yield* talk(g, ['man_1', 'man_2', 'man_3', 'man_4']);
    g.camOverride = { x: (X.mouth[0] + X.mouth[1]) / 2 - 60, y: -190, view: 980 };
    yield 2;
    p.override = null;
    yield* this.choiceD(g);
  },

  *choiceD(g) {
    const s = g.state;
    const gd = g.guard;
    const i = yield* g.choose(null, [
      { ar: 'خذ القماشة البيضاء', en: 'Take the white cloth' },
      { ar: 'هناك طريق آخر', en: 'There’s another way' },
    ]);
    g.camOverride = null;
    s.choices = s.choices.filter((c) => !c.startsWith('D'));
    s.choices.push(`D${i + 1}`);
    s.courage += 1;
    if (i === 0) {
      s.d_choice = 'cloth';
      yield* this.cloth(g);
    } else {
      s.d_choice = 'back';
      yield* talk(g, ['back_1', 'back_2']);
      gd.f = 1;
      gd.override = { ...POSES.kneel, head: -0.15 };
      yield* this.gift(g);
      yield* this.backWay(g);
    }
  },

  // D1: the sheet from the balcony rail, a curtain rail from the rubble.
  *cloth(g) {
    const L = g.level;
    const a = g.a;
    const p = g.player;
    const gd = g.guard;
    gd.f = 1;
    gd.override = { ...POSES.kneel, head: -0.15 };
    g.lock(false);
    g.text.objective(OBJ.sheet);
    L.add({ id: 'sheet', x: X.sheet, y: -150, range: 90, urgent: true, box: [112, 112], bx: -3, by: 7, outline: [[-47,-49],[43,-49],[45,47],[23,39],[-7,49],[-45,43]], label: ['خذ', 'Take'], enabled: () => !a.hasSheet, use: () => (a.pull = true) });
    yield () => a.pull;
    yield* g.reach(X.sheet, -200, () => {
      a.hasSheet = true;
      g.sound.noise({ dur: 0.45, freq: 2400, q: 0.6, vol: 0.12 }); // it tears at one edge
    });
    g.lock();
    yield* say(g, 'sheet');
    g.lock(false);
    g.text.objective(OBJ.rod);
    a.rebarGlint = true;
    L.add({ id: 'rail', x: X.rebar, y: -60, range: 80, urgent: true, box: [160, 60], bx: 5, by: 35, label: ['التقط', 'Pick up'], enabled: () => a.hasSheet && !a.hasRod, use: () => (a.hasRod = true) });
    yield () => a.hasRod;
    a.rebarGlint = false;
    yield* g.reach(X.rebar, -20, () => g.sound.click());
    g.lock();
    yield* say(g, 'rail');
    g.giveTool('whitecloth');
    g.sound.cloth();
    yield* say(g, 'cloth_item');
    g.lock(false);
    g.text.objective(OBJ.back);
    yield () => p.x > X.stop - 220;
    g.lock();
    g.text.objective(null);
    yield* g.walkPlayer(X.stop - 30);
    p.f = 1;
    gd.f = -1;
    gd.override = { ...POSES.crouch, head: 0.1 };
    yield* talk(g, ['cloth_1', 'cloth_2', 'cloth_3', 'cloth_4']);
    gd.f = 1;
    gd.override = { ...POSES.kneel, head: -0.15 };
    yield* this.gift(g);
    g.lock(false);
    g.active = 'whitecloth';
    a.clothReady = true;
    g.text.objective(OBJ.raise);
    g.prompt('use', 'ارفع القماشة', 'Raise the cloth');
    yield () => a.raised;
    g.prompt(null);
    yield* this.clothEnd(g);
  },

  // Sami raises the cloth and steps out past the sandbags, into School Street.
  *clothEnd(g) {
    const p = g.player;
    const a = g.a;
    g.lock();
    g.text.objective(null);
    yield* g.walkPlayer(X.stop - 10);
    p.f = 1;
    p.override = P_RAISE;
    p.rig.prop = (c, hand) => whiteCloth(c, hand, g.time);
    g.sound.cloth();
    yield 1.6;
    a.duskEnd = g.time;
    a.stepOut = true;
    g.camOverride = { x: X.stop + 160, y: -230, view: 1150 };
    const xc = (X.mouth[0] + X.mouth[1]) / 2;
    // the walk out is his: arms up, slow, no going back
    p.override = null;
    p.arms = { head: P_RAISE.head, armN: P_RAISE.armN, foreN: P_RAISE.foreN };
    g.stanceLock = 'stand';
    g.gate = (m) => Math.max(0, m) * 0.5;
    g.text.objective(OBJ.out);
    g.lock(false);
    yield () => p.x >= xc - 20;
    g.lock();
    g.text.objective(null);
    g.gate = null;
    g.stanceLock = null;
    yield* g.walkPlayer(xc);
    p.arms = null;
    p.override = P_RAISE;
    yield* intoDepth(g, p, xc, 0.07, 0.3);
    yield* this.finish(g);
  },

  // D2: into the half-collapsed building beside the street.
  *backWay(g) {
    const L = g.level;
    const a = g.a;
    const p = g.player;
    g.lock(false);
    g.text.objective(OBJ.ruin);
    L.add({ id: 'ruinDoor', x: X.ruinDoor, y: -120, range: 80, urgent: true, box: [80, 168], by: 40, label: ['ادخل', 'Go in'], enabled: () => !a.enter, use: () => (a.enter = true) });
    yield () => a.enter;
    g.lock();
    g.text.objective(null);
    yield* g.walkPlayer(X.ruinDoor);
    a.duskEnd = g.time;
    p.face('back');
    yield 0.5;
    p.visible = false;
    yield 1;
    g.sound.groan();
    g.bump(0.2);
    g.effects.trickle(X.ruinDoor + 10, -170, 3);
    yield 3;
    yield* this.finish(g);
  },

  // 2A-3: Abu Yazan has followed him south, slowly, and catches him up.
  *gift(g) {
    const p = g.player;
    const abu = g.abu;
    const s = g.state;
    abu.place(X.stop - 700);
    abu.visible = true;
    abu.f = 1;
    yield 0.8;
    yield* say(g, 'abu_1');
    p.f = -1;
    g.camOverride = { x: X.stop - 200, y: -230, view: 1150 };
    yield* g.walkNpc(abu, X.stop - 130, { speedScale: 0.45 });
    abu.f = 1;
    abu.override = { ...POSES.stand, torso: 0.12, head: 0.1 }; // breathing hard
    yield* talk(g, ['abu_2', 'abu_3']);
    abu.override = { ...POSES.stand, armN: 1.1, foreN: 1.3 };
    yield 0.6;
    g.giveTool('lighter');
    g.sound.click();
    abu.override = { ...POSES.stand, head: 0.05 };
    yield* say(g, 'lighter');
    yield GAP;
    abu.override = { ...POSES.stand, armN: 1.25, foreN: 1.45 }; // a hand on his arm
    yield* say(g, 'abu_4');
    g.giveTool('journal');
    s.journal = true;
    g.sound.cloth();
    yield* say(g, 'journal');
    yield GAP;
    abu.override = null;
    yield* say(g, 'abu_5');
    // He walks away, back north. Sami watches him go, then turns south.
    g.runner.run(
      (function* () {
        yield* g.walkNpc(abu, X.stop - 1100, { speedScale: 0.4 });
        abu.visible = false;
      })(),
    );
    yield 3;
    g.sound.noise({ dur: 1.6, freq: 500, q: 0.5, vol: 0.06, attack: 0.5 }); // a beat of wind
    yield 1.2;
    p.f = 1;
    g.camOverride = null;
  },

  // ========================================================== the end ==

  *finish(g) {
    const s = g.state;
    s.completed = true;
    s.checkpoint = 'south';
    writeSave(s);
    const t0 = g.time;
    yield () => {
      g.a.endFade = clamp((g.time - t0) / 1.8);
      return g.a.endFade >= 1;
    };
    g.fade = 1;
    g.sound.ambience({ crowd: 0, wind: 0, air: 0, generator: 0, traffic: 0 }, 2);
    yield 1.2;
    g.sound.score?.mood('after', 3);
    g.sound.ney(220, 10, 0.18); // the ney, lower than before, carrying on
    g.text.titleCard(CARDS.close, 7);
    yield 7.5;
    g.onEnd?.(s);
  },

  // =================================================== per-frame extras ==

  update(g, dt) {
    const a = g.a;
    const p = g.player;
    // the light goes as he goes south
    const k = clamp((p.x - X.start) / (X.stop - X.start)) * 0.5;
    a.duskK = a.duskEnd ? lerp(a.duskK, 0.8, 1 - Math.exp(-dt * 0.35)) : Math.max(a.duskK, k);

    // lane 2: at the window 6.5 s, away 3.5 s (forgiving: 5 and 5)
    a.forgiving = g.settings.get('lanes') === 'forgiving';
    const c2 = a.t2 ? (g.time - a.t2) % 10 : 0;
    const w2 = c2 < (a.forgiving ? 5 : 6.5) ? 1 : 0;
    if (a.radio2 && (w2 > 0.5) !== (a.watch2 > 0.5)) {
      g.sound.radio(1.6);
      line(g, w2 ? 'radio_watch' : 'radio_away');
    }
    a.watch2 = w2;
    // lane 3: the smoke thickens and thins on an 11 s cycle
    const c3 = a.t3 ? (g.time - a.t3) % 11 : 6;
    a.smoke = lerp(a.smoke, c3 < (a.forgiving ? 7.5 : 5.5) ? 1 : 0, 1 - Math.exp(-dt * 1.2));
    a.watch3 = a.smoke < 0.55 ? 1 : 0;

    // exposure in a lane
    const lane = LANES.find((L) => p.x > L.x0 && p.x < L.x1);
    if (lane && !g.locked && g.scene === 'street') {
      const watching = lane.id === 1 ? true : lane.id === 2 ? a.watch2 > 0.5 : a.watch3 > 0.5;
      const covered = p.stance !== 'stand' && lane.cover.some(([c0, c1]) => p.x > c0 && p.x < c1);
      const safe = p.stance === 'prone' || p.down || covered || !watching;
      a.laneState = { id: lane.id, watching, safe };
      a.expose = safe ? Math.max(0, a.expose - dt * 2) : a.expose + dt;
      if (a.expose > (a.forgiving ? 0.9 : 0.4) && !a.shotBusy) {
        a.expose = 0;
        g.runner.run(this.nearMiss(g, lane));
      }
    } else {
      a.laneState = lane ? a.laneState : null;
      a.expose = 0;
    }
  },

  useTool(g, id) {
    const a = g.a;
    const x = g.player.x;
    if (id === 'mirror') {
      if (a.radio2 && x > X.peek2 - 250 && x < X.car[1]) g.runner.run(this.lanePeek(g));
      else line(g, 'mirror_plain');
    } else if (id === 'walkie') {
      g.sound.squelch();
      if (a.radio2) line(g, a.watch2 > 0.5 ? 'radio_watch' : 'radio_away');
      else line(g, 'radio_plain');
    } else if (id === 'whitecloth') {
      if (a.clothReady && x > X.stop - 220) a.raised = true;
      else line(g, 'cloth_wrong');
    } else if (id === 'lighter') {
      g.sound.click();
      a.flameAt = g.time;
      line(g, 'lighter_use');
    } else if (id === 'journal') {
      line(g, 'journal');
    }
  },

  draw(R, g) {
    drawStreet(R, g);
  },

  look(g) {
    return eveLook(g);
  },
};

// A cigarette between two fingers, its tip glowing as he draws on it.
function cigarette(c, hand, t) {
  const [hx, hy] = hand;
  c.fillStyle = '#e8e2d4';
  c.fillRect(hx - 1, hy - 7, 2, 8);
  c.fillStyle = `rgba(255,${120 + 60 * Math.max(0, Math.sin(t * 0.8))},60,0.95)`;
  c.fillRect(hx - 1.2, hy - 8.5, 2.4, 2);
}

// A bedsheet wrapped round a curtain rail, held high.
function whiteCloth(c, hand, t) {
  const [hx, hy] = hand;
  c.strokeStyle = '#4a3b2e';
  c.lineWidth = 3;
  c.beginPath();
  c.moveTo(hx, hy + 30);
  c.lineTo(hx + 4, hy - 150);
  c.stroke();
  c.fillStyle = '#ece8de';
  c.beginPath();
  c.moveTo(hx + 4, hy - 148);
  for (let i = 0; i <= 6; i++) c.lineTo(hx + 4 + i * 14, hy - 148 + Math.sin(t * 5 + i * 0.9) * 4 * (i / 6));
  for (let i = 6; i >= 0; i--) c.lineTo(hx + 4 + i * 14, hy - 92 + Math.sin(t * 5 + i * 0.9 + 0.6) * 5 * (i / 6));
  c.closePath();
  c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.12)';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(hx + 30, hy - 146);
  c.lineTo(hx + 34, hy - 94);
  c.stroke();
}

// Walk away from us into a street that runs into depth, up to depth kMax.
function* intoDepth(g, w, mouth, rate, kMax) {
  const base = w.rig.scale;
  let k = 0.001;
  w.face('back');

// The moon, three-quarters full, and its halo. uv on screen.
function moon(R, u, v) {

        c.lineTo(-74 + i * 28, 24);
      }
      c.stroke();
      c.restore();
    });
  }
}

// A line by key, as a script step: shows it, tags placeholders in the log.
function* say(g, key) {
  const L = LINES[key];
  const step = g.say(L.who ? WHO[L.who] : null, [L.ar, L.en], L.dur, L.style || '');
  const first = step.next();
  markDraft(g, L);
  yield first.value;
}
function line(g, key) {
  const L = LINES[key];
  g.line(L.who ? WHO[L.who] : null, [L.ar, L.en], L.dur, L.style || '');
  markDraft(g, L);
}
function markDraft(g, L) {
  const last = g.text.log[g.text.log.length - 1];
  if (last && last.line[1] === L.en) last.draft = !!L.draft;
}
function* talk(g, keys) {
  for (const k of keys) {
    yield* say(g, k);
    yield GAP;
  }
}

// A soldier's rifle, held low across the body.
function rifle(c, hand) {
  const [hx, hy] = hand;
  c.save();
  c.translate(hx, hy);
  c.rotate(-0.35);
  c.fillStyle = '#1d1c1a';
  c.fillRect(-34, -4, 70, 6); // body and barrel
  c.fillRect(36, -3, 18, 3);
  c.fillRect(-2, 2, 6, 12); // magazine, curved
  c.fillStyle = '#4a3322';
  c.fillRect(-48, -3, 16, 8); // stock
  c.restore();
}

// Move a walker along a path of [x, y] points at a speed, with a pose
// for the gait (the walker's own, or a function of the distance so far),
// turned the way it goes unless told which way to face.
function* along(g, w, pts, speed, pose = null, face = null) {
  const before = w.override;
  w.scripted = true;
  let seg = 0;
  let u = 0;
  let dist = 0;
  yield () => {
    const dt = g.lastDt || 1 / 60;
    let left = speed * dt;
    while (left > 0 && seg < pts.length - 1) {
      const [ax, ay] = pts[seg];
      const [bx, by] = pts[seg + 1];
      const len = Math.hypot(bx - ax, by - ay) || 1;
      const step = Math.min(left, len * (1 - u));
      u += step / len;
      left -= step;
      dist += step;
      if (u >= 1 - 1e-6) {
        seg++;
        u = 0;
      }
    }
    const i = Math.min(seg, pts.length - 2);
    const [ax, ay] = pts[i];
    const [bx, by] = pts[i + 1];
    w.x = lerp(ax, bx, seg >= pts.length - 1 ? 1 : u);
    w.y = lerp(ay, by, seg >= pts.length - 1 ? 1 : u);
    if (face) w.f = face;
    else if (bx !== ax) w.f = bx > ax ? 1 : -1;
    w.stride += speed * dt;
    w.scriptedSpeed = speed;
    w.override = pose ? pose(dist) : null;
    return seg >= pts.length - 1;
  };
  w.scripted = false;
  w.scriptedSpeed = 0;
  // the others keep the pose they held (a soldier his rifle); the player is
  // handed back his own body
  w.override = w === g.player ? null : before;
  w.vx = 0;
  w.vy = 0;
  w.onGround = true;
}

    g.sound.radio(1.2);
    yield 1.2;
    yield* talk(g, ['m_1', 'sa_1', 'm_2', 'sa_2', 'm_3', 'sa_3', 'm_4', 'sa_4', 'm_5', 'sa_5', 'm_6']);
    // Beat 1: tea, and the terms
    // he pours, and drinks: the glass to his mouth
    m.override = { ...SIT, armN: 0.9, foreN: 1.8 };
    g.sound.slosh?.();
    yield 0.8;
    m.override = { ...SIT, head: -0.15, armN: 0.75, foreN: 2.85 };
    yield 1.1;
    m.override = SIT;
    yield* talk(g, ['m_7', 'sa_7', 'm_8', 'sa_8', 'm_9', 'sa_9', 'm_10', 'sa_10', 'm_11']);
    // Beat 2
    yield* talk(g, ['sa_12', 'm_12', 'sa_13', 'm_13', 'sa_14', 'm_14', 'sa_15', 'm_15']);
    // Beat 3: the price. He picks up Ahmad's lighter.
    m.override = { ...SIT_LEAN, armN: 1.2, foreN: 2.1 };
    a.lighterOnTable = false;
    g.sound.click();
    yield 0.6;
    yield* talk(g, ['m_16', 'sa_16', 'm_17']);
    m.override = SIT;
    a.lighterOnTable = true;
    yield* say(g, 'm_18');
    yield 0.6;

    const pick = yield* g.choose(['كيف يجيب سامي؟', 'How does Sami answer?'], [
      { ar: 'بكرامة', en: 'With dignity' },
      { ar: 'بغضب', en: 'With anger' },
      { ar: 'بصفقة', en: 'With a deal' },
    ]);
    s.choices = [...(s.choices || []), `G${pick + 1}`];
    if (pick === 0) {
      s.g_choice = 'dignity';
      p.override = SIT_LEAN;
      yield* say(g, 'g1_1');
      yield GAP;
      p.override = SIT;
      yield* say(g, 'g1_2');
      // the lighter goes into his pocket; Sami half rises, a hand sits him down
      a.lighterOnTable = false;
      m.override = { ...SIT, armN: 0.1, foreN: 2.4 };
      yield 0.8;
      p.override = { ...SIT, torso: -0.2, thighN: 1.2, thighF: 1.1 };
      yield* g.walkNpc(g.s1, X1.seat - 30, { speedScale: 0.5 });
      g.s1.f = 1;
      g.s1.override = { ...RIFLE, armN: 1.6, foreN: 1.7 };
      p.override = SIT;
      yield 1;
      m.override = SIT;
      yield* say(g, 'g1_3');
      g.s1.override = RIFLE;
      s.negotiation_outcome = 'success';
      s.body_retrieved = true;
      s.lighter_taken = true;
    } else if (pick === 1) {
      s.g_choice = 'anger';
      s.courage = (s.courage || 0) + 1;
      p.override = { ...SIT_LEAN, torso: 0.3, head: -0.1, armN: 1.3, foreN: 1.4 };
      yield* say(g, 'g2_1');
      // a look from Maher; the soldier steps behind Sami
      yield* g.walkNpc(g.s1, X1.seat - 34, { speedScale: 0.6 });
      g.s1.f = 1;
      yield 0.6;
      // (heard, not shown: the camera stays on the lamp)
      g.camOverride = { x: X1.table, y: -110, view: 520 };
      g.sound.tone(58, 0.35, { vol: 0.8, to: 36 });
      g.sound.noise({ dur: 0.18, freq: 500, q: 0.6, vol: 0.5 });
      g.sound.onImpact?.(0.6, 0.25);
      a.hitAt = g.time;
      g.bump(0.35);
      p.override = DOUBLED;
      yield 2.4;
      g.camOverride = { x: (X1.seat + X1.maher) / 2, y: -150, view: 820 };
      yield* say(g, 'g2_2');
      a.lighterOnTable = false;
      yield GAP;
      yield* say(g, 'g2_3');
      s.negotiation_outcome = 'partial';
      s.lighter_taken = true;
    } else {
      s.g_choice = 'deal';
      p.override = SIT_LEAN;
      yield* talk(g, ['g3_1', 'g3_2', 'g3_3', 'g3_4', 'g3_5', 'g3_6']);
      // he draws the valves on a scrap of paper
      p.override = { ...SIT_LEAN, torso: 0.35, armN: 1.2, foreN: 1.9 };
      yield 2.5;
      p.override = SIT;
      yield* say(g, 'g3_7');
      yield* say(g, 'g3_after');
      s.negotiation_outcome = 'success';
      s.body_retrieved = true;
      s.lighter_taken = false;
    }
    // they give back the walkie-talkie (and the lighter, only for the map)
    if (!s.tools.includes('walkie')) s.tools.push('walkie');
    if (!s.lighter_taken && !s.tools.includes('lighter')) s.tools.push('lighter');
    a.onTable = false;
    // he walks back into the dark, the cloth folded under his arm
    yield 1;
    p.override = null;
    g.s1.place(X1.bags[0] + 60);
    g.camOverride = null;
    const t0 = g.time;
    yield* g.walkPlayer(X1.stop - 200);
    yield () => g.time - t0 > 3;
    yield* this.finish(g);
  },

  // ------------------------------------------------------ Part 2 build --

  buildBuilding(g) {
    const s = g.state;
    const p = g.player;
    const L = g.level;
    const a = g.a;
    buildBuilding(L);
    const look = (id, x, y, key, box) => L.add({ id, x, y, range: 90, look: true, label: ['تفحّص', 'Examine'], use: () => line(g, key), ...box });
    look('table', X2.table, floorY(2) - 90, 'table', { box: [150, 90], by: 45 });
    look('drawing', X2.drawing, floorY(2) - 130, 'drawing', { box: [60, 44], by: 10 });
    look('stove', X2.stove, floorY(2) - 40, 'stove', { box: [50, 50], by: 20 });
    look('heights', X2.heights, floorY(4) - 110, 'heights', { box: [84, 196], by: 18 });
    L.add({ id: 'stairs1', x: X2.stairs1[0] + 30, y: -100, range: 70, urgent: true, label: ['اصعد الدرج', 'Climb the stairs'], box: [80, 160], by: 20, enabled: () => !a.climbing && g.player.y > -30, use: () => g.runner.run(this.flight(g, X2.stairs1, 1, 2)) });
    L.add({ id: 'stairs2', x: X2.stairs2[0] + 30, y: floorY(2) - 100, range: 70, urgent: true, label: ['اصعد الدرج', 'Climb the stairs'], box: [80, 160], by: 20, enabled: () => !a.climbing && g.player.y > floorY(3) + 50 && g.player.y < floorY(2) + 50, use: () => g.runner.run(this.climb2(g)) });
    L.add({ id: 'stairs4', x: X2.stairs4[0] + 30, y: floorY(4) - 100, range: 70, urgent: true, label: ['اصعد الدرج', 'Climb the stairs'], box: [80, 160], by: 20, enabled: () => !a.climbing && g.player.y > floorY(5) + 50 && g.player.y < floorY(4) + 50, use: () => g.runner.run(this.climb4(g)) });
    L.add({ id: 'hole', x: X2.hole, y: floorY(5) - 110, range: 90, urgent: true, label: ['انظر من الفتحة', 'Look out'], box: [60, 150], bx: 80, by: 30, enabled: () => !a.viewed && Math.abs(g.player.y - floorY(5)) < 20, use: () => g.runner.run(this.view(g)) });
    L.add({ id: 'pipe', x: X2.pipe - 10, y: floorY(4) - 60, range: 60, urgent: true, label: ['انزل على القسطل', 'Climb down the pipe'], box: [30, 120], bx: 10, by: 20, enabled: () => !a.down && Math.abs(g.player.y - floorY(4)) < 20, use: () => g.runner.run(this.pipe(g)) });
    L.add({ id: 'blanket', x: X2.blanket, y: -40, range: 80, urgent: true, label: ['أمسك أطراف الحرام', 'Take the edges of the blanket'], box: [150, 30], by: 25, enabled: () => !a.dragged && g.player.stance === 'prone', use: () => g.runner.run(this.drag(g)) });
    const cp = s.checkpoint;
    if (cp === 'floor4') p.place(X2.f4edge - 60, floorY(4));
    else if (cp === 'descent') {
      a.viewed = true;
      a.inside = false;
      a.stillGrace = 6;
      p.place(X2.balc5[0] + 20, floorY(5));
    } else p.place(X2.door + 30, 0);
    p.f = 1;
    g.runner.run(this.building(g));
  },

  camera(g) {
    if (g.a.part !== 2) return null;
    const p = g.player;
    return { x: p.x + p.f * 110, y: clamp(p.y - 205, floorY(5) - 260, -205), view: 1300 };
  },

  *building(g) {
    const a = g.a;
    const s = g.state;
    const cp = s.checkpoint;
    if (cp !== 'floor4' && cp !== 'descent') {
      g.checkpoint('building');
      g.fade = 1;
      g.lock();
      g.text.titleCard(CARDS.open, 7);
      yield 1.5;
      for (let k = 1; k >= 0; k -= 0.05) {
        g.fade = k;
        yield 0.05;
      }
      yield 5;
      g.lock(false);
      yield* say(g, 'building');
      yield* say(g, 'dark');
      g.prompt('use', 'اضغط مطوّلاً لتدوير المصباح، ثم اضغط مرة لإضاءته', 'Hold to crank the torch, then tap to switch it on');
      yield () => g.torch.on;
      g.prompt(null);
    } else g.lock(false);
    g.text.objective(a.viewed ? OBJ.down : OBJ.up);
  },

  // F1 → F2: an ordinary flight, still standing.
  *flight(g, [xa, xb], from, to) {
    const p = g.player;
    const a = g.a;
    a.climbing = true;
    g.lock();
    yield* g.walkPlayer(xa + 10);
    const stairs = (d) => stairPose(d * 0.1);
    yield* along(g, p, [[xa + 10, floorY(from)], [xb, floorY(to)]], 80, stairs);
    yield* along(g, p, [[xb, floorY(to)], [xb + 20, floorY(to)]], 90);
    p.place(xb + 20, floorY(to));
    p.f = -1;
    a.climbing = false;
    g.lock(false);
  },

  // F2 → F3: up the flight in the stairwell, over the slab across it.
  *climb2(g) {
    const p = g.player;
    const a = g.a;
    a.climbing = true;
    g.lock();
    const [xa, xb] = X2.stairs2;
    const ya = floorY(2);
    const yb = floorY(3);
    yield* g.walkPlayer(xa + 10);
    const mid = [lerp(xa, xb, 0.45), lerp(ya, yb, 0.45)];
    yield* along(g, p, [[xa + 10, ya], mid], 70, (d) => stairPose(d * 0.1));
    yield* say(g, 'slab');
    // over it, on the rebar: a mantle, the slab grinding under him
    p.override = POSES.reachUp;
    yield 0.5;
    g.sound.noise({ dur: 1.4, freq: 120, type: 'lowpass', vol: 0.5, buf: g.sound.brownBuf, attack: 0.1 });
    g.effects.trickle?.(mid[0] + 20, mid[1] - 120, 2);
    g.bump(0.2);
    a.slabShift = 1;
    yield* along(g, p, [mid, [mid[0] + 40, mid[1] - 70], [mid[0] + 80, mid[1] - 60]], 60, () => POSES.hands);
    yield* say(g, 'slab_holds');
    a.slabCrossed = true;
    yield* along(g, p, [[mid[0] + 80, mid[1] - 60], [xb, yb]], 80, (d) => stairPose(d * 0.1));
    yield* along(g, p, [[xb, yb], [xb + 30, yb]], 90);
    p.place(xb + 30, yb);
    p.override = null;
    a.climbing = false;
    g.lock(false);
  },

  // F4 → F5: the last flight; one step gives way.
  *climb4(g) {
    const p = g.player;
    const a = g.a;
    a.climbing = true;
    g.lock();
    const [xa, xb] = X2.stairs4;
    const ya = floorY(4);
    const yb = floorY(5);
    yield* g.walkPlayer(xa + 10);
    const k = 0.45;
    const mid = [lerp(xa, xb, k), lerp(ya, yb, k)];
    yield* along(g, p, [[xa + 10, ya], mid], 60, (d) => stairPose(d * 0.1));
    // the step breaks: he drops, catches the rail
    a.stepGone = true;
    g.sound.noise({ dur: 0.25, freq: 900, q: 0.8, vol: 0.5 });
    g.sound.noise({ when: g.sound.t + 0.6, dur: 0.3, freq: 300, q: 0.6, vol: 0.4 });
    g.bump(0.3);
    g.effects.puff?.(mid[0], mid[1] + 10, 0.4);
    p.override = { ...POSES.reachUp, armF: 0.3, foreF: 0.5 };
    yield* along(g, p, [mid, [mid[0], mid[1] + 16]], 120, () => ({ ...POSES.reachUp, armF: 0.3, foreF: 0.5 }));
    yield* say(g, 'step_gives');
    yield* along(g, p, [[mid[0], mid[1] + 16], [mid[0] + 20, mid[1] - 20], [xb, yb]], 60, (d) => stairPose(d * 0.1));
    yield* along(g, p, [[xb, yb], [xb + 30, yb]], 90);
    p.place(xb + 30, yb);
    p.override = null;
    a.climbing = false;
    g.lock(false);
    g.text.objective(OBJ.hole);
  },

  // The view from the fifth floor: the street, the checkpoint, the blanket.
  *view(g) {
    const a = g.a;
    a.viewed = true;
    g.lock();
    g.text.objective(null);
    yield* g.walkPlayer(X2.hole - 40);
    g.player.f = 1;
    g.camOverride = { x: 1560, y: -260, view: 1500 };
    g.sound.ambience({ wind: 0.45 }, 2);
    yield 2;
    yield* say(g, 'view');
    yield 1;
    g.camOverride = null;
    a.inside = false;
    g.checkpoint('descent');
    g.lock(false);
    a.stillGrace = g.time + 4;
    g.text.objective(OBJ.down);
    yield* say(g, 'balcony');
    g.prompt('crouch', 'انحنِ', 'Crouch');
  },

  // Down the drainpipe to the alley.
  *pipe(g) {
    const p = g.player;
    const a = g.a;
    a.down = true;
    g.lock();
    g.prompt(null);
    yield* g.walkPlayer(X2.pipe - 14);
    p.stance = 'stand';
    yield* say(g, 'pipe');
    const climb = (dist) => {
      const q = Math.sin(dist * 0.06);
      return { ...POSES.reachUp, torso: 0.05, armN: 2.5 + 0.3 * q, foreN: 2.9, armF: 2.5 - 0.3 * q, foreF: 2.9, thighN: 0.6 + 0.3 * q, shinN: -0.4, thighF: 0.6 - 0.3 * q, shinF: -0.4 };
    };
    const t0 = g.time;
    for (const y of [floorY(4) + 40, -380, -250, -120, -40]) {
      yield* along(g, p, [[X2.pipe - 14, p.y], [X2.pipe - 14, y]], 55, climb);
      if (g.time - t0 < 30) g.sound.noise({ dur: 0.3, freq: 700, q: 3, vol: 0.12 }); // the pipe creaks
    }
    yield* along(g, p, [[X2.pipe - 14, -40], [X2.pipe - 20, 0]], 90);
    p.place(X2.pipe - 20, 0);
    p.override = null;
    g.lock(false);
    yield* say(g, 'alley');
    g.text.objective(OBJ.crawl);
    g.prompt('prone', 'انبطح وازحف', 'Go prone, and crawl');
  },

  // Take the blanket's edges and pull him back into the shadow.
  *drag(g) {
    const p = g.player;
    const a = g.a;
    a.dragged = true;
    g.lock();
    g.prompt(null);
    g.text.objective(null);
    yield* say(g, 'blanket');
    a.blanketX = X2.blanket;
    // the weight under the blanket, head towards him
    a.body = new Shroud(g.level, X2.blanket - 62, 0, 1);
    p.f = 1;
    const tx = X2.shade - 40;
    // Now he pulls: the player backs him away on his belly, facing the body
    // (only backwards, only crawling, slowly: it's heavy), the weight coming
    // after his hands a moment late, the blanket scraping with each pull.
    p.faceLock = 1;
    g.stanceLock = 'prone';
    g.gate = (m) => Math.min(0, m) * 0.6;
    g.text.objective(OBJ.drag);
    g.prompt('left', 'اسحب للخلف', 'Pull back');
    g.lock(false);
    let stroke = -1;
    let dist = 0;
    let lastX = p.x;
    yield () => {
      dist += Math.abs(p.x - lastX);
      lastX = p.x;
      const n = Math.floor(dist / 38);
      if (n !== stroke) {
        stroke = n;
        g.sound.noise({ dur: 0.5, freq: 1300, q: 0.7, vol: 0.09, attack: 0.08 });
        g.sound.noise({ dur: 0.3, freq: 300, type: 'lowpass', vol: 0.12, buf: g.sound.brownBuf });
      }
      a.blanketX = p.x + 64;
      // his hands on its edges at the shoulders: each pull a surge
      const surge = Math.max(0, Math.sin((dist / 38) * Math.PI * 2)) * 6;
      a.body.pull([p.x + 44 - surge, -16]);
      if (dist > 0) g.prompt(null);
      return p.x <= tx;
    };
    g.lock();
    g.gate = null;
    g.stanceLock = null;
    p.faceLock = 0;
    g.text.objective(null);
    a.body.pull(null);
    p.f = 1;
    yield 0.2;
    g.line(null, [LINES.drag.ar, LINES.drag.en], LINES.drag.dur, 'examine');
    markDraft(g, LINES.drag);
    // he sits, and rests one hand on it, where the shoulder would be
    p.override = { ...POSES.sitGround, armN: 1.35, foreN: 1.45, head: 0.35 };
    g.sound.ambience({ wind: 0.1, air: 0.15 }, 3);
    yield 6;
    const s = g.state;
    s.body_retrieved = true;
    s.dangerous_route_complete = true;
    s.courage = (s.courage || 0) + 1;
    yield* this.finish(g);
  },

  // A shot that means to kill, and misses by a hand's width: back into cover.
  *nearMiss(g, back, key) {
    const p = g.player;
    const a = g.a;
    a.shotBusy = true;
    g.lock();
    const hx = p.x + p.f * 60;
    const hy = p.y - 90 - Math.random() * 40;
    g.sound.sniperCrack();
    g.effects.puff(hx, hy);
    Object.assign(a, { shotAt: g.time, shotX: hx, shotY: hy });
    g.bump(0.25);
    if (g.settings.get('physics')) {
      // he throws himself down, away from the shot
      p.knockDown([-p.f * 300, -200], { then: null });
      yield 0.9;
    } else yield 0.5;
    g.fade = 0.5;
    yield 0.2;
    p.place(back.x, back.y);
    p.stance = back.stance;
    g.fade = 0;
    g.state.lane_retries = (g.state.lane_retries || 0) + 1;
    line(g, key);
    g.lock(false);
    a.shotBusy = false;
  },

  *finish(g) {
    const s = g.state;
    s.completed = true;
    writeSave(s);
    const t0 = g.time;
    yield () => {
      g.a.endFade = clamp((g.time - t0) / 2);
      return g.a.endFade >= 1;
    };
    g.fade = 1;
    g.sound.ambience({ crowd: 0, wind: 0.05, air: 0.1, generator: 0, traffic: 0 }, 2);
    yield 1;
    g.sound.ney(196, 10, 0.16);
    g.text.titleCard(CARDS.after, 6);
    yield 6.5;
    // and on into the night walk (Part 3), straight on
    if (g.onPart) g.onPart(s);
    else g.onEnd?.(s);
  },

  // ============================================== per-frame extras ==

  update(g, dt) {
    g.a.body?.update(dt);
    const a = g.a;
    const p = g.player;
    g.lastDt = dt;
    // crickets, loud in the silence (quieter inside)
    if (g.time > a.nextChirp && g.scene === 'street') {
      a.nextChirp = g.time + 0.25 + Math.random() * 0.7;
      const f = 4300 + Math.random() * 700;
      const pan = Math.random() * 2 - 1;
      const v = a.inside ? 0.004 : 0.011;
      for (let i = 0; i < 3; i++) g.sound.tone(f, 0.028, { when: g.sound.t + i * 0.055, vol: v, pan });
    }
    if (a.part === 1) {
      // the checkpoint's radio, now and then
      if (g.time > a.nextRadio && p.x > X1.shout - 300) {
        a.nextRadio = g.time + 7 + Math.random() * 9;
        g.sound.radio(0.8 + Math.random());
      }
      return;
    }
    // the building settles and groans
    if (a.inside && g.time > (a.nextGroan || 6)) {
      a.nextGroan = g.time + 14 + Math.random() * 14;
      g.sound.groan?.();
    }
    if (a.shotBusy || g.locked) return;
    // lines as he comes to things, once each
    const once = (k, cond) => {
      if (!a[`said_${k}`] && cond) {
        a[`said_${k}`] = true;
        line(g, k);
      }
    };
    const onFloor = (n) => Math.abs(p.y - floorY(n)) < 30;
    once('wardrobe', onFloor(3) && p.x > X2.wardrobe[0] - 120 && p.x < X2.wardrobe[0]);
    once('lowceil', onFloor(3) && p.x > X2.lowceil[0] - 110 && p.x < X2.lowceil[0]);
    if (!a.said_gap && onFloor(3) && p.x > X2.mound[0] - 60) g.prompt('jump', 'اقفز وتمسّك', 'Jump, and pull yourself up');
    once('gap', onFloor(3) && p.x > X2.mound[0] - 60);
    if (a.f4 && !a.promptCleared) {
      a.promptCleared = true;
      g.prompt(null);
    }
    // up onto the fourth floor: a piece of the edge breaks away
    if (!a.f4 && p.y <= floorY(4) + 2 && !p.mantle) {
      a.f4 = true;
      g.sound.noise({ dur: 0.3, freq: 400, q: 0.6, vol: 0.4 });
      g.sound.noise({ when: g.sound.t + 0.9, dur: 0.6, freq: 180, type: 'lowpass', vol: 0.5, buf: g.sound.brownBuf });
      g.effects.puff(X2.f4edge, floorY(4) + 10, 0.5);
      g.bump(0.2);
      g.checkpoint('floor4');
    }
    // the balconies are in the open: stay low
    const onBalcony = p.x > X2.b1 && p.y < floorY(3);
    // (standing still up there is seen too, only a little more slowly)
    if (onBalcony && p.stance === 'stand' && !g.locked && !p.down) {
      a.expose = (a.expose || 0) + dt * (Math.abs(p.vx) > 5 ? 1 : g.time > (a.stillGrace || 0) ? 0.6 : 0);
      if (a.expose > 0.8) {
        a.expose = 0;
        g.runner.run(this.nearMiss(g, { x: X2.hole - 30, y: floorY(5), stance: 'crouch' }, 'miss_1'));
      }
    } else if (!onBalcony) a.expose = 0;
    else a.expose = Math.max(0, (a.expose || 0) - dt);
    // the moonlit street: only on his belly

// A candle in a window: a dark window cut into the façade, one tiny flame.
function candle(R, spec, f, k, t, flick = 0) {
  const cols = Math.max(2, Math.round(spec.w / 110));
  const ww = Math.min(58, (spec.w / cols) * 0.5);
  const wh = spec.fh * 0.46;
  const wx = spec.x + ((k + 0.5) * spec.w) / cols - ww / 2;
  const wy = -f * spec.fh - spec.fh * 0.72;
  R.paint((c) => {
    c.fillStyle = '#0b0c10';
    c.fillRect(wx, wy, ww, wh);
    c.fillStyle = 'rgba(170,180,210,0.35)';
    c.fillRect(wx - 5, wy + wh - 1, ww + 10, 3);
  });
  const fl = 0.8 + 0.2 * Math.sin(t * 7.3 + flick) * Math.sin(t * 2.9 + flick * 2);
  const cx = wx + ww * 0.55;
  const cy = wy + wh - 9;
  R.glow((c) => {
    const grd = c.createRadialGradient(cx, cy, 0, cx, cy, 20);
    grd.addColorStop(0, `rgba(255,214,150,${0.55 * fl})`);
    grd.addColorStop(0.25, `rgba(255,170,90,${0.18 * fl})`);
    grd.addColorStop(1, 'rgba(255,150,70,0)');
    c.fillStyle = grd;
    c.fillRect(cx - 20, cy - 20, 40, 40);
    c.fillStyle = `rgba(255,236,190,${0.9 * fl})`;
    c.fillRect(cx - 0.8, cy - 2, 1.6, 3);
  });
}

    c.ellipse(x0 + 300, by - 4, 22, 5, 0, 0, Math.PI * 2);
    c.fill();
  });
  // room 3: only a chair, a stool, a bucket; the sky for a ceiling
  R.cast((c) => {
    const by = room(3)[1];
    c.fillStyle = dark;
    c.fillRect(x0 + 150, by - 44, 28, 4);
    c.fillRect(x0 + 152, by - 40, 3, 40);
    c.fillRect(x0 + 173, by - 40, 3, 40);
    c.fillRect(x0 + 152, by - 92, 3, 48);
    c.fillRect(x0 + 60, by - 26, 24, 26);

  // curtains stirring at the back-wall windows
  for (const [wx, n, ww, wh] of openings) {

    const sway = Math.sin(t * 0.9 + wx * 0.01) * 3 + Math.sin(t * 2.3 + wx) * 0.8;

        c.quadraticCurveTo(ax + side * (ww * 0.3) + sway * side, by - wh * 0.4, ax + side * (ww * 0.38) + sway * 1.5, by + 10);

    c.fillStyle = '#5b4a3c';
    c.save();
    c.translate(x1 - 40, 2);
    c.rotate(0.32);
    c.fillRect(-6, -104, 40, 104);

  // moon on the broken edges
  R.glow((c) => {

    c.beginPath();

// The walls close in on both sides: tall, dark, near, sweeping past faster
// than the actors. The edge stays put on the screen; the wall's face (its
// windows, its pipe, its plaster) slides by, anchored to the world.
function alleyWalls(R, g) {
  const cx = R.cam.x;
  const k = alleyK(cx);
  if (k <= 0.01) return;
  const D = 1.25;
  const c1 = cx * D;
  const inner = lerp(880, 470, k);
  R.layer(D);
  for (const side of [-1, 1]) {
    const edge = c1 + side * inner;
    const outer = c1 + side * 1000;
    const xa = Math.min(edge, outer);
    const xb = Math.max(edge, outer);
    const wall = (c) => c.rect(xa, -900, xb - xa, 1200);
    R.cast((c) => {
      c.fillStyle = '#1b1d28';
      c.fillRect(xa, -900, xb - xa, 1200);
      // the face: windows shuttered and dark, a pipe, a balcony slab
      const r0 = Math.floor((xa - 100) / 280);
      const r1 = Math.floor((xb + 100) / 280);
      for (let i = r0; i <= r1; i++) {
        const q = rng(i * 7 + (side > 0 ? 301 : 101));
        const px = i * 280 + 40 + q() * 160;
        if (px + 60 < xa || px > xb) continue;
        for (let f = 0; f < 4; f++) {
          const fy = -f * 170 - 150;
          c.fillStyle = '#0d0e14';
          c.fillRect(px, fy, 46, 84);
          if (q() < 0.6) {
            c.fillStyle = '#2a2c37';
            c.fillRect(px + 2, fy + 2, 21, 80);
            c.fillRect(px + 25, fy + 2, 19, 40);
          }
          c.fillStyle = '#3a3d4a';
          c.fillRect(px - 6, fy + 84, 58, 5);
        }
        // a drainpipe
        c.fillStyle = '#16171d';
        c.fillRect(px + 140, -900, 9, 900);
        c.fillRect(px + 136, -300, 17, 4);
        c.fillRect(px + 136, -80, 17, 4);
      }
      // slab edges
      c.fillStyle = 'rgba(70,74,92,0.5)';
      for (let f = 0; f < 6; f++) c.fillRect(xa, -f * 170 - 62, xb - xa, 7);
    });
    R.surface(wall, 'plaster', { scale: 1.6, seed: 5 + (side > 0 ? 1 : 0), alpha: 0.55 });
    // the moon on the inner edge: a thread of silver, and a lit crest
    R.glow((c) => {
      c.strokeStyle = 'rgba(150,170,230,0.28)';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(edge, -900);
      c.lineTo(edge, 300);
      c.stroke();
      const sg = c.createLinearGradient(edge, 0, edge - side * 80, 0);
      sg.addColorStop(0, 'rgba(140,160,225,0.07)');
      sg.addColorStop(1, 'rgba(140,160,225,0)');
      c.fillStyle = sg;
      c.fillRect(Math.min(edge, edge - side * 80), -900, 80, 1200);
    });
  }
  R.layer(1);
}

function streetDebris(R, near) {
  // heaps and scatter along the street: little silver hills
  const piles = [
    [-300, 130, 34, 61, '#8a8a90'],
    [1000, 90, 30, 62, '#898990'],
    [1330, 100, 26, 63, '#8c8c92'],
    [2300, 90, 26, 64, '#8a8a90'],
    [3420, 120, 40, 65, '#8c8c94'],
    [3900, 150, 30, 66, '#898990'],
  ];
  for (const [x, w, h, seed, col] of piles) if (near(x, x + w)) T.rubble(R, x, w, h, { seed, color: col });
  // a toppled plastic chair, a flattened can, an empty gas bottle
  const bits = [[560, 'chair'], [1620, 'can'], [2060, 'bottle'], [2860, 'chair'], [3150, 'bottle']];
  R.cast((c) => {
    for (const [x, kind] of bits) {
      if (!near(x - 30, x + 30)) continue;
      c.fillStyle = '#4a4d5c';
      if (kind === 'chair') {
        c.save();
        c.translate(x, 0);
        c.rotate(-0.3);
        c.fillRect(-14, -4, 28, 4);
        c.fillRect(-14, -26, 4, 24);
        c.fillRect(-14, -4, 3, 4);
        c.restore();
        c.fillRect(x + 6, -14, 3, 14);
      } else if (kind === 'can') {
        c.fillRect(x - 6, -6, 12, 6);
      } else {
        c.fillRect(x - 7, -30, 14, 30);
        c.fillRect(x - 3, -35, 6, 5);
      }

// The moon on the tarmac and the paving: a pale sheen along the kerb, and
// wet-looking patches where the dust has settled.
function roadSheen(R, near) {

// ------------------------------------------------------------ the draw --

function drawWalk(R, g) {
  const t = g.time;
  const cx = R.cam.x;
  const near = (x0, x1) => x1 > cx - 1500 && x0 < cx + 1500;

  // the sky: the moon high, and Damascus's glow on the far horizon
  nightSky(R, g, { moonUv: MOON_UV });
  R.sky((c) => {
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    const gx = R.W * 1.02;
    const gy = R.H * 0.68;
    const grd = c.createRadialGradient(gx, gy, 0, gx, gy, R.W * 0.42);
    grd.addColorStop(0, 'rgba(255,170,96,0.22)');
    grd.addColorStop(0.4, 'rgba(255,140,80,0.07)');
    grd.addColorStop(1, 'rgba(255,130,70,0)');
    c.fillStyle = grd;
    c.fillRect(R.W * 0.5, 0, R.W * 0.5, R.H);
    c.restore();
  });
  // the skyline, with a minaret or two, its crest silvered by the moon
  T.skyline(R, { depth: 0.3, y: 40, color: '#1b2034', seed: 47, haze: ['#5c6c9c', 0.2], minarets: [560, 1180] });

  // ---- the street's buildings
  for (const b of BLOCKS) if (near(b.x, b.x + b.w)) T.block(R, b, t);
  // the courtyard's back wall stands a little behind the street's line
  if (near(GARDEN_WALL.x, GARDEN_WALL.x + GARDEN_WALL.w)) {
    const d = 0.93;
    R.layer(d);
    const dx = (d - 1) * 3180;
    T.block(R, { ...GARDEN_WALL, x: GARDEN_WALL.x + dx }, t);
    // the dark mouth of the gate in it
    R.paint((c) => {
      const gx = X3.garden[0] + 150 + dx;
      c.fillStyle = '#0a0b10';
      c.beginPath();
      c.moveTo(gx - 40, 0);
      c.lineTo(gx - 40, -92);
      c.quadraticCurveTo(gx, -128, gx + 40, -92);
      c.lineTo(gx + 40, 0);
      c.fill();
    });
    R.layer(1);
  }
  if (near(X3.alley[0], X3.alley[1])) alleyBack(R, g);
  if (near(X3.ruin[0], X3.ruin[1])) ruin(R, g);

  // a candle or two, in the windows of people who have not left
  if (near(-120, 380)) candle(R, BLOCKS[2], 1, 2, t, 1);
  if (near(2440, 2780)) candle(R, BLOCKS[5], 2, 0, t, 4);

  // ---- the ground
  T.street(R, -1200, 4600);
  roadSheen(R, near);
  if (near(X3.basement - 60, X3.basement + 60)) basementWell(R);
  if (near(X3.vine - 200, X3.vine + 200)) vineWall(R, g);
  if (near(X3.catWall[0], X3.catWall[1])) catWall(R);
  streetDebris(R, near);
  T.cables(R, cx, { seed: 165, from: -400, to: 4200 }); // (one span snapped, the rest still strung)

  // the scene's own props: the basement door, the wedding glimpse, the garden
  g.act?.drawProps?.(R, g);

  // ---- the people and the cat
  for (const w of [...(g.npcs || []), g.player]) {
    if (!w || !w.visible || !near(w.x - 100, w.x + 100)) continue;
    R.cast((c) => w.draw(c));
    R.shadow((c) => w.draw(c), w.x, w.y, SHEAR, SQUASH);
  }
  if (g.cat && !g.cat.hidden && near(g.cat.x - 50, g.cat.x + 50)) {
    R.cast((c) => g.cat.draw(c));
    R.shadow((c) => g.cat.draw(c), g.cat.x, g.cat.y, SHEAR, SQUASH);
    // its eyes catch the moon
    if (!g.cat.eyesClosed && g.cat.blink < 0.5) {
      const [ex, ey] = g.cat.eye();
      R.glow((c) => {
        const grd = c.createRadialGradient(ex, ey, 0, ex, ey, 5);
        grd.addColorStop(0, 'rgba(220,235,150,0.6)');
        grd.addColorStop(1, 'rgba(220,235,150,0)');
        c.fillStyle = grd;
        c.fillRect(ex - 5, ey - 5, 10, 10);
      });
    }
  }

  // ---- in front of everyone
  alleyWalls(R, g);
  g.effects?.draw(R);
  if (cx < X3.alley[0] - 180 || cx > X3.alley[1] + 320) T.foreground(R, cx, { from: -1000, to: 4400 });
}

return { X3, buildWalkLevel, surfaceAt, walkLook, drawWalk };
})();
