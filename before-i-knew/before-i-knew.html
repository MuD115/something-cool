// fn: draws the thing in world space. box: [x0, y0, x1, y1], its world
// bounds. k: 0 (sharp) … 1 (as far as it goes). opts.mode: 'bokeh' | 'soft'
// | 'off'; opts.alpha fades it; opts.cast: false for scenery that casts no
// shadow (paint); opts.mask(ctx): a world-space gradient, where the blur
// applies (drawn over the sharp version).
function depthCast(R, fn, box, k, { mode = 'bokeh', alpha = 1, cast = true, mask = null } = {}) {
  const radius = k * R.W * 0.009;
  if (mode === 'off' || radius < 0.6) {
    if (alpha >= 0.999) {
      if (cast) R.cast(fn);
      else R.paint(fn);
      return;
    }
  }
  const m = R.layers.alb.x.getTransform();
  // the screen rectangle the thing covers, with room for the blur
  const pts = [
    [box[0], box[1]],
    [box[2], box[1]],
    [box[0], box[3]],
    [box[2], box[3]],
  ].map(([x, y]) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f]);
  const pad = Math.ceil(radius + 2);
  const sx = Math.floor(Math.min(...pts.map((p) => p[0]))) - pad;
  const sy = Math.floor(Math.min(...pts.map((p) => p[1]))) - pad;
  const w = Math.ceil(Math.max(...pts.map((p) => p[0]))) + pad - sx;
  const h = Math.ceil(Math.max(...pts.map((p) => p[1]))) + pad - sy;
  if (w <= 0 || h <= 0 || w > R.W * 2 || h > R.H * 2) return;
  const [A, B] = pool;
  const a = fit(A, w, h);
  a.setTransform(m.a, m.b, m.c, m.d, m.e - sx, m.f - sy);
  fn(a);
  const b = fit(B, w, h);
  if (mode === 'off' || radius < 0.6) b.drawImage(A, 0, 0);
  else if (mode === 'soft') {
    b.filter = `blur(${radius.toFixed(2)}px)`;
    b.drawImage(A, 0, 0);
    b.filter = 'none';
  } else {
    // a disc kernel: the average of the thing shifted over a disc, kept as a
    // running mean (sample i at weight 1/(i+1)) so 8-bit colour doesn't drift
    DISC.forEach(([dx, dy], i) => {
      b.globalAlpha = 1 / (i + 1);
      b.drawImage(A, dx * radius, dy * radius);
    });
    b.globalAlpha = 1;
  }
  if (mask) {
    // blur only where the mask says (the far end); the sharp version is drawn first
    b.globalCompositeOperation = 'destination-in';
    b.setTransform(m.a, m.b, m.c, m.d, m.e - sx, m.f - sy);
    mask(b);
    b.setTransform(1, 0, 0, 1, 0, 0);
    b.globalCompositeOperation = 'source-over';
    if (cast) R.cast(fn);
    else R.paint(fn);
  }
  const put = (ctx, op) => {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = op;
    ctx.globalAlpha = alpha;
    ctx.drawImage(B, 0, 0, w, h, sx, sy, w, h);
    ctx.restore();
  };
  put(R.layers.alb.x, 'source-over');
  put(R.layers.emit.x, 'destination-out');
  if (cast) put(R.layers.occ.x, 'source-over');
}

// A figure's rough world bounds, for depthCast.
function figureBox(w) {
  const s = w.rig?.scale ?? 1;
  const x = w.rig?.x ?? w.x;
  const y = w.rig?.y ?? w.y;
  return [x - 80 * s, y - 230 * s, x + 80 * s, y + 10 * s];
}

// Scenery running away from us to a vanishing point (xc, vy): sharp at the
// near edge, softer towards the far end.
function deepScenery(R, fn, box, xc, vy, span, mode = 'bokeh') {
  if (mode === 'off') return R.paint(fn);
  depthCast(R, fn, box, 1, {
    mode,
    cast: false,
    mask: (c) => {
      const grd = c.createRadialGradient(xc, vy, 0, xc, vy, span * 0.6);
      grd.addColorStop(0, 'rgba(0,0,0,1)');
      grd.addColorStop(0.3, 'rgba(0,0,0,0.85)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = grd;
      c.fillRect(box[0] - 50, box[1] - 50, box[2] - box[0] + 100, box[3] - box[1] + 100);
    },
  });
}

return { depthCast, figureBox, deepScenery };

function sunLook(g) {

  const sunUv = [-0.28 - 0.1 * k, -0.95 + 0.85 * k];
  const lights = [
    { uv: sunUv, color: col, intensity: (1.25 - 0.2 * k) * (1 - fog * 0.45), radius: 0, rim: 0.55 + 0.6 * k },
    { uv: [0.5, -1.2], color: [0.55, 0.62, 0.78], intensity: 0.25 + fog * 0.3, radius: 0, rim: 0.2 },
  ];
  const torch = g.torchLight();

    lights.push({ x: g.a.flashX, y: -60, color: [1, 0.8, 0.55], intensity: 3 * f, radius: 0.5, rim: 1.2 });

    ambient: mixc([0.3, 0.31, 0.38], [0.27, 0.23, 0.28], k).map((v) => v * (1 - drain * 0.35)),
    lights,
    groundShadow: 0.75 * (1 - fog * 0.6),

    bloom: 0.55,
    exposure: 0.86 - drain * 0.1,

}

function skyStops(k) {
  const a = [[0, '#6f8fb4'], [0.45, '#a9bccb'], [0.75, '#d9d3c4']];

// Pause between lines so the dialogue breathes.
const GAP = 0.45;
const CAT_LINE = ['بسّة. مو جوعانة أكتر من أي حدا هون. وعم تستنى نفس الشي: إنو يخلص.', 'A cat. No hungrier than anyone else here. Waiting for the same thing: for it to end.'];
// (not in the script: a placeholder for the stroke)
const STROKE_LINE = ['خلّتني. للحظة، ما في غير شي دافي تحت إيدي.', 'It lets me. For a moment, there’s only something warm under my hand.'];

function* talk(g, lines) {
  for (const [who, line, style] of lines) {
    yield* g.say(who, line, null, style || '');
    yield GAP;
  }
}

const ACT1 = {
  bounds: [-150, X.end],

  build(g) {
    const L = g.level;
    const s = g.state;
    g.a = { sunK: 0, drain: 0, talking: false };
    g.surface = surfaceAt;

    L.add({ id: 'vine', x: X.vine, y: -150, range: 90, label: LOOK, look: true, box: [118, 184], bx: 2, by: 64, outline: [[-54,86],[-56,-10],[-49,-75],[-25,-92],[27,-99],[45,-75],[56,-39],[69,-10],[69,86]], use: () => g.line(null, ['دالية عنب. لسا عم تطلع من بين الحجار. ما حدا قلّها إنو في حرب.', 'A grape vine. Still growing up through the stones. No one told it there’s a war.'], 5, 'examine') });

    L.add({ id: 'shop', x: X.shop + 110, y: -170, range: 110, label: LOOK, look: true, box: [228, 214], bx: -1, by: 67, outline: [[-100,-105],[101,-105],[101,-74],[111,-63],[111,103],[-110,103],[-110,-63],[-100,-74]], use: () => g.line(null, ['دكّان أبو ريّان. كان يبيع كل شي: خبز وسكّر وسجاير. هلّق ما فيه غير غبرة.', 'Abu Rayyan’s shop. It used to sell everything: bread, sugar, cigarettes. Now there’s nothing in it but dust.'], 5.5, 'examine') });
    L.add({ id: 'battery', x: X.battery + 60, y: -150, range: 90, label: LOOK, look: true, box: [100, 60], bx: 2, by: 68, use: () => g.line(null, ['بطارية سيارة. بتشحن عشر تلفونات إذا بدها. مصدر الكهربا الوحيد لنص الحارة. الصبي اسمو فادي، عمرو خمستعش، صار المسؤول عنها لأنو هوّي الوحيد اللي بيعرف يفكّ ويركّب.', 'A car battery. It can charge ten phones if it has to. The only source of electricity for half the neighbourhood. The boy is Fadi, fifteen. He became responsible for it because he’s the only one who knows how to wire it.'], 9, 'examine') });
    L.add({ id: 'scrap', x: X.scrap + 90, y: -60, range: 70, label: LOOK, look: true, box: [190, 76], bx: -15, by: 26, use: () => g.line(null, ['كومة حديد. نحاس. ألمنيوم. كانت بناية. هلّق هي عملة.', 'A pile of iron. Copper. Aluminium. It was a building. Now it’s currency.'], 5, 'examine') });
    L.add({ id: 'wing', x: X.collapsed + 120, y: -240, range: 80, label: LOOK, look: true, box: [320, 270], bx: 29, by: 102, outline: [[-158,138],[-71,19],[-34,-78],[18,-61],[99,-25],[156,-19],[198,28],[167,138]], use: () => g.line(null, ['جناح المدرسة الشرقي. انهار بقصف هاون قبل شهرين. ما كان فيه حدا. الولاد كانوا بالقبو.', 'The eastern wing of the school. Collapsed from mortar fire two months ago. No one was inside. The children were in the basement.'], 6.5, 'examine') });
    L.add({
      id: 'shard',
      x: X.shard,
      y: -60,
      range: 60,
      label: ['التقط', 'Pick up'],
      box: [140, 52],
      bx: 5,
      by: 40,
      enabled: () => !g.hasTool('mirror'),
      use: () => {
        g.runner.run(
          (function* () {
            yield* g.reach(X.shard, -20, () => {
              g.giveTool('mirror');
              g.sound.click();
            });
            yield* g.say(null, ['شقفة مراية. بتشوف فيها حالك، أو بتشوف فيها شو ورا الحيطان.', 'A shard of mirror. You can see yourself in it, or you can see what’s around walls.'], 5, 'examine');
            yield* g.say(null, ['شقفة مراية. بتبيّن فيها الطريق اللي ما عم تشوفها.', 'Mirror shard. It shows the road you can’t see.'], 4, 'item');
          })(),
        );
      },
    });

    // --- the player, the cast ---
    const startAt = { walk: X.start, hour: X.junction + 120, school: 6980, news: X.classroom + 80 }[s.checkpoint] ?? X.start;
    g.player.place(startAt);
    g.player.f = 1;

    if (s.checkpoint === 'walk') this.buildWalk(g);
    if (['walk', 'hour'].includes(s.checkpoint)) this.buildHour(g);
    if (['walk', 'hour', 'school'].includes(s.checkpoint)) this.buildSchool(g);
    this.buildNews(g);

    if (s.checkpoint !== 'walk') g.a.sunK = { hour: 0.2, school: 0.55, news: 0.8 }[s.checkpoint] || 0;
    if (s.checkpoint === 'hour') g.text.objective(['اتجه شرقاً نحو الأنابيب', 'Head east, to the pipes']);
    g.sound.score?.mood(s.checkpoint === 'walk' ? 'walk' : 'hour', 3);
    g.sound.life(0.7);

  // ============================================================ Scene 1 ==

  buildWalk(g) {
    const L = g.level;
    const kh = g.npc('khaled', X.start + 80, { f: 1 });
    g.khaled = kh;
    g.a.khaledMode = 'follow';
    // Ahmad sets the pace: half a step ahead, loose and unhurried.
    kh.brain = (dt) => {
      const p = g.player;
      if (g.a.khaledMode === 'follow') {
        const target = Math.max(kh.x, p.x + 70);
        if (g.a.holdAhmad && kh.x >= g.a.holdAhmad) kh.update(dt, { stance: kh.stance });
        else if (target - kh.x > 8) kh.goTo(Math.min(target, g.a.holdAhmad ?? Infinity), dt, { speedScale: 0.55 });
        else kh.update(dt, {});
        // Waiting (held at the curtain or the junction, or just stopped
        // because Sami has): after a moment he turns round to face him.
        const held = g.a.holdAhmad && kh.x >= g.a.holdAhmad - 2;
        const waiting = held || target - kh.x <= 8;
        kh.waitT = waiting ? (kh.waitT || 0) + dt : 0;
        let want = 1;
        if (kh.waitT > 0.6 && p.x < kh.x - 40) want = -1;
        if (want !== kh.f && kh.onGround && !kh.mantle) {
          kh.f = want;
          kh.rig.pivot();
        }
      } else if (kh.goal !== null && kh.goal !== undefined) {
        if (kh.goTo(kh.goal, dt, kh.goalOpts || {})) kh.goal = null;
      } else if (g.a.khaledMode === 'depth') {
        // walking south, away from us down the side street
        kh.depthK = Math.min(1, (kh.depthK || 0.001) + dt * 0.06);
        const k = kh.depthK;
        const s = 1 / (1 + 3.4 * k);
        kh.rig.scale = s;
        kh.stride += dt * 90 * s;
        kh.pose(dt, 60);
        kh.rig.x = lerp(X.junction - 10, X.junction + 6, k);
        kh.rig.y = lerp(0, -70, 1 - s);
        if (k >= 1) kh.visible = false;
      } else kh.update(dt, {});
    };
    // The player can't outwalk him.
    g.gate = (move) => {
      if (g.a.khaledMode !== 'follow' || move <= 0) return move;
      if (g.player.x > kh.x + 20) return 0;
      return g.player.x > kh.x - 60 ? move * 0.55 : move; // fall into step with him
    };

    g.runner.run(this.walk(g));

    L.at(X.pigeon, () => {
      g.sound.pigeons();
      g.a.pigeonAt = g.time;
      for (const w of [g.player, kh]) {
        w.override = P_FLINCH;
        setTimeoutGame(g, 0.4, () => (w.override = null));
      }
    });
    L.at(X.curtain0 + 50, () => {
      g.a.curtainPrompt = true;
    });
    L.at(X.junction - 140, () => {
      g.a.reachedJunction = true;
    });
  },

  *walk(g) {
    const kh = g.khaled;
    g.sound.ambience({ wind: 0.4, air: 0.5, generator: 0.6, traffic: 0, crowd: 0 });
    g.text.titleCard([['بعد الضهر', 'The Afternoon'], ['الساعة تلاتة وخمس دقايق', '3:05 PM · 14 August 2014']], 4.5);
    g.text.objective(['امشِ مع أحمد', 'Walk with Ahmad']);
    yield 5;
    g.prompt('right', 'امشِ', 'Walk');
    yield () => g.player.x > X.start + 120;
    g.prompt(null);
    // The sniper curtain runs by position, alongside the talk: crouch under the sag.
    g.a.holdAhmad = X.sag0 + 40;
    const curtain = g.runner.run(
      (function* () {
        yield () => g.player.x > X.curtain0 - 40;
        g.prompt('crouch', 'انحنِ', 'Crouch down');
        yield () => g.player.stance !== 'stand' || g.player.x > X.sag1;
        g.prompt(null);
        // from here he walks on as far as the junction, and waits there
        g.a.holdAhmad = X.junction - 60;
        g.a.curtainCleared = true;
        yield () => g.player.x > X.sag1 + 10;
        if (g.player.stance !== 'stand') g.prompt('crouch', 'قِف', 'Stand up');
        yield () => g.player.stance === 'stand';
        g.prompt(null);
      })(),
    );
    g.runner.run(ambientShots(g));

    yield* talk(g, [
      [AHMAD, ['عارف شو أكتر شي بشتاقلو؟', 'You know what I miss most?']],
      [SAMI, ['الكهربا.', 'Electricity.']],
      [AHMAD, ['لا يا زلمة. الفوتبول بعد المدرسة.', 'No, man. Football after school.']],
      [SAMI, ['من كل شي عم يصير، الفوتبول؟', 'Out of everything that’s happening, football?']],
      [AHMAD, ['إي والله. بتذكّر كنّا نرمي الشنط عالرصيف ونلعب بالشارع لحتى يعتّم؟', 'I swear. Remember we used to throw our bags on the pavement and play in the street till it got dark?']],
      [SAMI, ['لحتى يطلع أبوك يدوّر عليك.', 'Till your dad came out looking for you.']],
      [AHMAD, ['بتستاهل كل قتلة.', 'Worth every beating.']],
    ]);
    yield () => g.player.x > X.pigeon + 60;
    yield 1;
    yield* talk(g, [
      [SAMI, ['كيف الولاد اليوم؟', 'How were the kids today?']],
      [AHMAD, ['منيحين. عم يتعلّمو ماضي وحاضر ومستقبل.', 'Good. They’re learning past, present and future.']],
      [SAMI, ['بالقواعد تقصد.', 'You mean in grammar.']],
      [AHMAD, ['هيك قلت.', 'That’s what I said.']],
    ]);

    yield () => curtain.done || g.a.curtainCleared;
    yield () => kh.x > X.sag0 + 20;
    yield* talk(g, [
      [AHMAD, ['يا ريت نرجع نلعب بهالشارع متل زمان.', 'I wish we could play in this street like before.']],
      [SAMI, ['بهالشارع؟ هلّق المشي فيه صار رياضة.', 'This street? Now just walking down it is a sport.']],
    ]);
    yield () => curtain.done;

    // Rami, who asked what "abroad" means.
    yield* talk(g, [
      [AHMAD, ['بتعرف رامي؟ ابن أبو علي؟ اللي ساكنين بآخر الشارع؟', 'You know Rami? Abu Ali’s son? The ones who live at the end of the street?']],
      [SAMI, ['الصغير؟ اللي ما بيوقف حكي؟', 'The little one? Who never stops talking?']],
    ]);
    // the rubble: climb it
    const climbPrompt = g.runner.run(
      (function* () {
        yield () => g.player.x > X.wall0 - 90;
        if (g.player.x < X.wall1) g.prompt('jump', 'اقفز / تسلّق', 'Jump / Climb');
        yield () => g.player.x > X.wall0 + 20 || g.player.mantle;
        g.prompt(null);
      })(),
    );
    yield* talk(g, [
      [AHMAD, ['هاد. سألني اليوم: أستاز، شو يعني "برّا"؟', 'That’s him. He asked me today: “Teacher, what does ‘abroad’ mean?”']],
    ]);
    yield 1.2;
    yield* talk(g, [
      [AHMAD, ['يعني ما بيعرف. ما طلع من هون بحياتو. ما شاف شي غير هالحارة. "برّا" بالنسبالو كلمة مثل "تنّين": شي بيسمع فيه بس ما شافو.', 'He doesn’t know. He’s never been outside this neighbourhood in his life. He’s never seen anything else. “Abroad” is like “dragon” to him: something he’s heard of but never seen.']],
    ]);
    yield () => climbPrompt.done;

    // The parting.
    yield () => g.a.reachedJunction && kh.x >= X.junction - 70;
    yield* this.parting(g);
  },

  *parting(g) {
    const kh = g.khaled;
    const p = g.player;
    g.lock();
    g.text.objective(null);
    g.a.khaledMode = 'script';
    yield* g.walkPlayer(X.junction - 150);
    p.f = 1;
    kh.f = -1;
    kh.override = P_TURNED;
    g.camOverride = { x: X.junction - 60, y: -240, view: 1150 };
    g.a.sunK = 0.1;
    g.sound.ambience({ generator: 0.25, air: 0.4 });
    yield 0.6;
    yield* talk(g, [
      [AHMAD, ['يلا، أنا رايح من هون. بدي مرّ عند أم سعيد وعيلتا، بنتن مريضة وما في حدا يشوفها.', 'Right, I’m heading off from here. I want to check on Um Said and her family. Their daughter’s ill and there’s no one to see her.']],
      [SAMI, ['من وين رايح؟ من شارع المدرسة؟', 'Which way are you going? Through School Street?']],
      [AHMAD, ['إي، أسرع.', 'Yeah, it’s quicker.']],
    ]);
    yield 0.8; // he considers saying something
    yield* talk(g, [
      [SAMI, ['خلّي بالك ع حالك.', 'Take care of yourself.']],
      [AHMAD, ['دايماً. بشوفك بالليل إن شاء الله. عندي نكتة جديدة، مو رح تصدّقها.', 'Always. I’ll see you tonight, God willing. I’ve got a new joke. You won’t believe it.']],
      [SAMI, ['نكاتك ما بتنضحك.', 'Your jokes aren’t funny.']],
      [AHMAD, ['هاي الأحلى من كلهن. الليلة بتسمعها.', 'This one’s the best yet. Tonight, you’ll hear it.']],
      [AHMAD, ['يلا، يا هندسة.', 'See you, ya handasa.']],
    ]);
    kh.override = POSES.wave;
    yield 1.1;
    kh.override = null;
    // He walks to the mouth of the southern road, then away down it.
    yield* g.walkNpc(kh, X.junction - 10);
    g.a.khaledMode = 'depth';
    kh.face('back');
    g.camOverride = { x: X.junction - 80, y: -230, view: 1050 };
    yield () => !kh.visible;
    // The street is empty. A beat of silence, then the world again.
    g.sound.ambience({ generator: 0, air: 0.1, wind: 0.1 }, 0.5);
    yield 2.5;
    g.sound.ambience({ generator: 0.5, air: 0.5, wind: 0.35 }, 3);
    g.sound.pigeons();
    yield 1.5;
    g.camOverride = null;
    g.lock(false);
    g.checkpoint('hour');
    g.sound.score?.mood('hour', 8);
    g.text.objective(['اتجه شرقاً نحو الأنابيب', 'Head east, to the pipes']);
  },

  // ============================================================ Scene 3 ==

  buildHour(g) {
    const L = g.level;
    const s = g.state;
    const old = g.npc('oldman', X.oldMan, { f: 1 });
    old.override = P_STRUGGLE;
    g.oldMan = old;
    g.a.cansOnGround = 2;

    L.at(X.oldMan - 150, () => g.runner.run(this.oldManScene(g)));

    // the corner: look before you cross
    g.a.mirrorChecked = false;
    const prevGate = g.gate;
    g.gate = (move) => {
      if (prevGate) move = prevGate(move);
      if (!g.a.mirrorChecked && move > 0 && g.player.x > X.corner - 40) {
        if (!g.a.cornerWarned) {
          g.a.cornerWarned = true;
          g.runner.run(this.cornerWarn(g));
        }
        return 0;
      }
      return move;
    };

    // the spotter's post: a stool at a second-floor window, radio to his ear
    L.solid(X.spotter - 30, X.spotter + 90, -330, -318, { noClimb: true });
    const sp = g.npc('spotter', X.spotter + 30, { y: -330, f: -1 });
    sp.override = SPOT_SIT;
    g.spotter = sp;
    L.at(X.spotter - 220, () => g.runner.run(this.spotterScene(g)));

    L.at(X.heli, () => g.runner.run(this.jetStrike(g)));
    L.at(X.oldMan + 500, () => (g.a.sunK = Math.max(g.a.sunK, 0.3)));
  },

  *oldManScene(g) {
    const p = g.player;
    const old = g.oldMan;
    g.lock();
    yield* g.walkPlayer(X.oldMan - 110);
    p.f = 1;
    yield* g.say(null, ['غالونين مي. عشرين ليتر الواحد. من البير لهون مسافة ربع ساعة. بالحر هاد، ساعة.', 'Two water jugs. Twenty litres each. From the well to here, a fifteen-minute walk. In this heat, an hour.'], 5.5, 'examine');
    const i = yield* g.choose(null, [
      { ar: 'ساعِده', en: 'Help him' },
      { ar: 'تابع طريقك', en: 'Keep walking' },
    ]);
    g.state.choices.push(`A${i + 1}`);
    if (i === 0) {
      g.state.compassion += 1;
      g.state.helped_old_man = true;
      yield* g.walkPlayer(X.oldMan + 10);
      old.f = -1;
      old.override = { ...POSES.stand, torso: 0.1 };
      yield* g.say(OLD, ['الله يخلّيك يا ابني...', 'God bless you, son...']);
      yield GAP;
      // take one jug; he takes the other
      g.a.cansOnGround = 0;
      p.carry = true;
      p.rig.prop = (c, hand) => jerryCan(c, hand[0], hand[1] + 44, 0.95);
      old.carry = true;
      old.override = null;
      old.rig.prop = (c, hand) => jerryCan(c, hand[0], hand[1] + 44, 0.95, '#d4a82a');
      g.sound.slosh();
      yield* g.say(SAMI, ['لوين بدك توصّلهن؟', 'Where do you need to get these?']);
      yield GAP;
      yield* g.say(OLD, ['هون، ع آخر الزقاق. بنتي وولادها. ما عندهن مي من مبارح.', 'Here, at the end of the alley. My daughter and her children. They’ve had no water since yesterday.']);
      // and they walk together, at Sami's pace (the player's): slowly, the
      // jug heavy, no running with it; the old man keeps beside him
      const prevObj = g.text.current;
      g.text.objective(['احمل الماء إلى الباب', 'Carry the water to the door']);
      g.stanceLock = 'stand';
      g.gate = (m) => (m < 0 && p.x < X.oldMan - 160 ? 0 : m);
      const a = g.a;
      a.carryWalk = true;
      g.runner.run(
        (function* () {
          while (a.carryWalk) {
            // a step behind him, never ahead, and never faster than he can
            old.goal = Math.min(X.door + 70, Math.max(old.x, p.x - 46));
            old.goalOpts = { speedScale: 0.6 };
            yield 0.15;
          }
        })(),
      );
      g.runner.run(
        (function* () {
          yield () => p.x > X.oldMan + 90;
          yield* g.say(OLD, ['كنت بشيل زيتون من الضيعة، شوالين عكتافي، وما كنت حسّ فيهن. هلّق غالون مي بيكسرني.', 'I used to carry olives from the village, sacks on my shoulders, and feel nothing. Now a jug of water breaks me.'], 6);
        })(),
      );
      g.lock(false);
      yield () => p.x >= X.door - 60;
      g.lock();
      a.carryWalk = false;
      g.gate = null;
      g.stanceLock = null;
      g.text.objective(prevObj || null);
      yield* g.walkNpc(old, X.door + 70, { speedScale: 0.6 });
      p.f = 1;
      old.f = -1;
      g.sound.noise({ dur: 0.08, freq: 400, q: 2, vol: 0.3 });
      yield 0.25;
      g.sound.noise({ dur: 0.08, freq: 400, q: 2, vol: 0.3 });
      yield 1;
      g.a.doorOpen = 0.35;
      g.a.doorGlow = 0.4;
      p.carry = false;
      p.rig.prop = null;
      yield* talk(g, [
        [OLD, ['الله يحميك. شو اسمك؟', 'God protect you. What’s your name?']],
        [SAMI, ['سامي.', 'Sami.']],
        [OLD, ['الله يحمي أهلك يا سامي.', 'God protect your family, Sami.']],
      ]);
      old.face('back');
      yield 0.7;
      old.visible = false;
      g.a.doorOpen = 0;
      g.a.doorGlow = 0;
      g.sound.noise({ dur: 0.15, freq: 300, q: 1, vol: 0.3 });
    } else {
      g.state.isolation += 1;
      g.state.helped_old_man = false;
      g.lock(false);
      // No judgement. The camera lingers on him a moment, then follows Sami.
      yield () => p.x > X.oldMan + 90;
      g.camOverride = { x: X.oldMan + 120, y: -240, view: 1400 };
      yield 2.2;
      g.camOverride = null;
    }
    g.lock(false);
    writeSave(g.state);
  },

  *cornerWarn(g) {
    if (!g.hasTool('mirror')) {
      yield* g.say(null, ['المفرق مكشوف عالغرب. أحسن ما تطلع قبل ما تشوف شو في.', 'The intersection is exposed to the west. Better not to step out before you see what’s there.'], 4.5, 'examine');
      g.a.cornerWarned = false;
      return;
    }
    g.active = 'mirror';
    g.prompt('use', 'استخدم المرآة', 'Use the mirror');

  *mirrorPeek(g) {

  *spotterScene(g) {
    const p = g.player;
    const sp = g.spotter;
    g.lock();
    yield* g.walkPlayer(X.spotter - 140);
    p.f = 1;
    sp.override = POSES.peekWindow; // he leans out over the sill to call down
    sp.f = -1;
    g.camOverride = { x: X.spotter - 60, y: -300, view: 1300 };
    yield* g.say(SPOT, ['يا زلمة! وين رايح؟ الطيران عم يضرب عالقبلي.', 'Hey, man! Where are you headed? The planes are hitting the southern quarter.'], null, 'shout');
    yield GAP;
    p.override = POSES.lookUp;
    yield* g.say(SAMI, ['رايح عالشرقي. عالأنابيب.', 'Heading to the eastern quarter. To the pipes.']);
    yield GAP;
    yield* g.say(SPOT, ['خود هاد. أحسنلك.', 'Take this. Better for you.']);
    // the walkie-talkie comes down on a rope
    g.a.rope = 0;
    const t0 = g.time;
    yield () => {
      g.a.rope = clamp((g.time - t0) / 3);
      return g.a.rope >= 1;
    };
    p.override = null;
    yield* g.walkPlayer(X.spotter - 24);
    p.f = 1;
    g.lock(false);
    g.prompt('interact', 'خذ جهاز اللاسلكي', 'Take the walkie-talkie');
    const taken = { v: false };
    g.level.add({ id: 'walkie', x: X.spotter - 10, y: -170, range: 60, label: ['خذ', 'Take'], use: () => (taken.v = true) });
    yield () => taken.v;
    g.level.remove('walkie');
    g.prompt(null);
    yield* g.reach(X.spotter - 10, -170, () => {
      g.giveTool('walkie');
      g.a.rope = 2;
    });
    g.lock();
    g.sound.squelch();
    g.a.rope = 2;
    yield* g.say(null, ['لاسلكي. بتسمع فيه تحذيرات الرصد. ما بيبعت، بس بيستقبل.', 'Walkie-talkie. You hear the spotters’ warnings. Receive only.'], 4.5, 'item');
    yield GAP;
    yield* g.say(SPOT, ['الموجة ٣. إذا سمعت "مروحي" أو "حربي"، انبطح. إذا سمعت "فيل"، الله يستر.', 'Channel 3. If you hear “mirwahi” (helicopter) or “harbi” (jet), get flat. If you hear “elephant”, God help us.'], 6);
    sp.override = SPOT_SIT;
    sp.f = -1;
    g.camOverride = null;
    g.lock(false);
  },

  // A jet, low and fast. The whine comes first; there are a few seconds to
  // get flat before it tears overhead, and then it hits another quarter.
  *jetStrike(g) {
    const p = g.player;
    g.a.heliWarn = g.time;
    g.sound.score?.mood('danger', 3);
    g.a.sunK = Math.max(g.a.sunK, 0.4);
    g.sound.radio(2.4);
    yield* g.say(RADIO, ['...حربي... حربي فوق الشرقي... حربي...', '...jet... jet over the eastern quarter... jet...'], 3.5, 'radio');
    const dur = 10;
    const over = 0.5;
    g.sound.jetPass(dur, over);
    const tOver = g.time + dur * over;
    // it crosses the sky in little more than a second, low and left to right
    g.a.jetFly = { t0: tOver - 0.7, dur: 1.4, x0: p.x * 0.35 - 1300, x1: p.x * 0.35 + 1300 };
    g.prompt('prone', 'انبطح!', 'Get down!');
    const t0 = g.time;
    yield () => p.stance === 'prone' || g.time - t0 > 4.3;
    g.prompt(null);
    g.lock();
    if (p.stance !== 'prone') {
      p.stance = 'prone'; // the body knows before the mind does
    }
    // The helplessness is the lesson: lie there and listen.
    g.camOverride = { x: p.x + 40, y: -200, view: 1250 };
    yield () => g.time >= tOver - 0.2;
    g.a.jetShadow = g.time;
    g.bump(0.35);
    yield 2;
    g.camOverride = null;
    // The strike, on another quarter.
    g.sound.strikeFar();
    g.bump(0.95);
    g.runner.run(
      (function* () {
        yield 0.7;
        g.bump(0.45); // the ground keeps shaking
        yield 0.8;
        g.bump(0.25);
      })(),
    );
    g.a.plumeAt = g.time;
    g.a.plumeX = g.cam.x * 0.3 - 420;
    yield 3;
    g.sound.radio(2.2);
    yield* g.say(RADIO, ['...ضربة حربي... عالحارة القبلية... ضربة حربي...', '...airstrike... the southern quarter... airstrike...'], 4, 'radio');
    g.lock(false);
    g.prompt('jump', 'قِف', 'Get up');
    yield () => p.stance === 'stand';
    g.prompt(null);
    g.player.rig.dust = 0.15;
    g.sound.score?.mood('hour', 10);
    writeSave(g.state);
  },

  // ======================================================= the school ====

  buildSchool(g) {
    const L = g.level;
    const kids = [];
    const mk = (outfit, x, f, pose) => {
      const k = g.npc(outfit, x, { f, scale: outfit === 'layla' ? 0.64 : 0.58 });
      k.override = pose;
      kids.push(k);
      return k;
    };
    g.layla = mk('layla', X.layla, 1, POSES.sort);
    g.boy = mk('boy', X.layla + 60, -1, POSES.sort);
    g.boy.rig.scale = 0.5;
    const runners = [mk('kid2', X.scrap + 120, -1, POSES.sort), mk('kid3', X.scrap + 210, 1, POSES.sort), mk('fadi', 7200, 1, POSES.sort)];
    runners[2].rig.scale = 0.6;
    g.kids = kids;
    g.runnerKids = runners;
    // the others play: dash between piles, calling out finds
    runners.forEach((k, i) => {
      k.play = true;
      k.brain = (dt) => {
        if (k.hide) {
          if (k.goTo(X.stairs, dt, { run: true })) enterDoor(g, k);
          return;
        }
        if (k.play) {
          if (k.goal === null || k.goal === undefined) {
            k.override = null;
            k.goal = X.scrap - 120 + ((Math.sin(g.time * 0.7 + i * 2) + 1) / 2) * 360;
          }
          if (k.goTo(k.goal, dt, { run: true, speedScale: 0.7 })) {
            k.goal = null;
          }
        } else k.update(dt, {});
      };
    });

    L.add({
      id: 'layla',
      x: X.layla,
      y: -130,
      range: 80,
      label: ['تحدّث إلى ليلى', 'Talk to Layla'],
      box: [70, 182],
      by: 40,
      sil: (c) => g.layla?.draw(c),
      enabled: () => !g.a.laylaTalked && !g.a.shelling,
      use: () => {
        g.a.laylaTalked = true;
        g.runner.run(this.laylaTalk(g));
      },
    });

    // the cat (after the shelling)
    const cat = new Cat();
    cat.x = X.catWall;
    cat.y = -148;
    cat.f = -1;
    cat.hidden = true;
    g.cat = cat;
    L.add({
      id: 'cat',
      x: X.catWall,
      y: -163,
      range: 110,
      label: ['القطة', 'The cat'],
      look: true,
      sil: (c) => cat.draw(c),
      box: [40, 38],
      lookText: CAT_LINE,
      enabled: () => !cat.hidden && !g.a.catDone,
      use: () => g.runner.run(this.catScene(g)),
    });
    // for a few seconds after, it will let him reach out to it
    L.add({
      id: 'catStroke',
      x: X.catWall,
      y: -163,
      range: 130,
      urgent: true,
      label: ['ملّس عليها', 'Stroke it'],
      sil: (c) => cat.draw(c),
      box: [40, 38],
      look: true,
      lookText: STROKE_LINE,
      enabled: () => g.a.catWait && !g.a.stroke,
      use: () => (g.a.stroke = true),
    });

    L.at(6950, () => {
      g.checkpoint('school');
      g.a.sunK = Math.max(g.a.sunK, 0.55);
      g.sound.ambience({ crowd: 0.35, generator: 0.1 });
    });
    L.at(X.scrap + 150, () => g.runner.run(this.shelling(g)));
    L.at(X.classroom - 30, () => {
      if (g.a.shellingDone) g.runner.run(this.flashback(g));
      else g.a.flashbackPending = true;
    });
  },

  *laylaTalk(g) {
    g.lock();
    const p = g.player;
    const l = g.layla;
    // they turn to each other; she looks up from her sorting
    p.f = l.x < p.x ? -1 : 1;
    const was = { f: l.f, override: l.override };
    l.f = p.x < l.x ? -1 : 1;
    l.override = { ...(was.override || POSES.sort), torso: 0.55, head: -0.45 };
    yield 0.4;
    yield* g.say(LAYLA, ['بتعرف قدّيش كيلو حديد لازم الواحد يلمّ لحتى يشتري كيس برغل؟', 'Do you know how many kilos of scrap metal you need to collect for a bag of bulgur?'], 5);
    yield GAP;
    yield* g.say(SAMI, ['كم؟', 'How many?']);
    yield GAP;
    yield* g.say(LAYLA, ['كتير.', 'A lot.']);
    yield 0.6;
    // and back to it
    l.f = was.f;
    l.override = was.override;
    g.lock(false);
  },

  *shelling(g) {
    const p = g.player;
    const s = g.state;
    g.a.shelling = true;
    g.sound.score?.mood('danger', 1.5);
    g.a.sunK = Math.max(g.a.sunK, 0.62);
    const impact = (x, dist) => {
      g.sound.mortarImpact(dist, g.sound.panFor(x));
      g.effects.blast(x, 0, dist < 1.5 ? 1 : 0.6);
      g.a.flashAt = g.time;
      g.a.flashX = x;
      g.bump(dist < 1.5 ? 0.6 : 0.3);
      if (!g.settings.get('physics')) return;
      // the blast's push: Sami, near enough, is rocked back and rights
      // himself; grown men caught close go down, and get up again (the
      // children are never thrown)
      const push = (w, k, fall) => {
        const away = Math.sign(w.x - x) || 1;
        if (fall) w.knockDown([away * 520 * k, -300 * k], { then: 'stand' });
        else w.knockDown([away * 360 * k, -40 * k], { muscle: 0.7, pinFeet: true });
      };
      if (dist < 1.7 && !p.down) push(p, clamp(1.7 - dist, 0.3, 1), false);
      const young = new Set([...(g.kids || []), ...(g.runnerKids || []), g.boy, g.layla].filter(Boolean));
      for (const w of g.npcs) {
        if (young.has(w) || w.down || !w.visible || w.hide) continue;
        const d = Math.abs(w.x - x);
        if (d < 260) push(w, 1 - d / 260, d < 180);
      }
    };
    const kidsFreeze = () => {
      for (const k of [...g.kids]) {
        k.play = false;
        k.goal = null;
        k.override = { ...POSES.stand, head: -0.35 };
      }
    };
    g.lock();
    g.sound.mortarWhistle(1.4);
    yield 1.4;
    impact(6880, 2.2);
    kidsFreeze();
    yield 0.9;
    g.sound.mortarWhistle(1.2);
    yield 1.2;
    impact(7120, 1.4);
    g.sound.carAlarm(10);
    // most of them run for the basement stairs; Layla and the little one freeze
    for (const k of g.runnerKids) {
      k.override = null;
      k.hide = true;
    }
    g.boy.override = { ...POSES.grief, torso: 0.3 };
    g.layla.override = { ...POSES.stand, head: -0.3, armN: 0.4, foreN: 0.9 };
    // shells keep walking in, away from the children
    const barrage = g.runner.run(
      (function* () {
        const xs = [6990, 7220, 7060, 7290, 6930];
        for (const x of xs) {
          g.sound.mortarWhistle(1.1);
          yield 1.1;
          impact(x, Math.abs(x - p.x) / 300);
          yield 0.6 + Math.random() * 0.8;
          if (g.a.stopBarrage) return;
        }
      })(),
    );
    const i = yield* g.choose(null, [
      { ar: 'احمِ الأطفال', en: 'Shield the children' },
      { ar: 'احتمِ', en: 'Take cover' },
    ], { timed: 7, def: 1 });
    s.choices.push(`B${i + 1}`);

    if (i === 0) {
      s.compassion += 1;
      s.children_helped = true;
      g.lock(false);
      g.text.objective(['خذ ليلى والطفل إلى الدرج', 'Get Layla and the boy to the stairs']);
      g.prompt('run', 'اركض', 'Run');
      const grabbed = { v: false };
      g.level.add({ id: 'grab', urgent: true, x: (X.layla + g.boy.x) / 2, y: -110, range: 110, label: ['خذهما', 'Take them'], use: () => (grabbed.v = true) });
      yield () => grabbed.v;
      g.level.remove('grab');
      g.prompt(null);
      g.line(SAMI, ['يلا يلا يلا! عالدرج!', 'Go go go! To the stairs!'], 2.5, 'shout');
      // they run with him, crouched, his body between them and the sky
      for (const [k, off] of [[g.layla, -40], [g.boy, -80]]) {
        k.override = null;
        k.brain = (dt) => k.goTo(Math.min(g.player.x + off, X.stairs), dt, { run: true });
      }
      g.runner.run(
        (function* () {
          yield 1.2;
          g.sound.mortarWhistle(1);
          yield 1;
          impact(X.scrap + 40, 0.9); // lands in the open area behind them
          g.a.crater = true;
          yield 1.5;
          g.sound.mortarWhistle(1);
          yield 1;
          impact(X.stairs - 380, 0.8);
        })(),
      );
      g.text.objective(['إلى الدرج', 'To the stairs']);
      yield () => g.player.x >= X.stairs - 20;
      g.text.objective(null);
      g.lock();
      g.a.stopBarrage = true;
      yield* this.stairwell(g);
    } else {
      s.isolation += 1;
      // dive behind the nearest wall
      yield* g.walkPlayer(X.lowWall + 20, { run: true });
      p.f = -1;
      p.stance = 'prone';
      // Layla pulls the little one to the basement on her own
      g.layla.override = null;
      g.boy.override = null;
      g.layla.brain = (dt) => {
        if (g.layla.goTo(X.stairs, dt, { run: true })) enterDoor(g, g.layla);
      };
      g.boy.brain = (dt) => {
        if (g.boy.goTo(Math.min(g.layla.x - 30, X.stairs), dt, { run: true }) && !g.layla.visible) enterDoor(g, g.boy);
      };
      g.camOverride = { x: X.lowWall - 120, y: -200, view: 1300 };
      yield 2.2;
      g.sound.mortarWhistle(1);
      yield 1;
      impact(X.scrap + 40, 0.9);
      g.a.crater = true;
      yield 2.5;
      g.sound.mortarWhistle(1.2);
      yield 1.2;
      impact(6960, 2.4);
      yield () => !g.layla.visible;
      yield 2;
      g.camOverride = null;
      g.a.stopBarrage = true;
    }

    // After: ringing silence, settling rubble, dust like fog.
    yield () => barrage.done;
    g.sound.ringing(1);
    g.sound.setMuffle(0.55, 0.4);
    g.effects.fog = Math.max(g.effects.fog, 0.8);
    yield 2.5;
    g.sound.ringing(0, 3);
    g.sound.setMuffle(0, 4);
    for (const k of g.kids) k.visible = false;
    g.a.crater = true;
    g.a.shelling = false;
    g.a.shellingDone = true;
    g.sound.score?.mood('hour', 12);
    g.player.rig.dust = 0.7;
    g.player.stance = g.player.stance === 'prone' ? 'prone' : 'stand';
    g.lock(false);
    if (g.player.stance !== 'stand') {
      g.prompt('jump', 'قِف', 'Get up');
      yield () => g.player.stance === 'stand';
      g.prompt(null);
    }
    g.sound.ambience({ crowd: 0, generator: 0, air: 0.35, wind: 0.3 });
    g.cat.hidden = false;
    writeSave(g.state);
    if (g.a.flashbackPending) g.runner.run(this.flashback(g));
  },

  *stairwell(g) {
    const p = g.player;
    g.fade = 1;
    yield 0.4;
    g.scene = 'stairwell';
    g.camOverride = { x: -60, y: -300, view: 1400 };
    g.snapCamera();
    const saved = { x: p.x, f: p.f };
    const bounds = g.level.bounds;
    g.level.bounds = [-2000, bounds[1]];
    p.place(-120);
    p.f = 1;
    p.stance = 'crouch';
    const mkKid = (outfit, x, f, pose, scale) => {
      const w = new Walker(g.level, outfit, scale);
      w.place(x);
      w.f = f;
      w.override = pose;
      w.update(0.016, {});
      return w;
    };
    const eyesShut = { ...POSES.crouch, head: 0.4, torso: 0.3 };
    g.stairKids = [
      mkKid('kid2', -420, 1, { ...POSES.crouch, head: 0.2 }, 0.58),
      mkKid('kid3', -300, 1, { ...POSES.crouch, head: 0.3 }, 0.58),
      mkKid('layla', 120, -1, eyesShut, 0.64),
      mkKid('boy', 220, -1, { ...POSES.kneel, head: 0.3 }, 0.5),
    ];
    g.stairKids.forEach((w) => {
      w.stance = 'crouch';
    });
    g.sound.setMuffle(0.6, 0.3);
    g.fade = 0;
    // the torch comes to hand; wait for the player to light it (or a few seconds)
    g.active = 'torch';
    if (!g.torch.on) g.prompt('use', 'أشعل المصباح', 'Torch');
    const t0 = g.time;
    g.runner.run(
      (function* () {
        for (let i = 0; i < 2; i++) {
          yield 1.4 + i;
          g.sound.mortarImpact(2.5);
          g.effects.trickle(-100 + i * 200, -640, 3);
          g.bump(0.25);
        }
      })(),
    );
    yield 3.5;
    yield () => g.torch.on || g.time - t0 > 9;
    g.prompt(null);
    p.override = { ...POSES.crouch, armN: 0.2, foreN: 0.9, armF: 0.1, foreF: 0.8, head: 0.2 }; // hands pressed flat to his knees
    yield* g.say(LAYLA, ['شكراً.', 'Thank you.'], 3);
    yield GAP;
    yield* g.say(SAMI, ['ابقوا هون. لا تطلعوا لحتى يهدا.', 'Stay here. Don’t come out until it’s quiet.'], 4);
    yield 1.5;
    g.fade = 1;
    yield 0.5;
    g.scene = 'street';
    g.level.bounds = bounds;
    g.stairKids = null;
    p.override = null;
    p.place(saved.x + 20);
    p.f = 1;
    p.stance = 'stand';
    g.camOverride = null;
    g.snapCamera();
    g.fade = 0;
  },

  *catScene(g) {
    const cat = g.cat;
    g.a.catDone = true;
    g.lock();
    g.player.f = g.player.x < cat.x ? 1 : -1;
    g.camOverride = { x: (g.player.x + cat.x) / 2, y: -220, view: 1000 };
    yield 1;
    // one slow blink
    const t0 = g.time;
    yield () => {
      const k = (g.time - t0) / 1.4;
      cat.blink = Math.sin(clamp(k) * Math.PI);
      return k >= 1;
    };
    yield* g.say(null, CAT_LINE, 6, 'examine');
    // it stays a moment, if he wants to reach out to it
    g.a.catWait = true;
    g.lock(false);
    const t2 = g.time;
    yield () => g.a.stroke || g.time - t2 > 5;
    g.a.catWait = false;
    if (g.a.stroke) {
      yield* this.catStroke(g);
      g.camOverride = null;
      g.lock(false);
      return;
    }
    yield 1.2;
    g.lock();
    // it turns, drops off the wall, and is gone into the rubble without a sound
    cat.f = 1;
    const t1 = g.time;
    yield () => {
      const k = (g.time - t1) / 1.6;
      cat.sit = 1 - clamp(k * 3);
      cat.x = X.catWall + k * 90;
      cat.y = -148 + Math.max(0, k - 0.35) * 260;
      cat.speed = 60;
      if (k >= 1) cat.hidden = true;
      return k >= 1;
    };
    g.camOverride = null;
    g.lock(false);
  },

  // Sami crouches and holds out a hand. The cat drops off the wall, comes to
  // him, turns its back to be stroked, arches into his hand with its eyes
  // closed and purrs; then it has had enough, and goes into the rubble.
  *catStroke(g) {
    const cat = g.cat;
    const p = g.player;
    g.lock();
    g.state.stroked_cat = true;
    const f = p.x < cat.x ? 1 : -1;
    // room for the cat between him and the foot of the wall
    yield* g.walkPlayer(X.catWall - f * 150);
    p.f = f;
    g.camOverride = { x: X.catWall - f * 90, y: -150, view: 820 };
    // his hand, low and forward, at the height of a standing cat's back
    // (about 25 up, rising a little as it pushes into his hand)
    const backY = p.y - 27.5;
    const reach = handTo(p, 'sami', 0, backY, f, { ...POSES.crouch, head: 0.3 });
    const handX = p.x - reach.x;
    const rest = { ...reach.pose, armN: 0.45, foreN: 1.0 };
    p.override = rest;
    g.sound.cloth();
    yield 0.5;
    p.override = reach.pose;
    yield 0.6;

    // down off the wall, landing where its back will be under his hand
    const landX = handX + 4 * f; // his hand on the middle of its back, its rump clear of his knees
    const x0 = cat.x;
    const y0 = cat.y;
    cat.f = -f;
    // it gets up, and gathers itself before it jumps
    const tg = g.time;
    yield () => {
      const k = clamp((g.time - tg) / 0.5);
      cat.sit = 1 - k;
      cat.y = y0 + Math.sin(clamp((k - 0.6) / 0.4) * Math.PI) * 3;
      return k >= 1;
    };
    const t1 = g.time;
    yield () => {
      const k = clamp((g.time - t1) / 0.7);
      cat.sit = 1 - clamp(k * 4);
      cat.x = lerp(x0, landX, smooth(0, 1, k));
      cat.y = lerp(y0, p.y, k) - Math.sin(k * Math.PI) * 30;
      cat.speed = k < 0.3 ? 0 : 50;
      return k >= 1;
    };
    cat.speed = 0;
    g.sound.step('grit', 0.05, { pan: g.sound.panFor(cat.x) });
    // the give of the landing
    const tl = g.time;
    yield () => {
      const k = clamp((g.time - tl) / 0.3);
      cat.sit = 0.35 * Math.sin(k * Math.PI);
      return k >= 1;
    };
    cat.sit = 0;
    yield 0.1;
    // it turns, and offers its back
    cat.f = f;
    yield 0.3;

    g.sound.purr(4.6, g.sound.panFor(cat.x));
    const t0 = g.time;
    yield () => {
      const k = (g.time - t0) / 4.6;
      // three slow strokes along its back, head to tail
      const s = Math.sin(clamp(k) * Math.PI * 6 - Math.PI / 2);
      p.override = { ...reach.pose, armN: reach.pose.armN + s * 0.12, foreN: reach.pose.foreN + s * 0.05 };
      cat.lean = Math.sin(clamp(k * 1.4) * Math.PI * 0.5) * (1 - clamp((k - 0.88) * 8));
      cat.blink = cat.lean * 0.9;
      return k >= 1;
    };
    g.line(null, STROKE_LINE, 5, 'examine');
    const e = g.text.log[g.text.log.length - 1];
    if (e?.line === STROKE_LINE) e.draft = true; // "[draft]" in the log
    cat.lean = 0;
    cat.blink = 0;
    p.override = rest;
    yield 0.8;
    // off, unhurried, towards the rubble, and gone
    const t2 = g.time;
    const x2 = cat.x;
    yield () => {
      const k = (g.time - t2) / 1.8;
      cat.x = x2 + f * k * 130;
      cat.speed = 60;
      if (k >= 1) cat.hidden = true;
      return k >= 1;
    };
    p.override = null;
    yield 0.8;
  },

  update(g, dt) {
    const a = g.a;

    if (a.drainT0) a.drain = clamp((g.time - a.drainT0) / 6);
    if (a.compress) a.sunK = lerp(0.9, 1.15, clamp((g.time - a.compress) / 12));
    // Sami walking south, away down the side street
    if (a.samiDepth) {
      const p = g.player;
      a.samiDepth = Math.min(1, a.samiDepth + dt * 0.08);
      const k = a.samiDepth;
      const s = 1 / (1 + 3.4 * k);
      p.rig.scale = s;
      p.stride += dt * 90 * s;
      p.pose(dt, 60);
      p.rig.x = lerp(X.south - 20, X.south, k);
      p.rig.y = lerp(0, -70, 1 - s);
    }
    // the cat sits and watches, and blinks now and then
    if (g.cat && !g.cat.hidden) {
      g.cat.update(dt);
      if (!g.a.catDone && Math.abs(g.player.x - g.cat.x) < 160 && !g.a.catAuto) {
        g.a.catAuto = true;
      }
    }
    if (a.curtainPrompt && g.player.x > X.sag1 + 40) a.curtainPrompt = false;
    streetLife(g, dt);

// Where to stand, and how to hold the arm, so one person's near hand rests
// on another's shoulder. Tries arm angles until the hand is at shoulder
// height, then stands at the distance that puts it there.
function handOnShoulder(who, to) {
  to.rig.solve();
  const [sx, sy] = to.rig.world('shoulder');
  const f = to.x < who.x ? -1 : 1;
  // the hand lands just on the near side of the shoulder
  return handTo(who, 'abuyazan', sx - f * 2, sy - 4, f);
}

// The same for any point: the arm angle that brings the near hand to height
// ty, and where to stand (facing f) so it lands at tx.
function handTo(who, outfit, tx, ty, f, base = { ...POSES.stand, head: 0.12 }) {
  const probe = new Person(outfit, who.rig.scale);
  let best = null;
  for (let a = 0.6; a <= 2.4; a += 0.02) {
    const pose = { ...base, armN: a, foreN: a + 0.12 };
    probe.setPose(pose);
    probe.x = 0;
    probe.y = who.y;
    probe.f = f;
    const [hx, hy] = probe.world('handN');
    const err = Math.abs(hy - ty);
    if (!best || err < best.err) best = { err, pose, hx };
  }
  return { pose: best.pose, x: tx - best.hx };
}

// ------------------------------------------------------ depth and doors --

// Walk into (k 0 → 1) or out of (k 1 → 0) a side street that runs away from
// the camera at x = mouth: the figure faces away or towards us and shrinks
// towards the vanishing point. Runs as a script step, after the NPC update.
function* depthWalk(g, w, mouth, dir, rate = 0.1) {
  const base = w.baseScale ?? w.rig.scale;
  w.baseScale = base;
  let k = dir === 'in' ? 0.001 : 1;
  w.face(dir === 'in' ? 'back' : 'front');
  w.x = mouth;
  const step = () => {
    const dt = g.lastDt || 1 / 60;
    k = clamp(k + (dir === 'in' ? 1 : -1) * rate * dt);
    w.pose(dt, 60);
    placeInDepth(w, mouth, k, base);
    w.stride += dt * 90 * (1 / (1 + 3.4 * k));
    w.depthK = k > 0.001 ? k : 0;
    return dir === 'in' ? k >= 1 : k <= 0;
  };
  yield step;
  w.depthK = 0;
  w.rig.scale = base;
  w.face(dir === 'in' ? 'back' : 'side');
  if (dir === 'in') w.visible = false;
}

function placeInDepth(w, mouth, k, base) {
  const s = 1 / (1 + 3.4 * k);
  w.rig.scale = base * s;
  w.rig.x = lerp(mouth - 10, mouth + 6, k);
  w.rig.y = lerp(0, -70, 1 - s);
}

// Someone reaching a doorway turns their back and goes in.
function enterDoor(g, w) {

// Now and then, in the calm stretches, someone crosses the mouth of a side
// street: out of it towards us, or along the street and into it.
const MOUTHS = [3105, 10020]; // (not the corner's street: it's exposed to the west)
// Ground the sniper can see: passers-by run across it, heads down.
const SNIPED = [
  [X.curtain0 - 20, X.curtain1 + 20],

const sniped = (x) => SNIPED.some(([a, b]) => x > a && x < b);

  { outfit: 'woman' },

function streetLife(g, dt) {
  const a = g.a;
  g.lastDt = dt;
  g.passers ||= [];
  const calm =
    g.scene === 'street' &&
    !g.locked &&
    !a.shelling &&
    !(a.jetFly && g.time < a.jetFly.t0 + 14) &&
    !(a.heliWarn && g.time < a.heliWarn + 12) &&
    !a.drainT0 &&
    g.player.x < X.newsStart - 250;
  a.nextPasser ??= g.time + 5;
  if (calm && g.time > a.nextPasser && g.passers.length < 2) {
    a.nextPasser = g.time + 9 + Math.random() * 9;
    const mouth = MOUTHS.find((m) => Math.abs(m - g.cam.x) < 650 && Math.abs(m - g.player.x) > 120);
    if (mouth) {
      const kind = PASSERS[Math.floor(Math.random() * PASSERS.length)];
      const w = new Walker(g.level, kind.outfit, kind.scale || 1);
      if (kind.can) w.rig.prop = (c, hand) => jerryCan(c, hand[0], hand[1] + 44, 0.95);
      const side = Math.random() < 0.5 ? -1 : 1;
      w.passer = { mouth, dir: Math.random() < 0.5 ? 'out' : 'in', side, phase: 'start' };
      if (w.passer.dir === 'in') {
        // from just beyond the edge of the frame, never in view
        w.place(g.cam.x + side * (g.cam.view / 2 + 160));
        w.f = -side;
      } else {
        w.place(mouth);
        w.rig.view = 'front';

      g.passers.push(w);

  }
  for (const w of g.passers) {
    const ps = w.passer;
    if (ps.phase === 'start') {
      ps.phase = ps.dir === 'out' ? 'depth' : 'along';
      if (ps.dir === 'out') ps.k = 1;
    }
    if (ps.phase === 'depth') {
      w.update(dt, {});
      w.pose(dt, 60);
      ps.k = clamp(ps.k + (ps.dir === 'in' ? 1 : -1) * 0.1 * dt);
      w.depth = ps.k;
      placeInDepth(w, ps.mouth, ps.k, w.baseScale ?? (w.baseScale = w.rig.scale));
      w.stride += dt * 90 * (1 / (1 + 3.4 * ps.k));
      if (ps.dir === 'out' && ps.k <= 0) {
        w.depth = 0;
        w.rig.scale = w.baseScale;
        w.face('side');
        w.f = ps.side;
        ps.phase = 'away';
      } else if (ps.dir === 'in' && ps.k >= 1) ps.done = true;
    } else if (ps.phase === 'along') {
      if (w.goTo(ps.mouth, dt, sniped(w.x) ? { run: true } : { speedScale: 0.6 })) {
        w.face('back');
        ps.phase = 'depth';
        ps.k = 0;
        w.baseScale = w.rig.scale;
      }
    } else if (ps.phase === 'away' || ps.phase === 'flee') {
      const run = ps.phase === 'flee' || sniped(w.x);
      w.goTo(w.x + ps.side * 400, dt, run ? { run: true } : { speedScale: 0.6 });
      // gone only once out of the frame
      if (Math.abs(w.x - g.cam.x) > g.cam.view / 2 + 140) ps.done = true;
    }
  }
  g.passers = g.passers.filter((w) => !w.passer.done);
  // shelling, or the news: whoever is out hurries off (never just vanishes)
  if (!calm && (a.shelling || a.drainT0)) {
    for (const w of g.passers) {
      const ps = w.passer;
      if (ps.phase === 'depth') {
        ps.dir = 'in';
      } else if (ps.phase !== 'flee') {
        ps.phase = 'flee';
        ps.side = w.x < g.cam.x ? -1 : 1;
        w.face('side');
        w.f = ps.side;
      }
    }
  }
}

  }
}

function setTimeoutGame(g, sec, fn) {
  g.runner.run(
    (function* () {
      yield sec;
      fn();
    })(),
  );
}

    c.lineTo(x + w * 0.53, -72);
    c.fill();
    // wheel wells on bare rims, sitting low
    c.fillStyle = '#17120f';
    for (const wx of [x + w * 0.18, x + w * 0.8]) {
      c.beginPath();
      c.arc(wx, -18, 24, Math.PI, 0);
      c.fill();
      c.strokeStyle = '#4a3a30';
      c.lineWidth = 3;
      c.beginPath();
      c.arc(wx, -10, 13, 0, Math.PI * 2);
      c.stroke();
    }
  });
}

// A tyre burning inside the lane, lit on purpose: its smoke blinds the hill.
function tyreX() {
  return (X.lane3[0] + X.lane3[1]) / 2 - 40;
}
function tyre(R, t, glow) {
  // a little way down the lane, towards the hill: smaller, higher
  const x = tyreX();
  const S = 0.55;
  const y = -48;
  R.cast((c) => {
    c.fillStyle = '#141110';
    c.beginPath();
    c.ellipse(x, y - 14 * S, 30 * S, 14 * S, 0, 0, Math.PI * 2);
    c.fill();
  });
  if (glow > 0)
    R.glow((c) => {
      for (let i = 0; i < 6; i++) {
        const fx = x + (-22 + i * 9) * S;
        const fh = (16 + 12 * Math.sin(t * 11 + i * 2)) * glow * S;
        c.fillStyle = `rgba(255,${130 + i * 12},50,${0.6 * glow})`;
        c.beginPath();
        c.moveTo(fx - 5 * S, y - 18 * S);
        c.quadraticCurveTo(fx, y - 18 * S - fh * 1.4, fx + 5 * S, y - 18 * S);
        c.fill();
      }
    });
}

// The smoke across lane 3, drawn in front of everyone. density 0…1.
function tyreSmoke(R, t, density) {
  if (density <= 0.02) return;
  const [x0, x1] = X.lane3;
  R.paint((c) => {
    const r = rng(33);
    for (let i = 0; i < 26; i++) {
      const k = i / 25;
      const px = lerp(x0 - 40, x1 + 80, r()) + Math.sin(t * 0.4 + i) * 30 + ((t * 18 + i * 40) % 160) - 80;
      const py = -30 - r() * 420 - k * 60;
      const pr = 70 + r() * 110;
      const a = Math.min(1, 0.9 * density * (0.6 + 0.4 * r()));
      const grd = c.createRadialGradient(px, py, 0, px, py, pr);
      grd.addColorStop(0, `rgba(58,52,50,${a})`);
      grd.addColorStop(0.6, `rgba(70,64,60,${a * 0.6})`);
      grd.addColorStop(1, 'rgba(70,64,60,0)');
      c.fillStyle = grd;
      c.beginPath();
      c.arc(px, py, pr, 0, Math.PI * 2);
      c.fill();
    }
  });
}

// The field hospital: a ground-floor flat with its front wall half gone and

    c.quadraticCurveTo(ox + 214, -90, ox + 200, -60);
    c.stroke();
    // the fridge, and the generator's cable to the lamp
    extrudeRect(c, ox + 238, -80, 44, 80, 16, { color: '#b8b4aa' });
    c.fillStyle = '#b8b4aa';
    c.fillRect(ox + 238, -80, 44, 80);
    c.fillStyle = '#8c887e';

  R.glow((c) => {

    c.fillStyle = '#a2967f';

// A collapsed wall across the pavement, with a gap at the bottom barely
// shoulder-width. Drawn over the player, who crawls beneath it.
function crawlWall(R) {
  const [x0, x1] = X.crawl;
  R.cast((c) => {
    const r = rng(52);
    const pts = [[x0 - 30, 2], [x0 - 20, -300], [x0 + 40, -340], [x1 - 20, -310], [x1 + 30, -260], [x1 + 40, 2], [x1 - 6, 2]];
    // the gap: a ragged lip of concrete hanging over it
    for (let i = 0; i <= 8; i++) pts.push([x1 - 6 - ((x1 - x0 - 12) * i) / 8, -52 - r() * 10]);
    pts.push([x0 + 6, 2]);
    // the wall is 26 thick: its torn top, the stump's right-hand end and the
    // left jamb of the gap all show their depth
    extrudePoly(c, pts, 26, { color: '#958a76' });
    c.fillStyle = '#958a76';
    c.beginPath();
    c.moveTo(...pts[0]);
    for (let i = 1; i < pts.length; i++) c.lineTo(...pts[i]);
    c.closePath();
    c.fill();
    c.fillStyle = 'rgba(0,0,0,0.18)';
    for (let i = 0; i < 6; i++) c.fillRect(x0 + r() * (x1 - x0), -300 + r() * 220, 30 + r() * 30, 3);
    c.strokeStyle = '#3e3126';
    c.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const rx = x0 + 10 + i * 26;
      c.beginPath();
      c.moveTo(rx, -54);
      c.quadraticCurveTo(rx + 6, -40, rx - 4, -30 - r() * 8);
      c.stroke();
    }
  });
}

// A first-floor balcony, and on its rail a sheet drying in the last sun.
function balcony(R, x, t, sheet) {
  R.cast((c) => {
    extrudeRect(c, x - 70, -150, 140, 10, 22, { color: '#8a7f6c' });
    c.fillStyle = '#8a7f6c';
    c.fillRect(x - 70, -150, 140, 10);
    // the far rail, set back across the slab
    c.strokeStyle = 'rgba(40,32,26,0.55)';
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(x - 70 + DEPTH.x * 22, -190 + DEPTH.y * 22);
    c.lineTo(x + 70 + DEPTH.x * 22, -190 + DEPTH.y * 22);
    c.moveTo(x + 70, -190);
    c.lineTo(x + 70 + DEPTH.x * 22, -190 + DEPTH.y * 22);
    c.moveTo(x + 70, -150);
    c.lineTo(x + 70 + DEPTH.x * 22, -150 + DEPTH.y * 22);
    c.stroke();
    c.strokeStyle = '#3a312a';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(x - 70, -190);
    c.lineTo(x + 70, -190);
    for (let i = 0; i <= 14; i++) {
      c.moveTo(x - 70 + i * 10, -190);
      c.lineTo(x - 70 + i * 10, -150);
    }
    c.stroke();
    if (sheet) {
      const sway = Math.sin(t * 1.5) * 4;
      c.fillStyle = '#e6e1d4';

      c.lineTo(x + 42 + sway, -96);

      c.lineTo(x - 10 + sway, -94);

      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(160,140,110,0.3)';

}

// A flat burnt out from inside: soot licking up from the doorway.
function guttedFlat(R, x) {

// The building beside School Street, half down: floors pancaked on the
// right, slabs hanging by their rebar. `cut` 0…1 opens the façade so we can
// see Sami inside.
function ruin(R, t, cut) {
  const [x0, x1] = X.ruin;
  const w = x1 - x0;
  R.paint((c) => {
    // the torn outline has a thickness: the broken top edges and the right-hand
    // end of the standing walls, 28 deep, behind the façade
    extrudePoly(c, [[x0, 4], [x0, -520], [x0 + w * 0.45, -520], [x0 + w * 0.6, -430], [x0 + w * 0.8, -300], [x1, -220], [x1, 4]], 28, { color: '#8f846f' });
    c.fillStyle = '#8f846f';
    c.beginPath();
    c.moveTo(x0, 4);
    c.lineTo(x0, -520);
    c.lineTo(x0 + w * 0.45, -520);
    c.lineTo(x0 + w * 0.6, -430);
    c.lineTo(x0 + w * 0.8, -300);
    c.lineTo(x1, -220);
    c.lineTo(x1, 4);
    c.closePath();
    c.fill();
    // the slabs, sagging towards the street
    c.fillStyle = '#6f6656';
    for (const [y, drop] of [[-380, 60], [-250, 90], [-130, 40]]) {
      extrudePoly(c, [[x0 + w * 0.3, y], [x1 + 20, y + drop], [x1 + 20, y + drop + 14], [x0 + w * 0.3, y + 14]], 14, { color: '#6f6656', topK: 1.3, sideK: 0.5 });
      c.fillStyle = '#6f6656';
      c.beginPath();
      c.moveTo(x0 + w * 0.3, y);
      c.lineTo(x1 + 20, y + drop);
      c.lineTo(x1 + 20, y + drop + 14);
      c.lineTo(x0 + w * 0.3, y + 14);
      c.fill();
    }
    for (let i = 0; i < 8; i++) {
      const rx = x1 + 16 - i * 7;
      // the stays have a far twin, dim, so they read as bars not lines
      c.strokeStyle = 'rgba(30,24,18,0.45)';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(rx + 5, -250 + 90 + 12 - 4);
      c.quadraticCurveTo(rx + 13, -124, rx - 1, -94 + i * 4);
      c.stroke();
      c.strokeStyle = '#3a2e24';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(rx, -250 + 90 + 12);
      c.quadraticCurveTo(rx + 8, -120, rx - 6, -90 + i * 4);
      c.stroke();
    }
    // windows on the standing half
    c.fillStyle = '#1c1714';
    for (let f = 0; f < 3; f++) for (let i = 0; i < 2; i++) c.fillRect(x0 + 30 + i * 70, -480 + f * 130, 40, 60);
    // the doorway
    c.fillStyle = '#0b0908';
    c.fillRect(X.ruinDoor - 36, -160, 72, 160);
    // the doorway cut through a 28 thick wall: its left jamb
    c.save();
    c.beginPath();
    c.rect(X.ruinDoor - 36, -160, 72, 160);
    c.clip();
    c.fillStyle = '#5a5143';
    c.beginPath();
    c.moveTo(X.ruinDoor - 36, -160);
    c.lineTo(X.ruinDoor - 36 + DEPTH.x * 28, -160 + DEPTH.y * 28);
    c.lineTo(X.ruinDoor - 36 + DEPTH.x * 28, DEPTH.y * 28);
    c.lineTo(X.ruinDoor - 36, 0);
    c.fill();
    c.restore();
  });
  R.surface((c) => {
    c.moveTo(x0, 4);
    c.lineTo(x0, -520);
    c.lineTo(x0 + w * 0.45, -520);
    c.lineTo(x0 + w * 0.6, -430);
    c.lineTo(x0 + w * 0.8, -300);
    c.lineTo(x1, -220);
    c.lineTo(x1, 4);
    c.closePath();
  }, 'concrete', { scale: 1.25, seed: 2 });
  if (cut > 0)
    R.paint((c) => {
      // inside: a dark room and the slab that fell into it, a ramp up to the
      // first floor
      c.globalAlpha = cut;
      c.fillStyle = '#231d18';
      c.fillRect(X.ruinDoor + 36, -250, x1 - X.ruinDoor - 36, 254);
      c.fillStyle = '#4a4034';
      c.beginPath();
      c.moveTo(X.climb[0], 0);
      c.lineTo(X.climb[0], -100);
      c.lineTo(X.climb[1], -104);
      c.lineTo(X.climb[1] + 30, -250);
      c.lineTo(X.climb[1] + 44, -250);
      c.lineTo(X.climb[1] + 10, 0);
      c.fill();
      c.globalAlpha = 1;
    });
}

// Looking down School Street from our sandbags to theirs. `peek` pushes
// the camera in. Ahmad's satchel lies halfway; nothing else of him is shown.
function schoolStreet(R, g, t) {
  const [x0, x1] = X.mouth;
  const xc = (x0 + x1) / 2;
  const vy = -86;
  const at = (k) => ({ s: 1 / (1 + 3.4 * k), x: xc, y: lerp(4, vy, 1 - 1 / (1 + 3.4 * k)) });
  const road = (c) => {
    // far end: the checkpoint in the last of the light
    c.fillStyle = '#5a5058';
    c.fillRect(x0 + 60, vy - 140, x1 - x0 - 120, 150);
    // road, long and flat
    c.fillStyle = '#6f6356';
    c.beginPath();
    c.moveTo(x0, 4);
    c.lineTo(xc - 26, vy);
    c.lineTo(xc + 26, vy);
    c.lineTo(x1, 4);
    c.fill();
    // the centre line, still there
    c.strokeStyle = 'rgba(210,200,170,0.35)';
    c.lineWidth = 2;
    c.setLineDash([14, 18]);
    c.beginPath();
    c.moveTo(xc, 4);
    c.lineTo(xc, vy);
    c.stroke();
    c.setLineDash([]);
    // receding façades
    const side = (edge, dir, col) => {
      c.fillStyle = col;
      c.beginPath();
      c.moveTo(edge, 4);
      c.lineTo(edge, -560);
      c.lineTo(xc + dir * 34, vy - 150);
      c.lineTo(xc + dir * 34, vy);
      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(22,18,16,0.55)';
      for (let i = 0; i < 6; i++) {
        const k = i / 6 + 0.06;
        const wx = lerp(edge, xc + dir * 34, k);
        for (let f = 0; f < 3; f++) {
          const wy = lerp(lerp(-500, vy - 140, k), lerp(-70, vy - 10, k), f / 3 + 0.1);
          c.fillRect(wx - 6 * (1 - k), wy, 12 * (1 - k) + 2, 22 * (1 - k) + 3);
        }
      }
    };
    side(x0, -1, '#7d7064');
    side(x1, 1, '#6c6158');
    // the checkpoint: sandbags, concrete blocks, a flag, a watchtower, a soldier
    const e = at(1);
    c.save();
    c.translate(xc, vy + 2);
    const s = 0.24;
    c.scale(s, s);
    c.fillStyle = '#51483e';
    concreteBlocks(c, -150, 7, 1, '#6a645a');
    c.fillStyle = '#5e5242';
    for (let i = 0; i < 6; i++) {
      c.beginPath();
      c.ellipse(-120 + i * 44, -54, 24, 12, 0, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = '#3a3432';
    c.fillRect(120, -230, 8, 230); // the tower's legs
    c.fillRect(180, -230, 8, 230);
    c.fillRect(110, -270, 90, 44);
    c.fillStyle = '#2a2524';
    c.fillRect(-60, -300, 4, 250); // flagpole
    const wave = Math.sin(t * 2.4) * 4;
    const band = (y, col) => {
      c.fillStyle = col;
      c.beginPath();
      c.moveTo(-56, -300 + y);
      c.quadraticCurveTo(-20, -304 + y + wave, 20, -300 + y);
      c.lineTo(20, -286 + y);
      c.quadraticCurveTo(-20, -290 + y + wave, -56, -286 + y);
      c.fill();
    };
    band(0, '#7a3a36');
    band(14, '#b7b0a2');
    band(28, '#2a2626');
    // a soldier behind the bags: a helmeted silhouette, still
    c.fillStyle = '#2b2a28';
    c.beginPath();
    c.arc(40, -96, 11, Math.PI, 0);
    c.fill();
    c.fillRect(30, -96, 20, 34);
    c.restore();
    void e;
  };
  deepScenery(R, road, [x0, vy - 160, x1, 4], xc, vy, x1 - x0, g.settings.get('dof') || 'bokeh');
  // Ahmad, halfway, under the blanket Um Said put over him: a dark shape
  // at a distance, and nothing more.
  const m = at(0.3);
  R.cast((c) => {
    c.save();
    c.translate(m.x + 20 * m.s, m.y);
    c.scale(m.s * 1.25, m.s * 1.25);
    const rip = Math.sin(t * 1.3) * 1.5;
    c.fillStyle = '#4e4338';
    c.beginPath();
    c.moveTo(-70, 0);
    c.quadraticCurveTo(-66, -18, -40, -20 + rip);
    c.quadraticCurveTo(0, -26, 30, -18 + rip * 0.6);
    c.quadraticCurveTo(62, -16, 72, 0);
    c.closePath();
    c.fill();
    c.fillStyle = 'rgba(0,0,0,0.22)';
    c.fillRect(-60, -6, 128, 6);
    c.restore();
  });
}

// ---------------------------------------------------------------- scene --

function drawStreet(R, g) {
  const t = g.time;
  const a = g.a;
  const k = a.duskK || 0;
  const cx = R.cam.x;
  const near = (x0, x1) => x1 > cx - 1400 && x0 < cx + 1400;

  T.sky(R, skyStops(k), { sun: [0.08, lerp(0.42, 0.72, k)], warmth: clamp(0.8 + k * 0.4), clouds: 0.6, cloudLit: mixc([255, 190, 140], [230, 130, 110], k), cloudShade: mixc([120, 100, 120], [70, 60, 90], k) });
  const stops = skyStops(k);
  horizon(R, {
    haze: rgbOf(stops[stops.length - 1][1]),
    shade: mixc([118, 100, 104], [62, 52, 74], k),
    cloud: mixc([255, 214, 180], [236, 150, 140], k),
    span: 7000,
    seed: 14,
    t,
    lights: clamp((k - 0.3) / 0.4),
    lite: g.settings.get('quality') === 'low',
  });
  T.plume(R, 1600, 60, t, { depth: 0.18, age: 1, height: 360, width: 60, alpha: 0.4, color: [80, 74, 78] });
  T.skyline(R, { depth: 0.32, y: 40, color: mixc([143, 132, 116], [96, 84, 96], k).map(Math.round).reduce((s, v) => s + v.toString(16).padStart(2, '0'), '#'), seed: 19, haze: ['#cfae96', 0.18] });

  // swifts, screaming in loose parties over the rooftops
