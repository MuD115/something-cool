  try {
    localStorage.removeItem(KEY);
  } catch {
    /* nothing to clear */
  }
}

return { freshState, loadSave, writeSave, clearSave };
})();

// ---- src/world/level.js
const __src_world_level = (() => {
// Level geometry and the things in it: solid boxes to stand on and bump
// into, low ceilings that force a crouch or a crawl, interactables with
// bilingual labels, and position triggers.

class Level {
  constructor({ bounds = [0, 10000] } = {}) {
    this.bounds = bounds;
    this.solids = []; // { x0, x1, y0 (top), y1 (bottom), noClimb }
    this.ceilings = []; // { x0, x1, y (underside) }
    this.things = []; // interactables
    this.triggers = [];
  }

  solid(x0, x1, top, bottom = 400, opts = {}) {
    const b = { x0, x1, y0: top, y1: bottom, ...opts };
    this.solids.push(b);
    return b;
  }

  ceiling(x0, x1, y) {
    const c = { x0, x1, y };
    this.ceilings.push(c);
    return c;
  }

  // Highest surface at or below yFrom (feet can't pass through tops).
  groundAt(x, yFrom = -9999) {
    let g = 0;
    for (const b of this.solids) {
      if (x < b.x0 || x > b.x1) continue;
      if (b.y0 >= yFrom - 2 && b.y0 < g) g = b.y0;
    }
    if (yFrom < -9000) {
      // first placement: stand on the highest thing here
      for (const b of this.solids) if (x >= b.x0 && x <= b.x1 && b.y0 < g) g = b.y0;
    }
    return g;
  }

  ceilingAt(x, feetY) {
    let c = -99999;
    for (const k of this.ceilings) {
      if (x < k.x0 || x > k.x1) continue;
      if (k.y < feetY && k.y > c) c = k.y;
    }
    return c;
  }

  // thing: { id, x, y, range, label: [ar, en], enabled(), use() }
  add(thing) {
    this.things.push({ range: 70, y: -120, enabled: () => true, ...thing });
    return thing;
  }

  remove(id) {
    this.things = this.things.filter((t) => t.id !== id);
  }

  // (y: the player's feet; things more than a storey above or below are
  // on another floor)
  nearest(x, y = null) {
    let best = null;
    let bd = Infinity;
    for (const t of this.things) {
      if (!t.enabled()) continue;
      if (y != null && (t.y < y - 260 || t.y > y + 60)) continue;
      // things marked urgent (a scripted action) win over plain examine points
      const d = Math.abs(t.x - x) - (t.urgent ? 1e6 : 0);
      if (Math.abs(t.x - x) < t.range && d < bd) {
        best = t;
        bd = d;
      }
    }
    return best;
  }

  // Fires fn once when the player first passes x (or every time if !once).
  at(x, fn, once = true) {
    this.triggers.push({ x, fn, once, done: false });
  }

  check(px) {
    for (const tr of this.triggers) {
      if (tr.done) continue;
      if (px >= tr.x) {
        tr.done = tr.once;
        tr.fn();
      }
    }
  }
}

// Coroutines for story beats: generators that yield seconds to wait, or a
// predicate to wait on. Driven by game time, so the pause menu stops them.
class Runner {
  constructor() {
    this.tasks = [];
    this.time = 0;
  }

  run(gen) {
    const task = { gen, wait: 0, until: null, done: false };
    this.tasks.push(task);
    this.step(task);
    return task;
  }

  step(task) {
    while (!task.done) {
      if (task.wait > 0 || (task.until && !task.until())) return;
      task.until = null;
      const r = task.gen.next();
      if (r.done) {
        task.done = true;
        return;
      }
      const v = r.value;
      if (typeof v === 'number') task.wait = v;
      else if (typeof v === 'function') task.until = v;
      else if (v && typeof v.next === 'function') {
        // yield another generator: run it to completion first
        const sub = this.run(v);
        task.until = () => sub.done;
      }
    }
  }

  update(dt) {
    this.time += dt;
    for (const t of this.tasks) {
      if (t.done) continue;
      if (t.wait > 0) t.wait -= dt;
      this.step(t);
    }
    this.tasks = this.tasks.filter((t) => !t.done);
  }

  clear() {
    this.tasks = [];
  }
}

return { Level, Runner };
})();

const __src_rigs_shapes = (() => {
// Path helpers for hand-built silhouettes.

// Smooth closed (or open) curve through points, Catmull-Rom → Bézier.
function smoothPath(ctx, pts, closed = true, tension = 1) {
  const n = pts.length;
  const p = (i) => (closed ? pts[(i + n) % n] : pts[Math.min(Math.max(i, 0), n - 1)]);
  ctx.moveTo(pts[0][0], pts[0][1]);
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = p(i - 1);
    const p1 = p(i);
    const p2 = p(i + 1);
    const p3 = p(i + 2);
    const t = tension / 6;
    ctx.bezierCurveTo(
      p1[0] + (p2[0] - p0[0]) * t,
      p1[1] + (p2[1] - p0[1]) * t,
      p2[0] - (p3[0] - p1[0]) * t,
      p2[1] - (p3[1] - p1[1]) * t,
      p2[0],
      p2[1],
    );
  }
  if (closed) ctx.closePath();
}

function fillSmooth(ctx, pts, color) {
  ctx.beginPath();
  smoothPath(ctx, pts, true);
  ctx.fillStyle = color;
  ctx.fill();
}

// A limb segment as a tapered capsule from (x0, y0, w0) to (x1, y1, w1).
function limb(ctx, x0, y0, x1, y1, w0, w1, color) {
  const dx = x1 - x0;
  const dy = y1 - y0;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len;
  const ny = dx / len;
  ctx.beginPath();
  ctx.moveTo(x0 + nx * w0 * 0.5, y0 + ny * w0 * 0.5);
  ctx.lineTo(x1 + nx * w1 * 0.5, y1 + ny * w1 * 0.5);
  ctx.arc(x1, y1, w1 * 0.5, Math.atan2(ny, nx), Math.atan2(ny, nx) + Math.PI, false);
  ctx.lineTo(x0 - nx * w0 * 0.5, y0 - ny * w0 * 0.5);
  ctx.arc(x0, y0, w0 * 0.5, Math.atan2(-ny, -nx), Math.atan2(-ny, -nx) + Math.PI, false);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function shade(hexColor, k) {
  const n = parseInt(hexColor.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) * k);
  const g = Math.min(255, ((n >> 8) & 255) * k);
  const b = Math.min(255, (n & 255) * k);
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

return { smoothPath, fillSmooth, limb, shade };
})();

  wave: { torso: 0.02, head: 0, thighN: 0.06, shinN: 0.02, thighF: -0.07, shinF: -0.07, armN: 2.3, foreN: 2.9, armF: -0.06, foreF: -0.02 },
  binoculars: { torso: 0.05, head: -0.2, thighN: 0.06, shinN: 0.02, thighF: -0.07, shinF: -0.07, armN: 1.3, foreN: 2.4, armF: 1.2, foreF: 2.35 },
  shield: { torso: 0.75, head: -0.2, thighN: 1.1, shinN: -0.3, thighF: 0.8, shinF: -0.5, armN: 1.4, foreN: 1.1, armF: 1.3, foreF: 1.0 },
  grief: { torso: 0.1, head: 0.45, thighN: 0.05, shinN: 0.02, thighF: -0.07, shinF: -0.07, armN: 0.35, foreN: 0.5, armF: 0.1, foreF: 0.2 },
  wallHand: { torso: 0.08, head: 0.3, thighN: 0.05, shinN: 0.02, thighF: -0.07, shinF: -0.07, armN: 1.35, foreN: 1.4, armF: 0.1, foreF: 0.2 },
  mirror: { torso: 0.1, head: -0.05, thighN: 0.25, shinN: -0.2, thighF: -0.1, shinF: -0.1, armN: 1.55, foreN: 1.6, armF: 0.2, foreF: 0.4 },
  lookUp: { torso: -0.05, head: -0.55, thighN: 0.06, shinN: 0.02, thighF: -0.07, shinF: -0.07, armN: 0.06, foreN: 0.12, armF: -0.06, foreF: -0.02 },
  hug: { torso: 0.25, head: 0.2, thighN: 0.9, shinN: -0.6, thighF: 0.6, shinF: -0.9, armN: 1.3, foreN: 1.9, armF: 1.2, foreF: 1.85 },
  sort: { torso: 0.9, head: -0.1, thighN: 1.4, shinN: -0.5, thighF: 1.2, shinF: -0.6, armN: 1.3, foreN: 1.3, armF: 0.9, foreF: 1.0 },
};

// A walking (or running) cycle at phase p (radians, one stride per π).
// Contact, loading, passing and push-off: the stance leg stays long, the
// swing knee folds as it comes through, arms counter-swing with soft elbows.
function walkPose(p, stride = 1, run = 0) {
  const A = (0.44 + run * 0.3) * stride; // hip swing
  const leg = (q) => {
    const th = A * Math.sin(q);
    // knee: folds most as the leg swings through, a little on loading
    const swing = Math.max(0, Math.cos(q + 0.25));
    const load = Math.max(0, Math.sin(q - 1.35)) * 0.14;
    const bend = 0.05 + (0.95 + run * 0.85) * stride * swing * swing + load * stride;
    return [th, th - bend];
  };
  const [tn, sn] = leg(p);
  const [tf, sf] = leg(p + Math.PI);
  const sw = (0.36 + run * 0.4) * stride;
  const armN = -sw * Math.sin(p);
  const armF = sw * Math.sin(p);
  const elbow = 0.2 + run * 1.25;
  return {
    torso: 0.06 + run * 0.2 + 0.015 * Math.cos(2 * p),
    head: -0.03 - run * 0.12 - 0.012 * Math.cos(2 * p),
    thighN: tn,
    shinN: sn,
    thighF: tf,
    shinF: sf,
    armN,
    foreN: armN + elbow + 0.3 * Math.max(0, armN) * (1 + run),
    armF,
    foreF: armF + elbow + 0.3 * Math.max(0, armF) * (1 + run),
  };
}

// Crouched, moving: a low, careful walk. Each leg swings its thigh through
// an arc; while the foot is planted the shin is solved so the foot stays on
// the ground (the body rolls over it), and on the swing the foot lifts and
// comes through with the knee folded. The hips dip on each step, the body
// pitches into it, and the arms counter-swing short and low.
const CROUCH_G = 46; // hip height when crouched
function crouchLeg(q, bob) {
  const th = 1.0 + 0.3 * Math.sin(q);
  const swing = Math.max(0, Math.cos(q)); // thigh coming forward: foot in the air
  const solve = (y) => -Math.acos(clamp((y - L.thigh * Math.cos(th)) / L.shin, -1, 1));
  const ground = CROUCH_G + bob;
  let sh = solve(ground);
  sh = solve(ground - footDrop(sh)); // the heel lifts as the shin sweeps back
  if (swing > 0) sh = solve(ground - footDrop(sh) - 11 * swing) - swing * 0.3; // lift and fold on the swing
  return [th, sh];
}

// Holding still, the crouch is the gait's moment with both feet planted.
{
  const [tn, sn] = crouchLeg(Math.PI / 2, 0);
  const [tf, sf] = crouchLeg((3 * Math.PI) / 2, 0);
  Object.assign(POSES.crouch, { thighN: tn, shinN: sn, thighF: tf, shinF: sf });
}

function crouchWalkPose(p) {
  const c = POSES.crouch;
  const bob = 1.6 * Math.cos(2 * p); // lowest as each foot lands
  const [tn, sn] = crouchLeg(p, bob);
  const [tf, sf] = crouchLeg(p + Math.PI, bob);
  const s = Math.sin(p);
  return {
    ...c,
    torso: c.torso + 0.04 * Math.cos(2 * p) - 0.02,
    head: c.head - 0.03 * Math.cos(2 * p),
    thighN: tn,
    shinN: sn,
    thighF: tf,
    shinF: sf,
    armN: c.armN - 0.22 * s,
    foreN: c.foreN - 0.12 * s,
    armF: c.armF + 0.22 * s,
    foreF: c.foreF + 0.12 * s,
  };
}

// Elbow-and-knee crawl, as soldiers are taught it: flat on the belly, the
// body never lifts. Opposite arm and leg work together: one forearm reaches
// ahead and plants while the other knee slides up along the ground (the
// lower leg folding up behind), then they push and the other pair reaches.
// Every curve is a smooth half-cosine, so nothing snaps at the turn.
function crawlPose(p) {
  const c = POSES.prone;
  const e = (x) => (1 - Math.cos(x)) / 2;
  const reachN = e(p);
  const reachF = e(p + Math.PI);
  return {
    ...c,
    torso: c.torso + 0.03 * Math.sin(2 * p),
    head: c.head + 0.05 * Math.sin(2 * p),
    armN: c.armN - 0.15 + 0.45 * reachN,
    foreN: c.foreN + 0.1 - 0.35 * reachN,
    armF: c.armF - 0.15 + 0.45 * reachF,
    foreF: c.foreF + 0.1 - 0.35 * reachF,
    thighF: c.thighF + 0.3 * reachN,
    shinF: c.shinF - 0.7 * reachN,
    thighN: c.thighN + 0.3 * reachF,
    shinN: c.shinN - 0.7 * reachF,
  };
}

// Climbing stairs, one step per half cycle. Stair ascent asks far more of
// the leading leg than walking: hip flexed about 60° and knee about 95° as
// it lifts to the next tread, the trailing leg straightening to push, the
// body leaning a little forward, the near hand on the rail.
function stairPose(p) {
  const c = POSES.stand;
  const kN = (1 + Math.sin(p)) / 2;
  const kF = 1 - kN;
  return {
    ...c,
    torso: 0.16 + 0.03 * Math.sin(2 * p),
    head: -0.05,
    thighN: lerp(-0.25, 1.05, kN),
    shinN: lerp(-0.3, -0.62, kN) - 0.25 * Math.max(0, Math.cos(p)),
    thighF: lerp(-0.25, 1.05, kF),
    shinF: lerp(-0.3, -0.62, kF) - 0.25 * Math.max(0, -Math.cos(p)),
    armN: 0.95,
    foreN: 1.25,
    armF: 0.25 - 0.2 * Math.sin(p),
    foreF: 0.45,
  };
}

const down = (a) => [Math.sin(a), Math.cos(a)];

// How the foot sits for a given shin angle: a shin swept back lifts the heel
// (the foot rolls onto its ball), a shin reaching forward lands on the heel.
// Positive is heel-up. The drop is how far below the ankle the lowest point
// of the foot then goes, so the hips can be set to keep it on the ground.
// How rounded the back is for a given lean: 0 upright, 1 bent well forward,
// and back to 0 as the body goes flat (prone).
const hunch = (lean) => clamp((lean - 0.2) / 0.45) * clamp((1.3 - lean) / 0.3);

function footRoll(shinA) {
  if (shinA < -0.3) return Math.min(0.8, (-shinA - 0.3) * 0.9);
  if (shinA > 0.2) return -Math.min(0.3, (shinA - 0.2) * 0.6);
  return 0;
}
function footDrop(shinA) {
  const r = footRoll(shinA);
  return r > 0 ? 13 * Math.sin(r) : 6 * Math.sin(-r);
}

// A limb segment as a round-capped stroke: convex at both ends, so joints
// never show a notch where two segments meet.
function seg(ctx, x0, y0, x1, y1, w, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
}

// A tapered limb: wide at the root, narrower at the end, rounded at both
// joints, with the back of it in shade and a thin light edge at the front
// (the figure faces +x in its own space).
function taper(ctx, x0, y0, x1, y1, w0, w1, color, shadeK = 0.16) {
  const dx = x1 - x0;
  const dy = y1 - y0;
  const len = Math.hypot(dx, dy) || 1;
  let nx = -dy / len;
  let ny = dx / len;
  if (nx > 0 || (nx === 0 && ny < 0)) {
    nx = -nx;
    ny = -ny;
  }
  const r0 = w0 / 2;
  const r1 = w1 / 2;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x0 + nx * r0, y0 + ny * r0);
  ctx.lineTo(x1 + nx * r1, y1 + ny * r1);
  ctx.lineTo(x1 - nx * r1, y1 - ny * r1);
  ctx.lineTo(x0 - nx * r0, y0 - ny * r0);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x0, y0, r0, 0, Math.PI * 2);
  ctx.arc(x1, y1, r1, 0, Math.PI * 2);
  ctx.fill();
  if (shadeK <= 0) return;
  // the back of the limb, turned from the light
  ctx.fillStyle = `rgba(0,0,0,${shadeK})`;
  ctx.beginPath();
  ctx.moveTo(x0 + nx * r0, y0 + ny * r0);
  ctx.lineTo(x1 + nx * r1, y1 + ny * r1);
  ctx.lineTo(x1 + nx * r1 * 0.2, y1 + ny * r1 * 0.2);
  ctx.lineTo(x0 + nx * r0 * 0.2, y0 + ny * r0 * 0.2);
  ctx.closePath();
  ctx.fill();
  // and the front edge catching it
  ctx.fillStyle = `rgba(255,255,255,${shadeK * 0.35})`;
  ctx.beginPath();
  ctx.moveTo(x0 - nx * r0, y0 - ny * r0);
  ctx.lineTo(x1 - nx * r1, y1 - ny * r1);
  ctx.lineTo(x1 - nx * r1 * 0.6, y1 - ny * r1 * 0.6);
  ctx.lineTo(x0 - nx * r0 * 0.6, y0 - ny * r0 * 0.6);
  ctx.closePath();
  ctx.fill();
}

class Person {
  constructor(outfit = 'sami', scale = 1) {
    this.o = OUTFITS[outfit] || OUTFITS.man;
    this.scale = scale;
    this.x = 0;
    this.y = 0; // ground level (when grounded) or hip position (when not)
    this.f = 1;
    this.grounded = true;
    this.pose = { ...POSES.stand };
    this.prop = null;
    this.dust = 0; // 0…1 grey dust after shelling
    // Facing: 'side' (profile, the default), 'front' (towards us, out of a
    // side street) or 'back' (away from us, into one). viewK eases 0…1 as
    // the figure turns; the drawing flips through a narrow silhouette.
    this.view = 'side';
    this.viewFrom = 'side';
    this.viewK = 1;
    this.flipK = 1; // a quick pivot when turning round in profile
    this.blink = 0; // > 0 while the eyes are shut
  }

  // Turn to face a new way; the rig animates the turn.
  face(view) {
    if (view === this.view) return;
    this.viewFrom = this.viewK < 0.5 ? this.viewFrom : this.view;
    this.view = view;
    this.viewK = 0;
  }

  // Turning round (left ↔ right) in profile.
  pivot() {
    this.flipK = 0;
  }

  tick(dt) {
    // things that hang (a bag, a pouch, a scarf's end) swing as the body
    // speeds up, slows down and bends, and settle: damped pendulums pushed
    // by the body's acceleration (ax, set by the walker) and its lean
    const lean = this.pose?.torso ?? 0;
    const dLean = dt > 0 ? (lean - (this.lastLean ?? lean)) / dt : 0;
    this.lastLean = lean;
    const push = -(this.ax || 0) * (this.f || 1) * 0.0022 - dLean * 0.35;
    for (const [s, k, c] of [['sw', 38, 5], ['sc', 22, 3.2]]) {
      const p = (this[s] = this[s] || { a: 0, v: 0 });
      p.v += (-k * p.a - c * p.v + push * k * 0.12) * dt;
      p.a = clamp(p.a + p.v * dt, -0.7, 0.7);
    }
    if (this.viewK < 1) this.viewK = Math.min(1, this.viewK + dt * 4);
    if (this.flipK < 1) this.flipK = Math.min(1, this.flipK + dt * 7);
    if (this.blink > 0) this.blink -= dt;
    else if (Math.random() < dt * 0.3) this.blink = 0.13;
  }

  setPose(p) {
    this.pose = { ...POSES.stand, ...p };
  }

  solve() {
    const p = this.pose;
    const j = {};
    const kN = down(p.thighN);
    const kF = down(p.thighF);
    j.kneeN = [kN[0] * L.thigh, kN[1] * L.thigh];
    j.kneeF = [kF[0] * L.thigh, kF[1] * L.thigh];
    const sN = down(p.shinN);
    const sF = down(p.shinF);
    j.footN = [j.kneeN[0] + sN[0] * L.shin, j.kneeN[1] + sN[1] * L.shin];
    j.footF = [j.kneeF[0] + sF[0] * L.shin, j.kneeF[1] + sF[1] * L.shin];
    const up = [Math.sin(p.torso), -Math.cos(p.torso)];
    j.neck = [up[0] * L.torso, up[1] * L.torso];
    j.shoulder = [up[0] * (L.torso - 7), up[1] * (L.torso - 7)];
    // hunched, the shoulders roll forward and the neck comes out of them
    const hs = hunch(p.torso);
    if (hs > 0) {
      const fw = [Math.cos(p.torso), Math.sin(p.torso)];
      j.shoulder = [j.shoulder[0] + fw[0] * 3 * hs, j.shoulder[1] + fw[1] * 3 * hs];
      j.neck = [j.neck[0] + fw[0] * 2.5 * hs, j.neck[1] + fw[1] * 2.5 * hs];
    }
    const ha = p.torso + p.head;
    j.head = [j.neck[0] + Math.sin(ha) * (L.neck + L.head), j.neck[1] - Math.cos(ha) * (L.neck + L.head)];
    const aN = down(p.armN);
    const aF = down(p.armF);
    j.elbowN = [j.shoulder[0] + aN[0] * L.upper, j.shoulder[1] + aN[1] * L.upper];
    j.elbowF = [j.shoulder[0] + aF[0] * L.upper, j.shoulder[1] + aF[1] * L.upper];
    const fN = down(p.foreN);
    const fF = down(p.foreF);
    const lN = L.fore * (p.foreNs ?? 1);
    const lF = L.fore * (p.foreFs ?? 1);
    j.handN = [j.elbowN[0] + fN[0] * lN, j.elbowN[1] + fN[1] * lN];
    j.handF = [j.elbowF[0] + fF[0] * lF, j.elbowF[1] + fF[1] * lF];
    this.local = j;
    return j;
  }

  // Height of the hip above the ground for the current pose.
  hipHeight() {
    const j = this.local || this.solve();
    if (this.pose.seat != null) return this.pose.seat;
    // Lowest of feet, knees and the torso itself, so poses blend smoothly
    // from standing to kneeling to lying flat.
    const h = Math.max(j.footN[1] + footDrop(this.pose.shinN), j.footF[1] + footDrop(this.pose.shinF), j.kneeN[1] + 8, j.kneeF[1] + 8, 12) + 4;
    // lying down, the belly is on the ground whatever the legs are doing (a
    // crawl draws the knees up, and must not lift the body with them)
    const lying = smooth(1.05, 1.45, this.pose.torso ?? 0);
    // (but never so low that a foot still under the body goes into the ground)
    return Math.max(lerp(h, PRONE_HIP, lying), j.footN[1] + footDrop(this.pose.shinN) + 4, j.footF[1] + footDrop(this.pose.shinF) + 4);
  }

  hip() {
    this.local || this.solve();
    if (!this.grounded) return [this.x, this.y];
    return [this.x, this.y - this.hipHeight() * this.scale];
  }

  toWorld(pt) {
    const [hx, hy] = this.hip();
    return [hx + pt[0] * this.f * this.scale, hy + pt[1] * this.scale];
  }

  world(name) {
    this.solve();
    return this.toWorld(this.local[name]);
  }

  // Top of the head in world space (for collision with low ceilings).
  top() {
    const j = this.solve();
    const [, hy] = this.hip();
    return hy + (j.head[1] - L.head) * this.scale;
  }

  draw(ctx) {
    // mid-turn: squeeze to a sliver, then open out into the new view
    const k = this.viewK;
    const shown = k < 0.5 ? this.viewFrom : this.view;
    let squeeze = k < 1 ? Math.max(0.12, Math.abs(Math.cos(k * Math.PI))) : 1;
    if (this.flipK < 1) squeeze *= Math.max(0.25, Math.abs(Math.cos(this.flipK * Math.PI)));
    if (squeeze < 1) {
      const [hx] = this.hip();
      ctx.save();
      ctx.translate(hx, 0);
      ctx.scale(squeeze, 1);
      ctx.translate(-hx, 0);
    }
    if (shown === 'side') this.drawSide(ctx);
    else this.drawFrontBack(ctx, shown === 'front');
    if (squeeze < 1) ctx.restore();
  }

  colours() {
    const o = this.o;
    const dusty = (c) => (this.dust > 0 && c ? mixHex(c, '#8a857c', this.dust * 0.55) : c);
    return {
      dusty,
      top: dusty(o.top),
      trousers: dusty(o.trousers),
      layer: o.layer ? dusty(o.layer.color) : null,
      hair: dusty(o.hair),
      beard: dusty(o.beardColor || o.hair),
      head: dusty(o.headColor || '#444444'),
    };
  }

  // ------------------------------------------------------------ profile --

  drawSide(ctx) {
    const j = this.solve();
    const [hx, hy] = this.hip();
    const o = this.o;
    const p = this.pose;
    const C = this.colours();
    ctx.save();
    ctx.translate(hx, hy);
    ctx.scale(this.f * this.scale, this.scale);

    const far = (c) => shade(c, 0.66);
    const sleeveCol = C.layer && o.layer.kind !== 'vest' ? C.layer : C.top;
    const longCoat = o.layer?.kind === 'coat';

    if (o.satchel) {
      // bag hangs behind the hip on the far side, swinging from its strap
      ctx.save();
      ctx.translate(-12, -8);
      ctx.rotate(this.sw?.a || 0);
      ctx.fillStyle = shade(o.satchel, 0.8);
      roundRect(ctx, -9, 0, 18, 21, 3);
      ctx.fill();
      ctx.restore();
    }
    this.arm(ctx, j.shoulder, j.elbowF, j.handF, far(sleeveCol), o.skin, far(o.skin), false);
    this.leg(ctx, j.kneeF, j.footF, p.shinF, far(C.trousers), far(o.shoes), far(o.skin), true);

    if (o.robe || longCoat) {
      // a jalabiya or long coat: a skirt from the hip that follows the legs
      const kn = j.kneeN;
      const kf = j.kneeF;
      const fn = j.footN;
      const ff = j.footF;
      const bottom = Math.max(fn[1], ff[1]) - (o.robe ? 7 : 16);
      ctx.beginPath();
      ctx.moveTo(-12, -4);
      ctx.lineTo(12, -4);
      ctx.lineTo(Math.max(kn[0], kf[0]) + 10, Math.max(kn[1], kf[1]));
      ctx.lineTo(Math.max(fn[0], ff[0]) + 6, bottom);
      ctx.lineTo(Math.min(fn[0], ff[0]) - 8, bottom + 2);
      ctx.lineTo(Math.min(kn[0], kf[0]) - 12, Math.max(kn[1], kf[1]));
      ctx.closePath();
      ctx.fillStyle = longCoat ? C.layer : C.top;
      ctx.fill();
      // a fold or two
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(2, 4);
      ctx.lineTo((kn[0] + fn[0]) / 2, bottom - 6);
      ctx.stroke();
    }
    this.leg(ctx, j.kneeN, j.footN, p.shinN, o.robe ? C.top : C.trousers, o.shoes, o.skin, false);

    // torso
    const up = [Math.sin(p.torso), -Math.cos(p.torso)];
    const side = [Math.cos(p.torso), Math.sin(p.torso)];
    const at = (d, s) => [up[0] * d + side[0] * s, up[1] * d + side[1] * s];
    const w = o.baggy ? 14 : 11.5;
    const torsoPath = () => {
      ctx.beginPath();
      const pts = [at(o.baggy ? -10 : -4, -w), at(o.baggy ? -10 : -2, w), at(L.torso - 15, w + 1.5), at(L.torso - 3, 9), at(L.torso, -3)];
      ctx.moveTo(...pts[0]);
      for (const q of pts.slice(1)) ctx.lineTo(...q);
      // the back: straight when upright, rounding into a curve as he bends
      // forward (upper back humped, shoulders rolled), flat again lying down
      const h = hunch(p.torso);
      ctx.lineTo(...at(L.torso - 6, -11 - 2 * h));
      ctx.quadraticCurveTo(...at(L.torso * 0.5, -w - 0.5 - 7 * h), ...at(6, -w - 1.5 * h));
      ctx.closePath();
    };
    torsoPath();
    ctx.fillStyle = C.top;
    ctx.fill();
    ctx.save();
    torsoPath();
    ctx.clip();
    if (o.pattern) this.pattern(ctx, o, -30, -L.torso - 10, 60, L.torso + 14, p.torso);
    // form: the back of the body in shadow
    const g = ctx.createLinearGradient(...at(20, -w), ...at(20, w));
    g.addColorStop(0, 'rgba(0,0,0,0.22)');
    g.addColorStop(0.55, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(255,255,255,0.05)');
    ctx.fillStyle = g;
    ctx.fillRect(-40, -80, 80, 100);
    // layers over the shirt
    if (o.layer) this.layerSide(ctx, o, C, at, w);
    ctx.restore();
    // collar line and placket
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(...at(L.torso - 3, 8));
    ctx.lineTo(...at(4, 9.5));
    ctx.stroke();
    if (o.belt) {
      ctx.strokeStyle = o.belt;
      ctx.lineWidth = 3.4;
      ctx.beginPath();
      ctx.moveTo(...at(3, -w - 0.5));
      ctx.lineTo(...at(4, w + 0.5));
      ctx.stroke();
      ctx.fillStyle = '#9a8c6a';
      const b = at(4, w - 1);
      ctx.fillRect(b[0] - 1.5, b[1] - 2, 3, 4);
      if (o.pouch) {
        ctx.fillStyle = shade(o.belt, 1.15);
        const q = at(0, -w + 1);
        ctx.save();
        ctx.translate(q[0], q[1]);
        ctx.rotate((this.sw?.a || 0) * 0.6);
        roundRect(ctx, -5, 0, 9, 10, 2);
        ctx.fill();
        ctx.restore();
      }
    }
    if (o.satchel) {
      ctx.strokeStyle = shade(o.satchel, 0.9);
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(...at(L.torso - 4, -9));
      ctx.lineTo(...at(6, 11));
      ctx.stroke();
    }

    // head and neck
    const ha = p.torso + p.head;
    const [hdx, hdy] = j.head;
    limb(ctx, j.neck[0], j.neck[1] + 3, hdx - Math.sin(ha) * 4, hdy + Math.cos(ha) * 5, 8, 7.5, shade(o.skin, 0.93));
    if (o.keffiyeh === 'shoulders' || o.scarf) this.scarfSide(ctx, o, at);
    ctx.save();
    ctx.translate(hdx, hdy);
    ctx.rotate(ha);
    this.headSide(ctx, o, C);
    ctx.restore();

    this.arm(ctx, j.shoulder, j.elbowN, j.handN, sleeveCol, o.skin, o.skin, true);
    if (this.prop) this.prop(ctx, j.handN, j.handF);
    ctx.restore();
  }

  // A vest, sweater, jacket or coat over the shirt, clipped to the torso.
  layerSide(ctx, o, C, at, w) {
    const k = o.layer.kind;
    ctx.fillStyle = C.layer;
    if (k === 'vest') {
      // open at the front, cut away at the arm
      ctx.beginPath();
      const pts = [at(-6, -w - 2), at(-6, w - 2), at(L.torso - 22, w - 1), at(L.torso - 10, 3), at(L.torso - 4, -4), at(L.torso - 10, -12), at(14, -w - 2)];
      ctx.moveTo(...pts[0]);
      for (const q of pts.slice(1)) ctx.lineTo(...q);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(...at(L.torso - 22, w - 1));
      ctx.lineTo(...at(-5, w - 2));
      ctx.stroke();
    } else if (k === 'sweater') {
      ctx.fillRect(-40, -80, 80, 100);
      ctx.fillStyle = 'rgba(0,0,0,0.14)';
      const hem = at(0, 0);
      ctx.fillRect(hem[0] - 30, hem[1] - 4, 60, 4);
    } else {
      // jacket or coat: covers the body, a strip of shirt at the open front
      ctx.fillRect(-40, -80, 80, 100);
      ctx.fillStyle = C.top;
      ctx.beginPath();
      const a0 = at(L.torso - 4, 6);
      const a1 = at(L.torso - 14, w + 2);
      const a2 = at(-6, w + 2);
      const a3 = at(-6, w - 3);
      ctx.moveTo(...a0);
      ctx.lineTo(...a1);
      ctx.lineTo(...a2);
      ctx.lineTo(...a3);
      ctx.closePath();
      ctx.fill();
      // lapel
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(...at(L.torso - 3, 3));
      ctx.lineTo(...at(L.torso - 18, w - 3));
      ctx.lineTo(...at(-6, w - 3));
      ctx.stroke();
    }
  }

  // Stripes or a check, drawn in torso space (clipped by the caller).
  pattern(ctx, o, x0, y0, w, h, lean) {
    ctx.save();
    ctx.rotate(lean);
    ctx.strokeStyle = o.patternColor || 'rgba(255,255,255,0.3)';
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = o.pattern === 'stripe' ? 2.2 : 1;
    ctx.beginPath();
    for (let y = y0; y < y0 + h; y += o.pattern === 'stripe' ? 6 : 5) {
      ctx.moveTo(x0, y);
      ctx.lineTo(x0 + w, y);
    }
    if (o.pattern === 'camo') {
      // blotches, not lines: the same every frame
      ctx.stroke();
      ctx.beginPath();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = o.patternColor;
      for (let i = 0; i < 9; i++) {
        const bx = x0 + ((i * 37) % 97) / 97 * w;
        const by = y0 + ((i * 53) % 89) / 89 * h;
        ctx.moveTo(bx + 5, by);
        ctx.ellipse(bx, by, 5 + (i % 3) * 2, 3 + (i % 2) * 2, i, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.restore();
      return;
    }
    if (o.pattern === 'check') {
      for (let x = x0; x < x0 + w; x += 5) {
        ctx.moveTo(x, y0);
        ctx.lineTo(x, y0 + h);
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  // A keffiyeh over the shoulders, or a scarf: soft cloth round the neck,
  // one end down the back, one hanging in front, with a fringe.
  scarfSide(ctx, o, at) {
    const kef = o.keffiyeh === 'shoulders';
    const col = kef ? '#e6e0d3' : o.scarf;
    ctx.fillStyle = col;
    // round the neck
    ctx.beginPath();
    ctx.moveTo(...at(L.torso + 1, -7));
    ctx.quadraticCurveTo(...at(L.torso + 4, 2), ...at(L.torso, 9));
    ctx.lineTo(...at(L.torso - 7, 8));
    ctx.quadraticCurveTo(...at(L.torso - 3, 0), ...at(L.torso - 6, -8));
    ctx.closePath();
    ctx.fill();
    // the end down the back, lifting and swinging as he moves
    const piv = at(L.torso - 1, -8);
    ctx.save();
    ctx.translate(piv[0], piv[1]);
    ctx.rotate(-(this.sc?.a || 0) * 0.8);
    ctx.translate(-piv[0], -piv[1]);
    ctx.beginPath();
    ctx.moveTo(...at(L.torso - 1, -8));
    ctx.quadraticCurveTo(...at(L.torso - 14, -14), ...at(L.torso - 30, -12));
    ctx.lineTo(...at(L.torso - 30, -6));
    ctx.quadraticCurveTo(...at(L.torso - 14, -7), ...at(L.torso - 6, -2));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    // the end hanging in front
    ctx.beginPath();
    ctx.moveTo(...at(L.torso - 4, 7));
    ctx.lineTo(...at(L.torso - 24, 10));
    ctx.lineTo(...at(L.torso - 24, 5));
    ctx.lineTo(...at(L.torso - 6, 2));
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = kef ? 'rgba(120,30,30,0.45)' : 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    for (const [d, s0, s1] of [[L.torso - 30, -12, -6], [L.torso - 24, 5, 10]]) {
      for (let i = 0; i < 4; i++) {
        const q = at(d - 1, s0 + ((s1 - s0) * i) / 3);
        ctx.moveTo(...q);
        ctx.lineTo(q[0], q[1] + 3); // fringe
      }
    }
    if (kef) {
      ctx.moveTo(...at(L.torso - 10, -11));
      ctx.lineTo(...at(L.torso - 22, -11));
      ctx.moveTo(...at(L.torso - 12, 8));
      ctx.lineTo(...at(L.torso - 20, 8));
    }
    ctx.stroke();
  }

  // The head in profile, facing +x, centred on the skull.
  headSide(ctx, o, C) {
    const hr = L.head;
    const skin = o.skin;
    if (o.headwear === 'hijab') {
      ctx.beginPath();
      ctx.ellipse(-2, -1, hr * 1.12, hr * 1.25, 0, 0, Math.PI * 2);
      ctx.fillStyle = C.head;
      ctx.fill();
      // drape to the shoulders
      ctx.beginPath();
      ctx.moveTo(-12, 0);
      ctx.quadraticCurveTo(-16, 18, -6, 26);
      ctx.lineTo(8, 22);
      ctx.lineTo(5, 8);
      ctx.fill();
      // the face in its opening
      this.faceSide(ctx, hr, skin, true);
      this.eyeSide(ctx, hr, o, C);
      return;
    }
    // skull, then the face and jaw
    ctx.beginPath();
    ctx.ellipse(-hr * 0.08, -hr * 0.08, hr * 0.96, hr * 1.0, 0, 0, Math.PI * 2);
    ctx.fillStyle = skin;
    ctx.fill();
    this.faceSide(ctx, hr, skin, false);
    // ear
    ctx.beginPath();
    ctx.ellipse(-hr * 0.22, hr * 0.12, 2.2, 3.4, 0.15, 0, Math.PI * 2);
    ctx.fillStyle = shade(skin, 0.86);
    ctx.fill();
    this.hairSide(ctx, o, C, hr);
    this.beardSide(ctx, o, C, hr);
    this.eyeSide(ctx, hr, o, C);
    this.hatSide(ctx, o, C, hr);
    if (o.glasses) {
      ctx.strokeStyle = 'rgba(20,18,16,0.85)';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.ellipse(hr * 0.62, -hr * 0.1, 2.6, 2.2, 0, 0, Math.PI * 2);
      ctx.moveTo(hr * 0.36, -hr * 0.14);
      ctx.lineTo(-hr * 0.15, -hr * 0.05);
      ctx.stroke();
    }
  }

  // Brow, nose, lips and chin in profile.
  faceSide(ctx, hr, skin, veiled) {
    ctx.beginPath();
    ctx.moveTo(hr * 0.15, -hr * 0.92);
    ctx.quadraticCurveTo(hr * 0.78, -hr * 0.78, hr * 0.84, -hr * 0.3); // forehead
    ctx.lineTo(hr * 0.8, -hr * 0.12); // brow ridge
    ctx.lineTo(hr * 1.12, hr * 0.3); // nose tip
    ctx.lineTo(hr * 0.86, hr * 0.42); // under the nose
    ctx.lineTo(hr * 0.92, hr * 0.56); // upper lip
    ctx.lineTo(hr * 0.82, hr * 0.64); // mouth
    ctx.lineTo(hr * 0.88, hr * 0.76); // lower lip
    ctx.quadraticCurveTo(hr * 0.84, hr * 1.02, hr * 0.5, hr * 1.06); // chin
    ctx.quadraticCurveTo(hr * 0.02, hr * 1.02, -hr * 0.34, hr * 0.62); // jaw
    ctx.lineTo(-hr * 0.2, 0);
    ctx.closePath();
    ctx.fillStyle = skin;
    ctx.fill();
    // nostril and mouth line
    ctx.fillStyle = shade(skin, 0.7);
    ctx.fillRect(hr * 0.86, hr * 0.33, 1.2, 0.9);
    ctx.fillStyle = shade(skin, 0.62);
    ctx.fillRect(hr * 0.66, hr * 0.63, hr * 0.2, 0.8);
    if (veiled) return;
  }

  eyeSide(ctx, hr, o, C) {
    // brow and eye (blinking now and then)
    ctx.strokeStyle = shade(o.hairStyle === 'bald' || !o.hair ? '#6a5a4a' : o.hair.startsWith('#') ? o.hair : '#2a2018', 0.9);
    ctx.lineWidth = 0.9;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(hr * 0.4, -hr * 0.33);
    ctx.quadraticCurveTo(hr * 0.62, -hr * 0.4, hr * 0.8, -hr * 0.3);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(22,16,12,0.85)';
    if (this.blink > 0) ctx.fillRect(hr * 0.48, -hr * 0.14, 3, 0.9);
    else {
      ctx.beginPath();
      ctx.ellipse(hr * 0.6, -hr * 0.12, 1.25, 1.05, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  hairSide(ctx, o, C, hr) {
    const s = o.hairStyle || 'short';
    ctx.fillStyle = C.hair;
    if (s === 'bald') {
      // a horseshoe of hair round the back and above the ear
      ctx.beginPath();
      ctx.moveTo(-hr * 0.35, -hr * 0.25);
      ctx.quadraticCurveTo(-hr * 0.95, -hr * 0.55, -hr * 1.02, 0);
      ctx.quadraticCurveTo(-hr * 0.98, hr * 0.5, -hr * 0.68, hr * 0.62);
      ctx.lineTo(-hr * 0.42, hr * 0.3);
      ctx.quadraticCurveTo(-hr * 0.55, 0, -hr * 0.35, -hr * 0.25);
      ctx.fill();
      return;
    }
    const front = s === 'receding' ? hr * 0.05 : s === 'sidepart' ? hr * 0.62 : hr * 0.5;
    const topY = s === 'buzz' ? -hr * 1.05 : s === 'curly' ? -hr * 1.22 : s === 'sidepart' ? -hr * 1.18 : -hr * 1.13;
    if (s === 'buzz') ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(front, -hr * (s === 'receding' ? 0.95 : 0.72));
    ctx.quadraticCurveTo(hr * 0.35, topY, -hr * 0.2, topY + hr * 0.02);
    ctx.quadraticCurveTo(-hr * 0.95, topY + hr * 0.1, -hr * 1.06, -hr * 0.1);
    ctx.quadraticCurveTo(-hr * 1.02, hr * 0.42, -hr * 0.72, hr * 0.6); // nape
    ctx.lineTo(-hr * 0.46, hr * 0.28); // behind the ear
    ctx.quadraticCurveTo(-hr * 0.5, -hr * 0.2, -hr * 0.1, -hr * 0.18);
    if (s !== 'receding') {
      ctx.lineTo(hr * 0.02, hr * 0.26); // sideburn
      ctx.lineTo(hr * 0.14, hr * 0.22);
      ctx.lineTo(hr * 0.16, -hr * 0.4); // temple
    }
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    if (s === 'curly') {
      for (let i = 0; i < 7; i++) {
        const a = Math.PI * (1.05 + i * 0.14);
        ctx.beginPath();
        ctx.arc(-hr * 0.2 + Math.cos(a) * hr * 0.95, -hr * 0.2 + Math.sin(a) * hr * 0.98, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    if (s === 'sidepart') {
      // a little lift at the front, and a lighter parting line
      ctx.strokeStyle = shade(o.hair, 1.4);
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(hr * 0.3, -hr * 1.05);
      ctx.quadraticCurveTo(-hr * 0.2, -hr * 1.0, -hr * 0.7, -hr * 0.78);
      ctx.stroke();
    }
    if (s === 'ponytail' || s === 'braid') {
      ctx.strokeStyle = C.hair;
      ctx.lineCap = 'round';
      ctx.lineWidth = s === 'braid' ? 3.2 : 4.2;
      ctx.beginPath();
      ctx.moveTo(-hr * 0.95, -hr * 0.25);
      ctx.quadraticCurveTo(-hr * 1.7, hr * 0.5, -hr * 1.35, s === 'braid' ? hr * 2.2 : hr * 1.3);
      ctx.stroke();
      ctx.fillStyle = '#8a3a3a';
      ctx.fillRect(-hr * 1.1, -hr * 0.22, 2.5, 2.5); // the hair tie
    }
  }

  beardSide(ctx, o, C, hr) {
    const b = o.beard || 'none';
    if (b === 'none') return;
    const col = C.beard;
    const jaw = (bottom, chinX = 0.84) => {
      ctx.beginPath();
      ctx.moveTo(-hr * 0.08, hr * 0.2); // from the sideburn
      ctx.lineTo(hr * 0.5, hr * 0.44); // cheek
      ctx.lineTo(hr * 0.66, hr * 0.44);
      ctx.lineTo(hr * 0.94, hr * 0.5); // round the mouth
      ctx.lineTo(hr * 0.9, hr * 0.62);
      ctx.lineTo(hr * 0.72, hr * 0.66);
      ctx.lineTo(hr * 0.9, hr * 0.74);
      ctx.quadraticCurveTo(hr * chinX + 0.1 * hr, hr * bottom, hr * 0.42, hr * (bottom + 0.06));
      ctx.quadraticCurveTo(-hr * 0.05, hr * (bottom - 0.08), -hr * 0.36, hr * 0.62);
      ctx.closePath();
    };
    if (b === 'stubble') {
      jaw(1.06);
      ctx.fillStyle = 'rgba(38,28,22,0.32)';
      ctx.fill();
      return;
    }
    ctx.fillStyle = col;
    if (b === 'short' || b === 'full') {
      jaw(b === 'full' ? 1.32 : 1.14);
      ctx.fill();
    } else if (b === 'long') {
      ctx.beginPath();
      ctx.moveTo(-hr * 0.08, hr * 0.2);
      ctx.lineTo(hr * 0.94, hr * 0.5);
      ctx.lineTo(hr * 0.92, hr * 0.62);
      ctx.lineTo(hr * 0.72, hr * 0.66);
      ctx.lineTo(hr * 0.95, hr * 0.8);
      ctx.quadraticCurveTo(hr * 0.9, hr * 1.5, hr * 0.5, hr * 1.95);
      ctx.quadraticCurveTo(hr * 0.1, hr * 1.4, -hr * 0.36, hr * 0.62);
      ctx.closePath();
      ctx.fill();
    } else if (b === 'goatee') {
      ctx.beginPath();
      ctx.moveTo(hr * 0.66, hr * 0.44);
      ctx.lineTo(hr * 0.94, hr * 0.5);
      ctx.lineTo(hr * 0.9, hr * 0.6);
      ctx.lineTo(hr * 0.74, hr * 0.64);
      ctx.lineTo(hr * 0.9, hr * 0.74);
      ctx.quadraticCurveTo(hr * 0.92, hr * 1.2, hr * 0.55, hr * 1.18);
      ctx.lineTo(hr * 0.56, hr * 0.7);
      ctx.closePath();
      ctx.fill();
    } else if (b === 'chinstrap') {
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-hr * 0.1, hr * 0.22);
      ctx.quadraticCurveTo(-hr * 0.05, hr * 0.95, hr * 0.5, hr * 1.1);
      ctx.quadraticCurveTo(hr * 0.84, hr * 1.02, hr * 0.86, hr * 0.8);
      ctx.stroke();
    }
    if (b === 'moustache' || b === 'thickMoustache' || b === 'full' || b === 'short' || b === 'long' || b === 'goatee') {
      ctx.fillStyle = col;
      ctx.beginPath();
      const thick = b === 'thickMoustache' ? 1.6 : 1;
      ctx.moveTo(hr * 0.6, hr * 0.44);
      ctx.lineTo(hr * 0.95, hr * 0.46);
      ctx.lineTo(hr * 0.95, hr * (0.5 + 0.1 * thick));
      ctx.lineTo(hr * 0.68, hr * (0.52 + 0.14 * thick));
      ctx.closePath();
      ctx.fill();
    }
  }

  hatSide(ctx, o, C, hr) {
    const h = o.headwear;
    if (!h) return;
    ctx.fillStyle = C.head;
    if (h === 'kufi') {
      ctx.beginPath();
      ctx.ellipse(-hr * 0.15, -hr * 0.62, hr * 0.94, hr * 0.5, -0.1, Math.PI, 0);
      ctx.fill();
    } else if (h === 'cap') {
      // flat cap: a soft crown pulled forward, a short brim
      ctx.beginPath();
      ctx.moveTo(-hr * 1.02, -hr * 0.3);
      ctx.quadraticCurveTo(-hr * 0.9, -hr * 1.2, hr * 0.2, -hr * 1.08);
      ctx.quadraticCurveTo(hr * 0.9, -hr * 0.95, hr * 1.12, -hr * 0.56);
      ctx.lineTo(hr * 0.72, -hr * 0.52);
      ctx.lineTo(-hr * 1.0, -hr * 0.18);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(hr * 0.55, -hr * 0.6, hr * 0.55, 1.2);
    } else if (h === 'beanie') {
      ctx.beginPath();
      ctx.moveTo(-hr * 1.04, -hr * 0.2);
      ctx.quadraticCurveTo(-hr * 1.0, -hr * 1.22, hr * 0.1, -hr * 1.18);
      ctx.quadraticCurveTo(hr * 0.86, -hr * 1.05, hr * 0.84, -hr * 0.42);
      ctx.lineTo(-hr * 1.04, -hr * 0.2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(-hr * 1.04, -hr * 0.55, hr * 1.9, 3); // the fold

    }
  }

  // ----------------------------------------------------- front and back --

  // Facing us or facing away. The same pose drives it: the side view's
  // vertical extents of knees, feet, elbows and hands foreshorten naturally.
  drawFrontBack(ctx, front) {
    const j = this.solve();
    const [hx, hy] = this.hip();
    const o = this.o;
    const p = this.pose;
    const C = this.colours();
    const sleeveCol = C.layer && o.layer.kind !== 'vest' ? C.layer : C.top;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.scale(this.scale, this.scale);
    const wide = o.baggy ? 15 : 12.5;
    const sy = j.shoulder[1];
    const ny = j.neck[1];
    const stroke = (pts, w, color) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = w;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(...pts[0]);
      for (const q of pts.slice(1)) ctx.lineTo(...q);
      ctx.stroke();
    };
    const leg = (side, knee, foot, cloth) => {
      const x0 = side * 6.5;
      const kx = x0 + side * 1.2;
      const fy = Math.max(knee[1] + 8, foot[1]);
      stroke([[x0, 0], [kx, Math.max(9, knee[1])], [x0, fy]], 12, cloth);
      if (o.footwear === 'sandal') {
        ctx.fillStyle = o.skin;
        ctx.beginPath();
        ctx.ellipse(x0, fy + 2, 5, 3.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = o.shoes;
        ctx.fillRect(x0 - 5, fy + 4, 10, 1.8);
      } else {
        ctx.fillStyle = o.shoes;
        ctx.beginPath();
        ctx.ellipse(x0, fy + 2, 6, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    };
    const nFirst = j.footN[1] < j.footF[1];
    const legs = [
      [-1, j.kneeN, j.footN],
      [1, j.kneeF, j.footF],
    ];
    if (!nFirst) legs.reverse();
    for (const [side, kn, ft] of legs) leg(side, kn, ft, o.robe ? shade(o.top, 0.9) : C.trousers);
    if (o.robe || o.layer?.kind === 'coat') {
      const bottom = Math.max(j.footN[1], j.footF[1]) - (o.robe ? 6 : 16);

  ctx.arcTo(x, y, x + w, y, r);

    });
  }

  torchLight() {

      y: hy - 4,

  render(time) {
    const R = this.R;
    R.cam.time = time;
    R.cam.set({ x: this.cam.x, y: this.cam.y, view: this.cam.view, shake: this.shake });

        c.fillStyle = r() < 0.5 ? 'rgba(255,244,225,0.10)' : 'rgba(120,96,80,0.10)';
        const pf = Math.floor(r() * floors);
        c.fillRect(x + r() * w * 0.8, -pf * fh - fh, w * (0.15 + r() * 0.25), fh);
      }
      // the wall's material, over its colour
      textureWall(c, mat, { seed: matSeed });
      // bleached by sun at the top, dirtier towards the street
      const bleach = c.createLinearGradient(0, top, 0, 0);
      bleach.addColorStop(0, 'rgba(255,248,236,0.10)');
      bleach.addColorStop(0.6, 'rgba(255,248,236,0)');
      bleach.addColorStop(1, 'rgba(50,38,28,0.14)');
      c.fillStyle = bleach;
      c.fillRect(x, top, w, H);

      // weathering: sun-bleached and dirty render, patched repairs, cracks
      c.fillStyle = 'rgba(60,50,40,0.08)';
      for (let i = 0; i < 12; i++) c.fillRect(x + r() * w, top, 2 + r() * 10, H);
      // (the fine texture is drawn once per building and reused every frame)
      c.drawImage(weathering(w, H, seed), x, top);
      for (let f = 0; f <= floors; f++) {
        const sy = -f * fh - 6;
        c.fillStyle = 'rgba(40,32,26,0.22)';
        c.fillRect(x, sy, w, 8);
        c.fillStyle = 'rgba(255,246,230,0.16)';
        c.fillRect(x, sy, w, 1.5);
        const under = c.createLinearGradient(0, sy + 8, 0, sy + 22);
        under.addColorStop(0, 'rgba(30,22,16,0.22)');
        under.addColorStop(1, 'rgba(30,22,16,0)');
        c.fillStyle = under;
        c.fillRect(x, sy + 8, w, 14);
      }

      // windows (and on the ground floor, a door or two)
      const cols = Math.max(2, Math.round(w / 110));
      const doorCols = spec.shopFront || spec.noDoors ? new Map() : pickDoors(cols, seed);
      const ww = Math.min(58, (w / cols) * 0.5);
      const wh = fh * 0.46;
      for (let f = 0; f < floors; f++) {
        for (let k = 0; k < cols; k++) {
          const wx = x + ((k + 0.5) * w) / cols - ww / 2;
          const wy = -f * fh - fh * 0.72;
          const kind = r();
          if (f === 0 && spec.shopFront) continue;
          if (f === 0 && doorCols.has(k)) {
            const dw = Math.min(74, (w / cols) * 0.62);
            syrianDoor(c, x + ((k + 0.5) * w) / cols, dw, fh * 0.8, doorCols.get(k), seed * 7 + k);
            recess.push({ rect: [x + ((k + 0.5) * w) / cols - dw / 2, -fh * 0.8, dw, fh * 0.8], door: true });
            continue;
          }
          if (kind < 0.12) {
            // blown out: ragged dark hole
            c.fillStyle = '#1b1612';
            c.beginPath();
            const jag = [[wx - 6, wy - 3], [wx + ww * 0.3, wy - 9], [wx + ww * 0.55, wy - 2], [wx + ww + 7, wy - 6], [wx + ww + 3, wy + wh * 0.5], [wx + ww + 8, wy + wh + 6], [wx + ww * 0.5, wy + wh + 3], [wx - 5, wy + wh + 9], [wx - 2, wy + wh * 0.4]];
            c.moveTo(...jag[0]);
            const poly = [jag[0]];
            for (const q of jag.slice(1)) {
              const pt = [q[0] + (r() - 0.5) * 5, q[1] + (r() - 0.5) * 5];
              poly.push(pt);
              c.lineTo(...pt);
            }
            c.closePath();
            c.fill();
            recess.push({ poly });
          } else {
            c.fillStyle = kind < 0.55 ? '#211b17' : '#2b241f';
            c.fillRect(wx, wy, ww, wh);
            recess.push({ rect: [wx, wy, ww, wh], sill: true });
            // the depth of the wall: a lit jamb, a shadowed one, the lintel's shade
            c.fillStyle = 'rgba(190,176,152,0.55)';
            c.fillRect(wx, wy, 4, wh);
            c.fillStyle = 'rgba(12,9,7,0.5)';
            c.fillRect(wx + ww - 5, wy, 5, wh);
            c.fillRect(wx, wy, ww, 6);
            // a pale frame and a stone sill
            c.strokeStyle = 'rgba(235,225,205,0.28)';
            c.lineWidth = 2;
            c.strokeRect(wx - 1, wy - 1, ww + 2, wh + 2);
            c.fillStyle = 'rgba(0,0,0,0.25)';
            c.fillRect(wx - 3, wy + wh, ww + 6, 4); // sill shadow
            c.fillStyle = 'rgba(230,220,200,0.35)';
            c.fillRect(wx - 5, wy + wh - 1, ww + 10, 3);
            // rain has run down from the sill for years
            const st = c.createLinearGradient(0, wy + wh, 0, wy + wh + 50);
            st.addColorStop(0, 'rgba(60,50,40,0.16)');
            st.addColorStop(1, 'rgba(60,50,40,0)');
            c.fillStyle = st;
            c.fillRect(wx + ww * 0.15, wy + wh + 2, ww * 0.7, 50);
            const extra = r();
            if (kind <= 0.55 && extra < 0.3) {
              // a curtain still hanging, drawn half across
              c.fillStyle = ['#7a5a48', '#5a6a6e', '#8a7a5a', '#6a4a5a'][Math.floor(r() * 4)];
              c.globalAlpha = 0.8;
              c.fillRect(wx + 2, wy + 2, ww * (0.3 + r() * 0.3), wh - 4);
              c.globalAlpha = 1;
            } else if (kind <= 0.55 && extra < 0.5) {
              // the last of the glass, catching the sky
              c.fillStyle = 'rgba(160,180,200,0.18)';
              c.beginPath();
              c.moveTo(wx, wy);
              c.lineTo(wx + ww * 0.6, wy);
              c.lineTo(wx, wy + wh * 0.7);
              c.fill();
            } else if (f === 0 && extra < 0.75) {
              // ground-floor grille
              c.strokeStyle = 'rgba(30,26,22,0.8)';
              c.lineWidth = 1.5;
              c.beginPath();
              for (let gx = wx + 6; gx < wx + ww; gx += 8) {
                c.moveTo(gx, wy);
                c.lineTo(gx, wy + wh);
              }
              c.stroke();
            }
            if (kind > 0.7) {
              // closed shutter, some slats missing
              c.fillStyle = spec.shutter || '#7a6a55';
              c.fillRect(wx, wy, ww, wh * (0.4 + r() * 0.6));
              c.fillStyle = 'rgba(0,0,0,0.2)';
              for (let s = wy + 4; s < wy + wh * 0.9; s += 6) c.fillRect(wx, s, ww, 1.5);
            } else if (kind > 0.55) {
              // plastic sheet over the window, sagging
              c.fillStyle = 'rgba(180,190,200,0.35)';
              c.beginPath();
              c.moveTo(wx, wy);
              c.lineTo(wx + ww, wy);
              c.lineTo(wx + ww, wy + wh);
              c.quadraticCurveTo(wx + ww / 2, wy + wh - 10, wx, wy + wh);
              c.fill();
            }
          }
        }
      }

      // shell holes with rebar
      for (const [fx, fy, hr] of spec.holes || []) {
        const hx = x + fx * w;
        const hy = top + fy * H;
        c.fillStyle = '#16120f';
        c.beginPath();
        const pts = [];
        for (let i = 0; i < 11; i++) {
          const a = (i / 11) * Math.PI * 2;
          const rr = hr * (0.7 + r() * 0.5);
          pts.push([hx + Math.cos(a) * rr, hy + Math.sin(a) * rr * 0.85]);
        }
        c.moveTo(...pts[0]);
        for (const q of pts.slice(1)) c.lineTo(...q);
        c.closePath();
        c.fill();
        recess.push({ poly: pts, ring: [hx, hy, hr] });
        // through the hole, the thickness of the wall it was punched through
        holeReveal(c, pts, WALL, shade(hexOf(color), 0.62));
        // broken render ring around the hole
        c.fillStyle = 'rgba(120,108,92,0.5)';
        c.beginPath();
        c.arc(hx, hy, hr * 1.35, 0, Math.PI * 2);
        c.arc(hx, hy, hr * 1.02, 0, Math.PI * 2, true);
        c.fill();
        c.strokeStyle = '#4a3a2c';
        c.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const a = r() * Math.PI * 2;
          c.beginPath();
          c.moveTo(hx + Math.cos(a) * hr * 0.9, hy + Math.sin(a) * hr * 0.8);
          c.quadraticCurveTo(hx + Math.cos(a) * hr * 0.5, hy + Math.sin(a) * hr * 0.4 + 8, hx + Math.cos(a) * hr * 0.2, hy + Math.sin(a) * hr * 0.3 + 18);
          c.stroke();
        }
      }

      // bullet pocks in clusters
      c.fillStyle = 'rgba(40,32,26,0.55)';
      for (let k = 0; k < (spec.pocks ?? 3); k++) {
        const cx = x + r() * w;
        const cy = top + r() * H;
        for (let i = 0; i < 14; i++) {
          c.beginPath();
          c.arc(cx + (r() - 0.5) * 70, cy + (r() - 0.5) * 50, 1.5 + r() * 2, 0, Math.PI * 2);
          c.fill();
        }
      }

      // exposed interiors where the corner is torn
      if (torn > 0) {
        c.fillStyle = 'rgba(30,24,20,0.0)';
      }

      // the base of the wall: grime, splash, and the dark where it meets the street
      const ao = c.createLinearGradient(0, -60, 0, 0);
      ao.addColorStop(0, 'rgba(30,24,18,0)');
      ao.addColorStop(1, 'rgba(30,24,18,0.38)');
      c.fillStyle = ao;
      c.fillRect(x, -60, w, 60);

      // graffiti
      for (const [text, gx, gy, size, gc, rot] of spec.graffiti || []) {
        c.save();
        c.translate(x + gx * w, gy);
        c.rotate(rot || -0.03);
        c.font = `${size}px "Aref Ruqaa", "IBM Plex Sans Arabic", serif`;
        c.fillStyle = gc || 'rgba(40,40,44,0.8)';
        c.textAlign = 'center';
        c.direction = 'rtl';
        c.fillText(text, 0, 0);
        c.restore();
      }
      c.restore();

      // torn edge: slab ends and dangling rebar
      if (torn > 0) {
        c.strokeStyle = '#5a4a3a';
        c.lineWidth = 2;
        for (let f = 1; f < floors; f++) {
          const sy = -f * fh;
          if (sy > top + H * (0.25 + torn * 0.45)) continue;
          const sx = tornLeft ? x + r() * w * 0.4 : x + w - r() * w * 0.4;
          extrudeRect(c, sx - 30, sy - 8, 60, 10, WALL * 0.8, { color: hexOf(color) });
          c.fillStyle = color;
          c.fillRect(sx - 30, sy - 8, 60, 10);
          for (let i = 0; i < 4; i++) {
            c.beginPath();
            c.moveTo(sx + (i - 2) * 10, sy);
            c.quadraticCurveTo(sx + (i - 2) * 12, sy + 20, sx + (i - 2) * 14 + (r() - 0.5) * 20, sy + 30 + r() * 30);
            c.stroke();
          }
        }
      }
  }, mat, matSeed);
  // the façade is baked once; each frame just places it
  R.paint((c) => c.drawImage(F.alb, F.x0, F.y0, F.w, F.h));
  R.height((h) => h.drawImage(F.hgt, F.x0, F.y0, F.w, F.h));
  if (!spec.noRoof && !torn) roofTop(R, spec, H, t);

  // balconies and laundry cast shadows onto the façade
  if (spec.balcony) {
    const [fl, side, hang] = spec.balcony;
    const by = -fl * fh - 8;
    const bx = side < 0.5 ? x + w * 0.15 : x + w * 0.55;
    R.cast((c) => {
      c.save();
      c.translate(bx, by);
      c.rotate(hang || 0);
      c.fillStyle = shade(color, 0.85);
      c.fillRect(0, 0, w * 0.3, 10);
      c.strokeStyle = '#3a3230';
      c.lineWidth = 2;
      c.strokeRect(2, -34, w * 0.3 - 4, 34);
      for (let i = 10; i < w * 0.3; i += 10) {
        c.beginPath();
        c.moveTo(i, -34);
        c.lineTo(i, 0);
        c.stroke();
      }
      if (!spec.laundry || spec.plants) {
        // someone still waters these
        for (let i = 0; i < 3; i++) {
          const px = 10 + i * (w * 0.3 - 20) / 2;
          c.fillStyle = '#8a5a3a';
          c.fillRect(px, -10, 10, 10);
          c.fillStyle = ['#5e7a3a', '#6e8a44', '#4e6a32'][i];
          c.beginPath();
          c.arc(px + 5, -13, 7, 0, Math.PI * 2);
          c.arc(px + 1, -17, 4, 0, Math.PI * 2);
          c.arc(px + 9, -18, 4, 0, Math.PI * 2);
          c.fill();
        }
      }
      if (spec.laundry) {
        c.strokeStyle = '#2a2420';
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(0, -40);
        c.lineTo(w * 0.3, -44);
        c.stroke();
        const cols = ['#9a8a70', '#6f7e86', '#b8a79a', '#7a5a50'];
        for (let i = 0; i < 4; i++) {
          const lx = 8 + i * (w * 0.3 - 16) / 4;
          const sway = Math.sin(t * 1.3 + i) * 2;
          c.fillStyle = cols[i];
          c.beginPath();
          c.moveTo(lx, -41 - i);
          c.lineTo(lx + 16, -41 - i);
          c.lineTo(lx + 16 + sway, -14 - i);
          c.lineTo(lx + sway, -12 - i);
          c.fill();
        }
      }
      c.restore();
    });
  }
  if (spec.dishes) {
    R.cast((c) => {
      for (const [fx, fy] of spec.dishes) {
        const dx = x + fx * w;
        const dy = -fy * fh - fh * 0.3;
        c.fillStyle = '#d8d2c6';
        c.beginPath();
        c.ellipse(dx, dy, 14, 16, -0.4, -Math.PI / 2, Math.PI / 2);
        c.fill();
        c.fillRect(dx - 2, dy, 4, 18);
      }
    });
  }
  if (spec.ac) {
    R.cast((c) => {
      for (const [fx, fy] of spec.ac) {
        c.fillStyle = '#cfc8ba';
        c.fillRect(x + fx * w, -fy * fh - fh * 0.35, 38, 26);
        c.fillStyle = 'rgba(0,0,0,0.3)';
        for (let i = 0; i < 4; i++) c.fillRect(x + fx * w + 4, -fy * fh - fh * 0.35 + 5 + i * 5, 30, 1.5);
      }
    });
  }
}

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${Math.min(255, ((n >> 16) & 255) * k) | 0},${Math.min(255, ((n >> 8) & 255) * k) | 0},${Math.min(255, (n & 255) * k) | 0})`;
}

// The street itself: asphalt, a pavement kerb, dust.
function street(R, x0, x1, { color = '#6e6559', pave = '#8a8072' } = {}) {
  const seen = (x) => Math.abs(x - R.cam.x) < 1500;
  R.paint((c) => {
    // the pavement: worn slabs with dark joints
    c.fillStyle = pave;
    c.fillRect(x0, -4, x1 - x0, 8);
    const r = rng(8);
    c.fillStyle = 'rgba(40,32,26,0.35)';
    for (let x = x0; x < x1; x += 46 + r() * 20) if (seen(x)) c.fillRect(x, -4, 1.5, 8); // (a cheap stream: fine to run it all)
    // the kerb stone, lit on top
    c.fillStyle = '#9d9383';
    c.fillRect(x0, 3, x1 - x0, 5);
    c.fillStyle = 'rgba(255,250,235,0.18)';
    c.fillRect(x0, 3, x1 - x0, 1.2);
    // asphalt
    c.fillStyle = color;
    c.fillRect(x0, 8, x1 - x0, 500);
    const road = c.createLinearGradient(0, 8, 0, 120);
    road.addColorStop(0, 'rgba(0,0,0,0.18)');
    road.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = road;
    c.fillRect(x0, 8, x1 - x0, 112);
  });
  // the road's surface and the pavement slabs, with their relief (only what
  // the camera can see)
  const vx0 = Math.max(x0, R.cam.x - 1600);
  const vx1 = Math.min(x1, R.cam.x + 1600);
  if (vx1 > vx0) {
    R.surface((c) => c.rect(vx0, 8, vx1 - vx0, 500), 'asphalt', { scale: 1.1, seed: 2 });
    R.surface((c) => c.rect(vx0, -4, vx1 - vx0, 7), 'pavers', { scale: 0.5, seed: 1, alpha: 0.8 });
  }
  R.paint((c) => {
    // patches of newer tarmac, and cracks (each strip seeded by its own x,
    // so what's drawn doesn't depend on what's on screen)
    for (let x = x0; x < x1; x += 60) {
      if (!seen(x)) continue;
      const q = rng(Math.floor(x) * 13 + 5);
      if (q() < 0.12) {
        c.fillStyle = 'rgba(30,28,26,0.22)';
        c.fillRect(x, 16 + q() * 50, 50 + q() * 120, 12 + q() * 20);
      }
      if (q() < 0.3) {
        c.strokeStyle = 'rgba(30,24,20,0.35)';
        c.lineWidth = 1;
        c.beginPath();
        let cx = x;
        let cy = 14 + q() * 60;
        c.moveTo(cx, cy);
        for (let k = 0; k < 4; k++) {
          cx += 10 + q() * 20;
          cy += (q() - 0.5) * 10;
          c.lineTo(cx, cy);
        }
        c.stroke();
      }
      // grit, stones and litter along the kerb
      for (let gx = x; gx < x + 60; gx += 11) {
        if (q() < 0.4) {
          c.fillStyle = `rgba(${150 + q() * 40},${140 + q() * 30},${120 + q() * 30},0.7)`;
          c.fillRect(gx, 8 + q() * 10, 2 + q() * 3, 2);
        }
        if (q() < 0.02) {
          c.fillStyle = q() < 0.5 ? 'rgba(220,215,200,0.6)' : 'rgba(80,110,140,0.5)';
          c.fillRect(gx, 10 + q() * 30, 6 + q() * 6, 3); // a scrap of paper or plastic
        }
      }
    }
  });
}

// Wooden electricity poles along the street, some leaning after years of
// blasts, with cables strung between them. Every cable ends somewhere: at
// the next pole, at a bracket where it goes into a building, or snapped and
// hanging to the ground. Cast, so they throw shadows.
function cables(R, camX, { seed = 11, y = -330, from = -600, to = 11000 } = {}) {
  // the poles first: where they stand, how they lean, where the arm is
  const r = rng(seed);
  const poles = [];
  for (let x = from + r() * 200; x < to; x += 620 + r() * 420) {
    const lean = r() < 0.35 ? (r() - 0.5) * 0.22 : (r() - 0.5) * 0.04;
    const h = 430 + r() * 50;
    poles.push({ x, lean, h, top: [x + Math.sin(lean) * h, -Math.cos(lean) * h] });
  }
  // what each span between neighbours does
  const spans = poles.slice(0, -1).map((p, i) => ({ a: p, b: poles[i + 1], kind: r(), wires: 2 + Math.floor(r() * 2), sag: 30 + r() * 40, k: r() }));
  const armY = (p, n) => [p.top[0] + Math.sin(p.lean) * (14 + n * 12), p.top[1] + Math.cos(p.lean) * (14 + n * 12)];
  const vis = (x0, x1) => x1 > camX - 1700 && x0 < camX + 1700;

  R.cast((c) => {
    c.lineCap = 'round';
    for (const s of spans) {
      if (!vis(s.a.x, s.b.x)) continue;
      c.strokeStyle = 'rgba(26,22,20,0.9)';
      c.lineWidth = 1.4;
      for (let n = 0; n < s.wires; n++) {
        const [ax, ay] = armY(s.a, n);
        const [bx, by] = armY(s.b, n);
        const sag = s.sag + n * 6;
        if (s.kind < 0.6) {
          // strung between the two poles
          c.beginPath();
          c.moveTo(ax, ay);
          c.quadraticCurveTo((ax + bx) / 2, Math.max(ay, by) + sag, bx, by);
          c.stroke();
        } else if (s.kind < 0.8) {
          // off the pole and into the building: a bracket on the wall and a hole
          const wx = ax + (bx - ax) * (0.3 + s.k * 0.4) + n * 18;
          const wy = -230 - s.k * 120 + n * 10;
          c.beginPath();
          c.moveTo(ax, ay);
          c.quadraticCurveTo((ax + wx) / 2, Math.max(ay, wy) + sag * 0.6, wx, wy);
          c.stroke();
          c.fillStyle = '#1c1714';
          c.fillRect(wx - 2, wy - 2, 5, 5);
          c.fillStyle = 'rgba(60,50,42,0.9)';
          c.fillRect(wx - 5, wy + 3, 11, 2.5);
        } else {
          // snapped: each end hangs from its pole, down to the ground
          for (const [px, py, dir] of [[ax, ay, 1], [bx, by, -1]]) {
            const len = (bx - ax) * (0.18 + s.k * 0.2 + n * 0.05);
            c.beginPath();
            c.moveTo(px, py);
            c.bezierCurveTo(px + dir * len * 0.5, py + 40, px + dir * len * 0.9, py * 0.35, px + dir * len, -2);
            // the last of it lying along the ground
            c.lineTo(px + dir * (len + 30 + n * 12), 0);
            c.stroke();
          }
        }
      }
    }
    // the poles, over their own wires' ends
    for (const p of poles) {
      if (!vis(p.x - 60, p.x + 60)) continue;
      c.save();
      c.translate(p.x, 0);
      c.rotate(p.lean);
      // a tarred wooden pole, thicker at the foot
      const g = c.createLinearGradient(-6, 0, 6, 0);
      g.addColorStop(0, '#3a2c20');
      g.addColorStop(0.45, '#5a4532');
      g.addColorStop(1, '#2e241b');
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(-6.5, 2);
      c.lineTo(-4.5, -p.h);
      c.lineTo(4.5, -p.h);
      c.lineTo(6.5, 2);
      c.fill();
      // grain and old nails, a blackened band where it was burned
      c.strokeStyle = 'rgba(20,14,10,0.35)';
      c.lineWidth = 0.8;
      c.beginPath();
      c.moveTo(-1.5, 0);
      c.lineTo(-1, -p.h);
      c.moveTo(2, 0);
      c.lineTo(1.6, -p.h);
      c.stroke();
      c.fillStyle = 'rgba(15,10,8,0.55)';
      c.fillRect(-6, -60, 12, 16);
      // cross-arms with insulators
      c.fillStyle = '#3e3024';
      for (let n = 0; n < 2; n++) {
        const yy = -p.h + 12 + n * 12;
        c.fillRect(-24, yy, 48, 5);
        c.fillStyle = '#c8c2b4';
        for (const ix of [-20, 18]) c.fillRect(ix, yy - 5, 3, 5);
        c.fillStyle = '#3e3024';
      }
      // a transformer box on some, and posters stapled on
      if (Math.abs(p.lean) < 0.05 && ((p.x | 0) % 3 === 0)) {
        c.fillStyle = '#5e6364';
        c.fillRect(6, -p.h * 0.62, 18, 26);
        c.fillStyle = 'rgba(0,0,0,0.3)';
        c.fillRect(6, -p.h * 0.62 + 22, 18, 4);
      }
      c.fillStyle = 'rgba(225,215,195,0.55)';
      c.fillRect(-5, -150, 10, 14);
      c.restore();
    }
  });
}

// Silhouettes very close to the camera, sweeping past faster than the street:
// a lamp post, twisted rebar, a rubble edge, a hanging wire.
function foreground(R, camX, { from = -1000, to = 15000 } = {}) {
  R.layer(1.32);
  R.paint((c) => {
    const r = rng(77);
    for (let x = from; x < to; x += 900 + r() * 700) {
      const kind = r();
      const k1 = r();
      const k2 = r();
      if (Math.abs(x - camX * 1.32) > 1700) continue;
      c.fillStyle = 'rgba(20,16,13,0.92)';
      c.strokeStyle = 'rgba(20,16,13,0.92)';
      if (kind < 0.3) {
        // nothing here: keep the foreground sparse
      } else if (kind < 0.6) {
        // a rubble edge with rebar
        c.beginPath();
        c.moveTo(x - 40, 60);
        c.lineTo(x, 10);
        c.lineTo(x + 60, 20);
        c.lineTo(x + 90, -10);
        c.lineTo(x + 150, 25);
        c.lineTo(x + 190, 60);
        c.closePath();
        c.fill();
        c.lineWidth = 2.5;
        for (let i = 0; i < 4; i++) {
          c.beginPath();
          c.moveTo(x + 40 + i * 22, 10);
          c.quadraticCurveTo(x + 50 + i * 20, -40, x + 30 + i * 30 + k1 * 30, -70 - k2 * 40 - i * 6);
          c.stroke();
        }
      } else if (kind < 0.8) {
        // a wire hanging into frame from above
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(x, -900);
        c.quadraticCurveTo(x + 30, -560, x + 10, -460 - k1 * 60);
        c.stroke();
      }
    }
  });
  R.layer(1);
}

// Dust motes turning slowly in the sunlight.
function motes(R, camX, t, strength = 1) {
  if (strength <= 0) return;
  R.glow((c) => {
    const r = rng(5);
    for (let i = 0; i < 70; i++) {
      const bx = r() * 2600 - 1300;
      const by = -40 - r() * 520;
      const sp = 6 + r() * 10;
      const x = camX + ((((bx + t * sp) % 2600) + 2600) % 2600) - 1300 + Math.sin(t * 0.7 + i) * 12;
      const y = by + Math.sin(t * 0.5 + i * 1.7) * 18;
      const a = (0.07 + r() * 0.12) * strength * (0.6 + 0.4 * Math.sin(t * 1.3 + i));
      c.fillStyle = `rgba(255,236,200,${a})`;
      c.fillRect(x, y, 2, 2);
    }
  });
}

// A heap of broken slabs. Returns nothing; collision is added separately.
function rubble(R, x, w, h, { seed = 5, color = '#a89b86', rebar = true, cast = true } = {}) {
  const draw = (c) => {
    const r = rng(seed);
    c.fillStyle = color;
    c.beginPath();
    const pts = [[x - 10, 2]];
    const n = 9;
    for (let i = 1; i < n; i++) {
      const k = i / n;
      pts.push([x + k * w + (r() - 0.5) * 16, -h * Math.sin(k * Math.PI) * (0.75 + r() * 0.35)]);
    }
    pts.push([x + w + 10, 2]);
    // the heap goes back as far as it goes across, near enough
    extrudePoly(c, pts, 14, { color: hexOf(color) });
    c.fillStyle = color;
    c.beginPath();
    c.moveTo(...pts[0]);
    for (const p of pts.slice(1)) c.lineTo(...p);
    c.closePath();
    c.fill();
    // slab edges and chunks
    for (let i = 0; i < 7; i++) {
      const sx = x + r() * w;
      const sy = -r() * h * 0.8;
      c.save();
      c.translate(sx, sy);
      c.rotate((r() - 0.5) * 1.2);
      const cc = shade(color.startsWith('#') ? color : '#a89b86', 0.75 + r() * 0.35);
      const cw = 40 + r() * 30;
      const cx0 = -20 - r() * 20;
      const ch = 10 + r() * 6;
      extrudeRect(c, cx0, -6, cw, ch, 8, { top: 'rgba(255,248,235,0.22)', side: 'rgba(0,0,0,0.35)' });
      c.fillStyle = cc;
      c.fillRect(cx0, -6, cw, ch);
      c.restore();
    }
    if (rebar) {
      c.strokeStyle = '#4a3b2e';
      c.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        const rx = x + r() * w;
        const ry = -h * (0.4 + r() * 0.5);
        c.beginPath();
        c.moveTo(rx, ry);
        c.quadraticCurveTo(rx + (r() - 0.5) * 30, ry - 20, rx + (r() - 0.5) * 50, ry - 30 - r() * 30);
        c.stroke();
      }
    }
  };
  if (cast) R.cast(draw);
  else R.paint(draw);
  // the broken concrete's grain and relief over the whole heap
  const q = rng(seed);
  const pts = [[x - 10, 2]];
  for (let i = 1; i < 9; i++) {
    const k = i / 9;
    pts.push([x + k * w + (q() - 0.5) * 16, -h * Math.sin(k * Math.PI) * (0.75 + q() * 0.35)]);
  }
  pts.push([x + w + 10, 2]);
  R.surface((c) => {
    c.moveTo(...pts[0]);
    for (const p of pts.slice(1)) c.lineTo(...p);
    c.closePath();
  }, 'concrete', { scale: 0.8, seed: 3, alpha: 0.9 });
}

// The sniper curtain: sheets and blankets on a wire across the gap. The
// middle section has sagged where shrapnel cut the wire.
function sniperCurtain(R, x0, x1, t, { wireY = -250, sagFrom, sagTo, sagY = -148 }) {
  R.cast((c) => {
    c.strokeStyle = '#2a2622';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(x0, wireY);
    c.lineTo(sagFrom, wireY + 6);
    c.quadraticCurveTo((sagFrom + sagTo) / 2, sagY - 30, sagTo, wireY + 6);
    c.lineTo(x1, wireY);
    c.stroke();
    const sheets = [
      [x0, sagFrom, '#d9d2c2', 0],
      [sagFrom, sagTo, '#8e6f5a', 1],
      [sagTo, x1, '#6d7a82', 0],
    ];
    for (const [a, b, col, sag] of sheets) {
      const sway = Math.sin(t * 1.2 + a * 0.01) * 5;
      c.fillStyle = col;
      c.beginPath();
      if (sag) {
        c.moveTo(a, wireY + 6);
        c.quadraticCurveTo((a + b) / 2, sagY - 30, b, wireY + 6);
        c.lineTo(b + sway, sagY + 6);
        c.quadraticCurveTo((a + b) / 2 + sway, sagY + 18, a + sway, sagY + 6);
      } else {
        c.moveTo(a, wireY);
        c.lineTo(b, wireY);
        c.lineTo(b + sway, wireY + 150);
        c.quadraticCurveTo((a + b) / 2 + sway, wireY + 160, a + sway, wireY + 150);
      }
      c.closePath();
      c.fill();
      // folds and a stitched seam
      c.strokeStyle = 'rgba(0,0,0,0.18)';
      c.lineWidth = 1.5;
      for (let fx = a + 14; fx < b - 6; fx += 22) {
        c.beginPath();
        c.moveTo(fx, wireY + 10);
        c.lineTo(fx + sway * 0.6, sag ? sagY : wireY + 140);
        c.stroke();
      }
    }
    // shrapnel holes let the light through
    c.fillStyle = '#1a1612';
    for (const [hx, hy] of [[x0 + 30, wireY + 60], [sagTo + 40, wireY + 40], [sagTo + 55, wireY + 90]]) {
      c.beginPath();
      c.arc(hx, hy, 3.5, 0, Math.PI * 2);
      c.fill();
    }
  });
}

// A shopfront with a dented, half-closed rolling shutter.
function shop(R, x, { w = 220, sign = 'دكّان أبو ريّان', open = 0.45 } = {}) {
  R.paint((c) => {
    c.fillStyle = '#1b1612';
    c.fillRect(x, -150, w, 150);
    // empty shelves inside
    c.fillStyle = 'rgba(80,66,52,0.6)';
    for (let i = 0; i < 3; i++) c.fillRect(x + 10, -120 + i * 35, w - 20, 4);
    c.fillStyle = '#8c8a86';
    c.fillRect(x - 4, -160, w + 8, 12);
    // sign
    c.fillStyle = '#2f4a5a';
    c.fillRect(x + 10, -205, w - 20, 38);
    c.fillStyle = '#e8dcc0';
    c.font = '24px "Aref Ruqaa", "Noto Naskh Arabic", serif';
    c.textAlign = 'center';
    c.direction = 'rtl';
    c.fillText(sign, x + w / 2, -178);
  });
  R.cast((c) => {
    const sh = 150 * (1 - open);
    c.fillStyle = '#7d7c78';
    c.beginPath();
    c.moveTo(x, -150);
    c.lineTo(x + w, -150);
    c.lineTo(x + w, -150 + sh);
    c.quadraticCurveTo(x + w * 0.55, -150 + sh + 22, x + w * 0.4, -150 + sh - 4);
    c.lineTo(x, -150 + sh + 6);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.25)';
    c.lineWidth = 1.5;
    for (let y = -146; y < -150 + sh; y += 7) {
      c.beginPath();
      c.moveTo(x, y);
      c.lineTo(x + w, y);
      c.stroke();
    }
  });
}

// A grape vine climbing a broken garden wall.
function vine(R, x, t, { wallH = 110, lush = 1, ripe = false } = {}) {
  R.cast((c) => {
    c.fillStyle = '#b3a58f';
    c.beginPath();
    c.moveTo(x - 70, 0);
    c.lineTo(x - 70, -wallH + 20);
    c.lineTo(x - 30, -wallH);
    c.lineTo(x + 10, -wallH + 30);
    c.lineTo(x + 40, -wallH + 8);
    c.lineTo(x + 70, -wallH + 40);
    c.lineTo(x + 70, 0);
    c.fill();
  });
  R.cast((c) => {
    const r = rng(12);
    c.strokeStyle = '#5a4230';
    c.lineWidth = 4;
    c.beginPath();
    c.moveTo(x + 20, 0);
    c.bezierCurveTo(x + 10, -60, x + 40, -90, x - 20, -wallH - 20);
    c.bezierCurveTo(x - 50, -wallH - 40, x - 10, -wallH - 70, x + 30, -wallH - 60);
    c.stroke();
    for (let i = 0; i < 22 * lush; i++) {
      const k = r();
      const lx = lerp(x + 20, x - 30, k) + (r() - 0.5) * 70;
      const ly = -k * (wallH + 60) - 10 + (r() - 0.5) * 30;
      const sway = Math.sin(t * 1.4 + i) * 1.5;
      c.fillStyle = r() < 0.5 ? '#5f7a3a' : '#6d8a44';
      c.beginPath();
      c.ellipse(lx + sway, ly, 11, 9, r() * 3, 0, Math.PI * 2);
      c.fill();
    }
    // small bunches of grapes
    for (let b = 0; b < 3; b++) {
      const gx = x - 10 + b * 22;
      const gy = -wallH + 6 + b * 8;
      c.fillStyle = ripe ? '#4a2a4a' : '#8ea24a';
      for (let i = 0; i < 7; i++) {
        c.beginPath();
        c.arc(gx + ((i % 3) - 1) * 4, gy + Math.floor(i / 3) * 5, 3, 0, Math.PI * 2);
        c.fill();
      }
    }
  });
}

// The school: a three-storey block with its eastern wing collapsed, a
// basement stairwell, and ground-floor classroom windows.
function school(R, x, t) {
  block(R, { x, w: 520, floors: 3, fh: 130, color: '#c8b999', seed: 44, torn: 0, pocks: 6, graffiti: [['مدرسة', 0.3, -330, 30, 'rgba(60,70,90,0.7)']] }, t);
  // the collapsed east wing: a slope of slabs
  rubble(R, x + 520, 380, 210, { seed: 45, color: '#b9aa8a' });
  // basement stairwell entrance: a low wall and a dark opening
  R.paint((c) => {
    c.fillStyle = '#0d0b09';
    c.fillRect(x + 380, -95, 80, 95);
    c.fillStyle = '#9d9078';
    for (let i = 0; i < 4; i++) c.fillRect(x + 384 + i * 4, -92 + i * 22, 72, 4); // steps going down, seen through
  });
  // classroom windows (for the flashback)
  R.paint((c) => {
    for (let i = 0; i < 3; i++) {
      c.fillStyle = '#2a2420';
      c.fillRect(x + 40 + i * 110, -110, 80, 70);
      c.fillStyle = 'rgba(90,70,50,0.5)';
      c.fillRect(x + 50 + i * 110, -60, 60, 3); // desk tops glimpsed
    }
    c.strokeStyle = '#d9d4c8';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(x + 150, -110);
    c.lineTo(x + 175, -80);
    c.lineTo(x + 160, -60);
    c.stroke(); // cracked pane
  });
}

// A doorway into a ground-floor room, lit from inside.
function roomDoor(R, x, { w = 110, h = 170, light = 'rgba(255,200,140,0.18)' } = {}) {
  R.paint((c) => {
    c.fillStyle = '#18130f';
    c.fillRect(x, -h, w, h);
  });
  R.glow((c) => {
    const g = c.createLinearGradient(x, -h, x, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, light);
    c.fillStyle = g;
    c.fillRect(x, -h, w, h);
  });
}

function jerryCan(c, x, y, s = 1, color = '#d9b12a') {
  c.save();

  c.scale(s, s);
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(-14, 0);
  c.lineTo(-14, -34);
  c.lineTo(-6, -40);
  c.lineTo(14, -40);
  c.lineTo(14, 0);
  c.closePath();
  c.fill();
  c.fillStyle = 'rgba(0,0,0,0.2)';
  c.fillRect(-10, -30, 20, 2);
  c.fillRect(-10, -16, 20, 2);
  c.fillStyle = shade('#d9b12a', 0.7);
  c.fillRect(4, -46, 7, 7); // cap
  c.strokeStyle = shade('#d9b12a', 0.6);
  c.lineWidth = 3;
  c.beginPath();
  c.moveTo(-8, -40);
  c.lineTo(-4, -48);
  c.lineTo(2, -48);
  c.lineTo(0, -40);
  c.stroke(); // handle
  c.restore();
}

// Sorted piles of scrap: rebar, copper, aluminium.
function scrapPiles(R, x, disturbed = 0) {
  R.cast((c) => {
    const r = rng(33);
    const piles = [
      [x, '#5a4a3e', 'rebar'],
      [x + 90, '#a86a3a', 'copper'],
      [x + 170, '#b8bcc0', 'alu'],
    ];
    for (const [px, col, kind] of piles) {
      const sc = disturbed ? 1.6 : 1;
      c.strokeStyle = col;
      c.fillStyle = col;
      c.lineWidth = kind === 'rebar' ? 3 : 2;
      for (let i = 0; i < 12; i++) {
        const ax = px + (r() - 0.5) * 50 * sc;
        const ay = -r() * 22 / sc;
        c.beginPath();
        c.moveTo(ax, ay);
        c.lineTo(ax + (r() - 0.5) * 40, ay - (r() - 0.2) * 10);
        c.stroke();
        if (kind !== 'rebar' && r() < 0.5) c.fillRect(ax, ay - 4, 8, 5);
      }
    }
  });
}

function crater(R, x, w = 180) {
  R.paint((c) => {
    c.fillStyle = '#3a3129';
    c.beginPath();
    c.ellipse(x, 10, w / 2, 16, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#8a7c68';
    const r = rng(9);
    for (let i = 0; i < 14; i++) c.fillRect(x - w / 2 - 30 + r() * (w + 60), -4 - r() * 8, 6 + r() * 12, 4 + r() * 5);
  });
}

// The dead olive tree at the corner: twisted, grey, leafless.
function deadOlive(R, x) {
  R.cast((c) => {
    c.strokeStyle = '#6a625a';
    c.lineCap = 'round';
    const branch = (bx, by, ang, len, w, d) => {
      const ex = bx + Math.cos(ang) * len;
      const ey = by + Math.sin(ang) * len;
      c.lineWidth = w;
      c.beginPath();
      c.moveTo(bx, by);
      c.quadraticCurveTo(bx + Math.cos(ang + 0.4) * len * 0.5, by + Math.sin(ang + 0.4) * len * 0.5, ex, ey);
      c.stroke();
      if (d < 4) {
        branch(ex, ey, ang - 0.45 - d * 0.05, len * 0.7, w * 0.62, d + 1);
        branch(ex, ey, ang + 0.5, len * 0.62, w * 0.6, d + 1);
      }
    };
    branch(x, 0, -Math.PI / 2 - 0.1, 90, 22, 0);
  });
}

function lowWall(R, x, w, h = 70, color = '#a3967f') {
  R.cast((c) => {
    extrudeRect(c, x, -h, w, h, 16, { color: hexOf(color) });
    c.fillStyle = color;
    c.fillRect(x, -h, w, h);
    c.fillStyle = 'rgba(0,0,0,0.15)';
    for (let i = 0; i < w; i += 36) c.fillRect(x + i, -h, 2, h);
    c.fillRect(x, -h / 2, w, 2);
  });
}

// A Mi-8 seen side-on in the far sky, rotor a blur.
// A fighter jet in side profile, facing right: pointed nose, bubble canopy,
// swept delta wing, twin fins, and the shimmer of the exhaust.
function jet(c, x, y, s, t) {
  c.save();
  c.translate(x, y);
  c.scale(s, s);
  // exhaust heat haze
  const hz = c.createLinearGradient(-150, 0, -58, 0);
  hz.addColorStop(0, 'rgba(255,220,180,0)');
  hz.addColorStop(1, 'rgba(255,200,150,0.22)');
  c.fillStyle = hz;
  c.beginPath();
  c.ellipse(-100, 1, 48, 5 + Math.sin(t * 40) * 0.8, 0, 0, Math.PI * 2);
  c.fill();
  // far wing (darker, behind)
  c.fillStyle = '#23252a';
  c.beginPath();
  c.moveTo(-6, -2);
  c.lineTo(-40, -12);
  c.lineTo(-52, -12);
  c.lineTo(-30, -2);
  c.closePath();
  c.fill();
  // fuselage
  c.fillStyle = '#2d3036';
  c.beginPath();
  c.moveTo(78, 1);
  c.quadraticCurveTo(58, -5, 30, -6);
  c.lineTo(-50, -5);
  c.lineTo(-62, -3);
  c.lineTo(-62, 4);
  c.lineTo(-48, 6);
  c.lineTo(30, 6);
  c.quadraticCurveTo(58, 5, 78, 1);
  c.closePath();
  c.fill();
  // intake
  c.fillStyle = '#1d1f23';
  c.fillRect(8, 1, 20, 5);
  // canopy
  c.fillStyle = '#5b6470';
  c.beginPath();
  c.moveTo(46, -5);
  c.quadraticCurveTo(36, -13, 20, -9);
  c.lineTo(18, -5);
  c.closePath();
  c.fill();
  // near wing, swept back
  c.fillStyle = '#383b42';
  c.beginPath();
  c.moveTo(14, 3);
  c.lineTo(-34, 16);
  c.lineTo(-48, 16);
  c.lineTo(-40, 3);
  c.closePath();
  c.fill();
  // twin fins
  c.fillStyle = '#2a2d33';
  c.beginPath();
  c.moveTo(-40, -5);
  c.lineTo(-58, -26);
  c.lineTo(-66, -26);
  c.lineTo(-60, -4);
  c.closePath();
  c.fill();
  c.fillStyle = '#212328';
  c.beginPath();
  c.moveTo(-44, -5);
  c.lineTo(-54, -20);
  c.lineTo(-60, -20);
  c.lineTo(-58, -4);
  c.closePath();
  c.fill();
  // tailplane
  c.fillStyle = '#34373e';
  c.beginPath();
  c.moveTo(-46, 3);
  c.lineTo(-64, 10);
  c.lineTo(-68, 10);
  c.lineTo(-62, 2);
  c.closePath();
  c.fill();
  // nozzle glow
  c.fillStyle = 'rgba(255,170,90,0.5)';
  c.beginPath();
  c.ellipse(-63, 0.5, 2, 3.4, 0, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

// The same jet seen from below, as a shadow on the ground: a swept delta
// with its fins and tailplane. Moving right.
function jetShadowShape(c, x, y, s) {
  c.save();
  c.translate(x, y);
  c.scale(s, s);
  c.beginPath();
  c.moveTo(80, 0);
  c.quadraticCurveTo(60, -7, 26, -8);
  c.lineTo(-10, -12);
  c.lineTo(-40, -70); // wing tip
  c.lineTo(-56, -70);
  c.lineTo(-44, -12);
  c.lineTo(-56, -10);
  c.lineTo(-72, -32); // tailplane
  c.lineTo(-82, -32);
  c.lineTo(-76, -8);
  c.lineTo(-78, 0);
  c.lineTo(-76, 8);
  c.lineTo(-82, 32);
  c.lineTo(-72, 32);
  c.lineTo(-56, 10);
  c.lineTo(-44, 12);
  c.lineTo(-56, 70);
  c.lineTo(-40, 70);
  c.lineTo(-10, 12);
  c.lineTo(26, 8);
  c.quadraticCurveTo(60, 7, 80, 0);
  c.closePath();
  c.fill();
  c.restore();
}

// ------------------------------------------------------------- doors --

// Which ground-floor bays are doors, and of what kind: one on a narrow
// block, two on a wide one; the same every time for the same building.
const DOOR_KINDS = ['steel', 'wood', 'shutter', 'gate', 'steel', 'shutter'];
function pickDoors(cols, seed) {
  const r = rng(seed * 13 + 5);
  const doors = new Map();
  const n = cols >= 4 ? 2 : 1;
  for (let i = 0; i < n; i++) {
    const k = Math.floor(r() * cols);
    doors.set(k, DOOR_KINDS[Math.floor(r() * DOOR_KINDS.length)]);
  }
  return doors;
}

// A Syrian street door, centred on x, standing on the ground (y = 0).
