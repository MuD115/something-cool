  c.fillRect(-1, -228, 2, 16);
  if (cracked) {
    c.strokeStyle = 'rgba(0,0,0,0.35)';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(-6, -170);
    c.lineTo(2, -140);
    c.lineTo(-3, -110);
    c.lineTo(5, -80);
    c.stroke();
  }
  c.restore();
}

// A column of smoke or dust, rising and spreading.
function plume(R, x, y, t, { depth = 0.3, age = 1, color = [120, 105, 90], height = 500, width = 120, alpha = 0.8 }) {
  if (age <= 0) return;
  R.layer(depth);
  R.paint((c) => {
    const r = rng(17);
    const h = height * Math.min(age, 1);
    // soft puffs: each fades to nothing at its edge, so the column has no rims
    for (let i = 0; i < 34; i++) {
      const k = i / 33;
      const py = y - k * h;
      const px = x + noise1(k * 4 + t * 0.2) * width * 0.4 * k + k * k * 80 + (r() - 0.5) * width * 0.3;
      const pr = (width * 0.45 + k * width * 1.1) * (0.7 + r() * 0.5);
      const shade = 0.75 + 0.35 * (1 - k) + r() * 0.1;
      const a = alpha * 0.55 * (1 - k * 0.6) * Math.min(1, age * 1.5);
      const rgb = `${(color[0] * shade) | 0},${(color[1] * shade) | 0},${(color[2] * shade) | 0}`;
      const grad = c.createRadialGradient(px, py, 0, px, py, pr);
      grad.addColorStop(0, `rgba(${rgb},${a})`);
      grad.addColorStop(0.55, `rgba(${rgb},${a * 0.6})`);
      grad.addColorStop(1, `rgba(${rgb},0)`);
      c.fillStyle = grad;
      c.beginPath();
      c.arc(px, py, pr, 0, Math.PI * 2);
      c.fill();
    }
  });
  R.layer(1);
}

// ----------------------------------------------------------- buildings --

// A block of flats, drawn as a façade on the street's far side.
// spec: { x, w, floors, fh, color, seed, torn: 0…1 (corner torn away),
//         holes: [[fx, fy, r]], balcony: [floor, side], laundry, dishes,
//         shutters, graffiti: [text, fx, fy, size, color], sign }
function block(R, spec, t = 0) {
  const { x, w, floors, fh = 140, color = CONCRETE[0], seed = 1 } = spec;
  const H = floors * fh;
  const top = -H;
  const torn = spec.torn || 0;
  const tornLeft = spec.tornLeft ?? rng(seed + 7)() < 0.5;

  // paint() draws twice (once per layer), so the random stream restarts here
  R.paint((c) => {
    const r = rng(seed);
    c.save();
    // outline with a torn corner
    c.beginPath();
    if (torn > 0) {
      const tw = w * (0.3 + torn * 0.4);
      const th = H * (0.25 + torn * 0.45);
      if (tornLeft) {
        c.moveTo(x, 0);
        c.lineTo(x, top + th);
        const n = 7;
        for (let i = 1; i < n; i++) c.lineTo(x + (tw * i) / n + (r() - 0.5) * 20, top + th - (th * i) / n + (r() - 0.5) * 30);
        c.lineTo(x + tw, top);
        c.lineTo(x + w, top);
        c.lineTo(x + w, 0);
      } else {
        c.moveTo(x, 0);
        c.lineTo(x, top);
        c.lineTo(x + w - tw, top);
        const n = 7;
        for (let i = 1; i < n; i++) c.lineTo(x + w - tw + (tw * i) / n + (r() - 0.5) * 20, top + (th * i) / n + (r() - 0.5) * 30);
        c.lineTo(x + w, top + th);
        c.lineTo(x + w, 0);
      }
    } else {
      c.rect(x, top, w, H);
    }
    c.closePath();
    c.fillStyle = color;
    c.fill();
    c.clip();

    // weathering and floor slabs
    c.fillStyle = 'rgba(60,50,40,0.08)';
    for (let i = 0; i < 12; i++) c.fillRect(x + r() * w, top, 2 + r() * 10, H);
    for (let f = 0; f <= floors; f++) {
      c.fillStyle = 'rgba(40,32,26,0.22)';
      c.fillRect(x, -f * fh - 6, w, 8);
    }

    // windows
    const cols = Math.max(2, Math.round(w / 110));
    const ww = Math.min(58, (w / cols) * 0.5);
    const wh = fh * 0.46;
    for (let f = 0; f < floors; f++) {
      for (let k = 0; k < cols; k++) {
        const wx = x + ((k + 0.5) * w) / cols - ww / 2;
        const wy = -f * fh - fh * 0.72;
        const kind = r();
        if (f === 0 && spec.shopFront) continue;
        if (kind < 0.12) {
          // blown out: ragged dark hole
          c.fillStyle = '#1b1612';
          c.beginPath();
          const jag = [[wx - 6, wy - 3], [wx + ww * 0.3, wy - 9], [wx + ww * 0.55, wy - 2], [wx + ww + 7, wy - 6], [wx + ww + 3, wy + wh * 0.5], [wx + ww + 8, wy + wh + 6], [wx + ww * 0.5, wy + wh + 3], [wx - 5, wy + wh + 9], [wx - 2, wy + wh * 0.4]];
          c.moveTo(...jag[0]);
          for (const q of jag.slice(1)) c.lineTo(q[0] + (r() - 0.5) * 5, q[1] + (r() - 0.5) * 5);
          c.closePath();
          c.fill();
        } else {
          c.fillStyle = kind < 0.55 ? '#211b17' : '#2b241f';
          c.fillRect(wx, wy, ww, wh);
          c.fillStyle = 'rgba(0,0,0,0.25)';
          c.fillRect(wx - 3, wy + wh, ww + 6, 4); // sill shadow
          if (kind > 0.7) {
            // closed shutter, some slats missing
            c.fillStyle = spec.shutter || '#7a6a55';
            c.fillRect(wx, wy, ww, wh * (0.4 + r() * 0.6));
            c.fillStyle = 'rgba(0,0,0,0.2)';
            for (let s = wy + 4; s < wy + wh * 0.9; s += 6) c.fillRect(wx, s, ww, 1.5);
          } else if (kind > 0.55) {
            // plastic sheet over the window, sagging
            c.fillStyle = 'rgba(180,190,200,0.35)';
            c.beginPath();
            c.moveTo(wx, wy);
            c.lineTo(wx + ww, wy);
            c.lineTo(wx + ww, wy + wh);
            c.quadraticCurveTo(wx + ww / 2, wy + wh - 10, wx, wy + wh);
            c.fill();
          }
        }
      }
    }

    // shell holes with rebar
    for (const [fx, fy, hr] of spec.holes || []) {
      const hx = x + fx * w;
      const hy = top + fy * H;
      c.fillStyle = '#16120f';
      c.beginPath();
      const pts = [];
      for (let i = 0; i < 11; i++) {
        const a = (i / 11) * Math.PI * 2;
        const rr = hr * (0.7 + r() * 0.5);
        pts.push([hx + Math.cos(a) * rr, hy + Math.sin(a) * rr * 0.85]);
      }
      c.moveTo(...pts[0]);
      for (const q of pts.slice(1)) c.lineTo(...q);
      c.closePath();
      c.fill();
      // broken render ring around the hole
      c.fillStyle = 'rgba(120,108,92,0.5)';
      c.beginPath();
      c.arc(hx, hy, hr * 1.35, 0, Math.PI * 2);
      c.arc(hx, hy, hr * 1.02, 0, Math.PI * 2, true);
      c.fill();
      c.strokeStyle = '#4a3a2c';
      c.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const a = r() * Math.PI * 2;
        c.beginPath();
        c.moveTo(hx + Math.cos(a) * hr * 0.9, hy + Math.sin(a) * hr * 0.8);
        c.quadraticCurveTo(hx + Math.cos(a) * hr * 0.5, hy + Math.sin(a) * hr * 0.4 + 8, hx + Math.cos(a) * hr * 0.2, hy + Math.sin(a) * hr * 0.3 + 18);
        c.stroke();
      }
    }

    // bullet pocks in clusters
    c.fillStyle = 'rgba(40,32,26,0.55)';
    for (let k = 0; k < (spec.pocks ?? 3); k++) {
      const cx = x + r() * w;
      const cy = top + r() * H;
      for (let i = 0; i < 14; i++) {
        c.beginPath();
        c.arc(cx + (r() - 0.5) * 70, cy + (r() - 0.5) * 50, 1.5 + r() * 2, 0, Math.PI * 2);
        c.fill();
      }
    }

    // exposed interiors where the corner is torn
    if (torn > 0) {
      c.fillStyle = 'rgba(30,24,20,0.0)';
    }

    // graffiti
    for (const [text, gx, gy, size, gc, rot] of spec.graffiti || []) {
      c.save();
      c.translate(x + gx * w, gy);
      c.rotate(rot || -0.03);
      c.font = `${size}px "Aref Ruqaa", "Noto Naskh Arabic", serif`;
      c.fillStyle = gc || 'rgba(40,40,44,0.8)';
      c.textAlign = 'center';
      c.direction = 'rtl';
      c.fillText(text, 0, 0);
      c.restore();
    }
    c.restore();

    // torn edge: slab ends and dangling rebar
    if (torn > 0) {
      c.strokeStyle = '#5a4a3a';
      c.lineWidth = 2;
      for (let f = 1; f < floors; f++) {
        const sy = -f * fh;
        if (sy > top + H * (0.25 + torn * 0.45)) continue;
        const sx = tornLeft ? x + r() * w * 0.4 : x + w - r() * w * 0.4;
        c.fillStyle = color;
        c.fillRect(sx - 30, sy - 8, 60, 10);
        for (let i = 0; i < 4; i++) {
          c.beginPath();
          c.moveTo(sx + (i - 2) * 10, sy);
          c.quadraticCurveTo(sx + (i - 2) * 12, sy + 20, sx + (i - 2) * 14 + (r() - 0.5) * 20, sy + 30 + r() * 30);
          c.stroke();
        }
      }
    }
  });

  // balconies and laundry cast shadows onto the façade
  if (spec.balcony) {
    const [fl, side, hang] = spec.balcony;
    const by = -fl * fh - 8;
    const bx = side < 0.5 ? x + w * 0.15 : x + w * 0.55;
    R.cast((c) => {
      c.save();
      c.translate(bx, by);
      c.rotate(hang || 0);
      c.fillStyle = shade(color, 0.85);
      c.fillRect(0, 0, w * 0.3, 10);
      c.strokeStyle = '#3a3230';
      c.lineWidth = 2;
      c.strokeRect(2, -34, w * 0.3 - 4, 34);
      for (let i = 10; i < w * 0.3; i += 10) {
        c.beginPath();
        c.moveTo(i, -34);
        c.lineTo(i, 0);
        c.stroke();
      }
      if (spec.laundry) {
        c.strokeStyle = '#2a2420';
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(0, -40);
        c.lineTo(w * 0.3, -44);
        c.stroke();
        const cols = ['#9a8a70', '#6f7e86', '#b8a79a', '#7a5a50'];
        for (let i = 0; i < 4; i++) {
          const lx = 8 + i * (w * 0.3 - 16) / 4;
          const sway = Math.sin(t * 1.3 + i) * 2;
          c.fillStyle = cols[i];
          c.beginPath();
          c.moveTo(lx, -41 - i);
          c.lineTo(lx + 16, -41 - i);
          c.lineTo(lx + 16 + sway, -14 - i);
          c.lineTo(lx + sway, -12 - i);
          c.fill();
        }
      }
      c.restore();
    });
  }
  if (spec.dishes) {
    R.cast((c) => {
      for (const [fx, fy] of spec.dishes) {
        const dx = x + fx * w;
        const dy = -fy * fh - fh * 0.3;
        c.fillStyle = '#d8d2c6';
        c.beginPath();
        c.ellipse(dx, dy, 14, 16, -0.4, -Math.PI / 2, Math.PI / 2);
        c.fill();
        c.fillRect(dx - 2, dy, 4, 18);
      }
    });
  }
  if (spec.ac) {
    R.cast((c) => {
      for (const [fx, fy] of spec.ac) {
        c.fillStyle = '#cfc8ba';
        c.fillRect(x + fx * w, -fy * fh - fh * 0.35, 38, 26);
        c.fillStyle = 'rgba(0,0,0,0.3)';
        for (let i = 0; i < 4; i++) c.fillRect(x + fx * w + 4, -fy * fh - fh * 0.35 + 5 + i * 5, 30, 1.5);
      }
    });
  }
}

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${Math.min(255, ((n >> 16) & 255) * k) | 0},${Math.min(255, ((n >> 8) & 255) * k) | 0},${Math.min(255, (n & 255) * k) | 0})`;
}

// The street itself: asphalt, a pavement kerb, dust.
function street(R, x0, x1, { color = '#6e6559', pave = '#8a8072' } = {}) {
  R.paint((c) => {
    c.fillStyle = pave;
    c.fillRect(x0, -4, x1 - x0, 8);
    c.fillStyle = color;
    c.fillRect(x0, 4, x1 - x0, 500);
    const r = rng(8);
    c.fillStyle = 'rgba(40,32,26,0.18)';
    for (let x = x0; x < x1; x += 40) {
      if (r() < 0.35) c.fillRect(x, 10 + r() * 30, 20 + r() * 60, 2);
    }
    // grit and small stones along the kerb
    c.fillStyle = 'rgba(160,150,130,0.6)';
    for (let x = x0; x < x1; x += 12) if (r() < 0.4) c.fillRect(x, 1 + r() * 4, 3, 2);
  });
}

// A heap of broken slabs. Returns nothing; collision is added separately.
function rubble(R, x, w, h, { seed = 5, color = '#a89b86', rebar = true, cast = true } = {}) {
  const draw = (c) => {
    const r = rng(seed);
    c.fillStyle = color;
    c.beginPath();
    const pts = [[x - 10, 2]];
    const n = 9;
    for (let i = 1; i < n; i++) {
      const k = i / n;
      pts.push([x + k * w + (r() - 0.5) * 16, -h * Math.sin(k * Math.PI) * (0.75 + r() * 0.35)]);
    }
    pts.push([x + w + 10, 2]);
    c.moveTo(...pts[0]);
    for (const p of pts.slice(1)) c.lineTo(...p);
    c.closePath();
    c.fill();
    // slab edges and chunks
    for (let i = 0; i < 7; i++) {
      const sx = x + r() * w;
      const sy = -r() * h * 0.8;
      c.save();
      c.translate(sx, sy);
      c.rotate((r() - 0.5) * 1.2);
      c.fillStyle = shade(color.startsWith('#') ? color : '#a89b86', 0.75 + r() * 0.35);
      c.fillRect(-20 - r() * 20, -6, 40 + r() * 30, 10 + r() * 6);
      c.restore();
    }
    if (rebar) {
      c.strokeStyle = '#4a3b2e';
      c.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        const rx = x + r() * w;
        const ry = -h * (0.4 + r() * 0.5);
        c.beginPath();
        c.moveTo(rx, ry);
        c.quadraticCurveTo(rx + (r() - 0.5) * 30, ry - 20, rx + (r() - 0.5) * 50, ry - 30 - r() * 30);
        c.stroke();
      }
    }
  };
  if (cast) R.cast(draw);
  else R.paint(draw);
}

// The sniper curtain: sheets and blankets on a wire across the gap. The
// middle section has sagged where shrapnel cut the wire.
function sniperCurtain(R, x0, x1, t, { wireY = -250, sagFrom, sagTo, sagY = -148 }) {
  R.cast((c) => {
    c.strokeStyle = '#2a2622';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(x0, wireY);
    c.lineTo(sagFrom, wireY + 6);
    c.quadraticCurveTo((sagFrom + sagTo) / 2, sagY - 30, sagTo, wireY + 6);
    c.lineTo(x1, wireY);
    c.stroke();
    const sheets = [
      [x0, sagFrom, '#d9d2c2', 0],
      [sagFrom, sagTo, '#8e6f5a', 1],
      [sagTo, x1, '#6d7a82', 0],
    ];
    for (const [a, b, col, sag] of sheets) {
      const sway = Math.sin(t * 1.2 + a * 0.01) * 5;
      c.fillStyle = col;
      c.beginPath();
      if (sag) {
        c.moveTo(a, wireY + 6);
        c.quadraticCurveTo((a + b) / 2, sagY - 30, b, wireY + 6);
        c.lineTo(b + sway, sagY + 6);
        c.quadraticCurveTo((a + b) / 2 + sway, sagY + 18, a + sway, sagY + 6);
      } else {
        c.moveTo(a, wireY);
        c.lineTo(b, wireY);
        c.lineTo(b + sway, wireY + 150);
        c.quadraticCurveTo((a + b) / 2 + sway, wireY + 160, a + sway, wireY + 150);
      }
      c.closePath();
      c.fill();
      // folds and a stitched seam
      c.strokeStyle = 'rgba(0,0,0,0.18)';
      c.lineWidth = 1.5;
      for (let fx = a + 14; fx < b - 6; fx += 22) {
        c.beginPath();
        c.moveTo(fx, wireY + 10);
        c.lineTo(fx + sway * 0.6, sag ? sagY : wireY + 140);
        c.stroke();
      }
    }
    // shrapnel holes let the light through
    c.fillStyle = '#1a1612';
    for (const [hx, hy] of [[x0 + 30, wireY + 60], [sagTo + 40, wireY + 40], [sagTo + 55, wireY + 90]]) {
      c.beginPath();
      c.arc(hx, hy, 3.5, 0, Math.PI * 2);
      c.fill();
    }
  });
}

// A shopfront with a dented, half-closed rolling shutter.
function shop(R, x, { w = 220, sign = 'دكّان أبو ريّان', open = 0.45 } = {}) {
  R.paint((c) => {
    c.fillStyle = '#1b1612';
    c.fillRect(x, -150, w, 150);
    // empty shelves inside
    c.fillStyle = 'rgba(80,66,52,0.6)';
    for (let i = 0; i < 3; i++) c.fillRect(x + 10, -120 + i * 35, w - 20, 4);
    c.fillStyle = '#8c8a86';
    c.fillRect(x - 4, -160, w + 8, 12);
    // sign
    c.fillStyle = '#2f4a5a';
    c.fillRect(x + 10, -205, w - 20, 38);
    c.fillStyle = '#e8dcc0';
    c.font = '24px "Aref Ruqaa", "Noto Naskh Arabic", serif';
    c.textAlign = 'center';
    c.direction = 'rtl';
    c.fillText(sign, x + w / 2, -178);
  });
  R.cast((c) => {
    const sh = 150 * (1 - open);
    c.fillStyle = '#7d7c78';
    c.beginPath();
    c.moveTo(x, -150);
    c.lineTo(x + w, -150);
    c.lineTo(x + w, -150 + sh);
    c.quadraticCurveTo(x + w * 0.55, -150 + sh + 22, x + w * 0.4, -150 + sh - 4);
    c.lineTo(x, -150 + sh + 6);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.25)';
    c.lineWidth = 1.5;
    for (let y = -146; y < -150 + sh; y += 7) {
      c.beginPath();
      c.moveTo(x, y);
      c.lineTo(x + w, y);
      c.stroke();
    }
  });
}

// A grape vine climbing a broken garden wall.
function vine(R, x, t, { wallH = 110, lush = 1, ripe = false } = {}) {
  R.cast((c) => {
    c.fillStyle = '#b3a58f';
    c.beginPath();
    c.moveTo(x - 70, 0);
    c.lineTo(x - 70, -wallH + 20);
    c.lineTo(x - 30, -wallH);
    c.lineTo(x + 10, -wallH + 30);
    c.lineTo(x + 40, -wallH + 8);
    c.lineTo(x + 70, -wallH + 40);
    c.lineTo(x + 70, 0);
    c.fill();
  });
  R.cast((c) => {
    const r = rng(12);
    c.strokeStyle = '#5a4230';
    c.lineWidth = 4;
    c.beginPath();
    c.moveTo(x + 20, 0);
    c.bezierCurveTo(x + 10, -60, x + 40, -90, x - 20, -wallH - 20);
    c.bezierCurveTo(x - 50, -wallH - 40, x - 10, -wallH - 70, x + 30, -wallH - 60);
    c.stroke();
    for (let i = 0; i < 22 * lush; i++) {
      const k = r();
      const lx = lerp(x + 20, x - 30, k) + (r() - 0.5) * 70;
      const ly = -k * (wallH + 60) - 10 + (r() - 0.5) * 30;
      const sway = Math.sin(t * 1.4 + i) * 1.5;
      c.fillStyle = r() < 0.5 ? '#5f7a3a' : '#6d8a44';
      c.beginPath();
      c.ellipse(lx + sway, ly, 11, 9, r() * 3, 0, Math.PI * 2);
      c.fill();
    }
    // small bunches of grapes
    for (let b = 0; b < 3; b++) {
      const gx = x - 10 + b * 22;
      const gy = -wallH + 6 + b * 8;
      c.fillStyle = ripe ? '#4a2a4a' : '#8ea24a';
      for (let i = 0; i < 7; i++) {
        c.beginPath();
        c.arc(gx + ((i % 3) - 1) * 4, gy + Math.floor(i / 3) * 5, 3, 0, Math.PI * 2);
        c.fill();
      }
    }
  });
}

// The school: a three-storey block with its eastern wing collapsed, a
// basement stairwell, and ground-floor classroom windows.
function school(R, x, t) {
  block(R, { x, w: 520, floors: 3, fh: 130, color: '#c8b999', seed: 44, torn: 0, pocks: 6, graffiti: [['مدرسة', 0.3, -330, 30, 'rgba(60,70,90,0.7)']] }, t);
  // the collapsed east wing: a slope of slabs
  rubble(R, x + 520, 380, 210, { seed: 45, color: '#b9aa8a' });
  // basement stairwell entrance: a low wall and a dark opening
  R.paint((c) => {
    c.fillStyle = '#0d0b09';
    c.fillRect(x + 380, -95, 80, 95);
    c.fillStyle = '#9d9078';
    for (let i = 0; i < 4; i++) c.fillRect(x + 384 + i * 4, -92 + i * 22, 72, 4); // steps going down, seen through
  });
  // classroom windows (for the flashback)
  R.paint((c) => {
    for (let i = 0; i < 3; i++) {
      c.fillStyle = '#2a2420';
      c.fillRect(x + 40 + i * 110, -110, 80, 70);
      c.fillStyle = 'rgba(90,70,50,0.5)';
      c.fillRect(x + 50 + i * 110, -60, 60, 3); // desk tops glimpsed
    }
    c.strokeStyle = '#d9d4c8';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(x + 150, -110);
    c.lineTo(x + 175, -80);
    c.lineTo(x + 160, -60);
    c.stroke(); // cracked pane
  });
}

function roomDoor(R, x, { w = 110, h = 170, light = 'rgba(255,200,140,0.18)' } = {}) {

    c.fillStyle = '#18130f';

    c.fillRect(x, -h, w, h);

function jerryCan(c, x, y, s = 1, color = '#d9b12a') {

  c.fillStyle = color;

// Sorted piles of scrap: rebar, copper, aluminium.
function scrapPiles(R, x, disturbed = 0) {
  R.cast((c) => {
    const r = rng(33);
    const piles = [
      [x, '#5a4a3e', 'rebar'],
      [x + 90, '#a86a3a', 'copper'],
      [x + 170, '#b8bcc0', 'alu'],
    ];
    for (const [px, col, kind] of piles) {
      const sc = disturbed ? 1.6 : 1;
      c.strokeStyle = col;
      c.fillStyle = col;
      c.lineWidth = kind === 'rebar' ? 3 : 2;
      for (let i = 0; i < 12; i++) {
        const ax = px + (r() - 0.5) * 50 * sc;
        const ay = -r() * 22 / sc;
        c.beginPath();
        c.moveTo(ax, ay);
        c.lineTo(ax + (r() - 0.5) * 40, ay - (r() - 0.2) * 10);
        c.stroke();
        if (kind !== 'rebar' && r() < 0.5) c.fillRect(ax, ay - 4, 8, 5);
      }
    }
  });
}

function crater(R, x, w = 180) {
  R.paint((c) => {
    c.fillStyle = '#3a3129';
    c.beginPath();
    c.ellipse(x, 10, w / 2, 16, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#8a7c68';
    const r = rng(9);
    for (let i = 0; i < 14; i++) c.fillRect(x - w / 2 - 30 + r() * (w + 60), -4 - r() * 8, 6 + r() * 12, 4 + r() * 5);
  });
}

// The dead olive tree at the corner: twisted, grey, leafless.
function deadOlive(R, x) {
  R.cast((c) => {
    c.strokeStyle = '#6a625a';
    c.lineCap = 'round';
    const branch = (bx, by, ang, len, w, d) => {
      const ex = bx + Math.cos(ang) * len;
      const ey = by + Math.sin(ang) * len;
      c.lineWidth = w;
      c.beginPath();
      c.moveTo(bx, by);
      c.quadraticCurveTo(bx + Math.cos(ang + 0.4) * len * 0.5, by + Math.sin(ang + 0.4) * len * 0.5, ex, ey);
      c.stroke();
      if (d < 4) {
        branch(ex, ey, ang - 0.45 - d * 0.05, len * 0.7, w * 0.62, d + 1);
        branch(ex, ey, ang + 0.5, len * 0.62, w * 0.6, d + 1);
      }
    };
    branch(x, 0, -Math.PI / 2 - 0.1, 90, 22, 0);
  });
}

function lowWall(R, x, w, h = 70, color = '#a3967f') {
  R.cast((c) => {
    c.fillStyle = color;
    c.fillRect(x, -h, w, h);
    c.fillStyle = 'rgba(0,0,0,0.15)';
    for (let i = 0; i < w; i += 36) c.fillRect(x + i, -h, 2, h);
    c.fillRect(x, -h / 2, w, 2);
  });
}

// A Mi-8 seen side-on in the far sky, rotor a blur.
function helicopter(c, x, y, s, t) {
  c.save();
  c.translate(x, y);
  c.scale(s, s);
  c.fillStyle = '#1c1c20';
  c.beginPath();
  smoothPath(c, [[-60, 0], [-20, -14], [40, -14], [62, -4], [60, 8], [20, 14], [-40, 10]], true);
  c.fill();
  c.fillRect(-120, -6, 70, 6); // tail boom
  c.fillRect(-126, -20, 8, 20);
  c.fillRect(-4, -20, 8, 8);
  c.globalAlpha = 0.35;
  c.fillRect(-90, -24 + Math.sin(t * 60) * 1, 180, 3); // rotor blur
  c.globalAlpha = 1;
  c.restore();
}

function sunLook(g) {
  const k = g.a.sunK;
  const drain = g.a.drain || 0;
  const fog = g.effects.fog;
  const col = mixc([1.0, 0.96, 0.9], [1.0, 0.7, 0.42], k);
  const sunUv = [-0.28 - 0.1 * k, -0.95 + 0.85 * k];
  const lights = [
    { uv: sunUv, color: col, intensity: (1.25 - 0.2 * k) * (1 - fog * 0.45), radius: 0, rim: 0.55 + 0.6 * k },
    { uv: [0.5, -1.2], color: [0.55, 0.62, 0.78], intensity: 0.25 + fog * 0.3, radius: 0, rim: 0.2 },
  ];
  const torch = g.torchLight();
  if (torch) lights.push(torch);
  if (g.a.doorGlow) lights.push({ x: X.door + 30, y: -90, color: [1, 0.72, 0.45], intensity: g.a.doorGlow, radius: 0.15, rim: 0.6 });
  if (g.a.flashAt && g.time - g.a.flashAt < 0.4) {
    const f = 1 - (g.time - g.a.flashAt) / 0.4;
    lights.push({ x: g.a.flashX, y: -60, color: [1, 0.8, 0.55], intensity: 3 * f, radius: 0.5, rim: 1.2 });
  }
  return {
    ambient: mixc([0.3, 0.31, 0.38], [0.27, 0.23, 0.28], k).map((v) => v * (1 - drain * 0.35)),
    lights,
    groundShadow: 0.75 * (1 - fog * 0.6),
    god: fog > 0.15 ? { uv: sunUv, strength: 0.35 * fog } : null,
    bloom: 0.55,
    exposure: 0.86 - drain * 0.1,
    grain: 0.045,
    grade: { sat: lerp(0.9, 0.18, drain), contrast: lerp(1.07, 0.92, drain), lift: -0.01 * drain, tint: [1, 1 - 0.02 * drain, 1 - 0.04 * drain] },
  };
}

const shearFor = (g) => 0.3 + 1.7 * g.a.sunK;

// ---------------------------------------------------------------- sky ----

function skyStops(k) {
  const a = [[0, '#6f8fb4'], [0.45, '#a9bccb'], [0.75, '#d9d3c4']];
  const b = [[0, '#56688e'], [0.45, '#b99b86'], [0.75, '#e8b27a']];
  return a.map(([p, ca], i) => {
    const A = [1, 3, 5].map((j) => parseInt(ca.slice(j, j + 2), 16));
    const B = [1, 3, 5].map((j) => parseInt(b[i][1].slice(j, j + 2), 16));
    return [p, `rgb(${A.map((v, j) => Math.round(lerp(v, B[j], k))).join(',')})`];
  });
}

// A street running away from us, into the gap between two blocks.
function sideStreet(R, x0, x1, { minaret = false, t = 0, curtainWindow = false } = {}) {
  const xc = (x0 + x1) / 2;
  const vy = -70;
  R.paint((c) => {
    // road narrowing to the vanishing point
    c.fillStyle = '#7a7064';
    c.beginPath();
    c.moveTo(x0, 4);
    c.lineTo(xc - 22, vy);
    c.lineTo(xc + 22, vy);
    c.lineTo(x1, 4);
    c.fill();
    // receding façades either side
    const side = (edge, dir, col) => {
      c.fillStyle = col;
      c.beginPath();
      c.moveTo(edge, 4);
      c.lineTo(edge, -520);
      c.lineTo(xc + dir * 30, vy - 150);
      c.lineTo(xc + dir * 30, vy);
      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(30,24,20,0.55)';
      for (let i = 0; i < 5; i++) {
        const k = i / 5;
        const wx = lerp(edge, xc + dir * 30, k + 0.08);
        const top = lerp(-470, vy - 140, k + 0.08);
        const bot = lerp(-60, vy - 10, k + 0.08);
        for (let f = 0; f < 3; f++) {
          const wy = lerp(top, bot, f / 3 + 0.08);
          c.fillRect(wx - 6 * (1 - k), wy, 12 * (1 - k) + 2, 26 * (1 - k) + 3);
        }
      }
    };
    side(x0, -1, '#9d917d');
    side(x1, 1, '#8c806e');
    if (minaret) T.minaret(c, xc + 8, vy + 10, 0.55, '#8a7e6c');
    if (curtainWindow) {
      // a window across the far street, a curtain lifting in it
      c.fillStyle = '#b4a893';
      c.fillRect(xc - 70, vy - 170, 140, 170);
      c.fillStyle = '#231d19';
      c.fillRect(xc - 25, vy - 130, 50, 44);
      c.fillStyle = '#c9c0b0';
      const lift = 0.5 + 0.5 * Math.sin(t * 2.1);
      c.beginPath();
      c.moveTo(xc - 25, vy - 130);
      c.lineTo(xc + 5, vy - 130);
      c.quadraticCurveTo(xc + 5 + lift * 10, vy - 105, xc - 5 + lift * 18, vy - 86);
      c.lineTo(xc - 25, vy - 86);
      c.fill();
    }
  });
}

        g.a.holdKhaled = X.junction - 60;
        g.a.curtainCleared = true;
        yield () => g.player.x > X.sag1 + 10;
        if (g.player.stance !== 'stand') g.prompt('crouch', 'قوم', 'Stand up');
        yield () => g.player.stance === 'stand';
        g.prompt(null);
      })(),
    );
    g.runner.run(ambientShots(g));

    yield* talk(g, [
      [KHALED, ['عارف شو أكتر شي بشتاقلو؟', 'You know what I miss most?']],
      [SAMI, ['الكهربا.', 'Electricity.']],
      [KHALED, ['لا يا زلمة. البوظة. بوظة بكداش.', 'No, man. Ice cream. Bakdash ice cream.']],
      [SAMI, ['من كل شي عم يصير، البوظة؟', 'Out of everything that’s happening, ice cream?']],
      [KHALED, ['إي والله. هديك البوظة العربية بالفستق الحلبي. بتذكّر كنّا نروح أنا وياك عالحميدية ونوقف بالطابور ربع ساعة؟', 'I swear. That Arabic ice cream with Aleppo pistachios. Remember we used to go to the Hamidiyya and queue for fifteen minutes?']],
      [SAMI, ['نص ساعة.', 'Half an hour.']],
      [KHALED, ['بتستاهل كل دقيقة.', 'Worth every minute.']],
    ]);
    yield () => g.player.x > X.pigeon + 60;
    yield 1;
    yield* talk(g, [
      [SAMI, ['كيف الولاد اليوم؟', 'How were the kids today?']],
      [KHALED, ['منيحين. عم يتعلّمو ماضي وحاضر ومستقبل.', 'Good. They’re learning past, present and future.']],
      [SAMI, ['بالقواعد تقصد.', 'You mean in grammar.']],
      [KHALED, ['هيك قلت.', 'That’s what I said.']],
    ]);

    yield () => curtain.done || g.a.curtainCleared;
    yield () => kh.x > X.sag0 + 20;
    yield* talk(g, [
      [KHALED, ['يا ريت كانت بوظة بكداش بتحمي من القنّاص.', 'If only Bakdash ice cream could protect you from snipers.']],
      [SAMI, ['لو هيك كانت أغلى من الدهب.', 'If it could, it’d be worth more than gold.']],
    ]);
    yield () => curtain.done;

    // Rami, who asked what "abroad" means.
    yield* talk(g, [
      [KHALED, ['بتعرف رامي؟ ابن أبو علي؟ اللي ساكنين بآخر الشارع؟', 'You know Rami? Abu Ali’s son? The ones who live at the end of the street?']],
      [SAMI, ['الصغير؟ اللي ما بيوقف حكي؟', 'The little one? Who never stops talking?']],
    ]);
    // the rubble: climb it
    const climbPrompt = g.runner.run(
      (function* () {
        yield () => g.player.x > X.wall0 - 90;
        if (g.player.x < X.wall1) g.prompt('jump', 'نطّ / اطلع', 'Jump / Climb');
        yield () => g.player.x > X.wall0 + 20 || g.player.mantle;
        g.prompt(null);
      })(),
    );
    yield* talk(g, [
      [KHALED, ['هاد. سألني اليوم: أستاز، شو يعني "برّا"؟', 'That’s him. He asked me today: “Teacher, what does ‘abroad’ mean?”']],
    ]);
    yield 1.2;
    yield* talk(g, [
      [KHALED, ['يعني ما بيعرف. ما طلع من هون بحياتو. ما شاف شي غير هالحارة. "برّا" بالنسبالو كلمة مثل "تنّين" — شي بيسمع فيه بس ما شافو.', 'He doesn’t know. He’s never been outside this neighbourhood in his life. He’s never seen anything else. “Abroad” is like “dragon” to him — something he’s heard of but never seen.']],
    ]);
    yield () => climbPrompt.done;

    // The parting.
    yield () => g.a.reachedJunction && kh.x >= X.junction - 70;
    yield* this.parting(g);
  },

  *parting(g) {
    const kh = g.khaled;
    const p = g.player;
    g.lock();
    g.text.objective(null);
    g.a.khaledMode = 'script';
    yield* g.walkPlayer(X.junction - 150);
    p.f = 1;
    kh.f = -1;
    kh.override = P_TURNED;
    g.camOverride = { x: X.junction - 60, y: -240, view: 1150 };
    g.a.sunK = 0.1;
    g.sound.ambience({ generator: 0.25, air: 0.4 });
    yield 0.6;
    yield* talk(g, [
      [KHALED, ['يلا، أنا رايح من هون. بدي مرّ عند أم سعيد وعيلتا — بنتن مريضة وما في حدا يشوفها.', 'Right, I’m heading off from here. I want to check on Um Said and her family — their daughter’s ill and there’s no one to see her.']],
      [SAMI, ['من وين رايح؟ من شارع المدرسة؟', 'Which way are you going? Through School Street?']],
      [KHALED, ['إي، أسرع.', 'Yeah, it’s quicker.']],
    ]);
    yield 0.8; // he considers saying something
    yield* talk(g, [
      [SAMI, ['خلّي بالك ع حالك.', 'Take care of yourself.']],
      [KHALED, ['دايماً. بشوفك بالليل إن شاء الله. عندي نكتة جديدة — مو رح تصدّقها.', 'Always. I’ll see you tonight, God willing. I’ve got a new joke — you won’t believe it.']],
      [SAMI, ['نكاتك ما بتنضحك.', 'Your jokes aren’t funny.']],
      [KHALED, ['هاي الأحلى من كلهن. الليلة بتسمعها.', 'This one’s the best yet. Tonight, you’ll hear it.']],
      [KHALED, ['يلا، يا هندسة.', 'See you, ya handasa.']],
    ]);
    kh.override = POSES.wave;
    yield 1.1;
    kh.override = null;
    // He walks to the mouth of the southern road, then away down it.
    yield* g.walkNpc(kh, X.junction - 10);
    g.a.khaledMode = 'depth';
    kh.face('back');
    g.camOverride = { x: X.junction - 80, y: -230, view: 1050 };

    g.a.occluder = null;
    // The street is empty. A beat of silence, then the world again.
    g.sound.ambience({ generator: 0, air: 0.1, wind: 0.1 }, 0.5);
    yield 2.5;
    g.sound.ambience({ generator: 0.5, air: 0.5, wind: 0.35 }, 3);
    g.sound.pigeons();
    yield 1.5;
    g.camOverride = null;

  // ============================================================ Scene 3 ==

  buildHour(g) {
    const L = g.level;
    const s = g.state;
    const old = g.npc('oldman', X.oldMan, { f: 1 });
    old.override = P_STRUGGLE;
    g.oldMan = old;
    g.a.cansOnGround = 2;

    L.at(X.oldMan - 150, () => g.runner.run(this.oldManScene(g)));

    // the corner: look before you cross
    g.a.mirrorChecked = false;
    const prevGate = g.gate;
    g.gate = (move) => {
      if (prevGate) move = prevGate(move);
      if (!g.a.mirrorChecked && move > 0 && g.player.x > X.corner - 40) {
        if (!g.a.cornerWarned) {
          g.a.cornerWarned = true;
          g.runner.run(this.cornerWarn(g));
        }
        return 0;
      }
      return move;
    };

    // the spotter's post, on an exposed third-floor slab
    L.solid(X.spotter - 150, X.spotter + 150, -412, -398, { noClimb: true });
    const sp = g.npc('spotter', X.spotter + 30, { y: -412, f: -1 });
    sp.override = POSES.binoculars;
    g.spotter = sp;
    L.at(X.spotter - 220, () => g.runner.run(this.spotterScene(g)));

    L.at(X.heli, () => g.runner.run(this.helicopter(g)));
    L.at(X.oldMan + 500, () => (g.a.sunK = Math.max(g.a.sunK, 0.3)));
  },

  *oldManScene(g) {

    p.f = 1;
    yield* g.say(null, ['غالونين مي. عشرين ليتر الواحد. من البير لهون مسافة ربع ساعة. بالحر هاد، ساعة.', 'Two water jugs. Twenty litres each. From the well to here, a fifteen-minute walk. In this heat, an hour.'], 5.5, 'examine');
    const i = yield* g.choose(null, [
      { ar: 'ساعدو', en: 'Help him' },
      { ar: 'ضل ماشي', en: 'Keep walking' },
    ]);

    if (i === 0) {
      g.state.compassion += 1;
      g.state.helped_old_man = true;

      old.f = -1;
      old.override = { ...POSES.stand, torso: 0.1 };
      yield* g.say(OLD, ['الله يخلّيك يا ابني...', 'God bless you, son...']);
      yield GAP;

      p.rig.prop = (c, hand) => jerryCan(c, hand[0], hand[1] + 44, 0.95);
      old.carry = true;
      old.override = null;
      old.rig.prop = (c, hand) => jerryCan(c, hand[0], hand[1] + 44, 0.95, '#d4a82a');
      g.sound.slosh();
      yield* g.say(SAMI, ['لوين بدك توصّلهن؟', 'Where do you need to get these?']);
      yield GAP;
      yield* g.say(OLD, ['هون، ع آخر الزقاق. بنتي وولادها. ما عندهن مي من مبارح.', 'Here, at the end of the alley. My daughter and her children. They’ve had no water since yesterday.']);
      // walk together, slowly
      g.runner.run(g.walkNpc(old, X.door + 70, { speedScale: 0.6 }));
      g.runner.run(
        (function* () {
          yield 2;
          yield* g.say(OLD, ['كنت بشيل زيتون من الضيعة، شوالين عكتافي، وما كنت حسّ فيهن. هلّق غالون مي بيكسرني.', 'I used to carry olives from the village, sacks on my shoulders, and feel nothing. Now a jug of water breaks me.'], 6);
        })(),
      );
      yield* g.walkPlayer(X.door - 40);
      yield () => old.goal === null;
      p.f = 1;
      old.f = -1;
      g.sound.noise({ dur: 0.08, freq: 400, q: 2, vol: 0.3 });
      yield 0.25;
      g.sound.noise({ dur: 0.08, freq: 400, q: 2, vol: 0.3 });
      yield 1;
      g.a.doorOpen = 0.35;
      g.a.doorGlow = 0.4;
      p.carry = false;
      p.rig.prop = null;
      yield* talk(g, [
        [OLD, ['الله يحميك. شو اسمك؟', 'God protect you. What’s your name?']],
        [SAMI, ['سامي.', 'Sami.']],
        [OLD, ['الله يحمي أهلك يا سامي.', 'God protect your family, Sami.']],
      ]);
      old.face('back');
      yield 0.7;
      old.visible = false;
      g.a.doorOpen = 0;
      g.a.doorGlow = 0;
      g.sound.noise({ dur: 0.15, freq: 300, q: 1, vol: 0.3 });
    } else {
      g.state.isolation += 1;
      g.state.helped_old_man = false;
      g.lock(false);
      // No judgement. The camera lingers on him a moment, then follows Sami.
      yield () => p.x > X.oldMan + 90;

  *cornerWarn(g) {
    if (!g.hasTool('mirror')) {
      yield* g.say(null, ['المفرق مكشوف عالغرب. أحسن ما تطلع قبل ما تشوف شو في.', 'The intersection is exposed to the west. Better not to step out before you see what’s there.'], 4.5, 'examine');
      g.a.cornerWarned = false;
      return;
    }
    g.active = 'mirror';
    g.prompt('use', 'استعمل المراية', 'Use the mirror');

    g.prompt(null);

  *mirrorPeek(g) {

    p.f = 1;
    p.override = POSES.mirror;

  *spotterScene(g) {

    g.lock();

    p.f = 1;
    sp.override = { ...POSES.stand, torso: 0.2, head: 0.5 };

    yield GAP;

    yield* g.say(SAMI, ['رايح عالشرقي. عالأنابيب.', 'Heading to the eastern quarter. To the pipes.']);
    yield GAP;
    yield* g.say(SPOT, ['خود هاد. أحسنلك.', 'Take this. Better for you.']);
    // the walkie-talkie comes down on a rope

    };
    p.override = null;

    g.lock();
    g.giveTool('walkie');

    yield* g.say(SPOT, ['الموجة ٣. إذا سمعت "مروحي" أو "حربي" — انبطح. إذا سمعت "فيل" — الله يستر.', 'Channel 3. If you hear “mirwahi” (helicopter) or “harbi” (jet) — get flat. If you hear “elephant” — God help us.'], 6);
    sp.override = POSES.binoculars;

  *helicopter(g) {
    const p = g.player;
    g.sound.score?.mood('danger', 3);
    g.a.sunK = Math.max(g.a.sunK, 0.4);
    g.sound.radio(2.4);
    yield* g.say(RADIO, ['...مروحي... مروحي فوق الشرقي... مروحي...', '...helicopter... helicopter over the eastern quarter... helicopter...'], 3.5, 'radio');
    g.sound.helicopter(12);
    g.a.heli = { t0: g.time + 1.5, dur: 10, x0: p.x * 0.35 + 900, x1: p.x * 0.35 - 900 };
    g.prompt('prone', 'انبطح!', 'Get down!');
    const t0 = g.time;

    g.prompt(null);
    g.lock();
    if (p.stance !== 'prone') {
      p.stance = 'prone'; // the body knows before the mind does
    }
    // The helplessness is the lesson: lie there and listen.
    g.camOverride = { x: p.x + 40, y: -200, view: 1250 };

    g.bump(0.15);

    g.a.plumeX = g.cam.x * 0.3 - 420;

    g.sound.radio(2.2);
    yield* g.say(RADIO, ['...نزل برميل... عالحارة القبلية... نزل برميل...', '...barrel dropped... the southern quarter... barrel dropped...'], 4, 'radio');
    g.lock(false);
    g.prompt('jump', 'قوم', 'Get up');
    yield () => p.stance === 'stand';
    g.prompt(null);

  // ======================================================= the school ====

  buildSchool(g) {
    const L = g.level;
    const kids = [];
    const mk = (outfit, x, f, pose) => {
      const k = g.npc(outfit, x, { f, scale: outfit === 'layla' ? 0.64 : 0.58 });
      k.override = pose;
      kids.push(k);
      return k;
    };
    g.layla = mk('layla', X.layla, 1, POSES.sort);
    g.boy = mk('boy', X.layla + 60, -1, POSES.sort);
    g.boy.rig.scale = 0.5;
    const runners = [mk('kid2', X.scrap + 120, -1, POSES.sort), mk('kid3', X.scrap + 210, 1, POSES.sort), mk('fadi', 7200, 1, POSES.sort)];
    runners[2].rig.scale = 0.6;
    g.kids = kids;
    g.runnerKids = runners;
    // the others play: dash between piles, calling out finds
    runners.forEach((k, i) => {
      k.play = true;
      k.brain = (dt) => {
        if (k.hide) {
          if (k.goTo(X.stairs, dt, { run: true })) enterDoor(g, k);
          return;
        }
        if (k.play) {
          if (k.goal === null || k.goal === undefined) {
            k.override = null;
            k.goal = X.scrap - 120 + ((Math.sin(g.time * 0.7 + i * 2) + 1) / 2) * 360;
          }
          if (k.goTo(k.goal, dt, { run: true, speedScale: 0.7 })) {
            k.goal = null;
          }
        } else k.update(dt, {});
      };
    });

    L.add({
      id: 'layla',
      x: X.layla,
      y: -130,
      range: 80,
      label: ['احكي مع ليلى', 'Talk to Layla'],
      enabled: () => !g.a.laylaTalked && !g.a.shelling,
      use: () => {
        g.a.laylaTalked = true;
        g.runner.run(this.laylaTalk(g));
      },
    });

    // the cat (after the shelling)
    const cat = new Cat();
    cat.x = X.catWall;
    cat.y = -148;
    cat.f = -1;
    cat.hidden = true;
    g.cat = cat;
    L.add({
      id: 'cat',
      x: X.catWall,
      y: -200,
      range: 110,
      label: ['البسّة', 'The cat'],
      enabled: () => !cat.hidden && !g.a.catDone,
      use: () => g.runner.run(this.catScene(g)),
    });

    L.at(6950, () => {
      g.checkpoint('school');
      g.a.sunK = Math.max(g.a.sunK, 0.55);
      g.sound.ambience({ crowd: 0.35, generator: 0.1 });
    });
    L.at(X.scrap + 150, () => g.runner.run(this.shelling(g)));
    L.at(X.classroom - 30, () => {
      if (g.a.shellingDone) g.runner.run(this.flashback(g));
      else g.a.flashbackPending = true;
    });
  },

  *laylaTalk(g) {
    g.lock();
    g.player.f = -1;
    yield* g.say(LAYLA, ['بتعرف قدّيش كيلو حديد لازم الواحد يلمّ لحتى يشتري كيس برغل؟', 'Do you know how many kilos of scrap metal you need to collect for a bag of bulgur?'], 5);
    yield GAP;
    yield* g.say(SAMI, ['كم؟', 'How many?']);
    yield GAP;
    yield* g.say(LAYLA, ['كتير.', 'A lot.']);
    g.lock(false);
  },

  *shelling(g) {
    const p = g.player;
    const s = g.state;
    g.a.shelling = true;
    g.sound.score?.mood('danger', 1.5);
    g.a.sunK = Math.max(g.a.sunK, 0.62);
    const impact = (x, dist) => {
      g.sound.mortarImpact(dist);
      g.effects.blast(x, 0, dist < 1.5 ? 1 : 0.6);
      g.a.flashAt = g.time;
      g.a.flashX = x;
      g.bump(dist < 1.5 ? 0.6 : 0.3);
    };
    const kidsFreeze = () => {
      for (const k of [...g.kids]) {
        k.play = false;
        k.goal = null;
        k.override = { ...POSES.stand, head: -0.35 };
      }
    };
    g.lock();
    g.sound.mortarWhistle(1.4);
    yield 1.4;
    impact(6880, 2.2);
    kidsFreeze();
    yield 0.9;
    g.sound.mortarWhistle(1.2);
    yield 1.2;
    impact(7120, 1.4);
    g.sound.carAlarm(10);
    // most of them run for the basement stairs; Layla and the little one freeze
    for (const k of g.runnerKids) {
      k.override = null;
      k.hide = true;
    }
    g.boy.override = { ...POSES.grief, torso: 0.3 };
    g.layla.override = { ...POSES.stand, head: -0.3, armN: 0.4, foreN: 0.9 };
    // shells keep walking in, away from the children
    const barrage = g.runner.run(
      (function* () {
        const xs = [6990, 7220, 7060, 7290, 6930];
        for (const x of xs) {
          g.sound.mortarWhistle(1.1);
          yield 1.1;
          impact(x, Math.abs(x - p.x) / 300);
          yield 0.6 + Math.random() * 0.8;
          if (g.a.stopBarrage) return;
        }
      })(),
    );
    const i = yield* g.choose(null, [
      { ar: 'احمي الولاد', en: 'Shield the children' },
      { ar: 'تخبّى', en: 'Take cover' },
    ], { timed: 7, def: 1 });
    s.choices.push(`B${i + 1}`);

    if (i === 0) {
      s.compassion += 1;
      s.children_helped = true;
      g.lock(false);
      g.text.objective(['خود ليلى والصغير عالدرج', 'Get Layla and the boy to the stairs']);
      g.prompt('run', 'اركض', 'Run');
      const grabbed = { v: false };
      g.level.add({ id: 'grab', urgent: true, x: (X.layla + g.boy.x) / 2, y: -110, range: 110, label: ['خدهن', 'Take them'], use: () => (grabbed.v = true) });
      yield () => grabbed.v;
      g.level.remove('grab');
      g.prompt(null);
      g.line(SAMI, ['يلا يلا يلا! عالدرج!', 'Go go go! To the stairs!'], 2.5, 'shout');
      // they run with him, crouched, his body between them and the sky
      for (const [k, off] of [[g.layla, -40], [g.boy, -80]]) {
        k.override = null;
        k.brain = (dt) => k.goTo(Math.min(g.player.x + off, X.stairs), dt, { run: true });
      }
      g.runner.run(
        (function* () {
          yield 1.2;
          g.sound.mortarWhistle(1);
          yield 1;
          impact(X.scrap + 40, 0.9); // lands in the open area behind them
          g.a.crater = true;
          yield 1.5;
          g.sound.mortarWhistle(1);
          yield 1;
          impact(X.stairs - 380, 0.8);
        })(),
      );
      g.text.objective(['عالدرج', 'To the stairs']);
      yield () => g.player.x >= X.stairs - 20;
      g.text.objective(null);
      g.lock();
      g.a.stopBarrage = true;
      yield* this.stairwell(g);
    } else {
      s.isolation += 1;
      // dive behind the nearest wall
      yield* g.walkPlayer(X.lowWall + 20, { run: true });
      p.f = -1;
      p.stance = 'prone';
      // Layla pulls the little one to the basement on her own
      g.layla.override = null;
      g.boy.override = null;
      g.layla.brain = (dt) => {
        if (g.layla.goTo(X.stairs, dt, { run: true })) enterDoor(g, g.layla);
      };
      g.boy.brain = (dt) => {
        if (g.boy.goTo(Math.min(g.layla.x - 30, X.stairs), dt, { run: true }) && !g.layla.visible) enterDoor(g, g.boy);
      };
      g.camOverride = { x: X.lowWall - 120, y: -200, view: 1300 };
      yield 2.2;
      g.sound.mortarWhistle(1);
      yield 1;
      impact(X.scrap + 40, 0.9);
      g.a.crater = true;
      yield 2.5;
      g.sound.mortarWhistle(1.2);
      yield 1.2;
      impact(6960, 2.4);
      yield () => !g.layla.visible;
      yield 2;
      g.camOverride = null;
      g.a.stopBarrage = true;
    }

    // After: ringing silence, settling rubble, dust like fog.
    yield () => barrage.done;
    g.sound.ringing(1);
    g.sound.setMuffle(0.55, 0.4);
    g.effects.fog = Math.max(g.effects.fog, 0.8);
    yield 2.5;
    g.sound.ringing(0, 3);
    g.sound.setMuffle(0, 4);
    for (const k of g.kids) k.visible = false;
    g.a.crater = true;
    g.a.shelling = false;
    g.a.shellingDone = true;
    g.sound.score?.mood('hour', 12);
    g.player.rig.dust = 0.7;
    g.player.stance = g.player.stance === 'prone' ? 'prone' : 'stand';
    g.lock(false);
    if (g.player.stance !== 'stand') {
      g.prompt('jump', 'قوم', 'Get up');
      yield () => g.player.stance === 'stand';
      g.prompt(null);
    }
    g.sound.ambience({ crowd: 0, generator: 0, air: 0.35, wind: 0.3 });
    g.cat.hidden = false;
    writeSave(g.state);
    if (g.a.flashbackPending) g.runner.run(this.flashback(g));
  },

  *stairwell(g) {
    const p = g.player;
    g.fade = 1;
    yield 0.4;
    g.scene = 'stairwell';
    g.camOverride = { x: -60, y: -300, view: 1400 };
    g.snapCamera();
    const saved = { x: p.x, f: p.f };
    const bounds = g.level.bounds;
    g.level.bounds = [-2000, bounds[1]];
    p.place(-120);
    p.f = 1;
    p.stance = 'crouch';
    const mkKid = (outfit, x, f, pose, scale) => {
      const w = new Walker(g.level, outfit, scale);
      w.place(x);
      w.f = f;
      w.override = pose;
      w.update(0.016, {});
      return w;
    };
    const eyesShut = { ...POSES.crouch, head: 0.4, torso: 0.3 };
    g.stairKids = [
      mkKid('kid2', -420, 1, { ...POSES.crouch, head: 0.2 }, 0.58),
      mkKid('kid3', -300, 1, { ...POSES.crouch, head: 0.3 }, 0.58),
      mkKid('layla', 120, -1, eyesShut, 0.64),
      mkKid('boy', 220, -1, { ...POSES.kneel, head: 0.3 }, 0.5),
    ];
    g.stairKids.forEach((w) => {
      w.stance = 'crouch';
    });
    g.sound.setMuffle(0.6, 0.3);
    g.fade = 0;
    // the torch comes to hand; wait for the player to light it (or a few seconds)
    g.active = 'torch';
    if (!g.torch.on) g.prompt('use', 'شغّل الكشّاف', 'Torch');
    const t0 = g.time;
    g.runner.run(
      (function* () {
        for (let i = 0; i < 2; i++) {
          yield 1.4 + i;
          g.sound.mortarImpact(2.5);
          g.effects.trickle(-100 + i * 200, -640, 3);
          g.bump(0.25);
        }
      })(),
    );
    yield 3.5;
    yield () => g.torch.on || g.time - t0 > 9;
    g.prompt(null);
    p.override = { ...POSES.crouch, armN: 0.2, foreN: 0.9, armF: 0.1, foreF: 0.8, head: 0.2 }; // hands pressed flat to his knees
    yield* g.say(LAYLA, ['شكراً.', 'Thank you.'], 3);
    yield GAP;
    yield* g.say(SAMI, ['ابقوا هون. لا تطلعوا لحتى يهدا.', 'Stay here. Don’t come out until it’s quiet.'], 4);
    yield 1.5;
    g.fade = 1;
    yield 0.5;
    g.scene = 'street';
    g.level.bounds = bounds;
    g.stairKids = null;
    p.override = null;
    p.place(saved.x + 20);
    p.f = 1;
    p.stance = 'stand';
    g.camOverride = null;
    g.snapCamera();
    g.fade = 0;
  },

  *catScene(g) {
    const cat = g.cat;
    g.a.catDone = true;
    g.lock();
    g.player.f = g.player.x < cat.x ? 1 : -1;
    g.camOverride = { x: (g.player.x + cat.x) / 2, y: -220, view: 1000 };
    yield 1;
    // one slow blink
    const t0 = g.time;
    yield () => {
      const k = (g.time - t0) / 1.4;
      cat.blink = Math.sin(clamp(k) * Math.PI);
      return k >= 1;
    };
    yield* g.say(null, ['بسّة. مو جوعانة أكتر من أي حدا هون. وعم تستنى نفس الشي: إنو يخلص.', 'A cat. No hungrier than anyone else here. Waiting for the same thing: for it to end.'], 6, 'examine');
    yield 1.2;
    // it turns, drops off the wall, and is gone into the rubble without a sound
    cat.f = 1;
    const t1 = g.time;
    yield () => {
      const k = (g.time - t1) / 1.6;
      cat.sit = 1 - clamp(k * 3);
      cat.x = X.catWall + k * 90;
      cat.y = -148 + Math.max(0, k - 0.35) * 260;
      cat.speed = 60;
      if (k >= 1) cat.hidden = true;
      return k >= 1;
    };
    g.camOverride = null;
    g.lock(false);
  },

  *flashback(g) {
    if (g.a.flashbackStarted) return;
    g.a.flashbackStarted = true;
    const p = g.player;
    g.lock();
    p.f = -1;
    g.camOverride = { x: X.classroom - 60, y: -150, view: 900 };
    yield 2.2;
    g.fade = 1;
    yield 0.8;
    // An evening in 2010. Everything whole.
    g.scene = 'flashback';
    g.a.flashFade = 0;
    g.camOverride = { x: 0, y: -210, view: 1150 };
    g.snapCamera();
    const young = (outfit, x, f) => {
      const w = new Walker(g.level, outfit);
      w.place(x);
      w.f = f;
      w.override = { ...POSES.sitGround, torso: 0.05 };
      w.update(0.016, {});
      w.brain = null;
      return w;
    };
    const ks = young('khaled', 90, -1);
    const ss = young('sami', -90, 1);
    ks.rig.o = { ...ks.rig.o, beard: 'stubble' };
    ss.rig.o = { ...ss.rig.o, beard: 'none', top: '#7a6f84' };
    g.flashActors = [ss, ks];
    g.sound.ambience({ traffic: 0.7, crowd: 0.25, wind: 0.1, air: 0, generator: 0 }, 1);
    g.sound.score?.mood('memory', 1.5);
    g.text.titleCard([['٢٠١٠', '2010']], 3);
    g.fade = 0;
    const horns = g.runner.run(
      (function* () {
        while (g.scene === 'flashback') {
          yield 3 + Math.random() * 4;
          if (g.scene !== 'flashback') return;
          if (Math.random() < 0.5) g.sound.horn();
          else g.sound.birds();
        }
      })(),
    );
    yield 2.5;
    ks.override = { ...POSES.sitGround, armN: 2.6, foreN: 2.9 }; // picks a grape
    yield 1;
    ks.override = { ...POSES.sitGround, armN: 1.4, foreN: 2.6 };
    yield* talk(g, [
      [KHALED, ['بتعرف شو بدي أعمل لمّا خلّص تدريب المعلمين؟', 'You know what I’m going to do when I finish teacher training?']],
      [SAMI, ['شو؟', 'What?']],
      [KHALED, ['بدي افتح مدرسة. مو مدرسة حكومية — مدرسة خاصة. ببيت. غرفة وحدة، كراسي وطبشور، وكتب كتير.', 'I’m going to open a school. Not a government school — a private one. In a house. One room, chairs, chalk, and lots of books.']],
      [SAMI, ['وبتعلّم فيها شعر.', 'And you’ll teach poetry.']],
      [KHALED, ['بعلّم فيها كل شي. قواعد وشعر وعلوم وكيف الواحد يفكّر لحالو.', 'I’ll teach everything. Grammar and poetry and science and how to think for yourself.']],
    ]);
    ks.override = { ...POSES.sitGround };
    yield 1.2;
    yield* g.say(SAMI, ['كيف الواحد يفكّر لحالو. بهالبلد.', 'How to think for yourself. In this country.']);
    yield GAP;
    // He lowers his voice — instinctively, the way everyone does.
    ks.override = { ...POSES.sitGround, torso: 0.3, head: 0.2 };
    g.sound.ambience({ traffic: 0.35, crowd: 0.1 }, 0.8);
    yield 0.8;
    yield* g.say(KHALED, ['هلّق لا. بس مو لازم يضل هيك.', 'Not now. But it doesn’t have to stay this way.'], 4.5, 'whisper');
    yield 1;
    ss.override = { ...POSES.sitGround, head: -0.45 }; // looks up at the arbour
    g.sound.birds();
    yield 2.4;
    // The song distorts. The garden fades into dust, wind, distance.
    g.sound.setMuffle(0.85, 1.2);
    const t0 = g.time;
    yield () => {
      g.a.flashFade = clamp((g.time - t0) / 1.6);
      return g.a.flashFade >= 1;
    };
    g.fade = 1;
    g.sound.score?.cut('hour', 3);
    yield 0.4;
    g.scene = 'street';
    g.flashActors = null;
    g.a.flashFade = 0;
    horns.done = true;
    g.sound.setMuffle(0, 0.2);
    g.sound.ambience({ traffic: 0, crowd: 0, wind: 0.35, air: 0.4, generator: 0.2 }, 0.3);
    g.camOverride = { x: X.classroom - 60, y: -150, view: 900 };
    g.snapCamera();
    g.fade = 0;
    g.sound.pigeons(); // the bird is a pigeon, and it flies away
    g.effects.trickle(X.classroom - 20, -130, 1.5);
    yield 2.2;
    g.camOverride = null;
    g.sound.radio(1.2);
    g.checkpoint('news');
    g.a.sunK = Math.max(g.a.sunK, 0.8);
    g.lock(false);
  },

  // ========================================================= Scene 4 ====

  buildNews(g) {
    const L = g.level;
    const people = [
      g.npc('woman', X.kerb + 140, { f: -1 }),
      g.npc('man', X.olive + 60, { f: -1 }),
      g.npc('woman2', X.olive + 130, { f: -1 }),
      g.npc('man', X.olive - 10, { f: 1 }),
    ];
    // a woman sits on the kerb, her face in her hands
    people[0].override = { ...POSES.kerb, head: 0.8, armN: 1.3, foreN: 2.7, armF: 1.2, foreF: 2.6 };
    people[1].override = { ...POSES.stand, head: 0.2 };
    people[2].override = { ...POSES.hands, head: 0.1 };
    people[3].override = { ...POSES.stand, head: 0.1, armN: 1.3, foreN: 2.5 }; // on the walkie-talkie
    people[3].rig.prop = (c, hand) => {
      c.fillStyle = '#1c1c1e';
      c.fillRect(hand[0] - 4, hand[1] - 20, 8, 22);
    };
    g.newsPeople = people;
    g.walkieMan = people[3];
    const abu = g.npc('abuyazan', X.abu, { f: -1 });
    abu.override = { ...POSES.stand, head: 0.05 };
    g.abu = abu;
    // He isn't at the corner yet: he comes up out of the southern street,
    // towards us, a little before Sami gets there.
    abu.visible = false;
    g.a.abuArrived = false;
    L.at(X.newsStart - 350, () => g.runner.run(this.abuArrives(g)));

    L.at(X.newsStart, () => {
      g.sound.ambience({ crowd: 0.5, generator: 0, wind: 0.2, air: 0.3 }, 3);
      g.a.sunK = Math.max(g.a.sunK, 0.9);
    });
    L.at(X.kerb - 120, () => g.runner.run(this.news(g)));
    // a jet, somewhere over the next town: the other word on channel 3
    L.at(X.battery + 380, () => g.runner.run(this.jet(g)));
  },

  *jet(g) {
    g.sound.radio(1.8);
    yield* g.say(RADIO, ['...حربي بالجو... حربي...', '...jet in the air... jet...'], 3, 'radio');
    g.sound.jet(7);
    g.a.jet = { t0: g.time + 0.8, dur: 5, x0: g.cam.x * 0.12 - 900, x1: g.cam.x * 0.12 + 1100 };
    yield 5.2;
    g.sound.strikeFar();
    g.bump(0.25);
    g.a.fil = { x: g.cam.x * 0.3 + 520, t: g.time };
    yield 2.5;
    g.sound.radio(1.6);
    yield* g.say(RADIO, ['...ضرب حربي... عالمرج... ضرب حربي...', '...airstrike... out by the farms... airstrike...'], 3.5, 'radio');
  },

  *abuArrives(g) {
    const abu = g.abu;
    abu.override = null;
    abu.place(X.south);
    abu.visible = true;
    abu.rig.view = 'front';
    abu.rig.viewK = 1;
    yield* depthWalk(g, abu, X.south, 'out', 0.16);
    abu.f = -1;
    yield* g.walkNpc(abu, X.abu, { speedScale: 0.6 });
    abu.f = -1;
    abu.override = { ...POSES.stand, head: 0.05 };
    g.a.abuArrived = true;
  },

  *news(g) {
    const p = g.player;
    const abu = g.abu;
    const s = g.state;
    g.sound.score?.mood('silence', 4);
    g.lock();
    g.text.objective(null);
    // He lets Sami come to him: the walk toward is the last of not knowing.
    yield* g.walkPlayer(X.kerb + 30);
    yield () => g.a.abuArrived !== false;
    p.f = 1;
    g.camOverride = { x: X.kerb + 90, y: -230, view: 1050 };
    yield 0.6;
    abu.override = null;
    yield* g.walkNpc(abu, X.kerb + 110, { speedScale: 0.4 });
    abu.f = -1;
    abu.override = { ...POSES.stand, head: 0.05 };
    yield* g.say(ABU, ['سامي.', 'Sami.'], 2.5);
    yield GAP;
    yield* g.say(SAMI, ['شو في يا عمّو؟ ليش هالناس مجتمعين؟', 'What is it, uncle? Why are these people gathered?']);
    yield GAP;
    abu.override = { ...POSES.stand, armN: 1.25, foreN: 1.45 }; // a hand on his shoulder
    yield 0.8;
    yield* g.say(ABU, ['خالد... الله يرحمو يا ابني.', 'Khaled... God have mercy on him, my son.'], 4.5);
    // Silence. The information enters but hasn't landed.
    g.a.drainT0 = g.time;
    g.sound.ambience({ crowd: 0.15, wind: 0.1, air: 0.1 }, 3);
    yield 2.4;
    yield* g.say(SAMI, ['شو... شو قلت؟', 'What... what did you say?']);
    yield GAP;
    yield* g.say(ABU, ['كان عم يقطع شارع المدرسة. قنّاص. ما حسّ بشي. كانت سريعة.', 'He was crossing School Street. A sniper. He didn’t feel anything. It was fast.'], 5.5);
    // his hand goes to the wall; the street goes distant, as if through water
    p.f = -1;
    p.override = { ...POSES.wallHand };
    g.sound.setMuffle(0.7, 3);
    g.sound.ringing(0.8, 1.5);
    yield 2;
    p.f = 1;
    p.override = { ...POSES.grief, head: 0.3 };
    yield* g.say(SAMI, ['إمتى؟', 'When?'], 2.6, 'whisper');
    yield GAP;
    yield* g.say(ABU, ['من نص ساعة. ساعة بالكتير.', 'Half an hour ago. An hour at most.'], 4);
    yield 1.5;
    g.sound.ringing(0.3, 2);

    const i = yield* g.choose(null, [
      { ar: 'بدي شوفو.', en: 'I need to see him.' },
      { ar: 'مين عمل هيك؟', en: 'Who did this?' },
      { ar: '(سكوت)', en: '(Silence)' },
    ]);
    s.choices.push(`C${i + 1}`);
    g.sound.ringing(0, 2);
    if (i === 0) {
      s.grief_response = 'action';
      s.path = 'retrieval';
      s.courage += 1;
      p.override = null;
      yield* g.say(SAMI, ['بدي شوفو. وينو هلّق؟', 'I need to see him. Where is he now?']);
      yield GAP;
      yield* g.say(ABU, ['سامي — ما فيك تروح. الشارع مكشوف. القنّاص لسا هناك.', 'Sami — you can’t go. The street is exposed. The sniper is still there.']);
      yield GAP;
      g.runner.run(g.walkPlayer(X.south - 20));
      yield* g.say(SAMI, ['وينو.', 'Where is he.'], 2.4);
      g.camOverride = { x: X.south - 120, y: -230, view: 1150 };
      yield* g.say(ABU, ['شارع المدرسة، قبل المفرق. سامي — سامي! ما فيك تروح هلّق!', 'School Street, before the junction. Sami — Sami! You can’t go there now!'], 4, 'shout');
      yield () => !g.autoWalk;
      // Sami walks south. The group watches him go.
      g.a.samiDepth = 0.001;
      g.player.face('back');
      yield () => g.a.samiDepth >= 1;
    } else if (i === 1) {
      s.grief_response = 'witness';
      s.path = 'witness';
      p.override = null;
      g.runner.run(g.walkPlayer(X.olive - 90));
      g.walkieMan.f = -1;
      yield* g.say(SAMI, ['مين عمل هيك. من وين إجت الطلقة.', 'Who did this. Where did the shot come from.']);
      yield GAP;
      yield* g.say(WMAN, ['القنّاص عالتلّة الغربية. بالبناية اللي عليها العلم — بتعرفو. نفس القنّاص اللي من أسبوع.', 'The sniper on the western hill. In the building with the flag — you know it. Same sniper from last week.'], 6);
      yield GAP;
      yield* g.say(SAMI, ['في حدا شافو وهوّي واقع؟', 'Did anyone see him fall?']);
      yield GAP;
      yield* g.say(WMAN, ['أم سعيد — هيّي اللي طلعت عليه. لحقوها الشباب بعدها. بس ما قدروا يجرّوه — الشارع مكشوف.', 'Um Said — she’s the one who went to him. Some of the men followed her. But they couldn’t move him — the street is exposed.'], 6.5);
      yield GAP;
      yield* g.say(SAMI, ['يعني لسا هناك.', 'So he’s still there.']);
      // Silence from the group. That's the answer.
      yield 3.5;
    } else {
      s.grief_response = 'withdrawal';
      s.path = 'grief';
      s.isolation += 1;
      // He sits on the kerb, in the exact spot where the woman was sitting.
      const woman = g.newsPeople[0];
      woman.override = null;
      g.runner.run(g.walkNpc(woman, X.kerb + 300, { speedScale: 0.5 }));
      p.override = null;
      yield* g.walkPlayer(X.kerb + 130);
      p.f = 1;
      const t0 = g.time;
      yield () => {
        p.override = { ...POSES.kerb, head: lerp(0.3, 0.75, clamp((g.time - t0) / 2)) };
        return g.time - t0 > 2;
      };
      g.abu.override = null;
      yield* g.walkNpc(g.abu, X.kerb + 190, { speedScale: 0.4 });
      g.abu.f = -1;
      g.abu.override = { ...POSES.kerb, head: 0.2 };
      // Time passes: the light moves, a shadow extends over them.
      g.a.compress = g.time;
      yield 7;
      yield* g.say(ABU, ['بدك مي؟', 'Do you want some water?'], 3.5);
      yield 2.5; // he shakes his head, almost imperceptibly
      yield* g.say(ABU, ['أمو بعدها ما بتعرف.', 'His mother doesn’t know yet.'], 4.5);
      yield 3;
    }

    // END OF ACT 1
    s.completed = true;
    writeSave(s);
    g.fade = 1;
    g.sound.ambience({ crowd: 0, wind: 0, air: 0, generator: 0, traffic: 0 }, 2);
    yield 1.6;
    g.sound.score?.mood('after', 3);
    g.sound.ney(293.66, 12, 0.2);
    g.text.titleCard([
      ['الساعة أربعة وربع. ١٤ آب، ٢٠١٤.', 'Quarter past four. 14 August 2014.'],
      ['بقيت الشمس ساعتين بالسما.', 'Two hours of sun left in the sky.'],
    ], 7);
    yield 7.5;
    g.onEnd?.(s);
  },

  // =================================================== per-frame extras ==

  update(g, dt) {
    const a = g.a;
    // the news drains the colour out of the world
    if (a.drainT0) a.drain = clamp((g.time - a.drainT0) / 6);
    if (a.compress) a.sunK = lerp(0.9, 1.15, clamp((g.time - a.compress) / 12));
    // Sami walking south, away down the side street
    if (a.samiDepth) {
      const p = g.player;
      a.samiDepth = Math.min(1, a.samiDepth + dt * 0.08);
      const k = a.samiDepth;
      const s = 1 / (1 + 3.4 * k);
      p.rig.scale = s;
      p.stride += dt * 90 * s;
      p.pose(dt, 60);
      p.rig.x = lerp(X.south - 20, X.south, k);
      p.rig.y = lerp(0, -70, 1 - s);
    }
    // the cat sits and watches, and blinks now and then
    if (g.cat && !g.cat.hidden) {
      g.cat.update(dt);
      if (!g.a.catDone && Math.abs(g.player.x - g.cat.x) < 160 && !g.a.catAuto) {
        g.a.catAuto = true;
      }
    }
    if (a.curtainPrompt && g.player.x > X.sag1 + 40) a.curtainPrompt = false;
    streetLife(g, dt);
  },

  useTool(g, id) {
    if (id === 'mirror') {
      const x = g.player.x;
      if (!g.a.mirrorChecked && x > X.corner - 170 && x < X.corner + 10) {
        g.runner.run(this.mirrorPeek(g));
      } else {
        g.line(null, ['شقفة مراية. بتشوف فيها حالك.', 'A shard of mirror. You can see yourself in it.'], 3, 'examine');

    } else if (id === 'walkie') {

  },

  draw(R, g) {

  },
};

// ------------------------------------------------------ depth and doors --

// Walk into (k 0 → 1) or out of (k 1 → 0) a side street that runs away from
// the camera at x = mouth: the figure faces away or towards us and shrinks
// towards the vanishing point. Runs as a script step, after the NPC update.
function* depthWalk(g, w, mouth, dir, rate = 0.1) {
  const base = w.baseScale ?? w.rig.scale;
  w.baseScale = base;
  let k = dir === 'in' ? 0.001 : 1;
  w.face(dir === 'in' ? 'back' : 'front');
  w.x = mouth;
  const step = () => {
    const dt = g.lastDt || 1 / 60;
    k = clamp(k + (dir === 'in' ? 1 : -1) * rate * dt);
    w.pose(dt, 60);
    placeInDepth(w, mouth, k, base);
    w.stride += dt * 90 * (1 / (1 + 3.4 * k));
    w.depthK = k > 0.001 ? k : 0;
    return dir === 'in' ? k >= 1 : k <= 0;
  };
  yield step;
  w.depthK = 0;
  w.rig.scale = base;
  w.face(dir === 'in' ? 'back' : 'side');
  if (dir === 'in') w.visible = false;
}

function placeInDepth(w, mouth, k, base) {
  const s = 1 / (1 + 3.4 * k);
  w.rig.scale = base * s;
  w.rig.x = lerp(mouth - 10, mouth + 6, k);
  w.rig.y = lerp(0, -70, 1 - s);
}

// Someone reaching a doorway turns their back and goes in.
function enterDoor(g, w) {
  if (w.entering) return;
  w.entering = true;
  w.face('back');
  setTimeoutGame(g, 0.45, () => (w.visible = false));
}

// ------------------------------------------------------------ street life --

// Now and then, in the calm stretches, someone crosses the mouth of a side
// street: out of it towards us, or along the street and into it.
const MOUTHS = [3105, 5130, 10020];
const PASSERS = [
  { outfit: 'man', can: true },
  { outfit: 'woman' },
  { outfit: 'woman2' },
  { outfit: 'fadi', scale: 0.86 },
  { outfit: 'man' },
  { outfit: 'boy', scale: 0.62 },
  { outfit: 'abuyazan' },
];

function streetLife(g, dt) {
  const a = g.a;
  g.lastDt = dt;
  g.passers ||= [];
  const calm =
    g.scene === 'street' &&
    !g.locked &&
    !a.shelling &&
    !(a.heli && g.time < a.heli.t0 + a.heli.dur + 8) &&
    !(a.jet && g.time < a.jet.t0 + 10) &&
    !a.drainT0 &&
    g.player.x < X.newsStart - 250;
  a.nextPasser ??= g.time + 5;
  if (calm && g.time > a.nextPasser && g.passers.length < 2) {
    a.nextPasser = g.time + 9 + Math.random() * 9;
    const mouth = MOUTHS.find((m) => Math.abs(m - g.cam.x) < 650 && Math.abs(m - g.player.x) > 120);
    if (mouth) {
      const kind = PASSERS[Math.floor(Math.random() * PASSERS.length)];
      const w = new Walker(g.level, kind.outfit, kind.scale || 1);
      if (kind.can) w.rig.prop = (c, hand) => jerryCan(c, hand[0], hand[1] + 44, 0.95);
      const side = Math.random() < 0.5 ? -1 : 1;
      w.passer = { mouth, dir: Math.random() < 0.5 ? 'out' : 'in', side, phase: 'start' };
      if (w.passer.dir === 'in') {
        w.place(mouth + side * 900);
        w.f = -side;
      } else {
        w.place(mouth);
        w.rig.view = 'front';
      }
      g.passers.push(w);
    } else a.nextPasser = g.time + 3;
  }
  for (const w of g.passers) {
    const ps = w.passer;
    if (ps.phase === 'start') {
      ps.phase = ps.dir === 'out' ? 'depth' : 'along';
      if (ps.dir === 'out') ps.k = 1;
    }
    if (ps.phase === 'depth') {
      w.update(dt, {});
      w.pose(dt, 60);
      ps.k = clamp(ps.k + (ps.dir === 'in' ? 1 : -1) * 0.1 * dt);
      w.depth = ps.k;
      placeInDepth(w, ps.mouth, ps.k, w.baseScale ?? (w.baseScale = w.rig.scale));
      w.stride += dt * 90 * (1 / (1 + 3.4 * ps.k));
      if (ps.dir === 'out' && ps.k <= 0) {
        w.depth = 0;
        w.rig.scale = w.baseScale;
        w.face('side');
        w.f = ps.side;
        ps.phase = 'away';
      } else if (ps.dir === 'in' && ps.k >= 1) ps.done = true;
    } else if (ps.phase === 'along') {
      if (w.goTo(ps.mouth, dt, { speedScale: 0.6 })) {
        w.face('back');
        ps.phase = 'depth';
        ps.k = 0;
        w.baseScale = w.rig.scale;
      }
    } else if (ps.phase === 'away') {
      w.goTo(ps.mouth + ps.side * 1000, dt, { speedScale: 0.6 });
      if (Math.abs(w.x - ps.mouth) > 950) ps.done = true;
    }
  }
  g.passers = g.passers.filter((w) => !w.passer.done);
  if (!calm && (a.shelling || a.drainT0)) g.passers.length = 0;
}

// A few single shots far to the south, irregular, all afternoon.
function* ambientShots(g) {
  for (;;) {
    yield 6 + Math.random() * 9;
    if (g.scene === 'street' && !g.a.shelling) g.sound.distantShot();
  }
}

function setTimeoutGame(g, sec, fn) {
  g.runner.run(
    (function* () {
      yield sec;
      fn();
    })(),
  );
}

return { ACT1 };
})();

// Graphics quality: a render-scale cap. Auto starts high and steps down if
// the frame rate struggles.
const QUALITY = { low: [0.55, 960], medium: [0.8, 1280], high: [1, 1600], auto: [1, 1500] };
let autoScale = 1;
function resize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const aspect = vw / vh < 1 ? 1.6 : 2.39;
  const w = Math.min(vw, vh * aspect);
  const h = w / aspect;
  stage.style.width = `${w}px`;
  stage.style.height = `${h}px`;
  stage.style.setProperty('--u', `${Math.max(w, h * 2.39) / 100}px`);
  const q = settings.get('quality') || 'auto';
  const [scale, cap] = QUALITY[q] || QUALITY.auto;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const px = Math.round(Math.min(cap, Math.max(560, w * dpr)) * scale * (q === 'auto' ? autoScale : 1));
  const py = Math.round(px / aspect);
  if (px !== R.W || py !== R.H) R.resize(px, py);
}
window.addEventListener('resize', resize);
resize();

function applyLanguage() {
  document.body.dataset.rotate = t('rotate');

    <p>This is Act One: the walk, the parting, and the hour of not knowing. Your choices shape who Sami is when the news reaches him, and which way the night goes.</p>
    <h3>Content note</h3>
    <p>Life under military siege: shelling, sniper fire, hunger, the death of a friend, grief. Violence is heard and implied, never shown. Recommended for ages 16 and over.</p>
    <p class="menu-sub">A work of fiction drawing on documented accounts of siege life. Everything is drawn and synthesised in code. There are no images or recordings.</p>`,
});
menu.showMain();

input.onKey((e) => {
  const acts = input.actionsFor(e.code);
  if (!acts.includes('menu')) return;
  if (!$('note').hidden) {
    $('note').hidden = true;
    return;
  }
  if (mode === 'play') menu.toggle();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && mode === 'play' && !menu.open) menu.showPause();
});

// ------------------------------------------------------- touch controls --

const touchMap = [
  ['t-left', 'left'],
  ['t-right', 'right'],
  ['t-jump', 'jump'],
  ['t-crouch', 'crouch'],
  ['t-prone', 'prone'],
  ['t-use', 'interact'],
  ['t-tool', 'tool'],
  ['t-light', 'use'],
  ['t-skip', 'skip'],
];
for (const [id, action] of touchMap) {
  const b = $(id);
  if (!b) continue;
  const down = (e) => {
    e.preventDefault();
    input.touchDown(action);
    b.classList.add('down');
  };
  const up = () => {
    input.touchUp(action);
    b.classList.remove('down');
  };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
}
$('t-menu').addEventListener('click', () => mode === 'play' && menu.toggle());

// ------------------------------------------------------------------ loop --

let last = performance.now();
let time = 0;
let frames = 0;
let fpsT = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  time += dt;
  input.poll();
  if (mode === 'title') {
    game.time += dt;
    game.effects.update(dt);
    Object.assign(game.cam, game.cameraTarget());
    game.render(time);
  } else {
    // (testing can run several steps per frame and skip drawing)
    const steps = window.game?.speed || 1;
    if (!menu.open) for (let i = 0; i < steps; i++) game.update(dt);
    if (!window.game?.noRender) game.render(time);
  }
  input.endFrame();

  frames++;
  fpsT += dt;
  if (fpsT > 2) {
    const fps = frames / fpsT;
    frames = 0;
    fpsT = 0;
    if (settings.get('quality') === 'auto' && fps < 34 && autoScale > 0.6) {
      autoScale -= 0.2;
      resize();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Debug and testing hook.
window.game = {
  speed: 1,
  game,
  menu,
  input,
  settings,
  text,
  start: (checkpoint = 'walk', extra = {}) => startGame({ ...freshState(), checkpoint, ...extra }),
  get mode() {
    return mode;
  },
};

return {  };
})();
</script>
