  *spotterScene(g) {
    const p = g.player;
    const sp = g.spotter;
    g.lock();
    yield* g.walkPlayer(X.spotter - 140);
    p.f = 1;
    sp.override = POSES.peekWindow; // he leans out over the sill to call down
    sp.f = -1;
    g.camOverride = { x: X.spotter - 60, y: -300, view: 1300 };
    yield* g.say(SPOT, ['يا زلمة! وين رايح؟ الطيران عم يضرب عالقبلي.', 'Hey, man! Where are you headed? The planes are hitting the southern quarter.'], null, 'shout');
    yield GAP;
    p.override = POSES.lookUp;
    yield* g.say(SAMI, ['رايح عالشرقي. عالأنابيب.', 'Heading to the eastern quarter. To the pipes.']);
    yield GAP;
    yield* g.say(SPOT, ['خود هاد. أحسنلك.', 'Take this. Better for you.']);
    // the walkie-talkie comes down on a rope
    g.a.rope = 0;
    const t0 = g.time;
    yield () => {
      g.a.rope = clamp((g.time - t0) / 3);
      return g.a.rope >= 1;
    };
    p.override = null;
    yield* g.walkPlayer(X.spotter - 24);
    p.f = 1;
    g.lock(false);
    g.prompt('interact', 'خذ جهاز اللاسلكي', 'Take the walkie-talkie');
    const taken = { v: false };
    g.level.add({ id: 'walkie', x: X.spotter - 10, y: -170, range: 60, label: ['خذ', 'Take'], use: () => (taken.v = true) });
    yield () => taken.v;
    g.level.remove('walkie');
    g.prompt(null);
    g.lock();
    g.giveTool('walkie');
    g.sound.squelch();
    g.a.rope = 2;
    yield* g.say(null, ['لاسلكي. بتسمع فيه تحذيرات الرصد. ما بيبعت، بس بيستقبل.', 'Walkie-talkie. You hear the spotters’ warnings. Receive only.'], 4.5, 'item');
    yield GAP;
    yield* g.say(SPOT, ['الموجة ٣. إذا سمعت "مروحي" أو "حربي"، انبطح. إذا سمعت "فيل"، الله يستر.', 'Channel 3. If you hear “mirwahi” (helicopter) or “harbi” (jet), get flat. If you hear “elephant”, God help us.'], 6);
    sp.override = SPOT_SIT;
    sp.f = -1;
    g.camOverride = null;
    g.lock(false);
  },

  // A jet, low and fast. The whine comes first; there are a few seconds to
  // get flat before it tears overhead, and then it hits another quarter.
  *jetStrike(g) {
    const p = g.player;
    g.a.heliWarn = g.time;
    g.sound.score?.mood('danger', 3);
    g.a.sunK = Math.max(g.a.sunK, 0.4);
    g.sound.radio(2.4);
    yield* g.say(RADIO, ['...حربي... حربي فوق الشرقي... حربي...', '...jet... jet over the eastern quarter... jet...'], 3.5, 'radio');
    const dur = 10;
    const over = 0.5;
    g.sound.jetPass(dur, over);
    const tOver = g.time + dur * over;
    // it crosses the sky in little more than a second, low and left to right
    g.a.jetFly = { t0: tOver - 0.7, dur: 1.4, x0: p.x * 0.35 - 1300, x1: p.x * 0.35 + 1300 };
    g.prompt('prone', 'انبطح!', 'Get down!');
    const t0 = g.time;
    yield () => p.stance === 'prone' || g.time - t0 > 4.3;
    g.prompt(null);
    g.lock();
    if (p.stance !== 'prone') {
      p.stance = 'prone'; // the body knows before the mind does
    }
    // The helplessness is the lesson: lie there and listen.
    g.camOverride = { x: p.x + 40, y: -200, view: 1250 };
    yield () => g.time >= tOver - 0.2;
    g.a.jetShadow = g.time;
    g.bump(0.35);
    yield 2;
    g.camOverride = null;
    // The strike, on another quarter.
    g.sound.strikeFar();
    g.bump(0.95);
    g.runner.run(
      (function* () {
        yield 0.7;
        g.bump(0.45); // the ground keeps shaking
        yield 0.8;
        g.bump(0.25);
      })(),
    );
    g.a.plumeAt = g.time;
    g.a.plumeX = g.cam.x * 0.3 - 420;
    yield 3;
    g.sound.radio(2.2);
    yield* g.say(RADIO, ['...ضربة حربي... عالحارة القبلية... ضربة حربي...', '...airstrike... the southern quarter... airstrike...'], 4, 'radio');
    g.lock(false);
    g.prompt('jump', 'قِف', 'Get up');
    yield () => p.stance === 'stand';
    g.prompt(null);
    g.player.rig.dust = 0.15;
    g.sound.score?.mood('hour', 10);
    writeSave(g.state);
  },

  // ======================================================= the school ====

  buildSchool(g) {
    const L = g.level;
    const kids = [];
    const mk = (outfit, x, f, pose) => {
      const k = g.npc(outfit, x, { f, scale: outfit === 'layla' ? 0.64 : 0.58 });
      k.override = pose;
      kids.push(k);
      return k;
    };
    g.layla = mk('layla', X.layla, 1, POSES.sort);
    g.boy = mk('boy', X.layla + 60, -1, POSES.sort);
    g.boy.rig.scale = 0.5;
    const runners = [mk('kid2', X.scrap + 120, -1, POSES.sort), mk('kid3', X.scrap + 210, 1, POSES.sort), mk('fadi', 7200, 1, POSES.sort)];
    runners[2].rig.scale = 0.6;
    g.kids = kids;
    g.runnerKids = runners;
    // the others play: dash between piles, calling out finds
    runners.forEach((k, i) => {
      k.play = true;
      k.brain = (dt) => {
        if (k.hide) {
          if (k.goTo(X.stairs, dt, { run: true })) enterDoor(g, k);
          return;
        }
        if (k.play) {
          if (k.goal === null || k.goal === undefined) {
            k.override = null;
            k.goal = X.scrap - 120 + ((Math.sin(g.time * 0.7 + i * 2) + 1) / 2) * 360;
          }
          if (k.goTo(k.goal, dt, { run: true, speedScale: 0.7 })) {
            k.goal = null;
          }
        } else k.update(dt, {});
      };
    });

    L.add({
      id: 'layla',
      x: X.layla,
      y: -130,
      range: 80,
      label: ['تحدّث إلى ليلى', 'Talk to Layla'],
      enabled: () => !g.a.laylaTalked && !g.a.shelling,
      use: () => {
        g.a.laylaTalked = true;
        g.runner.run(this.laylaTalk(g));
      },
    });

    // the cat (after the shelling)
    const cat = new Cat();
    cat.x = X.catWall;
    cat.y = -148;
    cat.f = -1;
    cat.hidden = true;
    g.cat = cat;
    L.add({
      id: 'cat',
      x: X.catWall,
      y: -200,
      range: 110,
      label: ['القطة', 'The cat'],
      enabled: () => !cat.hidden && !g.a.catDone,
      use: () => g.runner.run(this.catScene(g)),
    });

    L.at(6950, () => {
      g.checkpoint('school');
      g.a.sunK = Math.max(g.a.sunK, 0.55);
      g.sound.ambience({ crowd: 0.35, generator: 0.1 });
    });
    L.at(X.scrap + 150, () => g.runner.run(this.shelling(g)));
    L.at(X.classroom - 30, () => {
      if (g.a.shellingDone) g.runner.run(this.flashback(g));
      else g.a.flashbackPending = true;
    });
  },

  *laylaTalk(g) {
    g.lock();
    g.player.f = -1;
    yield* g.say(LAYLA, ['بتعرف قدّيش كيلو حديد لازم الواحد يلمّ لحتى يشتري كيس برغل؟', 'Do you know how many kilos of scrap metal you need to collect for a bag of bulgur?'], 5);
    yield GAP;
    yield* g.say(SAMI, ['كم؟', 'How many?']);
    yield GAP;
    yield* g.say(LAYLA, ['كتير.', 'A lot.']);
    g.lock(false);
  },

  *shelling(g) {
    const p = g.player;
    const s = g.state;
    g.a.shelling = true;
    g.sound.score?.mood('danger', 1.5);
    g.a.sunK = Math.max(g.a.sunK, 0.62);
    const impact = (x, dist) => {
      g.sound.mortarImpact(dist);
      g.effects.blast(x, 0, dist < 1.5 ? 1 : 0.6);
      g.a.flashAt = g.time;
      g.a.flashX = x;
      g.bump(dist < 1.5 ? 0.6 : 0.3);
    };
    const kidsFreeze = () => {
      for (const k of [...g.kids]) {
        k.play = false;
        k.goal = null;
        k.override = { ...POSES.stand, head: -0.35 };
      }
    };
    g.lock();
    g.sound.mortarWhistle(1.4);
    yield 1.4;
    impact(6880, 2.2);
    kidsFreeze();
    yield 0.9;
    g.sound.mortarWhistle(1.2);
    yield 1.2;
    impact(7120, 1.4);
    g.sound.carAlarm(10);
    // most of them run for the basement stairs; Layla and the little one freeze
    for (const k of g.runnerKids) {
      k.override = null;
      k.hide = true;
    }
    g.boy.override = { ...POSES.grief, torso: 0.3 };
    g.layla.override = { ...POSES.stand, head: -0.3, armN: 0.4, foreN: 0.9 };
    // shells keep walking in, away from the children
    const barrage = g.runner.run(
      (function* () {
        const xs = [6990, 7220, 7060, 7290, 6930];
        for (const x of xs) {
          g.sound.mortarWhistle(1.1);
          yield 1.1;
          impact(x, Math.abs(x - p.x) / 300);
          yield 0.6 + Math.random() * 0.8;
          if (g.a.stopBarrage) return;
        }
      })(),
    );
    const i = yield* g.choose(null, [
      { ar: 'احمِ الأطفال', en: 'Shield the children' },
      { ar: 'احتمِ', en: 'Take cover' },
    ], { timed: 7, def: 1 });
    s.choices.push(`B${i + 1}`);

    if (i === 0) {
      s.compassion += 1;
      s.children_helped = true;
      g.lock(false);
      g.text.objective(['خذ ليلى والطفل إلى الدرج', 'Get Layla and the boy to the stairs']);
      g.prompt('run', 'اركض', 'Run');
      const grabbed = { v: false };
      g.level.add({ id: 'grab', urgent: true, x: (X.layla + g.boy.x) / 2, y: -110, range: 110, label: ['خذهما', 'Take them'], use: () => (grabbed.v = true) });
      yield () => grabbed.v;
      g.level.remove('grab');
      g.prompt(null);
      g.line(SAMI, ['يلا يلا يلا! عالدرج!', 'Go go go! To the stairs!'], 2.5, 'shout');
      // they run with him, crouched, his body between them and the sky
      for (const [k, off] of [[g.layla, -40], [g.boy, -80]]) {
        k.override = null;
        k.brain = (dt) => k.goTo(Math.min(g.player.x + off, X.stairs), dt, { run: true });
      }
      g.runner.run(
        (function* () {
          yield 1.2;
          g.sound.mortarWhistle(1);
          yield 1;
          impact(X.scrap + 40, 0.9); // lands in the open area behind them
          g.a.crater = true;
          yield 1.5;
          g.sound.mortarWhistle(1);
          yield 1;
          impact(X.stairs - 380, 0.8);
        })(),
      );
      g.text.objective(['إلى الدرج', 'To the stairs']);
      yield () => g.player.x >= X.stairs - 20;
      g.text.objective(null);
      g.lock();
      g.a.stopBarrage = true;
      yield* this.stairwell(g);
    } else {
      s.isolation += 1;
      // dive behind the nearest wall
      yield* g.walkPlayer(X.lowWall + 20, { run: true });
      p.f = -1;
      p.stance = 'prone';
      // Layla pulls the little one to the basement on her own
      g.layla.override = null;
      g.boy.override = null;
      g.layla.brain = (dt) => {
        if (g.layla.goTo(X.stairs, dt, { run: true })) enterDoor(g, g.layla);
      };
      g.boy.brain = (dt) => {
        if (g.boy.goTo(Math.min(g.layla.x - 30, X.stairs), dt, { run: true }) && !g.layla.visible) enterDoor(g, g.boy);
      };
      g.camOverride = { x: X.lowWall - 120, y: -200, view: 1300 };
      yield 2.2;
      g.sound.mortarWhistle(1);
      yield 1;
      impact(X.scrap + 40, 0.9);
      g.a.crater = true;
      yield 2.5;
      g.sound.mortarWhistle(1.2);
      yield 1.2;
      impact(6960, 2.4);
      yield () => !g.layla.visible;
      yield 2;
      g.camOverride = null;
      g.a.stopBarrage = true;
    }

    // After: ringing silence, settling rubble, dust like fog.
    yield () => barrage.done;
    g.sound.ringing(1);
    g.sound.setMuffle(0.55, 0.4);
    g.effects.fog = Math.max(g.effects.fog, 0.8);
    yield 2.5;
    g.sound.ringing(0, 3);
    g.sound.setMuffle(0, 4);
    for (const k of g.kids) k.visible = false;
    g.a.crater = true;
    g.a.shelling = false;
    g.a.shellingDone = true;
    g.sound.score?.mood('hour', 12);
    g.player.rig.dust = 0.7;
    g.player.stance = g.player.stance === 'prone' ? 'prone' : 'stand';
    g.lock(false);
    if (g.player.stance !== 'stand') {
      g.prompt('jump', 'قِف', 'Get up');
      yield () => g.player.stance === 'stand';
      g.prompt(null);
    }
    g.sound.ambience({ crowd: 0, generator: 0, air: 0.35, wind: 0.3 });
    g.cat.hidden = false;
    writeSave(g.state);
    if (g.a.flashbackPending) g.runner.run(this.flashback(g));
  },

  *stairwell(g) {
    const p = g.player;
    g.fade = 1;
    yield 0.4;
    g.scene = 'stairwell';
    g.camOverride = { x: -60, y: -300, view: 1400 };
    g.snapCamera();
    const saved = { x: p.x, f: p.f };
    const bounds = g.level.bounds;
    g.level.bounds = [-2000, bounds[1]];
    p.place(-120);
    p.f = 1;
    p.stance = 'crouch';
    const mkKid = (outfit, x, f, pose, scale) => {
      const w = new Walker(g.level, outfit, scale);
      w.place(x);
      w.f = f;
      w.override = pose;
      w.update(0.016, {});
      return w;
    };
    const eyesShut = { ...POSES.crouch, head: 0.4, torso: 0.3 };
    g.stairKids = [
      mkKid('kid2', -420, 1, { ...POSES.crouch, head: 0.2 }, 0.58),
      mkKid('kid3', -300, 1, { ...POSES.crouch, head: 0.3 }, 0.58),
      mkKid('layla', 120, -1, eyesShut, 0.64),
      mkKid('boy', 220, -1, { ...POSES.kneel, head: 0.3 }, 0.5),
    ];
    g.stairKids.forEach((w) => {
      w.stance = 'crouch';
    });
    g.sound.setMuffle(0.6, 0.3);
    g.fade = 0;
    // the torch comes to hand; wait for the player to light it (or a few seconds)
    g.active = 'torch';
    if (!g.torch.on) g.prompt('use', 'أشعل المصباح', 'Torch');
    const t0 = g.time;
    g.runner.run(
      (function* () {
        for (let i = 0; i < 2; i++) {
          yield 1.4 + i;
          g.sound.mortarImpact(2.5);
          g.effects.trickle(-100 + i * 200, -640, 3);
          g.bump(0.25);
        }
      })(),
    );
    yield 3.5;
    yield () => g.torch.on || g.time - t0 > 9;
    g.prompt(null);
    p.override = { ...POSES.crouch, armN: 0.2, foreN: 0.9, armF: 0.1, foreF: 0.8, head: 0.2 }; // hands pressed flat to his knees
    yield* g.say(LAYLA, ['شكراً.', 'Thank you.'], 3);
    yield GAP;
    yield* g.say(SAMI, ['ابقوا هون. لا تطلعوا لحتى يهدا.', 'Stay here. Don’t come out until it’s quiet.'], 4);
    yield 1.5;
    g.fade = 1;
    yield 0.5;
    g.scene = 'street';
    g.level.bounds = bounds;
    g.stairKids = null;
    p.override = null;
    p.place(saved.x + 20);
    p.f = 1;
    p.stance = 'stand';
    g.camOverride = null;
    g.snapCamera();
    g.fade = 0;
  },

  *catScene(g) {
    const cat = g.cat;
    g.a.catDone = true;
    g.lock();
    g.player.f = g.player.x < cat.x ? 1 : -1;
    g.camOverride = { x: (g.player.x + cat.x) / 2, y: -220, view: 1000 };
    yield 1;
    // one slow blink
    const t0 = g.time;
    yield () => {
      const k = (g.time - t0) / 1.4;
      cat.blink = Math.sin(clamp(k) * Math.PI);
      return k >= 1;
    };
    yield* g.say(null, ['بسّة. مو جوعانة أكتر من أي حدا هون. وعم تستنى نفس الشي: إنو يخلص.', 'A cat. No hungrier than anyone else here. Waiting for the same thing: for it to end.'], 6, 'examine');
    yield 1.2;
    // it turns, drops off the wall, and is gone into the rubble without a sound
    cat.f = 1;
    const t1 = g.time;
    yield () => {
      const k = (g.time - t1) / 1.6;
      cat.sit = 1 - clamp(k * 3);
      cat.x = X.catWall + k * 90;
      cat.y = -148 + Math.max(0, k - 0.35) * 260;
      cat.speed = 60;
      if (k >= 1) cat.hidden = true;
      return k >= 1;
    };
    g.camOverride = null;
    g.lock(false);
  },

  *flashback(g) {
    if (g.a.flashbackStarted) return;
    g.a.flashbackStarted = true;
    const p = g.player;
    g.lock();
    p.f = -1;
    g.camOverride = { x: X.classroom - 60, y: -150, view: 900 };
    yield 2.2;
    g.fade = 1;
    yield 0.8;
    // An evening in 2010. Everything whole.
    g.scene = 'flashback';
    g.a.flashFade = 0;
    g.camOverride = { x: 0, y: -210, view: 1150 };
    g.snapCamera();
    const young = (outfit, x, f) => {
      const w = new Walker(g.level, outfit);
      w.place(x);
      w.f = f;
      w.override = { ...POSES.sitGround, torso: 0.05 };
      w.update(0.016, {});
      w.brain = null;
      return w;
    };
    const ks = young('khaled', 90, -1);
    const ss = young('sami', -90, 1);
    ks.rig.o = { ...ks.rig.o, beard: 'stubble' };
    ss.rig.o = { ...ss.rig.o, beard: 'none', top: '#7a6f84' };
    g.flashActors = [ss, ks];
    g.sound.ambience({ traffic: 0.7, crowd: 0.25, wind: 0.1, air: 0, generator: 0 }, 1);
    g.sound.score?.mood('memory', 1.5);
    g.text.titleCard([['٢٠١٠', '2010']], 3);
    g.fade = 0;
    const horns = g.runner.run(
      (function* () {
        while (g.scene === 'flashback') {
          yield 3 + Math.random() * 4;
          if (g.scene !== 'flashback') return;
          if (Math.random() < 0.5) g.sound.horn();
          else g.sound.birds();
        }
      })(),
    );
    yield 2.5;
    ks.override = { ...POSES.sitGround, armN: 2.6, foreN: 2.9 }; // picks a grape
    yield 1;
    ks.override = { ...POSES.sitGround, armN: 1.4, foreN: 2.6 };
    yield* talk(g, [
      [AHMAD, ['بتعرف شو بدي أعمل لمّا خلّص تدريب المعلمين؟', 'You know what I’m going to do when I finish teacher training?']],
      [SAMI, ['شو؟', 'What?']],
      [AHMAD, ['بدي افتح مدرسة. مو مدرسة حكومية، مدرسة خاصة. ببيت. غرفة وحدة، كراسي وطبشور، وكتب كتير.', 'I’m going to open a school. Not a government school. A private one. In a house. One room, chairs, chalk, and lots of books.']],
      [SAMI, ['وبتعلّم فيها شعر.', 'And you’ll teach poetry.']],
      [AHMAD, ['بعلّم فيها كل شي. قواعد وشعر وعلوم وكيف الواحد يفكّر لحالو.', 'I’ll teach everything. Grammar and poetry and science and how to think for yourself.']],
    ]);
    ks.override = { ...POSES.sitGround };
    yield 1.2;
    yield* g.say(SAMI, ['كيف الواحد يفكّر لحالو. بهالبلد.', 'How to think for yourself. In this country.']);
    yield GAP;
    // He lowers his voice instinctively, the way everyone does.
    ks.override = { ...POSES.sitGround, torso: 0.3, head: 0.2 };
    g.sound.ambience({ traffic: 0.35, crowd: 0.1 }, 0.8);
    yield 0.8;
    yield* g.say(AHMAD, ['هلّق لا. بس مو لازم يضل هيك.', 'Not now. But it doesn’t have to stay this way.'], 4.5, 'whisper');
    yield 1;
    ss.override = { ...POSES.sitGround, head: -0.45 }; // looks up at the arbour
    g.sound.birds();
    yield 2.4;
    // The song distorts. The garden fades into dust, wind, distance.
    g.sound.setMuffle(0.85, 1.2);
    const t0 = g.time;
    yield () => {
      g.a.flashFade = clamp((g.time - t0) / 1.6);
      return g.a.flashFade >= 1;

// Where to stand, and how to hold the arm, so one person's near hand rests
// on another's shoulder. Tries arm angles until the hand is at shoulder
// height, then stands at the distance that puts it there.
function handOnShoulder(who, to) {
  to.rig.solve();
  const [sx, sy] = to.rig.world('shoulder');
  const f = to.x < who.x ? -1 : 1;
  const probe = new Person('abuyazan', who.rig.scale);
  let best = null;
  for (let a = 0.9; a <= 1.9; a += 0.02) {
    const pose = { ...POSES.stand, head: 0.12, armN: a, foreN: a + 0.12 };
    probe.setPose(pose);
    probe.x = 0;
    probe.y = who.y;
    probe.f = f;
    const [hx, hy] = probe.world('handN');
    const err = Math.abs(hy - (sy - 4));
    if (!best || err < best.err) best = { err, pose, hx };
  }
  // the hand lands just on the near side of the shoulder
  return { pose: best.pose, x: sx - f * 2 - best.hx };
}

// ------------------------------------------------------ depth and doors --

// Walk into (k 0 → 1) or out of (k 1 → 0) a side street that runs away from
// the camera at x = mouth: the figure faces away or towards us and shrinks
// towards the vanishing point. Runs as a script step, after the NPC update.
function* depthWalk(g, w, mouth, dir, rate = 0.1) {
  const base = w.baseScale ?? w.rig.scale;
  w.baseScale = base;
  let k = dir === 'in' ? 0.001 : 1;
  w.face(dir === 'in' ? 'back' : 'front');
  w.x = mouth;
  const step = () => {
    const dt = g.lastDt || 1 / 60;
    k = clamp(k + (dir === 'in' ? 1 : -1) * rate * dt);
    w.pose(dt, 60);
    placeInDepth(w, mouth, k, base);
    w.stride += dt * 90 * (1 / (1 + 3.4 * k));
    w.depthK = k > 0.001 ? k : 0;
    return dir === 'in' ? k >= 1 : k <= 0;
  };
  yield step;
  w.depthK = 0;
  w.rig.scale = base;
  w.face(dir === 'in' ? 'back' : 'side');
  if (dir === 'in') w.visible = false;
}

function placeInDepth(w, mouth, k, base) {
  const s = 1 / (1 + 3.4 * k);
  w.rig.scale = base * s;
  w.rig.x = lerp(mouth - 10, mouth + 6, k);
  w.rig.y = lerp(0, -70, 1 - s);
}

// Someone reaching a doorway turns their back and goes in.
function enterDoor(g, w) {
  if (w.entering) return;
  w.entering = true;
  w.face('back');
  setTimeoutGame(g, 0.45, () => (w.visible = false));
}

// ------------------------------------------------------------ street life --

// Now and then, in the calm stretches, someone crosses the mouth of a side
// street: out of it towards us, or along the street and into it.
const MOUTHS = [3105, 5130, 10020];
const PASSERS = [
  { outfit: 'man', can: true },
  { outfit: 'woman' },
  { outfit: 'woman2' },
  { outfit: 'fadi', scale: 0.86 },
  { outfit: 'man2' },
  { outfit: 'man3' },
  { outfit: 'boy', scale: 0.62 },
  { outfit: 'abuyazan' },
];

function streetLife(g, dt) {
  const a = g.a;
  g.lastDt = dt;
  g.passers ||= [];
  const calm =
    g.scene === 'street' &&
    !g.locked &&
    !a.shelling &&
    !(a.jetFly && g.time < a.jetFly.t0 + 14) &&
    !(a.heliWarn && g.time < a.heliWarn + 12) &&
    !a.drainT0 &&
    g.player.x < X.newsStart - 250;
  a.nextPasser ??= g.time + 5;
  if (calm && g.time > a.nextPasser && g.passers.length < 2) {
    a.nextPasser = g.time + 9 + Math.random() * 9;
    const mouth = MOUTHS.find((m) => Math.abs(m - g.cam.x) < 650 && Math.abs(m - g.player.x) > 120);
    if (mouth) {
      const kind = PASSERS[Math.floor(Math.random() * PASSERS.length)];
      const w = new Walker(g.level, kind.outfit, kind.scale || 1);
      if (kind.can) w.rig.prop = (c, hand) => jerryCan(c, hand[0], hand[1] + 44, 0.95);
      const side = Math.random() < 0.5 ? -1 : 1;
      w.passer = { mouth, dir: Math.random() < 0.5 ? 'out' : 'in', side, phase: 'start' };
      if (w.passer.dir === 'in') {
        w.place(mouth + side * 900);
        w.f = -side;
      } else {
        w.place(mouth);
        w.rig.view = 'front';
      }
      g.passers.push(w);
    } else a.nextPasser = g.time + 3;
  }
  for (const w of g.passers) {
    const ps = w.passer;
    if (ps.phase === 'start') {
      ps.phase = ps.dir === 'out' ? 'depth' : 'along';
      if (ps.dir === 'out') ps.k = 1;
    }
    if (ps.phase === 'depth') {
      w.update(dt, {});
      w.pose(dt, 60);
      ps.k = clamp(ps.k + (ps.dir === 'in' ? 1 : -1) * 0.1 * dt);
      w.depth = ps.k;
      placeInDepth(w, ps.mouth, ps.k, w.baseScale ?? (w.baseScale = w.rig.scale));
      w.stride += dt * 90 * (1 / (1 + 3.4 * ps.k));
      if (ps.dir === 'out' && ps.k <= 0) {
        w.depth = 0;
        w.rig.scale = w.baseScale;
        w.face('side');
        w.f = ps.side;
        ps.phase = 'away';
      } else if (ps.dir === 'in' && ps.k >= 1) ps.done = true;
    } else if (ps.phase === 'along') {
      if (w.goTo(ps.mouth, dt, { speedScale: 0.6 })) {
        w.face('back');
        ps.phase = 'depth';
        ps.k = 0;
        w.baseScale = w.rig.scale;
      }
    } else if (ps.phase === 'away') {
      w.goTo(ps.mouth + ps.side * 1000, dt, { speedScale: 0.6 });
      if (Math.abs(w.x - ps.mouth) > 950) ps.done = true;
    }
  }
  g.passers = g.passers.filter((w) => !w.passer.done);
  if (!calm && (a.shelling || a.drainT0)) g.passers.length = 0;
}

// A few single shots far to the south, irregular, all afternoon.
function* ambientShots(g) {
  for (;;) {
    yield 6 + Math.random() * 9;
    if (g.scene === 'street' && !g.a.shelling) g.sound.distantShot();
  }
}

function setTimeoutGame(g, sec, fn) {
  g.runner.run(
    (function* () {
      yield sec;
      fn();
    })(),
  );
}

return { ACT1 };
})();

// k: 0 at 4:30 pm (gold) … 1 at 7:00 pm (the sun gone behind the hill).
function eveLook(g) {
  const k = g.a.duskK || 0;
  const fog = g.effects.fog;
  const sunUv = [-0.42, lerp(-0.08, 0.32, k)];
  const col = k < 0.5 ? mixc([1.0, 0.7, 0.42], [1.0, 0.52, 0.28], k * 2) : mixc([1.0, 0.52, 0.28], [0.85, 0.42, 0.42], (k - 0.5) * 2);
  const lights = [
    { uv: sunUv, color: col, intensity: lerp(1.15, 0.35, k) * (1 - fog * 0.4), radius: 0, rim: lerp(1.1, 0.7, k) },
    { uv: [0.6, -1.2], color: mixc([0.55, 0.6, 0.8], [0.45, 0.42, 0.75], k), intensity: lerp(0.25, 0.42, k), radius: 0, rim: 0.2 },
  ];
  const torch = g.torchLight();
  if (torch) lights.push(torch);
  if (g.a.tyreGlow) lights.push({ x: tyreX(), y: -70, color: [1, 0.55, 0.25], intensity: g.a.tyreGlow * (0.8 + 0.2 * Math.sin(g.time * 9)), radius: 0.12, rim: 0.5 });
  if (g.a.flameAt && g.time - g.a.flameAt < 2.5) {
    const [hx, hy] = g.player.rig.world('handN');
    lights.push({ x: hx, y: hy - 12, color: [1, 0.72, 0.4], intensity: 0.9 * (0.9 + 0.1 * Math.sin(g.time * 23)), radius: 0.1, rim: 0.6 });
  }
  if (g.a.shotAt && g.time - g.a.shotAt < 0.12) lights.push({ x: g.a.shotX, y: g.a.shotY, color: [1, 0.9, 0.7], intensity: 1.2, radius: 0.06, rim: 0.4 });
  return {
    ambient: mixc([0.27, 0.23, 0.28], [0.17, 0.16, 0.27], k),
    lights,
    groundShadow: lerp(0.8, 0.45, k) * (1 - fog * 0.6),
    god: k < 0.8 ? { uv: sunUv, strength: 0.18 + 0.2 * fog } : null,
    bloom: 0.6,
    exposure: lerp(0.86, 0.8, k),
    grain: 0.05,
    grade: { sat: lerp(0.95, 0.72, k), contrast: lerp(1.08, 1.02, k), lift: 0.005 * k, tint: [1, lerp(0.99, 0.95, k), lerp(0.96, 1.04, k)] },
    fade: g.a.endFade || 0,
  };
}

const shearFor = (g) => -(2.2 + 1.4 * (g.a.duskK || 0)); // long shadows, thrown east

function skyStops(k) {
  const a = [[0, '#56688e'], [0.45, '#b99b86'], [0.75, '#e8b27a']];
  const b = [[0, '#2b2d52'], [0.45, '#77577a'], [0.75, '#d67e58']];
  return a.map(([p, ca], i) => {
    const A = [1, 3, 5].map((j) => parseInt(ca.slice(j, j + 2), 16));
    const B = [1, 3, 5].map((j) => parseInt(b[i][1].slice(j, j + 2), 16));
    return [p, `rgb(${A.map((v, j) => Math.round(lerp(v, B[j], k))).join(',')})`];
  });
}

// Looking down a lane towards the western hill: receding walls, and at the
// end, the hill and the building with the flag. `watch` 0…1 lights a glint
// in the sniper's window.
function laneGap(R, x0, x1, { watch = 0, t = 0, seed = 1 } = {}) {
  const xc = (x0 + x1) / 2;
  const vy = -90;
  R.paint((c) => {
    const r = rng(seed);
    // the hill, low in the west, and the sky above it is the sun's
    c.fillStyle = '#6b5f5a';
    c.beginPath();
    c.moveTo(x0, vy - 60);
    c.quadraticCurveTo(xc - 40, vy - 150, xc + 60, vy - 118);
    c.lineTo(x1, vy - 90);
    c.lineTo(x1, vy + 10);
    c.lineTo(x0, vy + 10);
    c.fill();
    // the sniper's building on it, with its flag
    const bx = xc - 36 + (r() - 0.5) * 30;
    c.fillStyle = '#4e4648';
    c.fillRect(bx, vy - 176, 58, 70);
    c.fillStyle = '#24201f';
    for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) c.fillRect(bx + 8 + i * 17, vy - 166 + j * 26, 8, 12);
    c.fillStyle = '#3a3334';
    c.fillRect(bx + 50, vy - 212, 2, 38);
    c.fillStyle = '#5e3a38';
    c.beginPath();
    c.moveTo(bx + 52, vy - 212);
    c.quadraticCurveTo(bx + 62, vy - 214 + Math.sin(t * 3) * 2, bx + 72, vy - 208);
    c.lineTo(bx + 72, vy - 198);
    c.quadraticCurveTo(bx + 62, vy - 202 + Math.sin(t * 3 + 1) * 2, bx + 52, vy - 200);
    c.fill();
    // road narrowing to the hill
    c.fillStyle = '#7a6a5c';
    c.beginPath();
    c.moveTo(x0, 4);
    c.lineTo(xc - 18, vy + 6);
    c.lineTo(xc + 18, vy + 6);
    c.lineTo(x1, 4);
    c.fill();
    // receding walls either side, their inner faces in shade
    const side = (edge, dir, col) => {
      c.fillStyle = col;
      c.beginPath();
      c.moveTo(edge, 4);
      c.lineTo(edge, -560);
      c.lineTo(xc + dir * 60, vy - 220);
      c.lineTo(xc + dir * 60, vy + 6);
      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(24,18,16,0.5)';
      for (let i = 0; i < 4; i++) {
        const k = i / 4 + 0.1;
        const wx = lerp(edge, xc + dir * 60, k);
        for (let f = 0; f < 3; f++) {
          const wy = lerp(lerp(-500, vy - 200, k), lerp(-70, vy - 10, k), f / 3 + 0.1);
          c.fillRect(wx - 6 * (1 - k), wy, 12 * (1 - k) + 2, 24 * (1 - k) + 3);
        }
      }
    };
    side(x0, -1, '#6f6358');
    side(x1, 1, '#83766a');
    // the window glint: a scope catching the sun
    c.bx = bx;
  });
  const bx = xc - 36 + (rng(seed)() - 0.5) * 30;
  if (watch > 0.02)
    R.glow((c) => {
      const gx = bx + 25 + 4;
      const gy = vy - 166 + 26 + 6;
      const tw = 0.6 + 0.4 * Math.sin(t * 7);
      const grd = c.createRadialGradient(gx, gy, 0, gx, gy, 14);
      grd.addColorStop(0, `rgba(255,245,215,${0.95 * watch * tw})`);
      grd.addColorStop(1, 'rgba(255,220,160,0)');
      c.fillStyle = grd;
      c.fillRect(gx - 16, gy - 16, 32, 32);
      c.fillStyle = `rgba(255,250,230,${0.5 * watch * tw})`;
      c.fillRect(gx - 12, gy - 0.5, 24, 1);
      c.fillRect(gx - 0.5, gy - 8, 1, 16);
    });
}

// The band of low sun through a lane, across our street and the pavement.
function laneLight(R, x0, x1, k) {
  R.glow((c) => {
    const w = x1 - x0;
    const grd = c.createLinearGradient(0, -300, 0, 40);
    grd.addColorStop(0, 'rgba(255,170,90,0)');
    grd.addColorStop(0.7, `rgba(255,180,100,${0.1 * (1 - k * 0.6)})`);
    grd.addColorStop(1, `rgba(255,190,110,${0.18 * (1 - k * 0.6)})`);
    c.fillStyle = grd;
    c.beginPath();
    c.moveTo(x0 + 10, -300);
    c.lineTo(x1 - 10, -300);
    c.lineTo(x1 + w * 0.25, 40);
    c.lineTo(x0 + w * 0.25, 40);
    c.fill();
  });
}

// Torn sheets that were a sniper curtain here once.
function tornCurtain(R, x0, x1, t) {
  R.cast((c) => {
    c.strokeStyle = '#2a2622';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(x0, -300);
    c.quadraticCurveTo((x0 + x1) / 2, -270, x1, -305);
    c.stroke();
    const rags = [[x0 + 10, 50, 120, '#cfc6b4'], [x0 + 70, 26, 60, '#8e6f5a'], [x1 - 60, 44, 90, '#6d7a82']];
    for (const [rx, w, h, col] of rags) {
      const sway = Math.sin(t * 1.4 + rx) * 4;
      c.fillStyle = col;
      c.beginPath();
      c.moveTo(rx, -298);
      c.lineTo(rx + w, -296);
      c.lineTo(rx + w * 0.8 + sway, -296 + h);
      c.lineTo(rx + w * 0.55 + sway, -296 + h * 0.7);
      c.lineTo(rx + w * 0.3 + sway, -296 + h * 0.9);
      c.lineTo(rx + sway, -296 + h * 0.6);
      c.closePath();
      c.fill();
    }
  });
}

function sandbags(R, x, w, rows = 3, { color = '#9c8a68', cast = true } = {}) {

    const r = rng(x | 0);
    for (let row = 0; row < rows; row++) {
      const y = -row * 22;

      for (let bx = x + off; bx < x + w - 20; bx += 44) {
        const sh = 0.82 + r() * 0.3;
        c.fillStyle = T.shade(color, sh);
        c.beginPath();
        c.ellipse(bx + 22, y - 11, 24, 12, (r() - 0.5) * 0.08, 0, Math.PI * 2);
        c.fill();
        c.strokeStyle = 'rgba(40,30,20,0.35)';
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(bx + 6, y - 11);
        c.lineTo(bx + 38, y - 12);
        c.stroke();

function concreteBlocks(c, x, n, s = 1, color = '#8d877c') {

// A car burnt to its shell: no glass, no tyres, rust and soot.
function burntCar(R, x, w = 240) {
  R.cast((c) => {
    const h = 112;
    c.fillStyle = '#3b2c24';
    c.beginPath();
    c.moveTo(x, -24);
    c.lineTo(x + 8, -64);
    c.lineTo(x + w * 0.24, -70);
    c.lineTo(x + w * 0.34, -h);
    c.lineTo(x + w * 0.7, -h + 2);
    c.lineTo(x + w * 0.82, -68);
    c.lineTo(x + w - 4, -60);
    c.lineTo(x + w, -24);
    c.closePath();
    c.fill();
    // rust patches and soot
    const r = rng(x | 0);
    for (let i = 0; i < 16; i++) {
      c.fillStyle = r() < 0.5 ? 'rgba(130,64,34,0.55)' : 'rgba(20,16,14,0.6)';

    c.lineTo(x + w * 0.29, -72);

    c.lineTo(x + w * 0.67, -h + 9);
    c.lineTo(x + w * 0.77, -72);
    c.lineTo(x + w * 0.53, -72);

      c.strokeStyle = '#4a3a30';
      c.lineWidth = 3;
      c.beginPath();
      c.arc(wx, -10, 13, 0, Math.PI * 2);

}

// A tyre burning inside the lane, lit on purpose: its smoke blinds the hill.
function tyreX() {
  return (X.lane3[0] + X.lane3[1]) / 2 - 40;
}
function tyre(R, t, glow) {
  // a little way down the lane, towards the hill: smaller, higher
  const x = tyreX();
  const S = 0.55;
  const y = -48;
  R.cast((c) => {
    c.fillStyle = '#141110';
    c.beginPath();
    c.ellipse(x, y - 14 * S, 30 * S, 14 * S, 0, 0, Math.PI * 2);
    c.fill();
  });
  if (glow > 0)
    R.glow((c) => {
      for (let i = 0; i < 6; i++) {
        const fx = x + (-22 + i * 9) * S;
        const fh = (16 + 12 * Math.sin(t * 11 + i * 2)) * glow * S;
        c.fillStyle = `rgba(255,${130 + i * 12},50,${0.6 * glow})`;
        c.beginPath();
        c.moveTo(fx - 5 * S, y - 18 * S);
        c.quadraticCurveTo(fx, y - 18 * S - fh * 1.4, fx + 5 * S, y - 18 * S);
        c.fill();
      }
    });
}

// The smoke across lane 3, drawn in front of everyone. density 0…1.
function tyreSmoke(R, t, density) {
  if (density <= 0.02) return;
  const [x0, x1] = X.lane3;
  R.paint((c) => {
    const r = rng(33);
    for (let i = 0; i < 26; i++) {
      const k = i / 25;
      const px = lerp(x0 - 40, x1 + 80, r()) + Math.sin(t * 0.4 + i) * 30 + ((t * 18 + i * 40) % 160) - 80;
      const py = -30 - r() * 420 - k * 60;
      const pr = 70 + r() * 110;
      const a = Math.min(1, 0.9 * density * (0.6 + 0.4 * r()));
      const grd = c.createRadialGradient(px, py, 0, px, py, pr);
      grd.addColorStop(0, `rgba(58,52,50,${a})`);
      grd.addColorStop(0.6, `rgba(70,64,60,${a * 0.6})`);
      grd.addColorStop(1, 'rgba(70,64,60,0)');
      c.fillStyle = grd;
      c.beginPath();
      c.arc(px, py, pr, 0, Math.PI * 2);
      c.fill();
    }
  });
}

// The building beside School Street, half down: floors pancaked on the
// right, slabs hanging by their rebar. `cut` 0…1 opens the façade so we can
// see Sami inside.
function ruin(R, t, cut) {
  const [x0, x1] = X.ruin;
  const w = x1 - x0;
  R.paint((c) => {
    c.fillStyle = '#8f846f';
    c.beginPath();
    c.moveTo(x0, 4);
    c.lineTo(x0, -520);
    c.lineTo(x0 + w * 0.45, -520);
    c.lineTo(x0 + w * 0.6, -430);
    c.lineTo(x0 + w * 0.8, -300);
    c.lineTo(x1, -220);
    c.lineTo(x1, 4);
    c.closePath();
    c.fill();
    // the slabs, sagging towards the street
    c.fillStyle = '#6f6656';
    for (const [y, drop] of [[-380, 60], [-250, 90], [-130, 40]]) {
      c.beginPath();
      c.moveTo(x0 + w * 0.3, y);
      c.lineTo(x1 + 20, y + drop);
      c.lineTo(x1 + 20, y + drop + 14);
      c.lineTo(x0 + w * 0.3, y + 14);
      c.fill();
    }
    c.strokeStyle = '#3a2e24';
    c.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const rx = x1 + 16 - i * 7;
      c.beginPath();
      c.moveTo(rx, -250 + 90 + 12);
      c.quadraticCurveTo(rx + 8, -120, rx - 6, -90 + i * 4);
      c.stroke();
    }
    // windows on the standing half
    c.fillStyle = '#1c1714';
    for (let f = 0; f < 3; f++) for (let i = 0; i < 2; i++) c.fillRect(x0 + 30 + i * 70, -480 + f * 130, 40, 60);
    // the doorway
    c.fillStyle = '#0b0908';
    c.fillRect(X.ruinDoor - 36, -160, 72, 160);
  });
  if (cut > 0)
    R.paint((c) => {
      // inside: a dark room and the slab that fell into it, a ramp up to the
      // first floor
      c.globalAlpha = cut;
      c.fillStyle = '#231d18';
      c.fillRect(X.ruinDoor + 36, -250, x1 - X.ruinDoor - 36, 254);
      c.fillStyle = '#4a4034';
      c.beginPath();
      c.moveTo(X.climb[0], 0);
      c.lineTo(X.climb[0], -100);
      c.lineTo(X.climb[1], -104);
      c.lineTo(X.climb[1] + 30, -250);
      c.lineTo(X.climb[1] + 44, -250);
      c.lineTo(X.climb[1] + 10, 0);
      c.fill();
      c.globalAlpha = 1;
    });
}

// Looking down School Street from our sandbags to theirs. `peek` pushes
// the camera in. Ahmad's satchel lies halfway; nothing else of him is shown.
function schoolStreet(R, g, t) {
  const [x0, x1] = X.mouth;
  const xc = (x0 + x1) / 2;
  const vy = -86;
  const at = (k) => ({ s: 1 / (1 + 3.4 * k), x: xc, y: lerp(4, vy, 1 - 1 / (1 + 3.4 * k)) });
  R.paint((c) => {
    // far end: the checkpoint in the last of the light
    c.fillStyle = '#5a5058';
    c.fillRect(x0 + 60, vy - 140, x1 - x0 - 120, 150);
    // road, long and flat
    c.fillStyle = '#6f6356';
    c.beginPath();
    c.moveTo(x0, 4);
    c.lineTo(xc - 26, vy);
    c.lineTo(xc + 26, vy);
    c.lineTo(x1, 4);
    c.fill();
    // the centre line, still there
    c.strokeStyle = 'rgba(210,200,170,0.35)';
    c.lineWidth = 2;
    c.setLineDash([14, 18]);
    c.beginPath();
    c.moveTo(xc, 4);
    c.lineTo(xc, vy);
    c.stroke();
    c.setLineDash([]);
    // receding façades
    const side = (edge, dir, col) => {
      c.fillStyle = col;
      c.beginPath();
      c.moveTo(edge, 4);
      c.lineTo(edge, -560);
      c.lineTo(xc + dir * 34, vy - 150);
      c.lineTo(xc + dir * 34, vy);
      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(22,18,16,0.55)';
      for (let i = 0; i < 6; i++) {
        const k = i / 6 + 0.06;
        const wx = lerp(edge, xc + dir * 34, k);
        for (let f = 0; f < 3; f++) {
          const wy = lerp(lerp(-500, vy - 140, k), lerp(-70, vy - 10, k), f / 3 + 0.1);
          c.fillRect(wx - 6 * (1 - k), wy, 12 * (1 - k) + 2, 22 * (1 - k) + 3);
        }
      }
    };
    side(x0, -1, '#7d7064');
    side(x1, 1, '#6c6158');
    // the checkpoint: sandbags, concrete blocks, a flag, a watchtower, a soldier
    const e = at(1);
    c.save();
    c.translate(xc, vy + 2);
    const s = 0.24;
    c.scale(s, s);
    c.fillStyle = '#51483e';
    concreteBlocks(c, -150, 7, 1, '#6a645a');
    c.fillStyle = '#5e5242';
    for (let i = 0; i < 6; i++) {
      c.beginPath();
      c.ellipse(-120 + i * 44, -54, 24, 12, 0, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = '#3a3432';
    c.fillRect(120, -230, 8, 230); // the tower's legs
    c.fillRect(180, -230, 8, 230);
    c.fillRect(110, -270, 90, 44);
    c.fillStyle = '#2a2524';
    c.fillRect(-60, -300, 4, 250); // flagpole
    const wave = Math.sin(t * 2.4) * 4;
    const band = (y, col) => {
      c.fillStyle = col;
      c.beginPath();
      c.moveTo(-56, -300 + y);
      c.quadraticCurveTo(-20, -304 + y + wave, 20, -300 + y);
      c.lineTo(20, -286 + y);
      c.quadraticCurveTo(-20, -290 + y + wave, -56, -286 + y);
      c.fill();
    };
    band(0, '#7a3a36');
    band(14, '#b7b0a2');
    band(28, '#2a2626');
    // a soldier behind the bags: a helmeted silhouette, still
    c.fillStyle = '#2b2a28';
    c.beginPath();
    c.arc(40, -96, 11, Math.PI, 0);
    c.fill();
    c.fillRect(30, -96, 20, 34);
    c.restore();
    void e;
  });
  // Ahmad, halfway, under the blanket Um Said put over him: a dark shape
  // at a distance, and nothing more.
  const m = at(0.3);
  R.cast((c) => {
    c.save();
    c.translate(m.x + 20 * m.s, m.y);
    c.scale(m.s * 1.25, m.s * 1.25);
    const rip = Math.sin(t * 1.3) * 1.5;
    c.fillStyle = '#4e4338';
    c.beginPath();
    c.moveTo(-70, 0);
    c.quadraticCurveTo(-66, -18, -40, -20 + rip);
    c.quadraticCurveTo(0, -26, 30, -18 + rip * 0.6);
    c.quadraticCurveTo(62, -16, 72, 0);
    c.closePath();
    c.fill();
    c.fillStyle = 'rgba(0,0,0,0.22)';
    c.fillRect(-60, -6, 128, 6);
    c.restore();
  });
}

// ---------------------------------------------------------------- scene --

function drawStreet(R, g) {
  const t = g.time;
  const a = g.a;
  const k = a.duskK || 0;
  const cx = R.cam.x;
  const near = (x0, x1) => x1 > cx - 1400 && x0 < cx + 1400;

  T.sky(R, skyStops(k), { sun: [0.08, lerp(0.42, 0.72, k)], warmth: clamp(0.8 + k * 0.4) });
  T.skyline(R, { depth: 0.15, y: 30, color: mixc([163, 154, 144], [112, 98, 118], k).map(Math.round).reduce((s, v) => s + v.toString(16).padStart(2, '0'), '#'), seed: 14, haze: ['#d8b8a0', 0.3], minarets: [900] });
  T.plume(R, 1600, 60, t, { depth: 0.18, age: 1, height: 360, width: 60, alpha: 0.4, color: [80, 74, 78] });
  T.skyline(R, { depth: 0.32, y: 40, color: mixc([143, 132, 116], [96, 84, 96], k).map(Math.round).reduce((s, v) => s + v.toString(16).padStart(2, '0'), '#'), seed: 19, haze: ['#cfae96', 0.18] });

  // swifts, screaming in loose parties over the rooftops
  if (a.swiftsAt && t - a.swiftsAt < 6) {
    R.layer(0.4);
    R.paint((c) => {
      const r = rng(Math.floor(a.swiftsAt));
      const u = (t - a.swiftsAt) / 6;
      c.fillStyle = 'rgba(30,26,34,0.85)';
      for (let i = 0; i < 7; i++) {
        const bx = cx * 0.4 - 900 + u * 1800 + r() * 260 + Math.sin(t * 3 + i) * 30;
        const by = -420 - r() * 160 + Math.sin(t * 5 + i * 2) * 20;
        const flap = Math.sin(t * 22 + i) * 0.4;
        c.beginPath();
        c.moveTo(bx - 9, by - 2 + flap * 5);
        c.quadraticCurveTo(bx - 3, by - 1, bx, by);
        c.quadraticCurveTo(bx + 3, by - 1, bx + 9, by - 2 + flap * 5);
        c.lineTo(bx, by + 2);
        c.fill();
      }
    });
    R.layer(1);
  }

  // the lanes: what you see down them, before the façades frame them
  const laneWatch = [1, a.watch2 ?? 1, a.watch3 ?? 1];
  LANES.forEach((L, i) => {
    if (near(L.x0, L.x1)) laneGap(R, L.x0, L.x1, { watch: laneWatch[i], t, seed: 70 + i });
  });
  if (near(X.lane3[0], X.lane3[1])) tyre(R, t, a.tyreGlow || 0);
  if (near(X.mouth[0] - 200, X.mouth[1])) schoolStreet(R, g, t);

  for (const b of BLOCKS) if (near(b.x, b.x + b.w)) T.block(R, b, t);
  if (near(X.hosp[0], X.hosp[1])) fieldHospital(R, X.hosp[0], X.hosp[1], t);
  if (near(X.flat - 100, X.flat + 100)) guttedFlat(R, X.flat);
  if (near(X.sheet - 100, X.sheet + 100)) balcony(R, X.sheet, t, !a.hasSheet);
  if (near(X.ruin[0], X.ruin[1])) ruin(R, t, a.cut || 0);
  // the evening throws the shadows of our side's blocks long and east
  R.shadow((c) => {
    c.fillStyle = 'rgba(0,0,0,1)';
    for (let i = 0; i < BLOCKS.length; i++) {
      const b = BLOCKS[i];
      if (!near(b.x - 300, b.x + b.w + 300)) continue;
      const h = 240 + ((i * 97) % 5) * 50 + k * 200;
      const x0 = b.x + ((i * 53) % 3) * 50 - 60;
      const w = b.w * (0.5 + ((i * 31) % 4) * 0.1);
      c.beginPath();
      c.moveTo(x0, 10);
      c.lineTo(x0 + 40, -h);
      c.lineTo(x0 + w + 80, -h + 40);
      c.lineTo(x0 + w + 140, 10);
      c.closePath();
      c.fill();
    }
  }, 0, 0, 0, 1);

  T.street(R, -500, 7200);
  T.cables(R, cx, { seed: 23, to: 7000 });
  LANES.forEach((L) => {
    if (near(L.x0, L.x1)) laneLight(R, L.x0, L.x1, k);
  });
  if (near(X.lane1[0], X.lane1[1])) tornCurtain(R, X.lane1[0] + 20, X.lane1[1] - 20, t);
  if (near(X.rebar - 100, X.rebar + 100)) T.rubble(R, X.rebar - 70, 150, 50, { seed: 88, rebar: true });
  // our sandbags at the mouth of School Street, and a blanket on a wire
  // across it, high, so the checkpoint can't see who crosses behind
  if (near(X.mouth[0] - 200, X.mouth[1] + 200)) {
    R.cast((c) => {
      c.strokeStyle = '#2a2622';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(X.mouth[0] - 10, -330);
      c.quadraticCurveTo((X.mouth[0] + X.mouth[1]) / 2, -300, X.mouth[1] + 10, -336);
      c.stroke();
      const cols = ['#6b3f36', '#4a5260', '#8a7a5a', '#6b3f36'];
      for (let i = 0; i < 4; i++) {
        const bx = X.mouth[0] + i * 125;
        const sway = Math.sin(t * 1.1 + i) * 4;
        c.fillStyle = cols[i];
        c.beginPath();
        c.moveTo(bx, -326 + i * 2);
        c.lineTo(bx + 120, -322 + i * 2);
        c.lineTo(bx + 120 + sway, -190 - (i % 2) * 14);
        c.lineTo(bx + sway, -186);
        c.fill();
        c.fillStyle = 'rgba(0,0,0,0.15)';
        c.fillRect(bx + 20, -320, 2, 130);
        c.fillRect(bx + 70, -320, 2, 130);
      }
    });
    // rubble closing our street beyond the mouth
    T.rubble(R, X.mouth[1] - 20, 260, 180, { seed: 91 });
  }
  // the curtain rail in the rubble, when D1 needs it
  if (a.rebarGlint && near(X.rebar - 50, X.rebar + 50)) {
    R.glow((c) => {
      const tw = 0.5 + 0.5 * Math.sin(t * 5);
      c.fillStyle = `rgba(255,230,200,${0.3 + 0.3 * tw})`;
      c.fillRect(X.rebar - 12, -46, 24, 1.5);
    });
  }

  // --- the people ---
  const shear = shearFor(g);
  R.paint((c) => {
    for (const w of [...g.npcs, g.player]) {
      if (!w.visible || w.depthK || !near(w.x - 60, w.x + 60)) continue;
      const s2 = w.rig.scale || 1;
      const grd = c.createRadialGradient(w.x, w.y + 2, 0, w.x, w.y + 2, 26 * s2);
      grd.addColorStop(0, 'rgba(20,14,10,0.34)');
      grd.addColorStop(1, 'rgba(20,14,10,0)');
      c.fillStyle = grd;
      c.beginPath();
      c.ellipse(w.x, w.y + 2, 26 * s2, 5 * s2, 0, 0, Math.PI * 2);
      c.fill();
    }
  });
  for (const w of g.npcs) {
    if (!w.visible || !near(w.x - 100, w.x + 100) || w.depthK) continue;
    R.cast((c) => w.draw(c));
    R.shadow((c) => w.draw(c), w.x, w.y, shear, 0.1);
  }
  const p = g.player;
  if (p.visible) {
    if (a.inside) {
      R.cast((c) => p.draw(c));
    } else {
      R.cast((c) => p.draw(c));
      R.shadow((c) => p.draw(c), p.x, p.y, shear, 0.1);
    }
  }
  for (const w of [p, ...g.npcs]) if (w.visible && w.depthK) R.cast((c) => w.draw(c));

  // --- in front: the cover, the smoke, the bags ---
  if (near(X.wall1[0], X.wall1[1])) T.lowWall(R, X.wall1[0], X.wall1[1] - X.wall1[0], 104, '#a3957c');
  if (near(X.car[0], X.car[1])) burntCar(R, X.car[0], X.car[1] - X.car[0]);
  if (near(X.crawl[0] - 60, X.crawl[1] + 60)) crawlWall(R);
  if (near(X.lane3[0], X.lane3[1])) tyreSmoke(R, t, a.smoke || 0);
  if (near(X.guard - 100, X.mouth[0] + 200)) sandbags(R, X.guard + 10, 150, 4);
  // the ruin's front wall comes back over Sami once he's through the door
  if (a.inside && (a.cut || 0) < 1) {
    R.paint((c) => {
      c.globalAlpha = 1 - (a.cut || 0);
      c.fillStyle = '#8f846f';
      c.fillRect(X.ruinDoor + 36, -250, X.ruin[1] - X.ruinDoor - 36, 254);
      c.globalAlpha = 1;
    });
  }

  g.effects.draw(R);
  g.effects.drawFog(R, [190, 150, 130]);
  T.motes(R, cx, t, 0.8 * (1 - k));
  T.foreground(R, cx, { to: 7000 });
}

function surfaceAt(x) {
  if (x > X.rebar - 80 && x < X.rebar + 90) return 'rubble';
  if (x > X.ruin[0] && x < X.ruin[1]) return 'rubble';
  if (x > X.crawl[0] - 40 && x < X.crawl[1] + 40) return 'rubble';
  return 'grit';
}

return { X, LANES, eveLook, shearFor, sandbags, concreteBlocks, burntCar, drawStreet, surfaceAt };
})();

// A line by key, as a script step: shows it, tags placeholders in the log.
function* say(g, key) {
  const L = LINES[key];
  const step = g.say(L.who ? WHO[L.who] : null, [L.ar, L.en], L.dur, L.style || '');
  const first = step.next();
  markDraft(g, L);
  yield first.value;
}

// The same, without waiting for it.
function line(g, key) {
  const L = LINES[key];
  g.line(L.who ? WHO[L.who] : null, [L.ar, L.en], L.dur, L.style || '');
  markDraft(g, L);
}

function markDraft(g, L) {
  const last = g.text.log[g.text.log.length - 1];
  if (last && last.line[1] === L.en) last.draft = !!L.draft;
}

  for (const k of keys) {

  }

    g.sound.noise({ dur: 1.6, freq: 500, q: 0.5, vol: 0.06, attack: 0.5 }); // a beat of wind

      g.a.endFade = clamp((g.time - t0) / 1.8);

  update(g, dt) {

    a.duskK = a.duskEnd ? lerp(a.duskK, 0.8, 1 - Math.exp(-dt * 0.35)) : Math.max(a.duskK, k);

    const w2 = c2 < 6.5 ? 1 : 0;
    if (a.radio2 && (w2 > 0.5) !== (a.watch2 > 0.5)) {
      g.sound.radio(1.6);
      line(g, w2 ? 'radio_watch' : 'radio_away');
    }
    a.watch2 = w2;
    // lane 3: the smoke thickens and thins on an 11 s cycle
    const c3 = a.t3 ? (g.time - a.t3) % 11 : 6;

    const lane = LANES.find((L) => p.x > L.x0 && p.x < L.x1);

      const watching = lane.id === 1 ? true : lane.id === 2 ? a.watch2 > 0.5 : a.watch3 > 0.5;
      const covered = p.stance !== 'stand' && lane.cover.some(([c0, c1]) => p.x > c0 && p.x < c1);
      const safe = p.stance === 'prone' || covered || !watching;
      a.laneState = { id: lane.id, watching, safe };
      a.expose = safe ? Math.max(0, a.expose - dt * 2) : a.expose + dt;
      if (a.expose > 0.4 && !a.shotBusy) {

      a.laneState = lane ? a.laneState : null;
      a.expose = 0;
    }
  },

  useTool(g, id) {
    const a = g.a;
    const x = g.player.x;
    if (id === 'mirror') {
      if (a.radio2 && x > X.peek2 - 250 && x < X.car[1]) g.runner.run(this.lanePeek(g));
      else line(g, 'mirror_plain');
    } else if (id === 'walkie') {
      g.sound.squelch();

      else line(g, 'radio_plain');
    } else if (id === 'whitecloth') {
      if (a.clothReady && x > X.stop - 220) a.raised = true;
      else line(g, 'cloth_wrong');
    } else if (id === 'lighter') {
      g.sound.click();
      a.flameAt = g.time;
      line(g, 'lighter_use');
    } else if (id === 'journal') {
      line(g, 'journal');
    }
  },

  draw(R, g) {
    drawStreet(R, g);
  },

  look(g) {
    return eveLook(g);
  },
};

// A cigarette between two fingers, its tip glowing as he draws on it.
function cigarette(c, hand, t) {
  const [hx, hy] = hand;
  c.fillStyle = '#e8e2d4';
  c.fillRect(hx - 1, hy - 7, 2, 8);
  c.fillStyle = `rgba(255,${120 + 60 * Math.max(0, Math.sin(t * 0.8))},60,0.95)`;
  c.fillRect(hx - 1.2, hy - 8.5, 2.4, 2);
}

// A bedsheet wrapped round a curtain rail, held high.
function whiteCloth(c, hand, t) {
  const [hx, hy] = hand;
  c.strokeStyle = '#4a3b2e';
  c.lineWidth = 3;
  c.beginPath();
  c.moveTo(hx, hy + 30);
  c.lineTo(hx + 4, hy - 150);
  c.stroke();
  c.fillStyle = '#ece8de';
  c.beginPath();
  c.moveTo(hx + 4, hy - 148);
  for (let i = 0; i <= 6; i++) c.lineTo(hx + 4 + i * 14, hy - 148 + Math.sin(t * 5 + i * 0.9) * 4 * (i / 6));
  for (let i = 6; i >= 0; i--) c.lineTo(hx + 4 + i * 14, hy - 92 + Math.sin(t * 5 + i * 0.9 + 0.6) * 5 * (i / 6));
  c.closePath();
  c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.12)';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(hx + 30, hy - 146);
  c.lineTo(hx + 34, hy - 94);
  c.stroke();
}

// Walk away from us into a street that runs into depth, up to depth kMax.
function* intoDepth(g, w, mouth, rate, kMax) {
  const base = w.rig.scale;
  let k = 0.001;
  w.face('back');
  yield () => {
    const dt = g.lastDt || 1 / 60;
    k = Math.min(kMax, k + rate * dt);
    const s = 1 / (1 + 3.4 * k);
    w.rig.scale = base * s;
    w.rig.x = mouth;
    w.rig.y = lerp(0, -86, 1 - s);
    w.stride += dt * 90 * s;
    w.pose(dt, 60);
    w.depthK = k;
    return k >= kMax;
  };
}

// Distant shots now and then, and swifts over the roofs.
function* ambient(g) {
  let nextShot = g.time + 6;
  let nextSwifts = g.time + 4;
  for (;;) {
    g.lastDt = 1 / 60;
    yield 0.5;
    if (g.time > nextShot) {
      nextShot = g.time + 5 + Math.random() * 7;
      if (!g.a.duskEnd) g.sound.distantShot();
    }
    if (g.time > nextSwifts && (g.a.duskK || 0) < 0.9) {
      nextSwifts = g.time + 14 + Math.random() * 12;
      g.a.swiftsAt = g.time;
      g.sound.swifts();
    }
  }
}

  panel.appendChild(h);
  const box = document.createElement('div');
  box.className = 'menu-log';
  box.tabIndex = 0;
  const subs = settings.get('subtitles');
  if (!text.log.length) box.innerHTML = `<p class="menu-sub">${esc(t('logEmpty'))}</p>`;
  for (const e of text.log) {
    const row = document.createElement('div');
    row.className = `log-row style-${e.style || 'plain'}`;
    const whoName = e.who ? (lang() === 'ar' ? `<span class="ar" lang="ar" dir="rtl">${esc(e.who[0])}</span>` : `<span class="en">${esc(e.who[1])}</span>`) : '';
    const who = e.who ? `<span class="log-who">${whoName}</span>` : '';
    const draft = e.draft ? `<span class="log-draft">[draft]</span>` : '';
    row.innerHTML = `${who}${draft}<span class="log-lines">${subs !== 'en' ? `<span class="ar" lang="ar" dir="rtl">${esc(e.line[0])}</span>` : ''}${subs !== 'ar' ? `<span class="en" dir="ltr">${esc(e.line[1])}</span>` : ''}</span>`;
    box.appendChild(row);
  }
  panel.appendChild(box);
  requestAnimationFrame(() => (box.scrollTop = box.scrollHeight));
  m.backButton(panel);
}

const menu = new Menu($('menu'), {
  t,
  dir: () => (lang() === 'ar' ? 'rtl' : 'ltr'),
  header: () => `<p class="kicker"><span class="kicker-rule" aria-hidden="true"></span><span>${esc(t('kickerDate'))}</span></p>
    <h1><span class="ar" lang="ar" dir="rtl">قبل ما عرفت</span><span class="en" lang="en">Before I Knew</span></h1>
    <p class="tagline">${esc(t('tagline'))}</p>`,
  main: [
    {
      label: () => t('continue'),
      sub: continueSub,
      hidden: () => !saved() && !nextAct(),
      action: () => {
        if (saved()) return startGame(saved());
        const n = act2State(nextAct());
        writeSave(n);
        startGame(n);
      },
    },
    { label: () => t('newGame'), sub: () => t('newGameSub'), action: () => newGame() },
    { label: () => t('chapters'), action: (m) => m.push('chapters') },
    { label: () => t('settings'), action: (m) => m.push('settings') },
    { label: () => t('controls'), action: (m) => m.push('controls') },
    { label: () => t('about'), action: (m) => m.push('about') },
  ],
  pause: [
    { label: () => t('resume'), action: (m) => m.close() },
    { label: () => t('log'), action: (m) => m.push('log') },
    { label: () => t('settings'), action: (m) => m.push('settings') },
    { label: () => t('controls'), action: (m) => m.push('controls') },
    {
      label: () => t('restart'),
      action: () => {
        const s = loadSave() || freshState();
        startGame({ ...s, completed: false });
      },
    },
    { label: () => t('mainMenu'), action: () => toMainMenu() },
  ],
  pauseAside,
  pages: { log: logPage, chapters: chaptersPage },
  onOpen: () => {
    game.paused = true;
    stage.classList.add('paused');
    sound.suspend();
  },
  onClose: () => {
    game.paused = false;
    stage.classList.remove('paused');
    sound.resume();
  },
  settingsStore: settings,
  settings: [
    { group: 'gSound' },
    { key: 'master', label: 'master', type: 'range' },
    { key: 'music', label: 'music', type: 'range' },
    { key: 'effects', label: 'effects', type: 'range' },
    { group: 'gText' },
    { key: 'lang', label: 'lang', type: 'select', options: [['en', 'English'], ['ar', 'عربي']], redraw: true },
    { key: 'subtitles', label: 'subtitles', type: 'select', options: [['both', 'subsBoth'], ['en', 'subsEn'], ['ar', 'subsAr']] },
    { key: 'textSize', label: 'textSize', type: 'select', options: [[0.85, 'small'], [1, 'medium'], [1.2, 'large'], [1.4, 'xlarge']] },
    { key: 'backing', label: 'backing', type: 'select', options: [['off', 'off'], ['light', 'light'], ['dark', 'dark']] },
    { group: 'gDisplay' },
    { key: 'quality', label: 'quality', type: 'select', options: [['auto', 'auto'], ['low', 'low'], ['medium', 'medium'], ['high', 'high']] },
    { key: 'shake', label: 'shake', type: 'toggle' },
    { key: 'reduceFlashes', label: 'reduceFlashes', type: 'toggle' },
    { group: 'gPlay' },
    { key: 'hints', label: 'hints', type: 'toggle' },
  ],
  controls: { input, actions: ACTIONS, label: keyLabel },
  about: () =>
    lang() === 'ar'
      ? `<h2 class="menu-title">عن القصة</h2>
    <p><strong>قبل ما عرفت</strong> قصة تفاعلية تدور أحداثها في بلدة محاصرة في الغوطة، قرب دمشق، في آب ٢٠١٤. سامي في السابعة والعشرين. يمشي مع أقرب أصدقائه، أحمد، ثم يفترقان عند مفترق الطرق. وبعد أقلّ من ساعة، يعلم أن أحمد قد استُشهد.</p>
    <p>هذا هو الفصل الأول: المشوار، والفراق، وساعة ما قبل المعرفة. تحدّد خياراتك من يكون سامي حين يصله الخبر، وإلى أين تمضي الليلة.</p>
    <h3>تنبيه حول المحتوى</h3>
    <p>الحياة تحت الحصار: القصف، والقنص، والجوع، وموت صديق، والحزن. يُسمَع العنف ويُفهَم، لكنه لا يُعرَض. يُنصح بها لمن هم في السادسة عشرة فما فوق.</p>
    <p class="menu-sub">عمل متخيَّل مستند إلى شهادات موثّقة عن الحياة تحت الحصار. كل ما فيه مرسوم ومولَّد بالبرمجة، من دون صور أو تسجيلات.</p>`
      : `<h2 class="menu-title">About</h2>
    <p><strong>Before I Knew · قبل ما عرفت</strong> is an interactive story set in a besieged town in Ghouta, outside Damascus, in August 2014. Sami is 27. He walks with his closest friend, Ahmad, and they part at a junction. Less than an hour later, he learns that Ahmad has been killed.</p>
    <p>This is Act One: the walk, the parting, and the hour of not knowing. Your choices shape who Sami is when the news reaches him, and which way the night goes.</p>
    <h3>Content note</h3>
    <p>Life under military siege: shelling, sniper fire, hunger, the death of a friend, grief. Violence is heard and implied, never shown. Recommended for ages 16 and over.</p>
    <p class="menu-sub">A work of fiction drawing on documented accounts of siege life. Everything is drawn and synthesised in code. There are no images or recordings.</p>`,
});
menu.showMain();

input.onKey((e) => {
  const acts = input.actionsFor(e.code);
  if (!acts.includes('menu')) return;
  if (!$('note').hidden) {
    $('note').hidden = true;
    return;
  }
  if (mode === 'play') menu.toggle();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && mode === 'play' && !menu.open) menu.showPause();
});

// ------------------------------------------------------- touch controls --

const touchMap = [
  ['t-left', 'left'],
  ['t-right', 'right'],
  ['t-jump', 'jump'],
  ['t-crouch', 'crouch'],
  ['t-prone', 'prone'],
  ['t-use', 'interact'],
  ['t-tool', 'tool'],
  ['t-light', 'use'],
  ['t-skip', 'skip'],
];
for (const [id, action] of touchMap) {
  const b = $(id);
  if (!b) continue;
  const down = (e) => {
    e.preventDefault();
    input.touchDown(action);
    b.classList.add('down');
  };
  const up = () => {
    input.touchUp(action);
    b.classList.remove('down');
  };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
}
$('t-menu').addEventListener('click', () => mode === 'play' && menu.toggle());

// ------------------------------------------------------------------ loop --

let last = performance.now();
let time = 0;
let frames = 0;
let fpsT = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  time += dt;
  input.poll();
  if (mode === 'title') {
    game.time += dt;
    game.effects.update(dt);
    Object.assign(game.cam, game.cameraTarget());
    game.render(time);
  } else {
    // (testing can run several steps per frame and skip drawing)
    const steps = window.game?.speed || 1;
    if (!menu.open) for (let i = 0; i < steps; i++) game.update(dt);
    if (!window.game?.noRender) game.render(time);
  }
  input.endFrame();

  frames++;
  fpsT += dt;
  if (fpsT > 2) {
    const fps = frames / fpsT;
    frames = 0;
    fpsT = 0;
    if (settings.get('quality') === 'auto' && fps < 34 && autoScale > 0.6) {
      autoScale -= 0.2;
      resize();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Debug and testing hook.
window.game = {
  speed: 1,
  game,
  menu,
  input,
  settings,
  text,
  start: (checkpoint = 'walk', extra = {}) => startGame({ ...freshState(), checkpoint, ...extra }),
  startAct2: (checkpoint = 'south', extra = {}) => startGame({ ...act2State(null), checkpoint, ...extra }),
  get mode() {
    return mode;
  },
};

return {  };
})();
</script>
