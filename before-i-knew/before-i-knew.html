    thighN: tn,
    shinN: sn,
    thighF: tf,
    shinF: sf,
    armN,
    foreN: armN + elbow + 0.3 * Math.max(0, armN) * (1 + run),
    armF,
    foreF: armF + elbow + 0.3 * Math.max(0, armF) * (1 + run),
  };
}

// Crouched, moving: a low, careful walk. Each leg swings its thigh through
// an arc; while the foot is planted the shin is solved so the foot stays on
// the ground (the body rolls over it), and on the swing the foot lifts and
// comes through with the knee folded. The hips dip on each step, the body
// pitches into it, and the arms counter-swing short and low.
const CROUCH_G = 46; // hip height when crouched
function crouchLeg(q, bob) {
  const th = 1.0 + 0.3 * Math.sin(q);
  const swing = Math.max(0, Math.cos(q)); // thigh coming forward: foot in the air
  const solve = (y) => -Math.acos(clamp((y - L.thigh * Math.cos(th)) / L.shin, -1, 1));
  const ground = CROUCH_G + bob;
  let sh = solve(ground);
  sh = solve(ground - footDrop(sh)); // the heel lifts as the shin sweeps back
  if (swing > 0) sh = solve(ground - footDrop(sh) - 11 * swing) - swing * 0.3; // lift and fold on the swing
  return [th, sh];
}

// Holding still, the crouch is the gait's moment with both feet planted.
{
  const [tn, sn] = crouchLeg(Math.PI / 2, 0);
  const [tf, sf] = crouchLeg((3 * Math.PI) / 2, 0);
  Object.assign(POSES.crouch, { thighN: tn, shinN: sn, thighF: tf, shinF: sf });
}

function crouchWalkPose(p) {
  const c = POSES.crouch;
  const bob = 1.6 * Math.cos(2 * p); // lowest as each foot lands
  const [tn, sn] = crouchLeg(p, bob);
  const [tf, sf] = crouchLeg(p + Math.PI, bob);
  const s = Math.sin(p);
  return {
    ...c,
    torso: c.torso + 0.04 * Math.cos(2 * p) - 0.02,
    head: c.head - 0.03 * Math.cos(2 * p),
    thighN: tn,
    shinN: sn,
    thighF: tf,
    shinF: sf,
    armN: c.armN - 0.22 * s,
    foreN: c.foreN - 0.12 * s,
    armF: c.armF + 0.22 * s,
    foreF: c.foreF + 0.12 * s,
  };
}

// Elbow-and-knee crawl: opposite arm and leg reach together.
function crawlPose(p) {
  const c = POSES.prone;
  const s = Math.sin(p);
  const reachN = Math.max(0, s);
  const reachF = Math.max(0, -s);
  return {
    ...c,
    thighN: c.thighN + 0.35 * reachF,
    shinN: c.shinN + 0.55 * reachF,
    thighF: c.thighF + 0.35 * reachN,
    shinF: c.shinF + 0.55 * reachN,
    armN: c.armN + 0.3 * reachN - 0.1,
    foreN: c.foreN + 0.2 * reachN,
    armF: c.armF + 0.3 * reachF - 0.1,
    foreF: c.foreF + 0.2 * reachF,
  };
}

const down = (a) => [Math.sin(a), Math.cos(a)];

// How the foot sits for a given shin angle: a shin swept back lifts the heel
// (the foot rolls onto its ball), a shin reaching forward lands on the heel.
// Positive is heel-up. The drop is how far below the ankle the lowest point
// of the foot then goes, so the hips can be set to keep it on the ground.
// How rounded the back is for a given lean: 0 upright, 1 bent well forward,
// and back to 0 as the body goes flat (prone).
const hunch = (lean) => clamp((lean - 0.2) / 0.45) * clamp((1.3 - lean) / 0.3);

function footRoll(shinA) {
  if (shinA < -0.3) return Math.min(0.8, (-shinA - 0.3) * 0.9);
  if (shinA > 0.2) return -Math.min(0.3, (shinA - 0.2) * 0.6);
  return 0;
}
function footDrop(shinA) {
  const r = footRoll(shinA);
  return r > 0 ? 13 * Math.sin(r) : 6 * Math.sin(-r);
}

// A limb segment as a round-capped stroke: convex at both ends, so joints
// never show a notch where two segments meet.
function seg(ctx, x0, y0, x1, y1, w, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
}

class Person {
  constructor(outfit = 'sami', scale = 1) {
    this.o = OUTFITS[outfit] || OUTFITS.man;
    this.scale = scale;
    this.x = 0;
    this.y = 0; // ground level (when grounded) or hip position (when not)
    this.f = 1;
    this.grounded = true;
    this.pose = { ...POSES.stand };
    this.prop = null;
    this.dust = 0; // 0…1 grey dust after shelling
    // Facing: 'side' (profile, the default), 'front' (towards us, out of a
    // side street) or 'back' (away from us, into one). viewK eases 0…1 as
    // the figure turns; the drawing flips through a narrow silhouette.
    this.view = 'side';
    this.viewFrom = 'side';
    this.viewK = 1;
    this.flipK = 1; // a quick pivot when turning round in profile
    this.blink = 0; // > 0 while the eyes are shut
  }

  // Turn to face a new way; the rig animates the turn.
  face(view) {
    if (view === this.view) return;
    this.viewFrom = this.viewK < 0.5 ? this.viewFrom : this.view;
    this.view = view;
    this.viewK = 0;
  }

  // Turning round (left ↔ right) in profile.
  pivot() {
    this.flipK = 0;
  }

  tick(dt) {
    if (this.viewK < 1) this.viewK = Math.min(1, this.viewK + dt * 4);
    if (this.flipK < 1) this.flipK = Math.min(1, this.flipK + dt * 7);
    if (this.blink > 0) this.blink -= dt;
    else if (Math.random() < dt * 0.3) this.blink = 0.13;
  }

  setPose(p) {
    this.pose = { ...POSES.stand, ...p };
  }

  solve() {
    const p = this.pose;
    const j = {};
    const kN = down(p.thighN);
    const kF = down(p.thighF);
    j.kneeN = [kN[0] * L.thigh, kN[1] * L.thigh];
    j.kneeF = [kF[0] * L.thigh, kF[1] * L.thigh];
    const sN = down(p.shinN);
    const sF = down(p.shinF);
    j.footN = [j.kneeN[0] + sN[0] * L.shin, j.kneeN[1] + sN[1] * L.shin];
    j.footF = [j.kneeF[0] + sF[0] * L.shin, j.kneeF[1] + sF[1] * L.shin];
    const up = [Math.sin(p.torso), -Math.cos(p.torso)];
    j.neck = [up[0] * L.torso, up[1] * L.torso];
    j.shoulder = [up[0] * (L.torso - 7), up[1] * (L.torso - 7)];
    // hunched, the shoulders roll forward and the neck comes out of them
    const hs = hunch(p.torso);
    if (hs > 0) {
      const fw = [Math.cos(p.torso), Math.sin(p.torso)];
      j.shoulder = [j.shoulder[0] + fw[0] * 3 * hs, j.shoulder[1] + fw[1] * 3 * hs];
      j.neck = [j.neck[0] + fw[0] * 2.5 * hs, j.neck[1] + fw[1] * 2.5 * hs];
    }
    const ha = p.torso + p.head;
    j.head = [j.neck[0] + Math.sin(ha) * (L.neck + L.head), j.neck[1] - Math.cos(ha) * (L.neck + L.head)];
    const aN = down(p.armN);
    const aF = down(p.armF);
    j.elbowN = [j.shoulder[0] + aN[0] * L.upper, j.shoulder[1] + aN[1] * L.upper];
    j.elbowF = [j.shoulder[0] + aF[0] * L.upper, j.shoulder[1] + aF[1] * L.upper];
    const fN = down(p.foreN);
    const fF = down(p.foreF);
    const lN = L.fore * (p.foreNs ?? 1);
    const lF = L.fore * (p.foreFs ?? 1);
    j.handN = [j.elbowN[0] + fN[0] * lN, j.elbowN[1] + fN[1] * lN];
    j.handF = [j.elbowF[0] + fF[0] * lF, j.elbowF[1] + fF[1] * lF];
    this.local = j;
    return j;
  }

  // Height of the hip above the ground for the current pose.
  hipHeight() {
    const j = this.local || this.solve();
    if (this.pose.seat != null) return this.pose.seat;
    // Lowest of feet, knees and the torso itself, so poses blend smoothly
    // from standing to kneeling to lying flat.
    return Math.max(j.footN[1] + footDrop(this.pose.shinN), j.footF[1] + footDrop(this.pose.shinF), j.kneeN[1] + 8, j.kneeF[1] + 8, 12) + 4;
  }

  hip() {
    this.local || this.solve();
    if (!this.grounded) return [this.x, this.y];
    return [this.x, this.y - this.hipHeight() * this.scale];
  }

  toWorld(pt) {
    const [hx, hy] = this.hip();
    return [hx + pt[0] * this.f * this.scale, hy + pt[1] * this.scale];
  }

  world(name) {
    this.solve();
    return this.toWorld(this.local[name]);
  }

  // Top of the head in world space (for collision with low ceilings).
  top() {
    const j = this.solve();
    const [, hy] = this.hip();
    return hy + (j.head[1] - L.head) * this.scale;
  }

  draw(ctx) {
    // mid-turn: squeeze to a sliver, then open out into the new view
    const k = this.viewK;
    const shown = k < 0.5 ? this.viewFrom : this.view;
    let squeeze = k < 1 ? Math.max(0.12, Math.abs(Math.cos(k * Math.PI))) : 1;
    if (this.flipK < 1) squeeze *= Math.max(0.25, Math.abs(Math.cos(this.flipK * Math.PI)));
    if (squeeze < 1) {
      const [hx] = this.hip();
      ctx.save();
      ctx.translate(hx, 0);
      ctx.scale(squeeze, 1);
      ctx.translate(-hx, 0);
    }
    if (shown === 'side') this.drawSide(ctx);
    else this.drawFrontBack(ctx, shown === 'front');
    if (squeeze < 1) ctx.restore();
  }

  colours() {
    const o = this.o;
    const dusty = (c) => (this.dust > 0 && c ? mixHex(c, '#8a857c', this.dust * 0.55) : c);
    return {
      dusty,
      top: dusty(o.top),
      trousers: dusty(o.trousers),
      layer: o.layer ? dusty(o.layer.color) : null,
      hair: dusty(o.hair),
      beard: dusty(o.beardColor || o.hair),
      head: dusty(o.headColor || '#444444'),
    };
  }

  // ------------------------------------------------------------ profile --

  drawSide(ctx) {
    const j = this.solve();
    const [hx, hy] = this.hip();
    const o = this.o;
    const p = this.pose;
    const C = this.colours();
    ctx.save();
    ctx.translate(hx, hy);
    ctx.scale(this.f * this.scale, this.scale);

    const far = (c) => shade(c, 0.66);
    const sleeveCol = C.layer && o.layer.kind !== 'vest' ? C.layer : C.top;
    const longCoat = o.layer?.kind === 'coat';

    if (o.satchel) {
      // bag hangs behind the hip on the far side
      ctx.fillStyle = shade(o.satchel, 0.8);
      roundRect(ctx, -21, -8, 18, 21, 3);
      ctx.fill();
    }
    this.arm(ctx, j.shoulder, j.elbowF, j.handF, far(sleeveCol), o.skin, far(o.skin), false);
    this.leg(ctx, j.kneeF, j.footF, p.shinF, far(C.trousers), far(o.shoes), far(o.skin), true);

    if (o.robe || longCoat) {
      // a jalabiya or long coat: a skirt from the hip that follows the legs
      const kn = j.kneeN;
      const kf = j.kneeF;
      const fn = j.footN;
      const ff = j.footF;
      const bottom = Math.max(fn[1], ff[1]) - (o.robe ? 7 : 16);
      ctx.beginPath();
      ctx.moveTo(-12, -4);
      ctx.lineTo(12, -4);
      ctx.lineTo(Math.max(kn[0], kf[0]) + 10, Math.max(kn[1], kf[1]));
      ctx.lineTo(Math.max(fn[0], ff[0]) + 6, bottom);
      ctx.lineTo(Math.min(fn[0], ff[0]) - 8, bottom + 2);
      ctx.lineTo(Math.min(kn[0], kf[0]) - 12, Math.max(kn[1], kf[1]));
      ctx.closePath();
      ctx.fillStyle = longCoat ? C.layer : C.top;
      ctx.fill();
      // a fold or two
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(2, 4);
      ctx.lineTo((kn[0] + fn[0]) / 2, bottom - 6);
      ctx.stroke();
    }
    this.leg(ctx, j.kneeN, j.footN, p.shinN, o.robe ? C.top : C.trousers, o.shoes, o.skin, false);

    // torso
    const up = [Math.sin(p.torso), -Math.cos(p.torso)];
    const side = [Math.cos(p.torso), Math.sin(p.torso)];
    const at = (d, s) => [up[0] * d + side[0] * s, up[1] * d + side[1] * s];
    const w = o.baggy ? 14 : 11.5;
    const torsoPath = () => {
      ctx.beginPath();
      const pts = [at(o.baggy ? -10 : -4, -w), at(o.baggy ? -10 : -2, w), at(L.torso - 15, w + 1.5), at(L.torso - 3, 9), at(L.torso, -3)];
      ctx.moveTo(...pts[0]);
      for (const q of pts.slice(1)) ctx.lineTo(...q);
      // the back: straight when upright, rounding into a curve as he bends
      // forward (upper back humped, shoulders rolled), flat again lying down
      const h = hunch(p.torso);
      ctx.lineTo(...at(L.torso - 6, -11 - 2 * h));
      ctx.quadraticCurveTo(...at(L.torso * 0.5, -w - 0.5 - 7 * h), ...at(6, -w - 1.5 * h));
      ctx.closePath();
    };
    torsoPath();
    ctx.fillStyle = C.top;
    ctx.fill();
    ctx.save();
    torsoPath();
    ctx.clip();
    if (o.pattern) this.pattern(ctx, o, -30, -L.torso - 10, 60, L.torso + 14, p.torso);
    // form: the back of the body in shadow
    const g = ctx.createLinearGradient(...at(20, -w), ...at(20, w));
    g.addColorStop(0, 'rgba(0,0,0,0.22)');
    g.addColorStop(0.55, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(255,255,255,0.05)');
    ctx.fillStyle = g;
    ctx.fillRect(-40, -80, 80, 100);
    // layers over the shirt
    if (o.layer) this.layerSide(ctx, o, C, at, w);
    ctx.restore();
    // collar line and placket
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(...at(L.torso - 3, 8));
    ctx.lineTo(...at(4, 9.5));
    ctx.stroke();
    if (o.belt) {
      ctx.strokeStyle = o.belt;
      ctx.lineWidth = 3.4;
      ctx.beginPath();
      ctx.moveTo(...at(3, -w - 0.5));
      ctx.lineTo(...at(4, w + 0.5));
      ctx.stroke();
      ctx.fillStyle = '#9a8c6a';
      const b = at(4, w - 1);
      ctx.fillRect(b[0] - 1.5, b[1] - 2, 3, 4);
      if (o.pouch) {
        ctx.fillStyle = shade(o.belt, 1.15);
        const q = at(0, -w + 1);
        roundRect(ctx, q[0] - 5, q[1], 9, 10, 2);
        ctx.fill();
      }
    }
    if (o.satchel) {
      ctx.strokeStyle = shade(o.satchel, 0.9);
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(...at(L.torso - 4, -9));
      ctx.lineTo(...at(6, 11));
      ctx.stroke();
    }

    // head and neck
    const ha = p.torso + p.head;
    const [hdx, hdy] = j.head;
    limb(ctx, j.neck[0], j.neck[1] + 3, hdx - Math.sin(ha) * 4, hdy + Math.cos(ha) * 5, 8, 7.5, shade(o.skin, 0.93));
    if (o.keffiyeh === 'shoulders' || o.scarf) this.scarfSide(ctx, o, at);
    ctx.save();
    ctx.translate(hdx, hdy);
    ctx.rotate(ha);
    this.headSide(ctx, o, C);
    ctx.restore();

    this.arm(ctx, j.shoulder, j.elbowN, j.handN, sleeveCol, o.skin, o.skin, true);
    if (this.prop) this.prop(ctx, j.handN, j.handF);
    ctx.restore();
  }

  // A vest, sweater, jacket or coat over the shirt, clipped to the torso.
  layerSide(ctx, o, C, at, w) {
    const k = o.layer.kind;
    ctx.fillStyle = C.layer;
    if (k === 'vest') {
      // open at the front, cut away at the arm
      ctx.beginPath();
      const pts = [at(-6, -w - 2), at(-6, w - 2), at(L.torso - 22, w - 1), at(L.torso - 10, 3), at(L.torso - 4, -4), at(L.torso - 10, -12), at(14, -w - 2)];
      ctx.moveTo(...pts[0]);
      for (const q of pts.slice(1)) ctx.lineTo(...q);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(...at(L.torso - 22, w - 1));
      ctx.lineTo(...at(-5, w - 2));
      ctx.stroke();
    } else if (k === 'sweater') {
      ctx.fillRect(-40, -80, 80, 100);
      ctx.fillStyle = 'rgba(0,0,0,0.14)';
      const hem = at(0, 0);
      ctx.fillRect(hem[0] - 30, hem[1] - 4, 60, 4);
    } else {
      // jacket or coat: covers the body, a strip of shirt at the open front
      ctx.fillRect(-40, -80, 80, 100);
      ctx.fillStyle = C.top;
      ctx.beginPath();
      const a0 = at(L.torso - 4, 6);
      const a1 = at(L.torso - 14, w + 2);
      const a2 = at(-6, w + 2);
      const a3 = at(-6, w - 3);
      ctx.moveTo(...a0);
      ctx.lineTo(...a1);
      ctx.lineTo(...a2);
      ctx.lineTo(...a3);
      ctx.closePath();
      ctx.fill();
      // lapel
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(...at(L.torso - 3, 3));
      ctx.lineTo(...at(L.torso - 18, w - 3));
      ctx.lineTo(...at(-6, w - 3));
      ctx.stroke();
    }
  }

  // Stripes or a check, drawn in torso space (clipped by the caller).
  pattern(ctx, o, x0, y0, w, h, lean) {
    ctx.save();
    ctx.rotate(lean);
    ctx.strokeStyle = o.patternColor || 'rgba(255,255,255,0.3)';
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = o.pattern === 'stripe' ? 2.2 : 1;
    ctx.beginPath();
    for (let y = y0; y < y0 + h; y += o.pattern === 'stripe' ? 6 : 5) {
      ctx.moveTo(x0, y);
      ctx.lineTo(x0 + w, y);
    }
    if (o.pattern === 'check') {
      for (let x = x0; x < x0 + w; x += 5) {
        ctx.moveTo(x, y0);
        ctx.lineTo(x, y0 + h);
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  // A keffiyeh over the shoulders, or a scarf: soft cloth round the neck,
  // one end down the back, one hanging in front, with a fringe.
  scarfSide(ctx, o, at) {
    const kef = o.keffiyeh === 'shoulders';
    const col = kef ? '#e6e0d3' : o.scarf;
    ctx.fillStyle = col;
    // round the neck
    ctx.beginPath();
    ctx.moveTo(...at(L.torso + 1, -7));
    ctx.quadraticCurveTo(...at(L.torso + 4, 2), ...at(L.torso, 9));
    ctx.lineTo(...at(L.torso - 7, 8));
    ctx.quadraticCurveTo(...at(L.torso - 3, 0), ...at(L.torso - 6, -8));
    ctx.closePath();
    ctx.fill();
    // the end down the back
    ctx.beginPath();
    ctx.moveTo(...at(L.torso - 1, -8));
    ctx.quadraticCurveTo(...at(L.torso - 14, -14), ...at(L.torso - 30, -12));
    ctx.lineTo(...at(L.torso - 30, -6));
    ctx.quadraticCurveTo(...at(L.torso - 14, -7), ...at(L.torso - 6, -2));
    ctx.closePath();
    ctx.fill();
    // the end hanging in front
    ctx.beginPath();
    ctx.moveTo(...at(L.torso - 4, 7));
    ctx.lineTo(...at(L.torso - 24, 10));
    ctx.lineTo(...at(L.torso - 24, 5));
    ctx.lineTo(...at(L.torso - 6, 2));
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = kef ? 'rgba(120,30,30,0.45)' : 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    for (const [d, s0, s1] of [[L.torso - 30, -12, -6], [L.torso - 24, 5, 10]]) {
      for (let i = 0; i < 4; i++) {
        const q = at(d - 1, s0 + ((s1 - s0) * i) / 3);
        ctx.moveTo(...q);
        ctx.lineTo(q[0], q[1] + 3); // fringe
      }
    }
    if (kef) {
      ctx.moveTo(...at(L.torso - 10, -11));
      ctx.lineTo(...at(L.torso - 22, -11));
      ctx.moveTo(...at(L.torso - 12, 8));
      ctx.lineTo(...at(L.torso - 20, 8));
    }
    ctx.stroke();
  }

  // The head in profile, facing +x, centred on the skull.
  headSide(ctx, o, C) {
    const hr = L.head;
    const skin = o.skin;
    if (o.headwear === 'hijab') {
      ctx.beginPath();
      ctx.ellipse(-2, -1, hr * 1.12, hr * 1.25, 0, 0, Math.PI * 2);
      ctx.fillStyle = C.head;
      ctx.fill();
      // drape to the shoulders
      ctx.beginPath();
      ctx.moveTo(-12, 0);
      ctx.quadraticCurveTo(-16, 18, -6, 26);
      ctx.lineTo(8, 22);
      ctx.lineTo(5, 8);
      ctx.fill();
      // the face in its opening
      this.faceSide(ctx, hr, skin, true);
      this.eyeSide(ctx, hr, o, C);
      return;
    }
    // skull, then the face and jaw
    ctx.beginPath();
    ctx.ellipse(-hr * 0.08, -hr * 0.08, hr * 0.96, hr * 1.0, 0, 0, Math.PI * 2);
    ctx.fillStyle = skin;
    ctx.fill();
    this.faceSide(ctx, hr, skin, false);
    // ear
    ctx.beginPath();
    ctx.ellipse(-hr * 0.22, hr * 0.12, 2.2, 3.4, 0.15, 0, Math.PI * 2);
    ctx.fillStyle = shade(skin, 0.86);
    ctx.fill();
    this.hairSide(ctx, o, C, hr);
    this.beardSide(ctx, o, C, hr);
    this.eyeSide(ctx, hr, o, C);
    this.hatSide(ctx, o, C, hr);
    if (o.glasses) {
      ctx.strokeStyle = 'rgba(20,18,16,0.85)';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.ellipse(hr * 0.62, -hr * 0.1, 2.6, 2.2, 0, 0, Math.PI * 2);
      ctx.moveTo(hr * 0.36, -hr * 0.14);
      ctx.lineTo(-hr * 0.15, -hr * 0.05);
      ctx.stroke();
    }
  }

  // Brow, nose, lips and chin in profile.
  faceSide(ctx, hr, skin, veiled) {
    ctx.beginPath();
    ctx.moveTo(hr * 0.15, -hr * 0.92);
    ctx.quadraticCurveTo(hr * 0.78, -hr * 0.78, hr * 0.84, -hr * 0.3); // forehead
    ctx.lineTo(hr * 0.8, -hr * 0.12); // brow ridge
    ctx.lineTo(hr * 1.12, hr * 0.3); // nose tip
    ctx.lineTo(hr * 0.86, hr * 0.42); // under the nose
    ctx.lineTo(hr * 0.92, hr * 0.56); // upper lip
    ctx.lineTo(hr * 0.82, hr * 0.64); // mouth
    ctx.lineTo(hr * 0.88, hr * 0.76); // lower lip
    ctx.quadraticCurveTo(hr * 0.84, hr * 1.02, hr * 0.5, hr * 1.06); // chin
    ctx.quadraticCurveTo(hr * 0.02, hr * 1.02, -hr * 0.34, hr * 0.62); // jaw
    ctx.lineTo(-hr * 0.2, 0);
    ctx.closePath();
    ctx.fillStyle = skin;
    ctx.fill();
    // nostril and mouth line
    ctx.fillStyle = shade(skin, 0.7);
    ctx.fillRect(hr * 0.86, hr * 0.33, 1.2, 0.9);
    ctx.fillStyle = shade(skin, 0.62);
    ctx.fillRect(hr * 0.66, hr * 0.63, hr * 0.2, 0.8);
    if (veiled) return;
  }

  eyeSide(ctx, hr, o, C) {
    // brow and eye (blinking now and then)
    ctx.strokeStyle = shade(o.hairStyle === 'bald' || !o.hair ? '#6a5a4a' : o.hair.startsWith('#') ? o.hair : '#2a2018', 0.9);
    ctx.lineWidth = 0.9;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(hr * 0.4, -hr * 0.33);
    ctx.quadraticCurveTo(hr * 0.62, -hr * 0.4, hr * 0.8, -hr * 0.3);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(22,16,12,0.85)';
    if (this.blink > 0) ctx.fillRect(hr * 0.48, -hr * 0.14, 3, 0.9);
    else {
      ctx.beginPath();
      ctx.ellipse(hr * 0.6, -hr * 0.12, 1.25, 1.05, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  hairSide(ctx, o, C, hr) {
    const s = o.hairStyle || 'short';
    ctx.fillStyle = C.hair;
    if (s === 'bald') {
      // a horseshoe of hair round the back and above the ear
      ctx.beginPath();
      ctx.moveTo(-hr * 0.35, -hr * 0.25);
      ctx.quadraticCurveTo(-hr * 0.95, -hr * 0.55, -hr * 1.02, 0);
      ctx.quadraticCurveTo(-hr * 0.98, hr * 0.5, -hr * 0.68, hr * 0.62);
      ctx.lineTo(-hr * 0.42, hr * 0.3);
      ctx.quadraticCurveTo(-hr * 0.55, 0, -hr * 0.35, -hr * 0.25);
      ctx.fill();
      return;
    }
    const front = s === 'receding' ? hr * 0.05 : s === 'sidepart' ? hr * 0.62 : hr * 0.5;
    const topY = s === 'buzz' ? -hr * 1.05 : s === 'curly' ? -hr * 1.22 : s === 'sidepart' ? -hr * 1.18 : -hr * 1.13;
    if (s === 'buzz') ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(front, -hr * (s === 'receding' ? 0.95 : 0.72));
    ctx.quadraticCurveTo(hr * 0.35, topY, -hr * 0.2, topY + hr * 0.02);
    ctx.quadraticCurveTo(-hr * 0.95, topY + hr * 0.1, -hr * 1.06, -hr * 0.1);
    ctx.quadraticCurveTo(-hr * 1.02, hr * 0.42, -hr * 0.72, hr * 0.6); // nape
    ctx.lineTo(-hr * 0.46, hr * 0.28); // behind the ear
    ctx.quadraticCurveTo(-hr * 0.5, -hr * 0.2, -hr * 0.1, -hr * 0.18);
    if (s !== 'receding') {
      ctx.lineTo(hr * 0.02, hr * 0.26); // sideburn
      ctx.lineTo(hr * 0.14, hr * 0.22);
      ctx.lineTo(hr * 0.16, -hr * 0.4); // temple
    }
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    if (s === 'curly') {
      for (let i = 0; i < 7; i++) {
        const a = Math.PI * (1.05 + i * 0.14);
        ctx.beginPath();
        ctx.arc(-hr * 0.2 + Math.cos(a) * hr * 0.95, -hr * 0.2 + Math.sin(a) * hr * 0.98, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    if (s === 'sidepart') {
      // a little lift at the front, and a lighter parting line
      ctx.strokeStyle = shade(o.hair, 1.4);
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(hr * 0.3, -hr * 1.05);
      ctx.quadraticCurveTo(-hr * 0.2, -hr * 1.0, -hr * 0.7, -hr * 0.78);
      ctx.stroke();
    }
    if (s === 'ponytail' || s === 'braid') {
      ctx.strokeStyle = C.hair;
      ctx.lineCap = 'round';
      ctx.lineWidth = s === 'braid' ? 3.2 : 4.2;
      ctx.beginPath();
      ctx.moveTo(-hr * 0.95, -hr * 0.25);
      ctx.quadraticCurveTo(-hr * 1.7, hr * 0.5, -hr * 1.35, s === 'braid' ? hr * 2.2 : hr * 1.3);
      ctx.stroke();
      ctx.fillStyle = '#8a3a3a';
      ctx.fillRect(-hr * 1.1, -hr * 0.22, 2.5, 2.5); // the hair tie
    }
  }

  beardSide(ctx, o, C, hr) {
    const b = o.beard || 'none';
    if (b === 'none') return;
    const col = C.beard;
    const jaw = (bottom, chinX = 0.84) => {
      ctx.beginPath();
      ctx.moveTo(-hr * 0.08, hr * 0.2); // from the sideburn
      ctx.lineTo(hr * 0.5, hr * 0.44); // cheek
      ctx.lineTo(hr * 0.66, hr * 0.44);
      ctx.lineTo(hr * 0.94, hr * 0.5); // round the mouth
      ctx.lineTo(hr * 0.9, hr * 0.62);
      ctx.lineTo(hr * 0.72, hr * 0.66);
      ctx.lineTo(hr * 0.9, hr * 0.74);
      ctx.quadraticCurveTo(hr * chinX + 0.1 * hr, hr * bottom, hr * 0.42, hr * (bottom + 0.06));
      ctx.quadraticCurveTo(-hr * 0.05, hr * (bottom - 0.08), -hr * 0.36, hr * 0.62);
      ctx.closePath();
    };
    if (b === 'stubble') {
      jaw(1.06);
      ctx.fillStyle = 'rgba(38,28,22,0.32)';
      ctx.fill();
      return;
    }
    ctx.fillStyle = col;
    if (b === 'short' || b === 'full') {
      jaw(b === 'full' ? 1.32 : 1.14);
      ctx.fill();
    } else if (b === 'long') {
      ctx.beginPath();
      ctx.moveTo(-hr * 0.08, hr * 0.2);
      ctx.lineTo(hr * 0.94, hr * 0.5);
      ctx.lineTo(hr * 0.92, hr * 0.62);
      ctx.lineTo(hr * 0.72, hr * 0.66);
      ctx.lineTo(hr * 0.95, hr * 0.8);
      ctx.quadraticCurveTo(hr * 0.9, hr * 1.5, hr * 0.5, hr * 1.95);
      ctx.quadraticCurveTo(hr * 0.1, hr * 1.4, -hr * 0.36, hr * 0.62);
      ctx.closePath();
      ctx.fill();
    } else if (b === 'goatee') {
      ctx.beginPath();
      ctx.moveTo(hr * 0.66, hr * 0.44);
      ctx.lineTo(hr * 0.94, hr * 0.5);
      ctx.lineTo(hr * 0.9, hr * 0.6);
      ctx.lineTo(hr * 0.74, hr * 0.64);
      ctx.lineTo(hr * 0.9, hr * 0.74);
      ctx.quadraticCurveTo(hr * 0.92, hr * 1.2, hr * 0.55, hr * 1.18);
      ctx.lineTo(hr * 0.56, hr * 0.7);
      ctx.closePath();
      ctx.fill();
    } else if (b === 'chinstrap') {
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-hr * 0.1, hr * 0.22);
      ctx.quadraticCurveTo(-hr * 0.05, hr * 0.95, hr * 0.5, hr * 1.1);
      ctx.quadraticCurveTo(hr * 0.84, hr * 1.02, hr * 0.86, hr * 0.8);
      ctx.stroke();
    }
    if (b === 'moustache' || b === 'thickMoustache' || b === 'full' || b === 'short' || b === 'long' || b === 'goatee') {
      ctx.fillStyle = col;
      ctx.beginPath();
      const thick = b === 'thickMoustache' ? 1.6 : 1;
      ctx.moveTo(hr * 0.6, hr * 0.44);
      ctx.lineTo(hr * 0.95, hr * 0.46);
      ctx.lineTo(hr * 0.95, hr * (0.5 + 0.1 * thick));
      ctx.lineTo(hr * 0.68, hr * (0.52 + 0.14 * thick));
      ctx.closePath();
      ctx.fill();
    }
  }

  hatSide(ctx, o, C, hr) {
    const h = o.headwear;
    if (!h) return;
    ctx.fillStyle = C.head;
    if (h === 'kufi') {
      ctx.beginPath();
      ctx.ellipse(-hr * 0.15, -hr * 0.62, hr * 0.94, hr * 0.5, -0.1, Math.PI, 0);
      ctx.fill();
    } else if (h === 'cap') {
      // flat cap: a soft crown pulled forward, a short brim
      ctx.beginPath();
      ctx.moveTo(-hr * 1.02, -hr * 0.3);
      ctx.quadraticCurveTo(-hr * 0.9, -hr * 1.2, hr * 0.2, -hr * 1.08);
      ctx.quadraticCurveTo(hr * 0.9, -hr * 0.95, hr * 1.12, -hr * 0.56);
      ctx.lineTo(hr * 0.72, -hr * 0.52);
      ctx.lineTo(-hr * 1.0, -hr * 0.18);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(hr * 0.55, -hr * 0.6, hr * 0.55, 1.2);
    } else if (h === 'beanie') {
      ctx.beginPath();
      ctx.moveTo(-hr * 1.04, -hr * 0.2);
      ctx.quadraticCurveTo(-hr * 1.0, -hr * 1.22, hr * 0.1, -hr * 1.18);
      ctx.quadraticCurveTo(hr * 0.86, -hr * 1.05, hr * 0.84, -hr * 0.42);
      ctx.lineTo(-hr * 1.04, -hr * 0.2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(-hr * 1.04, -hr * 0.55, hr * 1.9, 3); // the fold

    }
  }

  // ----------------------------------------------------- front and back --

  // Facing us or facing away. The same pose drives it: the side view's
  // vertical extents of knees, feet, elbows and hands foreshorten naturally.
  drawFrontBack(ctx, front) {
    const j = this.solve();
    const [hx, hy] = this.hip();
    const o = this.o;
    const p = this.pose;
    const C = this.colours();
    const sleeveCol = C.layer && o.layer.kind !== 'vest' ? C.layer : C.top;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.scale(this.scale, this.scale);
    const wide = o.baggy ? 15 : 12.5;
    const sy = j.shoulder[1];
    const ny = j.neck[1];
    const stroke = (pts, w, color) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = w;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(...pts[0]);
      for (const q of pts.slice(1)) ctx.lineTo(...q);
      ctx.stroke();
    };
    const leg = (side, knee, foot, cloth) => {
      const x0 = side * 6.5;
      const kx = x0 + side * 1.2;
      const fy = Math.max(knee[1] + 8, foot[1]);
      stroke([[x0, 0], [kx, Math.max(9, knee[1])], [x0, fy]], 12, cloth);
      if (o.footwear === 'sandal') {
        ctx.fillStyle = o.skin;
        ctx.beginPath();
        ctx.ellipse(x0, fy + 2, 5, 3.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = o.shoes;
        ctx.fillRect(x0 - 5, fy + 4, 10, 1.8);
      } else {
        ctx.fillStyle = o.shoes;
        ctx.beginPath();
        ctx.ellipse(x0, fy + 2, 6, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    };
    const nFirst = j.footN[1] < j.footF[1];
    const legs = [
      [-1, j.kneeN, j.footN],
      [1, j.kneeF, j.footF],
    ];
    if (!nFirst) legs.reverse();
    for (const [side, kn, ft] of legs) leg(side, kn, ft, o.robe ? shade(o.top, 0.9) : C.trousers);
    if (o.robe || o.layer?.kind === 'coat') {
      const bottom = Math.max(j.footN[1], j.footF[1]) - (o.robe ? 6 : 16);
      ctx.beginPath();
      ctx.moveTo(-wide, -2);
      ctx.lineTo(wide, -2);
      ctx.lineTo(wide + 4, bottom);
      ctx.lineTo(-wide - 4, bottom);
      ctx.closePath();
      ctx.fillStyle = o.layer?.kind === 'coat' ? C.layer : C.top;
      ctx.fill();
    }
    const arm = (side, e, h) => {
      const sx = side * (wide + 2);
      const ex = sx + side * 3;
      const hxx = sx + side * 2.5;
      const ey = Math.max(sy + 8, e[1]);
      const hy3 = Math.max(sy + 14, h[1]);
      stroke([[sx, sy + 3], [ex, ey]], 9, shade(sleeveCol, 0.92));
      const bare = o.sleeve === 'short' || o.rolled;
      stroke([[ex, ey], [hxx, hy3]], bare ? 7 : 8.5, bare ? o.skin : shade(sleeveCol, 0.92));
      ctx.beginPath();
      ctx.ellipse(hxx, hy3 + 2, 3.8, 4.8, 0, 0, Math.PI * 2);
      ctx.fillStyle = o.skin;
      ctx.fill();
    };
    // torso: shoulders wider than the hips
    const torso = () => {
      ctx.beginPath();
      ctx.moveTo(-wide + 1, 2);
      ctx.lineTo(wide - 1, 2);
      ctx.lineTo(wide + 2, sy + 4);
      ctx.quadraticCurveTo(wide, ny + 1, 6, ny);
      ctx.lineTo(-6, ny);
      ctx.quadraticCurveTo(-wide, ny + 1, -wide - 2, sy + 4);
      ctx.closePath();
    };
    torso();
    ctx.fillStyle = C.top;
    ctx.fill();
    ctx.save();
    torso();
    ctx.clip();
    if (o.pattern) this.pattern(ctx, o, -30, ny - 4, 60, -ny + 10, 0);
    if (o.layer) {
      ctx.fillStyle = C.layer;
      if (o.layer.kind === 'sweater') ctx.fillRect(-30, ny - 4, 60, -ny + 10);
      else if (front) {
        // open at the front: two panels either side of the shirt
        ctx.fillRect(-30, ny - 4, 30 - (o.layer.kind === 'vest' ? 4 : 5), -ny + 10);
        ctx.fillRect(o.layer.kind === 'vest' ? 4 : 5, ny - 4, 30, -ny + 10);
      } else ctx.fillRect(-30, ny - 4, 60, -ny + 10);
    }
    const g = ctx.createLinearGradient(-wide, 0, wide, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.16)');
    g.addColorStop(0.5, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.16)');
    ctx.fillStyle = g;
    ctx.fillRect(-30, ny - 4, 60, -ny + 10);
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,0.16)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    if (front) {
      ctx.moveTo(0, ny + 3);
      ctx.lineTo(0, -2);
      ctx.moveTo(-5, ny + 1);
      ctx.lineTo(0, ny + 6);
      ctx.lineTo(5, ny + 1);
    } else {
      ctx.moveTo(-wide + 4, sy + 10);
      ctx.quadraticCurveTo(0, sy + 15, wide - 4, sy + 10);
    }
    ctx.stroke();
    if (o.belt) {
      ctx.fillStyle = o.belt;
      ctx.fillRect(-wide, -3, wide * 2, 3.4);
      if (front) {
        ctx.fillStyle = '#9a8c6a';
        ctx.fillRect(-2, -3.5, 4, 4.4);
      }
    }
    arm(-1, j.elbowN, j.handN);
    arm(1, j.elbowF, j.handF);
    if (o.satchel) {
      ctx.strokeStyle = shade(o.satchel, 0.9);
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(-wide + 3, ny + 2);
      ctx.lineTo(wide - 2, -4);
      ctx.stroke();
      if (!front) {
        ctx.fillStyle = o.satchel;
        roundRect(ctx, wide - 11, -12, 15, 17, 3);
        ctx.fill();
      }
    }
    if (o.keffiyeh === 'shoulders' || o.scarf) {
      const kef = o.keffiyeh === 'shoulders';
      ctx.fillStyle = kef ? '#e6e0d3' : o.scarf;
      // round the neck, and the two ends hanging down the chest (or back)
      ctx.beginPath();
      ctx.moveTo(-9, ny + 1);
      ctx.quadraticCurveTo(0, ny - 3, 9, ny + 1);
      ctx.lineTo(8, ny + 6);
      ctx.quadraticCurveTo(0, ny + 3, -8, ny + 6);
      ctx.closePath();
      ctx.fill();
      for (const sx of front ? [-7, 7] : [0]) {
        ctx.beginPath();
        ctx.moveTo(sx - 3, ny + 4);
        ctx.lineTo(sx + 3, ny + 4);
        ctx.lineTo(sx + 3.5, ny + 26);
        ctx.lineTo(sx - 3.5, ny + 26);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = kef ? 'rgba(120,30,30,0.45)' : 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          ctx.moveTo(sx - 3 + i * 2, ny + 26);
          ctx.lineTo(sx - 3 + i * 2, ny + 29);
        }
        if (kef) {
          ctx.moveTo(sx - 3, ny + 12);
          ctx.lineTo(sx + 3, ny + 12);
          ctx.moveTo(sx - 3, ny + 19);
          ctx.lineTo(sx + 3, ny + 19);
        }
        ctx.stroke();
      }
    }
    // neck and head
    const hr = L.head;
    const hy2 = j.head[1];
    limb(ctx, 0, ny + 2, 0, hy2 + hr * 0.6, 8, 7.5, shade(o.skin, 0.93));
    ctx.save();
    ctx.translate(0, hy2);
    ctx.rotate(Math.sin(p.head) * 0.15);
    this.headFrontBack(ctx, o, C, hr, front);
    ctx.restore();
    if (this.prop) this.prop(ctx, [-(wide + 3), j.handN[1]], [wide + 3, j.handF[1]]);
    ctx.restore();
  }

  headFrontBack(ctx, o, C, hr, front) {
    const skin = o.skin;
    if (o.headwear === 'hijab') {
      ctx.beginPath();
      ctx.ellipse(0, 1, hr * 1.12, hr * 1.28, 0, 0, Math.PI * 2);
      ctx.moveTo(-hr * 1.1, 4);
      ctx.quadraticCurveTo(-hr * 1.3, hr * 2.2, 0, hr * 2.3);
      ctx.quadraticCurveTo(hr * 1.3, hr * 2.2, hr * 1.1, 4);
      ctx.fillStyle = C.head;
      ctx.fill();
      if (front) {
        ctx.beginPath();
        ctx.ellipse(0, 1.5, hr * 0.66, hr * 0.86, 0, 0, Math.PI * 2);
        ctx.fillStyle = skin;
        ctx.fill();
        this.drawFace(ctx, hr, o, C, true);
      }
      return;
    }
    // head with a jaw that narrows to the chin
    ctx.beginPath();
    ctx.moveTo(-hr * 0.9, -hr * 0.2);
    ctx.quadraticCurveTo(-hr * 0.95, -hr * 1.05, 0, -hr * 1.05);
    ctx.quadraticCurveTo(hr * 0.95, -hr * 1.05, hr * 0.9, -hr * 0.2);
    ctx.quadraticCurveTo(hr * 0.86, hr * 0.7, hr * 0.35, hr * 1.02);
    ctx.quadraticCurveTo(0, hr * 1.12, -hr * 0.35, hr * 1.02);
    ctx.quadraticCurveTo(-hr * 0.86, hr * 0.7, -hr * 0.9, -hr * 0.2);
    ctx.fillStyle = skin;
    ctx.fill();
    // ears
    ctx.fillStyle = shade(skin, 0.9);
    ctx.beginPath();
    ctx.ellipse(-hr * 0.92, hr * 0.05, 2, 3.2, 0, 0, Math.PI * 2);
    ctx.ellipse(hr * 0.92, hr * 0.05, 2, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();
    const s = o.hairStyle || 'short';
    ctx.fillStyle = C.hair;
    if (!front) {
      // the back of the head
      if (s === 'bald') {
        ctx.beginPath();
        ctx.ellipse(0, hr * 0.25, hr * 0.92, hr * 0.5, 0, 0, Math.PI);
        ctx.fill();
      } else {
        if (s === 'buzz') ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.moveTo(-hr * 0.92, hr * 0.35);
        ctx.quadraticCurveTo(-hr * 1.02, -hr * 1.15, 0, -hr * (s === 'curly' ? 1.22 : 1.12));
        ctx.quadraticCurveTo(hr * 1.02, -hr * 1.15, hr * 0.92, hr * 0.35);
        ctx.quadraticCurveTo(0, hr * 0.72, -hr * 0.92, hr * 0.35);
        ctx.fill();
        ctx.globalAlpha = 1;
        if (s === 'ponytail' || s === 'braid') {
          ctx.strokeStyle = C.hair;
          ctx.lineWidth = s === 'braid' ? 3.2 : 4.2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, hr * 0.4);
          ctx.lineTo(0, s === 'braid' ? hr * 2.3 : hr * 1.5);
          ctx.stroke();
        }
      }
    } else if (s !== 'bald') {
      // hairline across the brow
      if (s === 'buzz') ctx.globalAlpha = 0.7;
      const line = s === 'receding' ? -hr * 0.62 : -hr * 0.42;
      ctx.beginPath();
      ctx.moveTo(-hr * 0.94, hr * 0.1);
      ctx.quadraticCurveTo(-hr * 1.02, -hr * 1.18, 0, -hr * (s === 'curly' ? 1.24 : 1.14));
      ctx.quadraticCurveTo(hr * 1.02, -hr * 1.18, hr * 0.94, hr * 0.1);
      ctx.lineTo(hr * 0.8, hr * 0.05);
      ctx.quadraticCurveTo(hr * 0.72, line, s === 'sidepart' ? hr * 0.3 : 0, line - (s === 'receding' ? hr * 0.15 : 0));
      ctx.quadraticCurveTo(-hr * 0.72, line, -hr * 0.8, hr * 0.05);

    });
  }

const __src_rigs_cat = (() => {
// A lean black street cat with a notched left ear. Sits, blinks slowly,
// stands, walks and drops off walls. Local frame: facing right, ground at
// y = 0. Black fur is drawn near-black with a cool sheen along the spine, the
// crown and the shoulder, so the shape still reads against dark stone.

const FAR = '#0a0a0c';
const SHEEN = 'rgba(120,128,150,0.32)';
const EYE = '#c2c83c';

    this.y = 0;
    this.f = 1;

    this.blink = 0;
    this.time = 0;
    this.headTurn = 0; // kept for the scene scripts

  // haunch), the head, and where the legs join.

    const bob = walking ? Math.sin(this.phase * Math.PI * 4) * 1.2 : 0;
    const STAND = [[-34, -34], [-28, -41], [-6, -38], [14, -42], [22, -45], [30, -29], [21, -16], [-2, -20], [-17, -19], [-33, -23]];
    const SIT = [[-26, -6], [-27, -22], [-15, -38], [2, -50], [9, -55], [19, -37], [17, -14], [7, -5], [-6, -2], [-24, 0]];

      walking,
      outline,
      head: mixp([35, -52 + bob], [17, -69 + breathe * 0.3], s),
      shoulder: mixp([20, -30 + bob], [12, -28], s),

    const b = this.shape();

    ctx.lineJoin = 'round';

    this.tail(ctx, b);

    ctx.fill();

            c.stroke();
          }
          if (kind > 0.7) {
            // closed shutter, some slats missing
            c.fillStyle = spec.shutter || '#7a6a55';
            c.fillRect(wx, wy, ww, wh * (0.4 + r() * 0.6));
            c.fillStyle = 'rgba(0,0,0,0.2)';
            for (let s = wy + 4; s < wy + wh * 0.9; s += 6) c.fillRect(wx, s, ww, 1.5);
          } else if (kind > 0.55) {
            // plastic sheet over the window, sagging
            c.fillStyle = 'rgba(180,190,200,0.35)';
            c.beginPath();
            c.moveTo(wx, wy);
            c.lineTo(wx + ww, wy);
            c.lineTo(wx + ww, wy + wh);
            c.quadraticCurveTo(wx + ww / 2, wy + wh - 10, wx, wy + wh);
            c.fill();
          }
        }
      }
    }

    // shell holes with rebar
    for (const [fx, fy, hr] of spec.holes || []) {
      const hx = x + fx * w;
      const hy = top + fy * H;
      c.fillStyle = '#16120f';
      c.beginPath();
      const pts = [];
      for (let i = 0; i < 11; i++) {
        const a = (i / 11) * Math.PI * 2;
        const rr = hr * (0.7 + r() * 0.5);
        pts.push([hx + Math.cos(a) * rr, hy + Math.sin(a) * rr * 0.85]);
      }
      c.moveTo(...pts[0]);
      for (const q of pts.slice(1)) c.lineTo(...q);
      c.closePath();
      c.fill();
      // broken render ring around the hole
      c.fillStyle = 'rgba(120,108,92,0.5)';
      c.beginPath();
      c.arc(hx, hy, hr * 1.35, 0, Math.PI * 2);
      c.arc(hx, hy, hr * 1.02, 0, Math.PI * 2, true);
      c.fill();
      c.strokeStyle = '#4a3a2c';
      c.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const a = r() * Math.PI * 2;
        c.beginPath();
        c.moveTo(hx + Math.cos(a) * hr * 0.9, hy + Math.sin(a) * hr * 0.8);
        c.quadraticCurveTo(hx + Math.cos(a) * hr * 0.5, hy + Math.sin(a) * hr * 0.4 + 8, hx + Math.cos(a) * hr * 0.2, hy + Math.sin(a) * hr * 0.3 + 18);
        c.stroke();
      }
    }

    // bullet pocks in clusters
    c.fillStyle = 'rgba(40,32,26,0.55)';
    for (let k = 0; k < (spec.pocks ?? 3); k++) {
      const cx = x + r() * w;
      const cy = top + r() * H;
      for (let i = 0; i < 14; i++) {
        c.beginPath();
        c.arc(cx + (r() - 0.5) * 70, cy + (r() - 0.5) * 50, 1.5 + r() * 2, 0, Math.PI * 2);
        c.fill();
      }
    }

    // exposed interiors where the corner is torn
    if (torn > 0) {
      c.fillStyle = 'rgba(30,24,20,0.0)';
    }

    // the base of the wall: grime, splash, and the dark where it meets the street
    const ao = c.createLinearGradient(0, -60, 0, 0);
    ao.addColorStop(0, 'rgba(30,24,18,0)');
    ao.addColorStop(1, 'rgba(30,24,18,0.38)');
    c.fillStyle = ao;
    c.fillRect(x, -60, w, 60);

    // graffiti
    for (const [text, gx, gy, size, gc, rot] of spec.graffiti || []) {
      c.save();
      c.translate(x + gx * w, gy);
      c.rotate(rot || -0.03);
      c.font = `${size}px "Aref Ruqaa", "IBM Plex Sans Arabic", serif`;
      c.fillStyle = gc || 'rgba(40,40,44,0.8)';
      c.textAlign = 'center';
      c.direction = 'rtl';
      c.fillText(text, 0, 0);
      c.restore();
    }
    c.restore();

    // torn edge: slab ends and dangling rebar
    if (torn > 0) {
      c.strokeStyle = '#5a4a3a';
      c.lineWidth = 2;
      for (let f = 1; f < floors; f++) {
        const sy = -f * fh;
        if (sy > top + H * (0.25 + torn * 0.45)) continue;
        const sx = tornLeft ? x + r() * w * 0.4 : x + w - r() * w * 0.4;
        c.fillStyle = color;
        c.fillRect(sx - 30, sy - 8, 60, 10);
        for (let i = 0; i < 4; i++) {
          c.beginPath();
          c.moveTo(sx + (i - 2) * 10, sy);
          c.quadraticCurveTo(sx + (i - 2) * 12, sy + 20, sx + (i - 2) * 14 + (r() - 0.5) * 20, sy + 30 + r() * 30);
          c.stroke();
        }
      }
    }
  });

  // balconies and laundry cast shadows onto the façade
  if (spec.balcony) {
    const [fl, side, hang] = spec.balcony;
    const by = -fl * fh - 8;
    const bx = side < 0.5 ? x + w * 0.15 : x + w * 0.55;
    R.cast((c) => {
      c.save();
      c.translate(bx, by);
      c.rotate(hang || 0);
      c.fillStyle = shade(color, 0.85);
      c.fillRect(0, 0, w * 0.3, 10);
      c.strokeStyle = '#3a3230';
      c.lineWidth = 2;
      c.strokeRect(2, -34, w * 0.3 - 4, 34);
      for (let i = 10; i < w * 0.3; i += 10) {
        c.beginPath();
        c.moveTo(i, -34);
        c.lineTo(i, 0);
        c.stroke();
      }
      if (!spec.laundry || spec.plants) {
        // someone still waters these
        for (let i = 0; i < 3; i++) {
          const px = 10 + i * (w * 0.3 - 20) / 2;
          c.fillStyle = '#8a5a3a';
          c.fillRect(px, -10, 10, 10);
          c.fillStyle = ['#5e7a3a', '#6e8a44', '#4e6a32'][i];
          c.beginPath();
          c.arc(px + 5, -13, 7, 0, Math.PI * 2);
          c.arc(px + 1, -17, 4, 0, Math.PI * 2);
          c.arc(px + 9, -18, 4, 0, Math.PI * 2);
          c.fill();
        }
      }
      if (spec.laundry) {
        c.strokeStyle = '#2a2420';
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(0, -40);
        c.lineTo(w * 0.3, -44);
        c.stroke();
        const cols = ['#9a8a70', '#6f7e86', '#b8a79a', '#7a5a50'];
        for (let i = 0; i < 4; i++) {
          const lx = 8 + i * (w * 0.3 - 16) / 4;
          const sway = Math.sin(t * 1.3 + i) * 2;
          c.fillStyle = cols[i];
          c.beginPath();
          c.moveTo(lx, -41 - i);
          c.lineTo(lx + 16, -41 - i);
          c.lineTo(lx + 16 + sway, -14 - i);
          c.lineTo(lx + sway, -12 - i);
          c.fill();
        }
      }
      c.restore();
    });
  }
  if (spec.dishes) {
    R.cast((c) => {
      for (const [fx, fy] of spec.dishes) {
        const dx = x + fx * w;
        const dy = -fy * fh - fh * 0.3;
        c.fillStyle = '#d8d2c6';
        c.beginPath();
        c.ellipse(dx, dy, 14, 16, -0.4, -Math.PI / 2, Math.PI / 2);
        c.fill();
        c.fillRect(dx - 2, dy, 4, 18);
      }
    });
  }
  if (spec.ac) {
    R.cast((c) => {
      for (const [fx, fy] of spec.ac) {
        c.fillStyle = '#cfc8ba';
        c.fillRect(x + fx * w, -fy * fh - fh * 0.35, 38, 26);
        c.fillStyle = 'rgba(0,0,0,0.3)';
        for (let i = 0; i < 4; i++) c.fillRect(x + fx * w + 4, -fy * fh - fh * 0.35 + 5 + i * 5, 30, 1.5);
      }
    });
  }
}

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${Math.min(255, ((n >> 16) & 255) * k) | 0},${Math.min(255, ((n >> 8) & 255) * k) | 0},${Math.min(255, (n & 255) * k) | 0})`;
}

// The street itself: asphalt, a pavement kerb, dust.
function street(R, x0, x1, { color = '#6e6559', pave = '#8a8072' } = {}) {
  const seen = (x) => Math.abs(x - R.cam.x) < 1500;
  R.paint((c) => {
    // the pavement: worn slabs with dark joints
    c.fillStyle = pave;
    c.fillRect(x0, -4, x1 - x0, 8);
    const r = rng(8);
    c.fillStyle = 'rgba(40,32,26,0.35)';
    for (let x = x0; x < x1; x += 46 + r() * 20) if (seen(x)) c.fillRect(x, -4, 1.5, 8); // (a cheap stream: fine to run it all)
    // the kerb stone, lit on top
    c.fillStyle = '#9d9383';
    c.fillRect(x0, 3, x1 - x0, 5);
    c.fillStyle = 'rgba(255,250,235,0.18)';
    c.fillRect(x0, 3, x1 - x0, 1.2);
    // asphalt
    c.fillStyle = color;
    c.fillRect(x0, 8, x1 - x0, 500);
    const road = c.createLinearGradient(0, 8, 0, 120);
    road.addColorStop(0, 'rgba(0,0,0,0.18)');
    road.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = road;
    c.fillRect(x0, 8, x1 - x0, 112);
    // patches of newer tarmac, and cracks (each strip seeded by its own x,
    // so what's drawn doesn't depend on what's on screen)
    for (let x = x0; x < x1; x += 60) {
      if (!seen(x)) continue;
      const q = rng(Math.floor(x) * 13 + 5);
      if (q() < 0.12) {
        c.fillStyle = 'rgba(30,28,26,0.22)';
        c.fillRect(x, 16 + q() * 50, 50 + q() * 120, 12 + q() * 20);
      }
      if (q() < 0.3) {
        c.strokeStyle = 'rgba(30,24,20,0.35)';
        c.lineWidth = 1;
        c.beginPath();
        let cx = x;
        let cy = 14 + q() * 60;
        c.moveTo(cx, cy);
        for (let k = 0; k < 4; k++) {
          cx += 10 + q() * 20;
          cy += (q() - 0.5) * 10;
          c.lineTo(cx, cy);
        }
        c.stroke();
      }
      // grit, stones and litter along the kerb
      for (let gx = x; gx < x + 60; gx += 11) {
        if (q() < 0.4) {
          c.fillStyle = `rgba(${150 + q() * 40},${140 + q() * 30},${120 + q() * 30},0.7)`;
          c.fillRect(gx, 8 + q() * 10, 2 + q() * 3, 2);
        }
        if (q() < 0.02) {
          c.fillStyle = q() < 0.5 ? 'rgba(220,215,200,0.6)' : 'rgba(80,110,140,0.5)';
          c.fillRect(gx, 10 + q() * 30, 6 + q() * 6, 3); // a scrap of paper or plastic
        }
      }
    }
  });
}

// Cables sagging across the street between the blocks, and some broken ones
// hanging. Cast, so they throw thin shadows.
function cables(R, camX, { seed = 11, y = -330, from = -600, to = 11000 } = {}) {
  R.cast((c) => {
    const r = rng(seed);
    c.strokeStyle = 'rgba(28,24,22,0.85)';
    c.lineWidth = 1.4;
    for (let x = from; x < to; x += 260 + r() * 260) {
      const span = 180 + r() * 260;
      const y0 = y + (r() - 0.5) * 80;
      const y1 = y0 + (r() - 0.5) * 60;
      const hang = r();
      const drop = r();
      if (x + span < camX - 1600 || x > camX + 1600) continue;
      c.beginPath();
      c.moveTo(x, y0);
      c.quadraticCurveTo(x + span / 2, Math.max(y0, y1) + 30 + hang * 40, x + span, y1);
      c.stroke();
      if (drop < 0.3) {
        // snapped, hanging down
        c.beginPath();
        c.moveTo(x + span * 0.7, y1 + 10);
        c.quadraticCurveTo(x + span * 0.72, y1 + 60, x + span * 0.66, y1 + 100 + drop * 200);
        c.stroke();
      }
    }
  });
}

// Silhouettes very close to the camera, sweeping past faster than the street:
// a lamp post, twisted rebar, a rubble edge, a hanging wire.
function foreground(R, camX, { from = -1000, to = 15000 } = {}) {
  R.layer(1.32);
  R.paint((c) => {
    const r = rng(77);
    for (let x = from; x < to; x += 900 + r() * 700) {
      const kind = r();
      const k1 = r();
      const k2 = r();
      if (Math.abs(x - camX * 1.32) > 1700) continue;
      c.fillStyle = 'rgba(20,16,13,0.92)';
      c.strokeStyle = 'rgba(20,16,13,0.92)';
      if (kind < 0.3) {
        // nothing here: keep the foreground sparse
      } else if (kind < 0.6) {
        // a rubble edge with rebar
        c.beginPath();
        c.moveTo(x - 40, 60);
        c.lineTo(x, 10);
        c.lineTo(x + 60, 20);
        c.lineTo(x + 90, -10);
        c.lineTo(x + 150, 25);
        c.lineTo(x + 190, 60);
        c.closePath();
        c.fill();
        c.lineWidth = 2.5;
        for (let i = 0; i < 4; i++) {
          c.beginPath();
          c.moveTo(x + 40 + i * 22, 10);
          c.quadraticCurveTo(x + 50 + i * 20, -40, x + 30 + i * 30 + k1 * 30, -70 - k2 * 40 - i * 6);
          c.stroke();
        }
      } else if (kind < 0.8) {
        // a wire hanging into frame from above
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(x, -900);
        c.quadraticCurveTo(x + 30, -560, x + 10, -460 - k1 * 60);
        c.stroke();
      }
    }
  });
  R.layer(1);
}

// Dust motes turning slowly in the sunlight.
function motes(R, camX, t, strength = 1) {
  if (strength <= 0) return;
  R.glow((c) => {
    const r = rng(5);
    for (let i = 0; i < 70; i++) {
      const bx = r() * 2600 - 1300;
      const by = -40 - r() * 520;
      const sp = 6 + r() * 10;
      const x = camX + ((((bx + t * sp) % 2600) + 2600) % 2600) - 1300 + Math.sin(t * 0.7 + i) * 12;
      const y = by + Math.sin(t * 0.5 + i * 1.7) * 18;
      const a = (0.07 + r() * 0.12) * strength * (0.6 + 0.4 * Math.sin(t * 1.3 + i));
      c.fillStyle = `rgba(255,236,200,${a})`;
      c.fillRect(x, y, 2, 2);
    }
  });
}

// A heap of broken slabs. Returns nothing; collision is added separately.
function rubble(R, x, w, h, { seed = 5, color = '#a89b86', rebar = true, cast = true } = {}) {
  const draw = (c) => {
    const r = rng(seed);
    c.fillStyle = color;
    c.beginPath();
    const pts = [[x - 10, 2]];
    const n = 9;
    for (let i = 1; i < n; i++) {
      const k = i / n;
      pts.push([x + k * w + (r() - 0.5) * 16, -h * Math.sin(k * Math.PI) * (0.75 + r() * 0.35)]);
    }
    pts.push([x + w + 10, 2]);
    c.moveTo(...pts[0]);
    for (const p of pts.slice(1)) c.lineTo(...p);
    c.closePath();
    c.fill();
    // slab edges and chunks
    for (let i = 0; i < 7; i++) {
      const sx = x + r() * w;
      const sy = -r() * h * 0.8;
      c.save();
      c.translate(sx, sy);
      c.rotate((r() - 0.5) * 1.2);
      c.fillStyle = shade(color.startsWith('#') ? color : '#a89b86', 0.75 + r() * 0.35);
      c.fillRect(-20 - r() * 20, -6, 40 + r() * 30, 10 + r() * 6);
      c.restore();
    }
    if (rebar) {
      c.strokeStyle = '#4a3b2e';
      c.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        const rx = x + r() * w;
        const ry = -h * (0.4 + r() * 0.5);
        c.beginPath();
        c.moveTo(rx, ry);
        c.quadraticCurveTo(rx + (r() - 0.5) * 30, ry - 20, rx + (r() - 0.5) * 50, ry - 30 - r() * 30);
        c.stroke();
      }
    }
  };
  if (cast) R.cast(draw);
  else R.paint(draw);
}

// The sniper curtain: sheets and blankets on a wire across the gap. The
// middle section has sagged where shrapnel cut the wire.
function sniperCurtain(R, x0, x1, t, { wireY = -250, sagFrom, sagTo, sagY = -148 }) {
  R.cast((c) => {
    c.strokeStyle = '#2a2622';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(x0, wireY);
    c.lineTo(sagFrom, wireY + 6);
    c.quadraticCurveTo((sagFrom + sagTo) / 2, sagY - 30, sagTo, wireY + 6);
    c.lineTo(x1, wireY);
    c.stroke();
    const sheets = [
      [x0, sagFrom, '#d9d2c2', 0],
      [sagFrom, sagTo, '#8e6f5a', 1],
      [sagTo, x1, '#6d7a82', 0],
    ];
    for (const [a, b, col, sag] of sheets) {
      const sway = Math.sin(t * 1.2 + a * 0.01) * 5;
      c.fillStyle = col;
      c.beginPath();
      if (sag) {
        c.moveTo(a, wireY + 6);
        c.quadraticCurveTo((a + b) / 2, sagY - 30, b, wireY + 6);
        c.lineTo(b + sway, sagY + 6);
        c.quadraticCurveTo((a + b) / 2 + sway, sagY + 18, a + sway, sagY + 6);
      } else {
        c.moveTo(a, wireY);
        c.lineTo(b, wireY);
        c.lineTo(b + sway, wireY + 150);
        c.quadraticCurveTo((a + b) / 2 + sway, wireY + 160, a + sway, wireY + 150);
      }
      c.closePath();
      c.fill();
      // folds and a stitched seam
      c.strokeStyle = 'rgba(0,0,0,0.18)';
      c.lineWidth = 1.5;
      for (let fx = a + 14; fx < b - 6; fx += 22) {
        c.beginPath();
        c.moveTo(fx, wireY + 10);
        c.lineTo(fx + sway * 0.6, sag ? sagY : wireY + 140);
        c.stroke();
      }
    }
    // shrapnel holes let the light through
    c.fillStyle = '#1a1612';
    for (const [hx, hy] of [[x0 + 30, wireY + 60], [sagTo + 40, wireY + 40], [sagTo + 55, wireY + 90]]) {
      c.beginPath();
      c.arc(hx, hy, 3.5, 0, Math.PI * 2);
      c.fill();
    }
  });
}

// A shopfront with a dented, half-closed rolling shutter.
function shop(R, x, { w = 220, sign = 'دكّان أبو ريّان', open = 0.45 } = {}) {
  R.paint((c) => {
    c.fillStyle = '#1b1612';
    c.fillRect(x, -150, w, 150);
    // empty shelves inside
    c.fillStyle = 'rgba(80,66,52,0.6)';
    for (let i = 0; i < 3; i++) c.fillRect(x + 10, -120 + i * 35, w - 20, 4);
    c.fillStyle = '#8c8a86';
    c.fillRect(x - 4, -160, w + 8, 12);
    // sign
    c.fillStyle = '#2f4a5a';
    c.fillRect(x + 10, -205, w - 20, 38);
    c.fillStyle = '#e8dcc0';
    c.font = '24px "Aref Ruqaa", "Noto Naskh Arabic", serif';
    c.textAlign = 'center';
    c.direction = 'rtl';
    c.fillText(sign, x + w / 2, -178);
  });
  R.cast((c) => {
    const sh = 150 * (1 - open);
    c.fillStyle = '#7d7c78';
    c.beginPath();
    c.moveTo(x, -150);
    c.lineTo(x + w, -150);
    c.lineTo(x + w, -150 + sh);
    c.quadraticCurveTo(x + w * 0.55, -150 + sh + 22, x + w * 0.4, -150 + sh - 4);
    c.lineTo(x, -150 + sh + 6);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.25)';
    c.lineWidth = 1.5;
    for (let y = -146; y < -150 + sh; y += 7) {
      c.beginPath();
      c.moveTo(x, y);
      c.lineTo(x + w, y);
      c.stroke();
    }
  });
}

// A grape vine climbing a broken garden wall.
function vine(R, x, t, { wallH = 110, lush = 1, ripe = false } = {}) {
  R.cast((c) => {
    c.fillStyle = '#b3a58f';
    c.beginPath();
    c.moveTo(x - 70, 0);
    c.lineTo(x - 70, -wallH + 20);
    c.lineTo(x - 30, -wallH);
    c.lineTo(x + 10, -wallH + 30);
    c.lineTo(x + 40, -wallH + 8);
    c.lineTo(x + 70, -wallH + 40);
    c.lineTo(x + 70, 0);
    c.fill();
  });
  R.cast((c) => {
    const r = rng(12);
    c.strokeStyle = '#5a4230';
    c.lineWidth = 4;
    c.beginPath();
    c.moveTo(x + 20, 0);
    c.bezierCurveTo(x + 10, -60, x + 40, -90, x - 20, -wallH - 20);
    c.bezierCurveTo(x - 50, -wallH - 40, x - 10, -wallH - 70, x + 30, -wallH - 60);
    c.stroke();
    for (let i = 0; i < 22 * lush; i++) {
      const k = r();
      const lx = lerp(x + 20, x - 30, k) + (r() - 0.5) * 70;
      const ly = -k * (wallH + 60) - 10 + (r() - 0.5) * 30;
      const sway = Math.sin(t * 1.4 + i) * 1.5;
      c.fillStyle = r() < 0.5 ? '#5f7a3a' : '#6d8a44';
      c.beginPath();
      c.ellipse(lx + sway, ly, 11, 9, r() * 3, 0, Math.PI * 2);
      c.fill();
    }
    // small bunches of grapes
    for (let b = 0; b < 3; b++) {
      const gx = x - 10 + b * 22;
      const gy = -wallH + 6 + b * 8;
      c.fillStyle = ripe ? '#4a2a4a' : '#8ea24a';
      for (let i = 0; i < 7; i++) {
        c.beginPath();
        c.arc(gx + ((i % 3) - 1) * 4, gy + Math.floor(i / 3) * 5, 3, 0, Math.PI * 2);
        c.fill();
      }
    }
  });
}

// The school: a three-storey block with its eastern wing collapsed, a
// basement stairwell, and ground-floor classroom windows.
function school(R, x, t) {
  block(R, { x, w: 520, floors: 3, fh: 130, color: '#c8b999', seed: 44, torn: 0, pocks: 6, graffiti: [['مدرسة', 0.3, -330, 30, 'rgba(60,70,90,0.7)']] }, t);
  // the collapsed east wing: a slope of slabs
  rubble(R, x + 520, 380, 210, { seed: 45, color: '#b9aa8a' });

// Sorted piles of scrap: rebar, copper, aluminium.
function scrapPiles(R, x, disturbed = 0) {
  R.cast((c) => {
    const r = rng(33);
    const piles = [
      [x, '#5a4a3e', 'rebar'],
      [x + 90, '#a86a3a', 'copper'],
      [x + 170, '#b8bcc0', 'alu'],
    ];
    for (const [px, col, kind] of piles) {
      const sc = disturbed ? 1.6 : 1;
      c.strokeStyle = col;
      c.fillStyle = col;
      c.lineWidth = kind === 'rebar' ? 3 : 2;
      for (let i = 0; i < 12; i++) {
        const ax = px + (r() - 0.5) * 50 * sc;
        const ay = -r() * 22 / sc;
        c.beginPath();
        c.moveTo(ax, ay);
        c.lineTo(ax + (r() - 0.5) * 40, ay - (r() - 0.2) * 10);
        c.stroke();
        if (kind !== 'rebar' && r() < 0.5) c.fillRect(ax, ay - 4, 8, 5);
      }
    }
  });
}

function crater(R, x, w = 180) {
  R.paint((c) => {

}

// The dead olive tree at the corner: twisted, grey, leafless.
function deadOlive(R, x) {
  R.cast((c) => {
    c.strokeStyle = '#6a625a';
    c.lineCap = 'round';
    const branch = (bx, by, ang, len, w, d) => {
      const ex = bx + Math.cos(ang) * len;
      const ey = by + Math.sin(ang) * len;
      c.lineWidth = w;
      c.beginPath();
      c.moveTo(bx, by);
      c.quadraticCurveTo(bx + Math.cos(ang + 0.4) * len * 0.5, by + Math.sin(ang + 0.4) * len * 0.5, ex, ey);
      c.stroke();
      if (d < 4) {
        branch(ex, ey, ang - 0.45 - d * 0.05, len * 0.7, w * 0.62, d + 1);
        branch(ex, ey, ang + 0.5, len * 0.62, w * 0.6, d + 1);
      }
    };
    branch(x, 0, -Math.PI / 2 - 0.1, 90, 22, 0);
  });
}

  R.cast((c) => {

function sunLook(g) {
  const k = g.a.sunK;
  const drain = g.a.drain || 0;
  const fog = g.effects.fog;
  const col = mixc([1.0, 0.96, 0.9], [1.0, 0.7, 0.42], k);
  const sunUv = [-0.28 - 0.1 * k, -0.95 + 0.85 * k];
  const lights = [
    { uv: sunUv, color: col, intensity: (1.25 - 0.2 * k) * (1 - fog * 0.45), radius: 0, rim: 0.55 + 0.6 * k },
    { uv: [0.5, -1.2], color: [0.55, 0.62, 0.78], intensity: 0.25 + fog * 0.3, radius: 0, rim: 0.2 },
  ];
  const torch = g.torchLight();
  if (torch) lights.push(torch);
  if (g.a.doorGlow) lights.push({ x: X.door + 30, y: -90, color: [1, 0.72, 0.45], intensity: g.a.doorGlow, radius: 0.15, rim: 0.6 });
  if (g.a.flashAt && g.time - g.a.flashAt < 0.4) {
    const f = 1 - (g.time - g.a.flashAt) / 0.4;
    lights.push({ x: g.a.flashX, y: -60, color: [1, 0.8, 0.55], intensity: 3 * f, radius: 0.5, rim: 1.2 });
  }
  return {
    ambient: mixc([0.3, 0.31, 0.38], [0.27, 0.23, 0.28], k).map((v) => v * (1 - drain * 0.35)),
    lights,
    groundShadow: 0.75 * (1 - fog * 0.6),
    god: fog > 0.15 ? { uv: sunUv, strength: 0.35 * fog } : null,
    bloom: 0.55,
    exposure: 0.86 - drain * 0.1,
    grain: 0.045,
    grade: { sat: lerp(0.9, 0.18, drain), contrast: lerp(1.07, 0.92, drain), lift: -0.01 * drain, tint: [1, 1 - 0.02 * drain, 1 - 0.04 * drain] },
  };
}

const shearFor = (g) => 0.3 + 1.7 * g.a.sunK;

// ---------------------------------------------------------------- sky ----

function skyStops(k) {
  const a = [[0, '#6f8fb4'], [0.45, '#a9bccb'], [0.75, '#d9d3c4']];
  const b = [[0, '#56688e'], [0.45, '#b99b86'], [0.75, '#e8b27a']];
  return a.map(([p, ca], i) => {
    const A = [1, 3, 5].map((j) => parseInt(ca.slice(j, j + 2), 16));
    const B = [1, 3, 5].map((j) => parseInt(b[i][1].slice(j, j + 2), 16));
    return [p, `rgb(${A.map((v, j) => Math.round(lerp(v, B[j], k))).join(',')})`];
  });
}

  }, 0, 0, 0, 1);
  if (near(1450, 1800)) {
    R.paint((c) => {
      c.fillStyle = '#9a8e7a';
      c.fillRect(1450, -60, 350, 64); // rubble in the gap, far off
    });
  }
  if (near(2890, 3320)) sideStreet(R, 2890, 3320, { minaret: true, t });
  if (near(4930, 5330)) sideStreet(R, 4930, 5330, { curtainWindow: true, t });
  if (near(9880, 10160)) sideStreet(R, 9880, 10160, { t });

  T.street(R, -500, 10800);
  T.cables(R, cx);

  // --- props behind the actors ---
  if (near(X.vine - 100, X.vine + 100)) T.vine(R, X.vine, t);
  if (near(X.wall0 - 60, X.wall1 + 60)) T.rubble(R, X.wall0 - 20, X.wall1 - X.wall0 + 40, 100, { seed: 21 });
  if (near(X.shop, X.shop + 240)) T.shop(R, X.shop);
  if (near(X.oldMan - 200, X.door + 200)) {
    // the daughter's door at the end of the alley
    R.paint((c) => {
      c.fillStyle = '#3a2c20';
      c.fillRect(X.door, -170, 64, 170);
      c.fillStyle = '#1a130e';
      c.fillRect(X.door + 6, -164, 52 * (1 - (a.doorOpen || 0)), 164);
    });
    if (a.doorOpen) R.glow((c) => {
      c.fillStyle = `rgba(255,190,120,${0.25 * a.doorOpen})`;
      c.fillRect(X.door + 6 + 52 * (1 - a.doorOpen), -164, 52 * a.doorOpen, 164);
    });
    if (a.cansOnGround) R.cast((c) => {
      T.jerryCan(c, X.oldMan + 30, 0);
      if (a.cansOnGround > 1) T.jerryCan(c, X.oldMan + 60, 0, 1, '#d4a82a');
    });
  }
  if (near(X.shard - 100, X.shard + 100)) {
    T.rubble(R, X.shard - 80, 170, 34, { seed: 30, rebar: false });
    if (!g.hasTool('mirror')) {
      R.cast((c) => {
        c.fillStyle = '#6b5a48';
        c.fillRect(X.shard + 20, -16, 12, 8); // a child's sandal
      });
      const tw = 0.5 + 0.5 * Math.sin(t * 5);
      R.glow((c) => {
        c.fillStyle = `rgba(255,255,240,${0.6 + tw * 0.4})`;
        c.beginPath();
        c.moveTo(X.shard - 6, -22);
        c.lineTo(X.shard + 8, -26);
        c.lineTo(X.shard + 4, -18);
        c.fill();
        c.fillStyle = `rgba(255,255,230,${0.35 * tw})`;
        c.fillRect(X.shard - 12, -23, 26, 1.5);
        c.fillRect(X.shard, -34, 1.5, 22);
      });
    }
  }
  // spotter's post: the dark room behind his window, and the rope
  if (near(X.spotter - 300, X.spotter + 300)) {
    R.paint((c) => {
      const g2 = c.createLinearGradient(0, SPOT_WIN.top, 0, SPOT_WIN.sill);
      g2.addColorStop(0, '#1d1a17');
      g2.addColorStop(1, '#2b2621');
      c.fillStyle = g2;
      c.fillRect(SPOT_WIN.x0, SPOT_WIN.top, SPOT_WIN.x1 - SPOT_WIN.x0, SPOT_WIN.sill - SPOT_WIN.top + 4);
    });
    if (a.rope !== undefined && a.rope < 1.2) {
      const ry = lerp(SPOT_WIN.sill, -150, clamp(a.rope));
      R.cast((c) => {
        c.strokeStyle = '#3a3026';
        c.lineWidth = 1.5;
        c.beginPath();
        c.moveTo(X.spotter - 10, SPOT_WIN.sill);
        c.lineTo(X.spotter - 10 + Math.sin(t * 2) * 3, ry);
        c.stroke();
        if (!g.hasTool('walkie')) {
          c.fillStyle = '#1c1c1e';
          c.fillRect(X.spotter - 16, ry, 12, 28);
          c.fillRect(X.spotter - 13, ry - 10, 2, 10);
        }
      });
    }
  }
  if (near(6200, 6700)) {
    T.rubble(R, 6150, 200, 60, { seed: 40 });
    T.lowWall(R, X.coverWall - 60, 170, 110, '#b1a48e');
  }
  // the school and the children's scrap
  if (near(X.collapsed - 100, X.school + 600)) {
    T.rubble(R, X.collapsed, 400, 230, { seed: 50, color: '#b9aa8a' });
    T.block(R, { x: X.school, w: 520, floors: 3, fh: 130, color: '#c8b999', seed: 44, pocks: 6, graffiti: [['مدرسة', 0.45, -320, 30, 'rgba(60,70,90,0.7)']] }, t);
    R.paint((c) => {
      // the basement stairwell
      c.fillStyle = '#0c0a08';
      c.fillRect(X.stairs - 40, -110, 80, 110);
      c.fillStyle = '#8f846e';
      c.fillRect(X.stairs - 48, -118, 96, 10);
      // classroom windows on the ground floor
      for (let i = 0; i < 3; i++) {
        c.fillStyle = '#2a2420';
        c.fillRect(X.classroom - 110 + i * 110, -110, 80, 70);
        c.fillStyle = 'rgba(120,96,70,0.5)';
        c.fillRect(X.classroom - 100 + i * 110, -64, 60, 3);
        c.fillStyle = 'rgba(40,40,40,0.8)';
        c.fillRect(X.classroom - 95 + i * 110, -100, 50, 22); // a blackboard glimpsed
      }
    });
    T.scrapPiles(R, X.scrap, a.crater ? 1 : 0);
    if (a.crater) T.crater(R, X.scrap + 30, 190);
  }
  if (near(X.catWall - 80, X.catWall + 80)) {
    R.cast((c) => {
      c.fillStyle = '#a99c86';
      c.beginPath();
      c.moveTo(X.catWall - 60, 2);
      c.lineTo(X.catWall - 55, -150);
      c.lineTo(X.catWall - 10, -140);
      c.lineTo(X.catWall + 20, -155);
      c.lineTo(X.catWall + 55, -120);
      c.lineTo(X.catWall + 60, 2);
      c.fill();
    });
  }
  if (near(X.battery - 100, X.battery + 200)) {
    T.roomDoor(R, X.battery, { w: 120, h: 180, light: 'rgba(160,190,220,0.12)' });
    R.paint((c) => {
      // the table, the battery, the tangle of cables
      c.fillStyle = '#2c231b';
      c.fillRect(X.battery + 20, -70, 80, 6);
      c.fillRect(X.battery + 26, -64, 4, 64);
      c.fillRect(X.battery + 90, -64, 4, 64);
      c.fillStyle = '#16161a';
      c.fillRect(X.battery + 40, -92, 34, 22);
      c.strokeStyle = '#8a2a22';
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(X.battery + 48, -92);
      c.bezierCurveTo(X.battery + 40, -110, X.battery + 20, -80, X.battery + 30, -72);
      c.stroke();
    });
    R.glow((c) => {
      for (let i = 0; i < 4; i++) {
        c.fillStyle = `rgba(170,210,255,${0.5 + 0.3 * Math.sin(t * 2 + i)})`;
        c.fillRect(X.battery + 26 + i * 16, -76, 8, 5);
      }
    });
  }
  if (near(X.kerb - 100, X.olive + 200)) {
    T.lowWall(R, X.kerb - 20, 110, 62, '#a79a84');
    // a fallen concrete beam propped on two blocks by the kerb: where people
    // sit to wait for news (and where Sami sits, if he says nothing)
    R.cast((c) => {
      const x0 = X.kerb + 100;
      const x1 = X.kerb + 222;
      c.fillStyle = '#8e8676';
      c.fillRect(x0 + 6, -24, 22, 24);
      c.fillRect(x1 - 30, -24, 22, 24);
      c.fillStyle = 'rgba(0,0,0,0.2)';
      c.fillRect(x0 + 6, -24, 22, 3);
      c.fillRect(x1 - 30, -24, 22, 3);
      c.fillStyle = '#a39b8a';
      c.beginPath();
      c.moveTo(x0, -40);
      c.lineTo(x1, -41);
      c.lineTo(x1 + 3, -24);
      c.lineTo(x0 - 2, -23);
      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(255,250,235,0.18)';
      c.fillRect(x0, -40, x1 - x0, 2);
      c.strokeStyle = '#4a3b2e';
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(x1, -34);
      c.quadraticCurveTo(x1 + 12, -38, x1 + 16, -30); // rebar out of the broken end
      c.moveTo(x1, -28);
      c.lineTo(x1 + 10, -22);
      c.stroke();
    });
    // the walkie-talkie man's upturned crate
    R.cast((c) => {
      c.fillStyle = '#6a5238';
      c.fillRect(X.olive - 30, -30, 40, 30);
      c.fillStyle = 'rgba(0,0,0,0.25)';
      for (let i = 0; i < 3; i++) c.fillRect(X.olive - 30, -26 + i * 9, 40, 2);
    });
    T.deadOlive(R, X.olive);
  }

  // --- the people ---
  const shear = shearFor(g);
  // contact shadows: everyone stands on the ground, not above it
  R.paint((c) => {
    for (const w of [...g.npcs, ...(g.passers || []), g.player]) {
      if (!w.visible || w.depthK || w.depth > 0 || !near(w.x - 60, w.x + 60)) continue;
      const s2 = w.rig.scale || 1;
      const lift = Math.max(0, w.rig.pose?.seat ? 0 : 0);
      const gy = w.onGround === false ? w.y + 0 : w.y;
      const grd = c.createRadialGradient(w.x, gy + 2 + lift, 0, w.x, gy + 2, 26 * s2);
      grd.addColorStop(0, 'rgba(20,14,10,0.32)');
      grd.addColorStop(1, 'rgba(20,14,10,0)');
      c.fillStyle = grd;
      c.beginPath();
      c.ellipse(w.x, gy + 2, 26 * s2, 5 * s2, 0, 0, Math.PI * 2);
      c.fill();
    }
  });
  // passers-by far down the side streets, behind everyone
  for (const w of g.passers || []) {
    if (w.depth > 0 && near(w.x - 100, w.x + 100)) R.cast((c) => w.draw(c));
  }
  for (const w of g.npcs) {
    if (!w.visible || !near(w.x - 100, w.x + 100)) continue;
    if (w.depthK) continue; // walking away down a side street: drawn below
    R.cast((c) => w.draw(c));
    R.shadow((c) => w.draw(c), w.x, w.y, shear, 0.12);
  }
  for (const w of g.passers || []) {
    if (w.depth > 0 || !near(w.x - 100, w.x + 100)) continue;
    R.cast((c) => w.draw(c));
    R.shadow((c) => w.draw(c), w.x, w.y, shear, 0.12);
  }
  if (g.cat && !g.cat.hidden && near(g.cat.x - 50, g.cat.x + 50)) {
    R.cast((c) => g.cat.draw(c));
    // its eyes catch the light
    if (g.cat.blink < 0.5) {
      const [ex, ey] = g.cat.eye();
      R.glow((c) => {
        const grd = c.createRadialGradient(ex, ey, 0, ex, ey, 5);
        grd.addColorStop(0, 'rgba(220,230,120,0.55)');
        grd.addColorStop(1, 'rgba(220,230,120,0)');
        c.fillStyle = grd;
        c.fillRect(ex - 5, ey - 5, 10, 10);
      });
    }
  }
  const p = g.player;
  if (p.visible) {
    R.cast((c) => p.draw(c));
    R.shadow((c) => p.draw(c), p.x, p.y, shear, 0.12);
  }
  // those walking away into depth
  for (const w of g.npcs) {
    if (!w.visible || !w.depthK) continue;
    R.cast((c) => w.draw(c));
  }
  // the wall around the spotter's window, over him: only his upper body shows
  if (near(X.spotter - 300, X.spotter + 300)) {
    R.cast((c) => {
      const W = SPOT_WIN;
      c.fillStyle = '#b5a892';
      c.beginPath();
      c.rect(W.x0 - 110, W.top - 70, W.x1 - W.x0 + 220, W.floor - W.top + 82);
      c.rect(W.x1, W.top, W.x0 - W.x1, W.sill - W.top); // the opening (reverse winding)
      c.fill('evenodd');
      // plaster stains and a crack
      c.fillStyle = 'rgba(80,66,50,0.14)';
      c.fillRect(W.x0 - 90, W.sill + 6, 60, 40);
      c.strokeStyle = 'rgba(60,50,40,0.35)';
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(W.x1 + 30, W.top - 60);
      c.lineTo(W.x1 + 44, W.top - 20);
      c.lineTo(W.x1 + 38, W.top + 30);
      c.stroke();
      // the sill and the slab edge
      c.fillStyle = '#cfc3ab';
      c.fillRect(W.x0 - 8, W.sill, W.x1 - W.x0 + 16, 7);
      c.fillStyle = '#8f846f';
      c.fillRect(W.x0 - 110, W.floor + 6, W.x1 - W.x0 + 220, 8);
      // the frame, what's left of it
      c.strokeStyle = '#5a4a38';
      c.lineWidth = 3;
      c.strokeRect(W.x0, W.top, W.x1 - W.x0, W.sill - W.top);
    });
  }
  // a building corner the walker passes behind
  if (a.occluder) {
    R.paint((c) => {
      c.fillStyle = '#a5987f';
      c.fillRect(a.occluder[0], -300, a.occluder[1], 304);
    });
  }

  // --- in front ---
  if (near(X.curtain0, X.curtain1)) T.sniperCurtain(R, X.curtain0, X.curtain1, t, { sagFrom: X.sag0, sagTo: X.sag1, sagY: -162 });
  if (near(X.lowWall - 60, X.lowWall + 60)) T.lowWall(R, X.lowWall - 50, 100, 64, '#9e917b');
  R.layer(1.3);
  R.paint((c) => {
    const r = rng(5);
    c.fillStyle = '#2a231d';
    for (let i = 0; i < 26; i++) {
      const fx = -400 + i * 480 + r() * 200;
      const h = 20 + r() * 50;
      c.beginPath();
      c.moveTo(fx - 60, 200);
      c.lineTo(fx - 40, 60 - h);
      c.lineTo(fx + 10, 50 - h * 1.2);
      c.lineTo(fx + 50, 70 - h * 0.6);
      c.lineTo(fx + 70, 200);
      c.fill();
    }
  });
  R.layer(1);

  g.effects.draw(R);
  // the jet's shadow: a swept-wing shape, smeared by its speed, across the
  // street and up the walls in half a second
  if (a.jetShadow) {
    const k = (g.time - a.jetShadow) / 0.55;
    if (k > 0 && k < 1)
      R.shadow(
        (c) => {
          const x = lerp(cx - 1500, cx + 1500, k);
          c.fillStyle = 'rgba(0,0,0,0.85)';
          for (let i = 0; i < 5; i++) {
            c.globalAlpha = i === 0 ? 1 : 0.16; // motion smear
            T.jetShadowShape(c, x - i * 80, -230, 2.4);
          }
          c.globalAlpha = 1;
        },
        cx,
        -230,
        0,
        0.62, // cast across the street and up the walls at a low angle
      );
  }
  g.effects.drawFog(R);
  // dust turning in the sun, and silhouettes close to the lens
  T.motes(R, cx, t, a.shelling ? 0.4 : 1);
  T.foreground(R, cx);
}

// ---------------------------------------------------------- the stairwell --

function drawStairwell(R, g) {
  const t = g.time;
  R.paint((c) => {
    c.fillStyle = '#3a342d';
    c.fillRect(-900, -700, 1800, 1400);
    // stairs down from the doorway, top left
    c.fillStyle = '#4d463d';
    for (let i = 0; i < 12; i++) c.fillRect(-620 + i * 55, -420 + i * 36, 60, 400);
    c.fillStyle = '#2b2621';
    c.fillRect(-900, 0, 1800, 400);
    // cracks and a child's chalk drawing on the wall
    c.strokeStyle = 'rgba(20,16,12,0.6)';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(80, -500);
    c.lineTo(120, -380);
    c.lineTo(90, -300);
    c.stroke();
    c.strokeStyle = 'rgba(220,210,190,0.5)';
    c.beginPath();
    c.arc(300, -260, 26, 0, Math.PI * 2);
    c.moveTo(300, -234);
    c.lineTo(300, -170);
    c.moveTo(270, -210);
    c.lineTo(330, -210);
    c.stroke();
  });
  R.glow((c) => {
    // daylight from the doorway above
    const g2 = c.createLinearGradient(-700, -700, -300, -200);
    g2.addColorStop(0, 'rgba(230,215,185,0.9)');
    g2.addColorStop(1, 'rgba(230,215,185,0)');
    c.fillStyle = g2;
    c.fillRect(-900, -700, 500, 300);
  });
  for (const w of g.stairKids || []) R.cast((c) => w.draw(c));
  R.cast((c) => g.player.draw(c));
  g.effects.draw(R);
  // dust pouring through the ceiling seams
  R.paint((c) => {
    for (let i = 0; i < 4; i++) {
      const k = (t * 0.7 + i * 0.3) % 1;
      c.fillStyle = `rgba(180,168,146,${0.35 * Math.sin(k * Math.PI)})`;
      c.fillRect(-200 + i * 170, -640, 3, 640 * k);
    }
  });
}

function stairLook(g) {
  const torch = g.torchLight();
  const lights = [{ uv: [0.05, -0.1], color: [0.95, 0.88, 0.75], intensity: 0.9, radius: 0.8, project: 1.3, rim: 0.8 }];
  if (torch) lights.push(torch);
  return { ambient: [0.05, 0.05, 0.06], lights, groundShadow: 0, bloom: 0.8, grain: 0.07, grade: { sat: 0.8, contrast: 1.05, lift: 0, tint: [1, 1, 1] } };
}

// ----------------------------------------------------------- the flashback --

function drawFlashback(R, g) {
  const t = g.time;
  T.sky(R, [[0, '#4a4f7a'], [0.4, '#c77d5c'], [0.72, '#f3b168']]);
  R.layer(0.3);
  R.paint((c) => {
    // the town, whole: rooftops, water tanks, satellite dishes, a minaret
    const r = rng(71);
    c.fillStyle = '#7c6056';
    for (let x = -1400; x < 1400; x += 90 + r() * 60) {
      const h = 80 + r() * 140;
      c.fillRect(x, -h, 80 + r() * 60, h + 300);
      if (r() < 0.5) c.fillRect(x + 20, -h - 20, 26, 20);
    }
    T.minaret(c, 300, -150, 0.9, '#7c6056', false);
  });
  R.glow((c) => {
    const r = rng(72);
    for (let i = 0; i < 40; i++) {
      c.fillStyle = `rgba(255,${190 + r() * 40},120,${0.5 + r() * 0.4})`;
      c.fillRect(-1300 + r() * 2600, -30 - r() * 160, 5, 6);
    }
  });
  R.layer(1);
  // the house wall behind the garden, a window with a television flickering
  R.paint((c) => {
    c.fillStyle = '#c9a987';
    c.fillRect(-700, -420, 1400, 424);
    c.fillStyle = '#2d241e';
    c.fillRect(260, -300, 110, 90);
    c.fillStyle = '#8c6a52';
    c.fillRect(-640, -200, 90, 204); // door
    c.fillStyle = '#6f5a48';
    c.fillRect(-700, 0, 1400, 300);
  });
  R.glow((c) => {
    const f = 0.35 + 0.25 * Math.sin(t * 13) * Math.sin(t * 5.3);
    c.fillStyle = `rgba(120,160,255,${f})`;
    c.fillRect(268, -292, 94, 74);
  });
  // the arbour: posts, beams, vines and ripe grapes
  R.cast((c) => {
    c.fillStyle = '#5a4332';
    c.fillRect(-420, -330, 12, 334);
    c.fillRect(400, -330, 12, 334);
    c.fillRect(-460, -340, 900, 10);
    const r = rng(73);
    for (let i = 0; i < 70; i++) {
      c.fillStyle = r() < 0.5 ? '#4f6a2e' : '#62803a';
      c.beginPath();
      c.ellipse(-460 + r() * 900, -340 + (r() - 0.3) * 50, 18, 14, r() * 3, 0, Math.PI * 2);
      c.fill();
    }
    for (let b = 0; b < 9; b++) {
      const bx = -380 + b * 95 + r() * 30;
      c.fillStyle = '#4a2448';
      for (let i = 0; i < 12; i++) {
        c.beginPath();
        c.arc(bx + ((i % 3) - 1) * 6, -312 + Math.floor(i / 3) * 7, 4.5, 0, Math.PI * 2);
        c.fill();
      }
    }
    // floor cushions along the wall, a kilim stripe on each
    for (const [cx, w] of [[-90, 120], [90, 120]]) {
      c.fillStyle = '#7a3a2c';
      c.beginPath();
      c.moveTo(cx - w / 2, 0);
      c.lineTo(cx - w / 2 + 4, -14);
      c.quadraticCurveTo(cx, -17, cx + w / 2 - 4, -14);
      c.lineTo(cx + w / 2, 0);
      c.closePath();
      c.fill();
      c.fillStyle = '#c9a25a';
      c.fillRect(cx - w / 2 + 6, -9, w - 12, 2);
      c.fillStyle = '#2f4a5a';
      for (let k = cx - w / 2 + 10; k < cx + w / 2 - 10; k += 14) c.fillRect(k, -6, 6, 3);
    }
    // low table with tea
    c.fillStyle = '#6a4a30';
    c.fillRect(-60, -44, 120, 8);
    c.fillRect(-50, -36, 6, 36);
    c.fillRect(44, -36, 6, 36);
    // a wire with a bird
    c.strokeStyle = '#2a2420';
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(-700, -390);
    c.quadraticCurveTo(0, -370, 700, -395);
    c.stroke();
    if (!g.a.birdGone) {
      c.fillStyle = '#2a2420';
      c.beginPath();
      c.ellipse(180, -388, 9, 6, 0, 0, Math.PI * 2);
      c.fill();
      c.fillRect(186, -392, 6, 3);
    }
  });
  R.glow((c) => {
    // tea glasses, lit amber by the sun
    for (const gx of [-30, 26]) {
      c.fillStyle = 'rgba(200,90,40,0.8)';
      c.fillRect(gx, -60, 10, 16);
    }
  });
  for (const w of g.flashActors || []) {
    R.cast((c) => w.draw(c));
    R.shadow((c) => w.draw(c), w.x, w.y, 1.6, 0.12);
  }
}

function flashLook(g) {
  const k = g.a.flashFade || 0;
  return {
    ambient: [0.4, 0.3, 0.3],
    lights: [{ uv: [1.1, 0.35], color: [1.0, 0.66, 0.4], intensity: 1.4, radius: 0, project: 1.04, rim: 1.2 }],

      g.a.cornerWarned = false;
      return;
    }
    g.active = 'mirror';
    g.prompt('use', 'استخدم المرآة', 'Use the mirror');
    yield () => g.a.mirrorChecked;
    g.prompt(null);
  },

  *mirrorPeek(g) {
